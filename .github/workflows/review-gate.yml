name: Review gate

# The required check `review-gate` (job name). It passes for an auto-merge proof-task pull request, for a
# pull request by a repository administrator, and otherwise only with two approvals of the current commit
# from two accounts other than the author, each with a merged pull request here (scripts/review_gate.py).
# GitHub's own required reviews count only reviewers with write access, which outside reviewers do not
# have. It never merges anything. On pull_request_target it also sets the label `needs-review`.
#
# Triggers: pull_request_target (opened, changed, reopened), pull_request_review (a review is submitted,
# dismissed or edited), and merge_group (the check must report there too, or the merge queue waits for it).
#
# Security: the job checks out `main` (never the pull request's head) and runs only `main`'s script; the
# pull request is data read through the API. A pull_request_review run takes this workflow file from the
# pull request itself, so a pull request that edits .github/ must be protected by the code-owner review of
# .github/CODEOWNERS (the ruleset requires it).
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed, edited]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: review-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main (never the pull request)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned PyYAML
        run: python3 -m pip install --quiet "$(grep -i '^pyyaml' requirements.txt)"

      - name: Set the label needs-review (pull_request_target only)
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/review_gate.py --repo "$REPO" --pr "$PR" --labels || true

      - name: Evaluate the gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: python3 scripts/review_gate.py --repo "$REPO" --pr "${PR:-0}" --event "$EVENT"
