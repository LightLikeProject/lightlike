# `lake comparator` on the proof tasks that a change proves (scripts/comparator_run.py).
#
# For each task file the change touches and that no longer contains `sorry`, the challenge is the file
# as first committed (the locked statement) and the solution is the file now. The comparator
# establishes that both prove the same statement, that only propext, Classical.choice and Quot.sound
# are used, and that the kernel accepts the proof; the weekly run adds the external kernels
# (`--paranoid`: leanchecker-paranoid, lean4lean, nanoda, con-leche, con-ron). It extends the
# statement-unchanged check of a pull request (scripts/proof_task_check.py) and the axiom audit.
#
# When it runs:
#   pull_request  the required check `comparator` of a proof-task pull request: the change is the
#                 pull request (its merge commit against the base); it blocks on a rejection;
#   merge_group   the same check on a merge-queue run, against the queue's base;
#   push to main  after a push, the task files it proved; weekly (Sunday 03:00 UTC, every proved task,
#                 paranoid) and on demand (Actions -> Comparator -> Run workflow). These three never
#                 block anything (continue-on-error).
# The first step selects the task files without running Lean (git and PyYAML only); when the change
# proves none, every later step is skipped and the check passes in seconds, so the check reports on
# every pull request, as a required check must. Like CI, only on demand while the repository is
# private. The comparator needs bubblewrap, which is Linux only, so this runs on GitHub's runners and
# not on a Mac. Pull-request code runs only under `pull_request`, with the read-only token below and
# no secrets; the caches are only restored here, never saved.
name: Comparator

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:
    inputs:
      all:
        description: "Judge every proved task file, not only those the last push changed"
        type: boolean
        default: false
      paranoid:
        description: "Also run the external kernels"
        type: boolean
        default: false

concurrency:
  group: comparator-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  comparator:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    # Blocking only as the required check of a pull request or a merge-queue run.
    continue-on-error: ${{ github.event_name != 'pull_request' && github.event_name != 'merge_group' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the pinned PyYAML
        run: python3 -m pip install --quiet "$(grep -i '^pyyaml' requirements.txt)"

      # The task files to judge, from git and docs/tasks/tasks.yaml only (--dry-run runs no Lean). A
      # pull request is judged as its merge commit against the base (HEAD^1), a merge-queue run
      # against the queue's base, a push against the previous main.
      - name: Select the task files the change proves
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
          ALL: ${{ github.event_name == 'schedule' || inputs.all }}
          PARANOID: ${{ github.event_name == 'schedule' || inputs.paranoid }}
        run: |
          args=(--after "$(git rev-parse HEAD)")
          if [ "$ALL" = true ]; then
            args+=(--all)
          elif [ "$EVENT" = pull_request ]; then
            args+=(--before "$(git rev-parse HEAD^1)")
          elif [ "$EVENT" = merge_group ]; then
            args+=(--before "$QUEUE_BASE")
          else
            args+=(--before "${BEFORE:-$(git rev-parse HEAD^)}")
          fi
          [ "$PARANOID" = true ] && args+=(--paranoid)
          printf '%s\n' "${args[@]}" > "$RUNNER_TEMP/comparator-args.txt"
          python3 scripts/comparator_run.py --dry-run "${args[@]}" | tee "$RUNNER_TEMP/selection.txt"
          if grep -q '^== ' "$RUNNER_TEMP/selection.txt"; then
            echo "judge=true" >> "$GITHUB_OUTPUT"
          else
            echo "judge=false" >> "$GITHUB_OUTPUT"
            echo "comparator: the change proves no task file; nothing to judge" >> "$GITHUB_STEP_SUMMARY"
          fi

      # The installer script is pinned to the commit of elan v4.4.0, so that a later change to it is not run here.
      - name: Install elan (toolchain from lean-toolchain)
        if: ${{ steps.select.outputs.judge == 'true' }}
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/3cc76985a1becb3c03cd65c1c5007e6f186ae474/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # bubblewrap sandboxes the untrusted project; Ubuntu 24.04 restricts unprivileged user
      # namespaces by default, which bwrap needs, so lift that for this job's VM.
      - name: Install bubblewrap and allow user namespaces
        if: ${{ steps.select.outputs.judge == 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bwrap works"

      - name: Restore dependency cache (Mathlib, Physlib builds)
        if: ${{ steps.select.outputs.judge == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .lake/packages
          key: lake-packages-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Restore the library build of main
        if: ${{ steps.select.outputs.judge == 'true' }}
        uses: actions/cache/restore@v6
        with:
          path: .lake/build
          key: lightlike-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: lightlike-build-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Prebuilt Mathlib and the library
        if: ${{ steps.select.outputs.judge == 'true' }}
        run: |
          lake exe cache get || true
          lake build Lightlike Tasks

      - name: Judge the proved task files
        if: ${{ steps.select.outputs.judge == 'true' }}
        run: |
          mapfile -t args < "$RUNNER_TEMP/comparator-args.txt"
          python3 scripts/comparator_run.py "${args[@]}"
