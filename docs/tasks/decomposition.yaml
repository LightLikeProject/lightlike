# Hand-written input to scripts/tasks.py. The script combines it with the milestone tables of
# docs/tasks/milestones.md into docs/tasks/tasks.yaml (the full task list and dependency graph) and
# docs/tasks/README.md (the task board in Markdown). After editing this file or milestones.md, run
#   python3 scripts/tasks.py generate
# Every milestone is one task; the proof tasks and upstream tasks below are added. This file is the
# plan only: who works on a task, and whether it is done, is on the task's GitHub issue.

# Area heading of milestones.md -> area label (used for the label `area: <label>`).
areas:
  PL topology: pl-topology
  Oscillatory and saddle-point asymptotics: asymptotics
  Harmonic analysis on Lie groups: harmonic-analysis
  Quantum groups and state-sum TQFTs: quantum-groups
  Lorentzian and Riemannian geometry: geometry
  Operator algebras and quantum information: operator-algebras
  Perturbative QFT and the renormalization group: qft-rg
  Conformal field theory: cft
  Random geometry: random-geometry
  Gauge theory and constrained systems: gauge-constrained
  Spin foams: spin-foams
  Canonical quantum gravity: canonical-qg
  Group field theory and tensor models: gft-tensor
  Dynamical triangulations: dynamical-triangulations
  Regge calculus: regge
  Causal sets: causal-sets
  Asymptotic safety: asymptotic-safety
  Perturbative quantum gravity: perturbative-qg
  String theory: string-theory
  Holography: holography
  Low-dimensional gravity: low-dim-gravity
  Semiclassical gravity: semiclassical
  Cosmology: cosmology
  Noncommutative geometry: ncg
  Twistor theory: twistors
  Matrix models: matrix-models
  Other approaches: other

# Milestone IDs in milestones.md that are not plain codes, and the codes used in task IDs.
aliases:
  RC6a: RC6   # part of RC6

# Dependencies for milestone tables without a "Needs" column.
needs:
  PL4: [PL2]
  PL5: []
  PL6: [PL5]
  PL7: [PL2, PL4, PL6]

# Milestones whose statements are all among the proof tasks below. Once those are locked, the
# milestones that need one of them can start, before its proofs are done.
stated: [QU1]   # the definitions exist; the statements are T-QU1-P1 to PL7

# Hand-written tasks: statements written as skeletons in Tasks/, one file per task. Their
# statements are drafts until they are reviewed and locked (`tasks.py lock`).
tasks:
  - id: T-QU1-P1
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols at r = 4
    file: Tasks/QU/T_QU1_P1.lean
    decl: Lightlike.TV.qOrthogonality_four
    size: M
    difficulty: intermediate
    routes:
      - As `qOrthogonality_three` (`Lightlike/TuraevViro/LevelOne.lean`) with colours `Fin 3`; the q-numbers involve √2, so evaluate exactly in ℚ(√2) instead of `decide` on reals.
  - id: T-QU1-P2
    milestone: QU1
    kind: proof
    title: q-Biedenharn–Elliott identity at r = 4
    file: Tasks/QU/T_QU1_P2.lean
    decl: Lightlike.TV.qBiedenharnElliott_four
    size: M
    difficulty: intermediate
    routes:
      - As `qBiedenharnElliott_three` with colours `Fin 3`, exact arithmetic in ℚ(√2).
  - id: T-QU1-P3
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols at r = 5
    file: Tasks/QU/T_QU1_P3.lean
    decl: Lightlike.TV.qOrthogonality_five
    size: M
    difficulty: intermediate
    routes:
      - As T-QU1-P1 with colours `Fin 4`; sin(π/5) involves the golden ratio, so work in ℚ(√5).
  - id: T-QU1-P4
    milestone: QU1
    kind: proof
    title: q-Biedenharn–Elliott identity at r = 5
    file: Tasks/QU/T_QU1_P4.lean
    decl: Lightlike.TV.qBiedenharnElliott_five
    size: M
    difficulty: intermediate
    routes:
      - As T-QU1-P2 with colours `Fin 4`, exact arithmetic in ℚ(√5).
  - id: T-QU1-P5
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols for every r ≥ 2
    file: Tasks/QU/T_QU1_P5.lean
    decl: Lightlike.TV.qOrthogonality_all
    size: L
    difficulty: research-level
    routes:
      - The q-Racah formula and q-hypergeometric summation (Kirillov–Reshetikhin 1989).
      - Representation theory of U_q(sl₂) at roots of unity (Turaev, Quantum invariants of knots and 3-manifolds, 1994).
      - Kauffman–Lins recoupling theory (Temperley–Lieb recoupling theory and invariants of 3-manifolds, 1994).
  - id: T-QU1-P6
    milestone: QU1
    kind: proof
    title: q-Biedenharn–Elliott identity for every r ≥ 2
    file: Tasks/QU/T_QU1_P6.lean
    decl: Lightlike.TV.qBiedenharnElliott_all
    size: L
    difficulty: research-level
    routes:
      - The q-Racah formula and q-hypergeometric identities (Kirillov–Reshetikhin 1989).
      - Representation theory of U_q(sl₂) at roots of unity (Turaev 1994).
      - Kauffman–Lins recoupling theory (1994).
  - id: T-GE1-P1
    milestone: GE1
    kind: proof
    title: Existence and uniqueness of the Levi-Civita connection of a Lorentzian metric
    file: Tasks/GE/T_GE1_P1.lean
    decl: Lightlike.leviCivita_exists_unique
    size: L
    difficulty: research-level
    routes:
      - Koszul formula as in Mathlib's `CovariantDerivative.leviCivitaConnection` (Riemannian case): it needs only non-degeneracy of `g`; use the musical isomorphism `LinearMap.BilinForm.toDual` (nondegenerate by `IsLorentzianForm.bilinForm_nondegenerate`). Uniqueness is on differentiable fields, as in Mathlib.
  - id: T-GE1-P2
    milestone: GE1
    kind: proof
    title: The curvature tensor is computed by any smooth extensions
    file: Tasks/GE/T_GE1_P2.lean
    decl: Lightlike.curvatureAt_apply
    size: L
    difficulty: research-level
    routes:
      - Tensoriality of `(X, Y, Z) ↦ ∇_X ∇_Y Z - ∇_Y ∇_X Z - ∇_{[X,Y]} Z` in each slot, as `CovariantDerivative.torsion_apply` (Mathlib/Geometry/Manifold/VectorBundle/CovariantDerivative/Torsion.lean), with `TensorialAt.mkHom`.
  - id: T-GE1-P3
    milestone: GE1
    kind: proof
    title: The Ricci tensor of a Levi-Civita connection is symmetric
    file: Tasks/GE/T_GE1_P3.lean
    decl: Lightlike.ricciAt_symm
    size: L
    difficulty: research-level
    routes:
      - First Bianchi identity and the pair symmetry of the lowered curvature (T-GE1-P4), then trace.
  - id: T-GE1-P4
    milestone: GE1
    kind: proof
    title: The first Bianchi identity and the pair symmetry of the lowered curvature
    file: Tasks/GE/T_GE1_P4.lean
    decl: Lightlike.bianchi_first_and_pair_symm
    size: L
    difficulty: research-level
    routes:
      - Torsion-freeness gives the first identity (Jacobi identity of the Lie bracket); metric compatibility gives antisymmetry in the last pair; the pair symmetry follows by the usual four-term argument.
  - id: T-GE1-P5
    milestone: GE1
    kind: proof
    title: The intrinsic scalar curvature is the coordinate scalar curvature in every chart
    file: Tasks/GE/T_GE1_P5.lean
    decl: Lightlike.scalarCurvatureAt_chart
    size: L
    difficulty: research-level
    routes:
      - In a chart the coordinate fields have vanishing brackets and `∇_{∂ᵢ} ∂ⱼ = Γᵏᵢⱼ ∂ₖ` (Koszul formula); the coordinate formula of `Lightlike/Spacetime/Curvature.lean` is then the trace of `curvatureAt`. This fixes the sign convention of the two definitions.
  - id: T-GE1-P6
    milestone: GE1
    kind: proof
    title: The manifold-level Einstein equations are the coordinate ones in every chart
    file: Tasks/GE/T_GE1_P6.lean
    decl: Lightlike.satisfiesEinstein_iff_chart
    size: L
    difficulty: research-level
    routes:
      - T-GE1-P5 and its Ricci version in a chart; the `IsCoordMetric` part is `LorentzianMetric.isCoordMetric_coordMetric`.
  - id: T-GE1-P7
    milestone: GE1
    kind: proof
    title: The second Bianchi identity of a Levi-Civita connection
    file: Tasks/GE/T_GE1_P7.lean
    decl: Lightlike.bianchi_second
    size: L
    difficulty: research-level
    routes:
      - Torsion-freeness and the Jacobi identity: evaluate the cyclic sum on extensions of the vectors with vanishing brackets at the point (coordinate fields of a chart), where it reduces to the Jacobi identity for the covariant derivatives.
  - id: T-GE1-P8
    milestone: GE1
    kind: proof
    title: The Einstein tensor of a Levi-Civita connection is divergence free
    file: Tasks/GE/T_GE1_P8.lean
    decl: Lightlike.einstein_divergence_free
    size: L
    difficulty: research-level
    routes:
      - Contract the second Bianchi identity (T-GE1-P7) twice, using the symmetries of the curvature (T-GE1-P4) and metric compatibility.
  - id: T-GE1-P9
    milestone: GE1
    kind: proof
    title: Minkowski space solves the Einstein equations on the manifold
    file: Tasks/GE/T_GE1_P9.lean
    decl: Lightlike.minkowski_satisfiesEinstein
    size: L
    difficulty: research-level
    routes:
      - The connection is the trivial one, `∇_v Y = Dy(v)`: it is torsion free, compatible with the constant metric, and its curvature vanishes.

# Upstream tasks: finished results that belong in Mathlib (general mathematics) or Physlib
# (general physics), with the rework each needs. Exclusive, like definition
# tasks; `target` gives the label `upstream: <library>`.
upstream:
  - id: T-UP-1
    target: Mathlib
    area: harmonic-analysis
    size: M
    results: [LL-0007]
    title: "The spin representations of SU(2) are irreducible"
    rework: "`SU2` is already Mathlib's `Matrix.specialUnitaryGroup (Fin 2) ℂ`. Generalize the continuity hypotheses, follow Mathlib naming and style, and place it under `Mathlib/RepresentationTheory`."

  - id: T-UP-2
    target: Mathlib
    area: harmonic-analysis
    size: L
    results: [LL-0008]
    deps: [T-UP-1]
    title: "Every continuous irreducible finite-dimensional representation of SU(2) is a spin representation"
    rework: "Remove the dependence on the project's `Su2Exp` exponential map, or upstream it first; Mathlib naming and style review."

  - id: T-UP-3
    target: Physlib
    area: harmonic-analysis
    size: S
    results: [LL-0018]
    title: "Orthogonality of the 3j symbols in the general parametrisation"
    rework: "Already stated for Physlib's `threeJ` in doubled spins. Rename to Physlib conventions, drop the `Lightlike` namespace, and place it next to `sum_wigner3j_mul_wigner3j` (PhyslibAlpha/QuantumMechanics/AngularMomentum/Wigner3j.lean)."

  - id: T-UP-4
