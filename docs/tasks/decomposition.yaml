# Hand-written input to scripts/tasks.py. The script combines it with the milestone tables of
# docs/tasks/milestones.md into docs/tasks/tasks.yaml (the full task list and dependency graph) and
# docs/tasks/README.md (the task board in Markdown). After editing this file or milestones.md, run
#   python3 scripts/tasks.py generate
# Every milestone is one task; the proof tasks and upstream tasks below are added. This file is the
# plan only: who works on a task, and whether it is done, is on the task's GitHub issue.

# Area heading of milestones.md -> area label (used for the label `area: <label>`).
areas:
  PL topology: pl-topology
  Oscillatory and saddle-point asymptotics: asymptotics
  Harmonic analysis on Lie groups: harmonic-analysis
  Quantum groups and state-sum TQFTs: quantum-groups
  Lorentzian and Riemannian geometry: geometry
  Operator algebras and quantum information: operator-algebras
  Perturbative QFT and the renormalization group: qft-rg
  Conformal field theory: cft
  Dynamical systems: dynamics
  Random geometry: random-geometry
  Gauge theory and constrained systems: gauge-constrained
  Spin foams: spin-foams
  Canonical quantum gravity: canonical-qg
  Group field theory and tensor models: gft-tensor
  Dynamical triangulations: dynamical-triangulations
  Regge calculus: regge
  Causal sets: causal-sets
  Asymptotic safety: asymptotic-safety
  Perturbative quantum gravity: perturbative-qg
  String theory: string-theory
  Holography: holography
  Low-dimensional gravity: low-dim-gravity
  Semiclassical gravity: semiclassical
  Cosmology: cosmology
  Noncommutative geometry: ncg
  Twistor theory: twistors
  Matrix models: matrix-models
  Other approaches: other

# Milestone IDs in milestones.md that are not plain codes, and the codes used in task IDs.
aliases:
  RC6a: RC6   # part of RC6

# Dependencies for milestone tables without a "Needs" column.
needs:
  PL4: [PL2]
  PL5: []
  PL6: [PL5]
  PL7a: [PL2, PL4]
  PL7b: [PL7a, PL6]
  PL7c: [PL2, PL4, PL7a]

# Milestones whose statements are all among the proof tasks below. Once those are locked, the
# milestones that need one of them can start, before its proofs are done.
stated: [QU1]   # the definitions exist; the statements are T-QU1-P1 to PL7

# Hand-written tasks: statements written as skeletons in Tasks/, one file per task. Their
# statements are drafts until they are reviewed and locked (`tasks.py lock`).
tasks:
  - id: T-QU1-P1
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols at r = 4
    file: Tasks/QU/T_QU1_P1.lean
    decl: Lightlike.TV.qOrthogonality_four
    size: M
    difficulty: intermediate
    routes:
      - As `qOrthogonality_three` (`Lightlike/TuraevViro/LevelOne.lean`) with colours `Fin 3`; the q-numbers involve √2, so evaluate exactly in ℚ(√2) instead of `decide` on reals.
  - id: T-QU1-P2
    milestone: QU1
    kind: proof
    title: q-Biedenharn–Elliott identity at r = 4
    file: Tasks/QU/T_QU1_P2.lean
    decl: Lightlike.TV.qBiedenharnElliott_four
    size: M
    difficulty: intermediate
    routes:
      - As `qBiedenharnElliott_three` with colours `Fin 3`, exact arithmetic in ℚ(√2).
  - id: T-QU1-P3
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols at r = 5
    file: Tasks/QU/T_QU1_P3.lean
    decl: Lightlike.TV.qOrthogonality_five
    size: M
    difficulty: intermediate
    routes:
      - As T-QU1-P1 with colours `Fin 4`; sin(π/5) involves the golden ratio, so work in ℚ(√5).
  - id: T-QU1-P4
    milestone: QU1
    kind: proof
    title: q-Biedenharn–Elliott identity at r = 5
    file: Tasks/QU/T_QU1_P4.lean
    decl: Lightlike.TV.qBiedenharnElliott_five
    size: M
    difficulty: intermediate
    routes:
      - As T-QU1-P2 with colours `Fin 4`, exact arithmetic in ℚ(√5).
  - id: T-QU1-P5
    milestone: QU1
    kind: proof
    title: q-orthogonality of the quantum 6j symbols for every r ≥ 2
    file: Tasks/QU/T_QU1_P5.lean
    decl: Lightlike.TV.qOrthogonality_all
    size: L
    difficulty: research-level
    routes:
      - The q-Racah formula and q-hypergeometric summation (Kirillov–Reshetikhin 1989).
      - Representation theory of U_q(sl₂) at roots of unity (Turaev, Quantum invariants of knots and 3-manifolds, 1994).
      - Kauffman–Lins recoupling theory (Temperley–Lieb recoupling theory and invariants of 3-manifolds, 1994).
  - id: T-OP1-P1
    milestone: OP1
    kind: proof
    title: "The generator of a strongly continuous unitary group is self-adjoint (Stone's theorem, direction 1)"
    file: Tasks/OP/T_OP1_P1.lean
    decl: Lightlike.OperatorAlgebras.stone_generator_isSelfAdjoint
    size: L
    difficulty: research-level
    routes:
      - "Show `A` is closed, densely defined (domain is invariant and mollified vectors lie in it) and symmetric, then `ran (A ± i) = H` by the integral `∫₀^∞ e^{-t} U (∓ t) ψ dt` (Hall, Chapter 10, the proof of Stone's theorem)."
      - "Reed–Simon I, Chapter VIII (Stone's theorem)."
  - id: T-OP1-P2
    milestone: OP1
    kind: proof
    title: "Every self-adjoint operator generates a strongly continuous unitary group (Stone's theorem, direction 2)"
    file: Tasks/OP/T_OP1_P2.lean
    decl: Lightlike.OperatorAlgebras.stone_exists
    size: L
    difficulty: research-level
    routes:
      - "The unbounded spectral theorem (Hall, Chapter 10) and the functional calculus `U t = ∫ e^{i t λ} dE(λ)`."
      - "The Cayley transform and the spectral theorem for unitaries, or the Hille–Yosida resolvent route."
  - id: T-OP1-P3
    milestone: OP1
    kind: proof
    title: "A strongly continuous unitary group is determined by its generator (Stone's theorem, uniqueness)"
    file: Tasks/OP/T_OP1_P3.lean
    decl: Lightlike.OperatorAlgebras.stone_unique
    size: L
    difficulty: research-level
    routes:
      - "For `ψ` in the domain, `d/dt (V (-t) U t ψ) = 0`, so `V (-t) U t ψ` is constant; extend by density of the domain (needs the domain to be invariant under the group)."
  - id: T-OP2-P1
    milestone: OP2
    kind: proof
    title: "A Fock representation of the Weyl relations exists on every complex Hilbert space"
    file: Tasks/OP/T_OP2_P1.lean
    decl: Lightlike.OperatorAlgebras.fockRep_exists
    size: L
    difficulty: research-level
    routes:
      - "Symmetric Fock space `⨁ₙ Sym^n h` with the Weyl operators `exp(i φ(f))` (Bratteli–Robinson 2, Section 5.2.3), or the GNS representation of the quasi-free state `ω(W f) = exp(-‖f‖²/4)`."
  - id: T-OP2-P2
    milestone: OP2
    kind: proof
    title: "The Fock representation is unique up to unitary equivalence"
    file: Tasks/OP/T_OP2_P2.lean
    decl: Lightlike.OperatorAlgebras.fockRep_unique
    size: L
    difficulty: research-level
    routes:
      - "The map `W f Ω ↦ W' f Ω'` preserves inner products by the Weyl relation and the vacuum expectation; extend by cyclicity."
  - id: T-OP2-P3
    milestone: OP2
    kind: proof
    title: "Shale's criterion: a Bogoliubov transformation is implementable in the Fock representation iff its antilinear part is Hilbert–Schmidt"
    file: Tasks/OP/T_OP2_P3.lean
    decl: Lightlike.OperatorAlgebras.shale
    size: L
    difficulty: research-level
    routes:
      - "Implementability by the unitary built from the Bogoliubov coefficients (Shale 1962; Bratteli–Robinson 2, Chapter 5); the converse by the number operator and the vacuum's image."
  - id: T-OP2-P4
    milestone: OP2
    kind: proof
    title: "Every nonzero vector of a Fock representation is cyclic for the Weyl unitaries (the Fock representation is irreducible)"
    file: Tasks/OP/T_OP2_P4.lean
    decl: Lightlike.OperatorAlgebras.fockRep_cyclic_of_ne_zero
    size: L
    difficulty: research-level
    routes:
      - "The closed span of `W f ψ` is invariant, so its projection commutes with every `W f`; the projection onto the vacuum is a limit of Gaussian averages of the Weyl unitaries (over the span of finitely many vectors), which shows that the commutant is trivial."
  - id: T-OP2-P5
    milestone: OP2
    kind: proof
    title: "A Bogoliubov transformation is implemented in a Fock representation iff there is a vector with Gaussian characteristic function exp(-|T f|^2/4)"
    file: Tasks/OP/T_OP2_P5.lean
    decl: Lightlike.OperatorAlgebras.implements_iff_exists_gaussian_vector
    size: M
    difficulty: advanced
    routes:
      - "`⇒`: `Ψ = U⁻¹ Ω` has `⟪Ψ, W f Ψ⟫ = ⟪Ω, W (T f) Ω⟫`. `⇐`: the vectors `W (T f) Ω` and `W f Ψ` have the same Gram matrix (the transformation preserves the symplectic form), `Ψ` is cyclic by irreducibility, and the Gram unitary (`exists_unitary_of_gram_eq`) intertwines."
  - id: T-OP2-P6
    milestone: OP2
    kind: proof
    title: "Shale's criterion, necessity: an implementable Bogoliubov transformation has Hilbert-Schmidt antilinear part"
    file: Tasks/OP/T_OP2_P6.lean
    decl: Lightlike.OperatorAlgebras.shale_necessity
    size: L
    difficulty: research-level
    routes:
      - "By `T-OP2-P5` there is `Ψ` with `⟪Ψ, W f Ψ⟫ = exp (-‖T f‖² / 4)`. The overlap `|⟪Ω, Ψ⟫|²` is the limit over finite-dimensional subspaces of the Gaussian averages of `W f`, which is `∏ (1 + ‖β eᵢ‖²)⁻¹` for a Hilbert basis `eᵢ`; it is positive, so `∑ ‖β eᵢ‖² < ∞`."
  - id: T-OP2-P7
    milestone: OP2
    kind: proof
    title: "Shale's criterion, sufficiency: a Bogoliubov transformation with Hilbert-Schmidt antilinear part is implementable"
    file: Tasks/OP/T_OP2_P7.lean
    decl: Lightlike.OperatorAlgebras.shale_sufficiency
    size: L
    difficulty: research-level
    routes:
      - "Build the squeezed vector `Ψ` (a vector with `⟪Ψ, W f Ψ⟫ = exp (-‖T f‖² / 4)`) as a limit of finite-mode squeezed vectors, whose Cauchy estimate is `∑ ‖β eᵢ‖² < ∞`; then `T-OP2-P5` gives the unitary."
  - id: T-OP1-P4
    milestone: OP1
    kind: proof
    title: "The C_c^∞ functions are a core of the generator of the translation group on L²(ℝ)"
    file: Tasks/OP/T_OP1_P4.lean
    decl: Lightlike.OperatorAlgebras.translationGroup_core
    size: M
    difficulty: research-level
    routes:
      - "Mollification: for ψ in the domain, ψ * ρ_ε is smooth and tends to ψ with its derivative; truncate by a cutoff and use that the generator commutes with convolution (Hall, Chapter 10)."
      - "A dense invariant subspace of the domain is a core (Reed–Simon I, Chapter VIII, on cores); the C_c^∞ functions are invariant under translation and dense (Mathlib: Lp.dense_hasCompactSupport_contDiff)."
  - id: T-OP1-P5
    milestone: OP1
    kind: proof
    title: "On L²[0,1], -i d/dx without boundary conditions has deficiency indices (1,1)"
    file: Tasks/OP/T_OP1_P5.lean
    decl: Lightlike.OperatorAlgebras.momentumMin_deficiency
    size: M
    difficulty: intermediate
    routes:
      - "The adjoint of -i d/dx on C_c^∞(0,1) is -i d/dx on H¹(0,1) (weak derivative); ker(A† ∓ i) is spanned by exp(∓x), found by solving the ODE for an absolutely continuous function; density of C_c^∞(0,1) in L²(0,1) (Mathlib: density of compactly supported smooth functions in Lp)."

  - id: T-OP1-P6
    milestone: OP1
    kind: proof
    title: "On L²(0,1), the closure of -i d/dx on C² functions supported inside (0,1) equals its closure on C_c^∞(0,1)"
    file: Tasks/OP/T_OP1_P6.lean
    decl: Lightlike.OperatorAlgebras.momentumGraph_closure_eq
    size: M
    difficulty: intermediate
    routes:
      - "Mollification: for f in C²_c(0,1), f * ρ_ε is C_c^∞(0,1) for small ε, and f * ρ_ε → f and (f * ρ_ε)' = f' * ρ_ε → f' in L²(0,1), so every graph point of the C² operator is a limit of graph points of the C_c^∞ operator; the other inclusion is monotonicity (momentumGraphSmooth_le). Needs: convolution with a mollifier commutes with the derivative and converges in L² (Mathlib: ContDiffBump, convolution approximation of the identity)."

  - id: T-SP3-P1
    milestone: SP3
    kind: proof
    title: "A logarithmic Tauberian theorem of Ingham type: if β log L(β) → a > 0 then log ρ[0, X] / (2 √(a X)) → 1"
    file: Tasks/SP/T_SP3_P1.lean
    decl: Lightlike.Tauberian.ingham_logarithmic
    size: M
    difficulty: intermediate
    routes:
      - "Upper bound ρ[0, X] ≤ e^{βX} L(β) with β = √(a/X). Lower bound: split L(β) into three windows around the saddle x = a/β²; the outer two are at most L(β)/4 each by comparing with the Laplace transform at β(1 + η/2) and β/(1 + η/2), so the middle window, at most e^{-βXl} ρ[0, Xh], carries at least half of L(β)."
  - id: T-OP1-P7
    milestone: OP1
    kind: proof
    title: "The Hille–Yosida generation theorem for contraction semigroups on a Banach space"
    file: Tasks/OP/T_OP1_P7.lean
    decl: Lightlike.OperatorAlgebras.hilleYosida_contraction_generation
    size: L
    difficulty: intermediate
    routes:
      - "Yosida approximation: with R(λ) = (λ - A)⁻¹, the bounded operators Y_λ = λ² R(λ) - λ give contractions exp(t Y_λ); a Cauchy estimate and the density of dom A show that exp(t Y_λ) converges strongly to a semigroup S(t), uniformly on compact time intervals; the difference quotients of S converge to A x on dom A (mean value inequality for exp(t Y_λ)), so the generator contains A, and a dissipative generator with λ - A surjective is A."

  - id: T-OP1-P8
    milestone: OP1
    kind: proof
    title: "The spectral theorem for unbounded self-adjoint operators: a unique projection-valued measure with A equal to the spectral integral of the identity"
    file: Tasks/OP/T_OP1_P8.lean
    decl: Lightlike.OperatorAlgebras.spectral_theorem
    size: XL
    difficulty: research-level
    routes:
      - "Teschl, Mathematical Methods in Quantum Mechanics, Theorem 3.7 (resolvent, Herglotz functions, Stieltjes inversion), or the Cayley transform, the continuous functional calculus of the unitary and the Riesz–Markov theorem, transported to the real line."
  - id: T-SF10-P2
    milestone: SF10
    kind: proof
    title: Invertibility of the Hessian of the Lorentzian vertex action at a critical point
    file: Tasks/SF/T_SF10_P2.lean
    decl: Lightlike.Asymptotics.Lorentzian.lorHessian_invertible_at_critical
    size: L
    difficulty: research-level
    routes:
      - "Reduce to `Im(-H)` injective on the kernel of `Re(-H)`: `Re(-H)` is positive semidefinite (a sum of squares of the linearised alignment conditions) and `-H v = 0` forces `Re(-H) v = 0` and `Im(-H) v = 0`. The closed form of the blocks is `hessBlockMatrix` (`Lightlike/Asymptotics/Lorentzian/HessianAssembly.lean`)."
      - "A certified computation for the regular simplex (numerical evidence: `scripts/asymptotics/lorentzian_hessian_kernel_check.py`) does not settle all nondegenerate data."
  - id: T-SF10-P3
    milestone: SF10
    kind: proof
    title: The far part of the Lorentzian vertex integral is of lower order
    file: Tasks/SF/T_SF10_P3.lean
    decl: Lightlike.Asymptotics.Lorentzian.lorVertex_farRemainder
    size: S
    difficulty: intermediate
    routes:
      - "Split `1 - χ = (ψ - χ) + (1 - ψ)` for a cutoff `ψ` in `U` equal to `1` near `K`; the first part is `lorVertex_farRemainder_compact_proof` (T-SF10-P5, proved: `Lightlike/SpinFoam/VertexAsymptoticsHyp/FarCompact.lean`), the second `lorVertex_farRemainder_tail` (T-SF10-P6). The critical-set hypothesis is `CriticalSetIs` with the cutoff `1` (the first form, with `χ`, is false: a critical point outside `tsupport χ` contributes `λ^{-22}`; `docs/notes/sf10-p3-assessment.md`)."
  - id: T-SF10-P6
    milestone: SF10
    kind: proof
    title: The non-compact tail of the Lorentzian far remainder is of lower order
    file: Tasks/SF/T_SF10_P6.lean
    decl: Lightlike.Asymptotics.Lorentzian.lorVertex_farRemainder_tail
    size: L
    difficulty: research-level
    routes:
      - "An integrable majorant uniform in `λ` (`‖A e^{λS}‖ ≤ ‖A‖ e^{S.re}` for `λ ≥ 1`, `Re S ≤ 0`) and a quantitative gap `Re S ≤ -δ` in the non-compact directions, with `nonstationary_phase` where `Re S = 0`, `dS ≠ 0`. Not in BDFHP; if false, report a counterexample."
  - id: T-SF10-P4
    milestone: SF10
    kind: proof
    title: Finiteness and classification of the critical points of the Lorentzian vertex action
    file: Tasks/SF/T_SF10_P4.lean
    decl: Lightlike.Asymptotics.Lorentzian.lorVertex_criticalSet_finite
    size: L
    difficulty: research-level
    routes:
      - "The bivector reconstruction theorem for Lorentzian data (BDFHP Sec. 5.4.3, via Barrett–Dowdall–Fairbairn–Gomes–Hellmann, arXiv:0902.1170): critical points give bivector geometries. The SU(2) case is `Lightlike/Asymptotics/Lorentzian/Classification.lean`."
  - id: T-GE2-P1
    milestone: GE2
    kind: proof
    title: "Timelike futures are causal futures: I⁺(x) ⊆ J⁺(x)"
    file: Tasks/GE2/T_GE2_P1.lean
    decl: Lightlike.Causal.chronFuture_subset_causalFuture
    size: S
    difficulty: intermediate
    routes:
      - "Unfold both definitions; `IsFutureTimelike v` gives `IsFutureCausal v` (the vector is nonzero because `g(v, X) < 0`)."
  - id: T-GE2-P2
    milestone: GE2
    kind: proof
    title: "A point is in its own causal future: x ∈ J⁺(x)"
    file: Tasks/GE2/T_GE2_P2.lean
    decl: Lightlike.Causal.mem_causalFuture_self
    size: S
    difficulty: intermediate
    routes:
      - "The constant curve on `Icc 0 0`: locally Lipschitz on a point, and the velocity condition holds almost everywhere on a null set."
  - id: T-GE2-P3
    milestone: GE2
    kind: proof
    title: "The causal future is transitive: y ∈ J⁺(x), z ∈ J⁺(y) imply z ∈ J⁺(x)"
    file: Tasks/GE2/T_GE2_P3.lean
    decl: Lightlike.Causal.causalFuture_trans
    size: M
    difficulty: intermediate
    routes:
      - "Glue the curves at the junction; the glued curve is locally Lipschitz in charts, and the velocity condition holds almost everywhere since a point is null."
  - id: T-GE2-P4
    milestone: GE2
    kind: proof
    title: "The chronological future is transitive: y ∈ I⁺(x), z ∈ I⁺(y) imply z ∈ I⁺(x)"
    file: Tasks/GE2/T_GE2_P4.lean
    decl: Lightlike.Causal.chronFuture_trans
    size: M
    difficulty: intermediate
    routes:
      - "As `causalFuture_trans`."
  - id: T-GE2-P5
    milestone: GE2
    kind: proof
    title: "Push-up, first form: y ∈ I⁺(x), z ∈ J⁺(y) imply z ∈ I⁺(x)"
    file: Tasks/GE2/T_GE2_P5.lean
    decl: Lightlike.Causal.chronFuture_causalFuture_trans
    size: L
    difficulty: research-level
    routes:
      - "Local result in a convex normal neighbourhood, then chain along the causal curve by compactness of its parameter interval."
  - id: T-GE2-P6
    milestone: GE2
    kind: proof
    title: "Push-up, second form: y ∈ J⁺(x), z ∈ I⁺(y) imply z ∈ I⁺(x)"
    file: Tasks/GE2/T_GE2_P6.lean
    decl: Lightlike.Causal.causalFuture_chronFuture_trans
    size: M
    difficulty: research-level
    routes:
      - "As `chronFuture_causalFuture_trans`, deforming the causal curve at its end."
  - id: T-GE2-P7
    milestone: GE2
    kind: proof
    title: The chronological future is open
    file: Tasks/GE2/T_GE2_P7.lean
    decl: Lightlike.Causal.isOpen_chronFuture
    size: L
    difficulty: research-level
    routes:
      - "Perturb the end of a timelike curve inside a chart; the open future cone at the end point supplies the room."
  - id: T-GE2-P8
    milestone: GE2
    kind: proof
    title: Causality implies chronology
    file: Tasks/GE2/T_GE2_P8.lean
    decl: Lightlike.Causal.isChronological_of_isCausal
    size: M
    difficulty: intermediate
    routes:
      - "A timelike curve from `x` to `x` has a point `y ≠ x` (the velocity is nonzero almost everywhere); `y ∈ J⁺(x)` and `x ∈ J⁺(y)`."
  - id: T-GE2-P9
    milestone: GE2
    kind: proof
    title: Strong causality implies causality
    file: Tasks/GE2/T_GE2_P9.lean
    decl: Lightlike.Causal.isCausal_of_isStronglyCausal
    size: M
    difficulty: intermediate
    routes:
      - "If `y ∈ J⁺(x)` and `x ∈ J⁺(y)` with `x ≠ y`, a causally convex neighbourhood of `x` missing `y` contains the whole loop, contradiction."
  - id: T-GE2-P10
    milestone: GE2
    kind: proof
    title: Stable causality implies strong causality
    file: Tasks/GE2/T_GE2_P10.lean
    decl: Lightlike.Causal.isStronglyCausal_of_isStablyCausal
    size: L
    difficulty: research-level
    routes:
      - "Preimages of small intervals of the time function intersected with a chart box are causally convex."
  - id: T-GE2-P11
    milestone: GE2
    kind: proof
    title: Causal simplicity implies stable causality
    file: Tasks/GE2/T_GE2_P11.lean
    decl: Lightlike.Causal.isStablyCausal_of_isCausallySimple
    size: L
    difficulty: research-level
    routes:
      - "Construct a time function by Hawking's averaging of volumes of futures, using closedness of `J±`."
  - id: T-GE2-P12
    milestone: GE2
    kind: proof
    title: Global hyperbolicity implies causal simplicity
    file: Tasks/GE2/T_GE2_P12.lean
    decl: Lightlike.Causal.isCausallySimple_of_isGloballyHyperbolic
    size: L
    difficulty: research-level
    routes:
      - "The limit curve theorem for causal curves with endpoints converging, using compactness of the diamonds."
  - id: T-GE2-P13
    milestone: GE2
    kind: proof
    title: A Cauchy surface is achronal
    file: Tasks/GE2/T_GE2_P13.lean
    decl: Lightlike.Causal.IsCauchySurface.isAchronal
    size: M
    difficulty: intermediate
    routes:
      - "Extend a timelike curve by Zorn's lemma to an inextendible one; it meets `S` at both points, contradicting uniqueness."
  - id: T-GE2-P14
    milestone: GE2
    kind: proof
    title: The causal future in Minkowski space is the closed light cone
    file: Tasks/GE2/T_GE2_P14.lean
    decl: Lightlike.Causal.minkowski_causalFuture
    size: L
    difficulty: intermediate
    routes:
      - "`⊇` by a straight line (`isFutureCausalCurve_line`-type lemma); `⊆` by integrating the velocity of a Lipschitz curve (absolutely continuous) and the reverse triangle inequality of the cone."
  - id: T-GE2-P15
    milestone: GE2
    kind: proof
    title: Minkowski space is globally hyperbolic
    file: Tasks/GE2/T_GE2_P15.lean
    decl: Lightlike.Causal.minkowski_isGloballyHyperbolic
    size: L
    difficulty: intermediate
    routes:
      - "From `minkowski_causalFuture`: the diamonds are closed and bounded subsets of `ℝ^{d+1}`."
  - id: T-GE2-P16
    milestone: GE2
    kind: proof
    title: The slice t = 0 is a Cauchy surface of Minkowski space
    file: Tasks/GE2/T_GE2_P16.lean
    decl: Lightlike.Causal.minkowski_isCauchySurface
    size: L
    difficulty: intermediate
    routes:
      - "The time coordinate is strictly increasing along a timelike curve and unbounded on an inextendible one (the cone is bounded by lines)."
  - id: T-GE2-P17
    milestone: GE2
    kind: proof
    title: A continuous time orientation can be replaced by a smooth one
    file: Tasks/GE2/T_GE2_P17.lean
    decl: Lightlike.Causal.exists_smooth_timeOrientation
    size: L
    difficulty: research-level
    routes:
      - "Smooth partition of unity subordinate to charts where a constant timelike field is future-directed; convex combinations of future-directed timelike vectors stay in the cone."

  - id: T-GE2-P18
    milestone: GE2
    kind: proof
    title: An achronal set is a Cauchy surface iff its domain of dependence is the whole manifold
    file: Tasks/GE2/T_GE2_P18.lean
    decl: Lightlike.Causal.isCauchySurface_iff_domainDep_eq_univ
    size: L
    difficulty: research-level
    routes:
      - "Both directions go through extension of a timelike curve to an inextendible one; achronality gives the uniqueness of the meeting point."
  - id: T-GE2-P19
    milestone: GE2
    kind: proof
    title: A curve with timelike velocity almost everywhere, without a margin, still joins its endpoints in the timelike future
    file: Tasks/GE2/T_GE2_P19.lean
    decl: Lightlike.Causal.mem_chronFuture_of_ae_timelike
    size: L
    difficulty: research-level
    routes:
      - "Open. The library's timelike curves carry a margin (the velocity stays in a closed cone strictly inside the timelike cone on compact intervals); the textbooks ask only for timelike velocity. The statement says the two definitions give the same chronological future. Approach: approximate the curve by piecewise-smooth timelike curves with margin in a convex chart neighbourhood."
  - id: T-GE2-P20
    milestone: GE2
    kind: proof
    title: A limit curve through a limit point of future-inextendible causal curves is a future-inextendible causal curve
    file: Tasks/GE2/T_GE2_P20.lean
    decl: Lightlike.Causal.exists_inextendible_limit_curve
    size: L
    difficulty: research-level
    routes:
      - "The full limit-curve theorem (Hawking-Ellis, Lemma 6.2.1) for future-inextendible curves, across charts, with the limit curve of one subsequence. The endpoint form in one chart is `Lightlike.Causal.exists_limit_curve` (LL-0151, Lightlike/Spacetime/CausalLadder/LimitCurve.lean). Approach: reparametrise each curve by a complete Riemannian length (or cover by charts and diagonalise), apply the one-chart theorem on each chart, glue by the compact-chart cover, and extend by a maximality argument to an inextendible curve."
  - id: T-CS2-P1
    milestone: CS2
    kind: proof
    title: "The Myrheim–Meyer relation probability in every dimension"
    file: Tasks/CS2/T_CS2_P1.lean
    decl: Lightlike.CausalSets.myrheimMeyer
    size: L
    difficulty: research-level
    routes:
      - "Light-cone-type coordinates are not available beyond `d = 1`. Reduce, by the symmetry of the diamond, to the volume of the set of `y` in the diamond that are in the causal future of a point `x`, and integrate over `x`."
  - id: T-CS2-P2
    milestone: CS2
    kind: proof
    title: "The Myrheim–Meyer relation probability in four dimensions is 1/20"
    file: Tasks/CS2/T_CS2_P2.lean
    decl: Lightlike.CausalSets.relProb_three
    size: M
    difficulty: advanced
    routes:
      - "Either specialise `myrheimMeyer` (`Γ(5) Γ(2) / (4 Γ(6)) = 1/20`) or compute the volume of the intersection of the future cone of a point with the diamond directly."
  - id: T-CS2-P3
    milestone: CS2
    kind: proof
    title: "A rectangle instead of the diamond gives a different relation probability"
    file: Tasks/CS2/T_CS2_P3.lean
    decl: Lightlike.CausalSets.rectangle_relProb
    size: M
    difficulty: intermediate
    routes:
      - "For `s = t' - t ∈ [0, 1]` the density of the time difference is `1 - s`, and `|x' - x| ≤ s` has probability `s - s²/4` for the width `2`; integrate `(1 - s)(s - s²/4)` over `[0, 1]` to get `7/48`. The diamond value is `relProb_one`."

  - id: T-CS3-P1
    milestone: CS3
    kind: proof
    title: "The longest chain of n uniform points of the 1+1 diamond is about 2 sqrt(n)"
    file: Tasks/CS3/T_CS3_P1.lean
    decl: Lightlike.CausalSets.expected_longestChain_asymptotic
    size: L
    difficulty: research-level
    routes:
      - "The order of the sprinkled points is the dominance order of a uniform random permutation (`coneLE_sprinklePt`), so the longest chain is the longest increasing subsequence. The limit `2` is the theorem of Vershik–Kerov and Logan–Shepp."

  - id: T-CA1-P1
    milestone: CA1
    kind: proof
    title: "The bracket of a smeared momentum constraint with a smeared Hamiltonian constraint is a smeared Hamiltonian constraint"
    file: Tasks/CA/T_CA1_P1.lean
    decl: Lightlike.Canonical.bracket_momentum_hamiltonian
    size: L
    difficulty: research-level
    routes:
      - "Covariance of the scalar density `√h R` under the flow of `ξ`, from `Lightlike.scalarCurvature_pullback`, and the first variation of the scalar curvature."
      - "Hojman–Kuchař–Teitelboim (1976) and Thiemann (2007), Chapter 1: the hypersurface deformation algebra."
  - id: T-CA1-P2
    milestone: CA1
    kind: proof
    title: "The bracket of two smeared Hamiltonian constraints is a smeared momentum constraint with the structure function h^{ij}"
    file: Tasks/CA/T_CA1_P2.lean
    decl: Lightlike.Canonical.bracket_hamiltonian_hamiltonian
    size: L
    difficulty: research-level
    routes:
      - "The first variation of `√h R` (Palatini identity in coordinates), an integration by parts, and the antisymmetry in `N, M`."
      - "Hojman–Kuchař–Teitelboim (1976) and Thiemann (2007), Chapter 1: the hypersurface deformation algebra."
  - id: T-CA1-P3
    milestone: CA1
    kind: proof
    title: "The Lie-derivative form of the smeared momentum constraint equals the ADM form with the covariant divergence of the momentum"
    file: Tasks/CA/T_CA1_P3.lean
    decl: Lightlike.Canonical.momentumConstraint_eq_adm
    size: M
    difficulty: intermediate
    routes:
      - "Pointwise `π^{ij} (ℒ_ξ h)_ij + 2 (h ξ)_i ∇_k π^{ik} = 2 ∂_j (π^{ij} h_{ik} ξ^k)` and `integral_pd_eq_zero`."
      - "ADM (1962), eq. (3.14b)."

  - id: T-CA1-P4
    milestone: CA1
    kind: proof
    title: "The bracket of two smeared momentum constraints on a hypersurface is the smeared constraint of the Lie bracket of the shifts"
    file: Tasks/CA/T_CA1_P4.lean
    decl: Lightlike.Canonical.bracket_momentum_momentum_M
    size: L
    difficulty: research-level
    routes:
      - "Chart by chart the integrands are those of `bracket_momentum_momentum`; the new content is the independence of the sum over the atlas pieces of the decomposition (change laws `IsCovTensor`, `IsVec`, `IsDensity`) and the commutation of the Gateaux derivative with the finite sum."
  - id: T-CA1-P5
    milestone: CA1
    kind: proof
    title: "The bracket of a smeared momentum constraint with a smeared Hamiltonian constraint on a hypersurface is the Hamiltonian constraint smeared with the derivative of the lapse along the shift"
    file: Tasks/CA/T_CA1_P5.lean
    decl: Lightlike.Canonical.bracket_momentum_hamiltonian_M
    size: L
    difficulty: research-level
    routes:
      - "As T-CA1-P4, with `admBracket_momentum_hamiltonian` in every chart and the chart covariance of the scalar curvature."
  - id: T-CA1-P6
    milestone: CA1
    kind: proof
    title: "The bracket of two smeared Hamiltonian constraints on a hypersurface is the smeared momentum constraint of the shift given by the inverse metric"
    file: Tasks/CA/T_CA1_P6.lean
    decl: Lightlike.Canonical.bracket_hamiltonian_hamiltonian_M
    size: L
    difficulty: research-level
    routes:
      - "As T-CA1-P4, with `bracket_hamiltonian_hamiltonian_of_smooth` in every chart; `structureShift` is a vector field."
  - id: T-CA1-P7
    milestone: CA1
    kind: proof
    title: "On a single global chart the constraints on a hypersurface are the constraints of the chart"
    file: Tasks/CA/T_CA1_P7.lean
    decl: Lightlike.Canonical.constraintM_bridge
    size: M
    difficulty: intermediate
    routes:
      - "On `M = ℝᵈ` the charts are the identity and the atlas pieces partition `ℝᵈ`; for continuous compactly supported integrands the sum of the integrals over the pieces is the integral (`integral_iUnion`)."

  - id: T-GF7-P8
    milestone: GF7
    kind: proof
    title: "Cayley's formula: there are n^{n-2} trees on n labelled vertices"
    file: Tasks/GF/T_GF7_P8.lean
    decl: Lightlike.FieldTheory.Forest.card_isTree
    size: M
    difficulty: intermediate
    routes:
      - "The Prüfer code: removing the least leaf and recording its neighbour, n - 2 times, is a bijection from the trees on Fin n to Fin n^(n-2); or count rooted forests by induction (the number of rooted forests on [n] with k given roots is k n^{n-k-1})."

# Upstream tasks: finished results that belong in Mathlib (general mathematics) or Physlib
# (general physics), with the rework each needs. Exclusive, like definition
# tasks; `target` gives the label `upstream: <library>`.
  - id: T-OP6-P1
    milestone: OP6
    kind: proof
    title: "The dual of the compact operators is the trace class: every continuous functional on the compact operators is a trace pairing with a unique trace-class operator of the same norm"
    file: Tasks/OP/T_OP6_P1.lean
    decl: Lightlike.OperatorAlgebras.TraceClass.compact_dual_eq_traceClass
    size: L
    difficulty: advanced
    routes:
      - "Finite-rank operators are dense in the compact ones; a functional on them gives a bounded sesquilinear form on rank-one operators (`TraceClass.sesquilinearFormOfFunctional`), hence a bounded operator by Riesz, and its polar decomposition shows it is trace class with `‖T‖₁ = ‖f‖` (Reed-Simon I, Theorem VI.26)."

  - id: T-GE6-P1
    milestone: GE6
    kind: proof
    title: "The Kerr metric component g_tt = -(Δ - a² sin²θ)/ρ² (Carroll (7.125))"
    file: Tasks/GE6/T_GE6_P1.lean
    decl: Lightlike.kerr_gtt_eq
    size: S
    difficulty: intermediate
    routes:
      - "Unfold `kerrMetric`, `kerrS`, `kerrD`; clear the denominator with `kerrS_pos` and use `sin² + cos² = 1`."
  - id: T-GE6-P2
    milestone: GE6
    kind: proof
    title: "g_tt = a² sin²θ/ρ² ≥ 0 where Δ = 0 (Carroll (7.126))"
    file: Tasks/GE6/T_GE6_P2.lean
    decl: Lightlike.kerr_gtt_horizon
    size: S
    difficulty: intermediate
    routes:
      - "From `kerr_gtt_eq` (T-GE6-P1); nonnegativity from `kerrS_pos`."
  - id: T-GE6-P3
    milestone: GE6
    kind: proof
    title: "The ergosurface g_tt = 0 is (r - M)² = M² - a² cos²θ (Carroll (7.127))"
    file: Tasks/GE6/T_GE6_P3.lean
    decl: Lightlike.kerr_ergosurface_iff
    size: S
    difficulty: intermediate
    routes:
      - "Reduce to the numerator `Δ - a² sin²θ = r² - 2Mr + a² cos²θ` of `kerr_gtt_eq`."
  - id: T-GE6-P4
    milestone: GE6
    kind: proof
    title: "The Kerr metric at M = 0 is flat space in ellipsoidal coordinates, diagonal form (Carroll (7.117))"
    file: Tasks/GE6/T_GE6_P4.lean
    decl: Lightlike.kerr_mass_zero
    size: S
    difficulty: intermediate
    routes:
      - "Entrywise: `Matrix.ext` with `fin_cases`, then `simp [kerrMetric, kerrD]` and `field_simp`."
  - id: T-GE6-P5
    milestone: GE6
    kind: proof
    title: "The irreducible mass of a Kerr black hole: A/(16π) = (M² + √(M⁴ - (Ma)²))/2 (Carroll (7.148), (7.149))"
    file: Tasks/GE6/T_GE6_P5.lean
    decl: Lightlike.kerr_irreducible_mass
    size: S
    difficulty: intermediate
    routes:
      - "`rplus_sq_add` gives `r₊² + a² = 2 M r₊`; then `√(M⁴ - M² a²) = M √(M² - a²)`."
  - id: T-GE6-P6
    milestone: GE6
    kind: proof
    title: "Extreme Kerr: M - M_irr = (1 - 1/√2) M, about 29 % of M (Carroll (7.149), (7.152))"
    file: Tasks/GE6/T_GE6_P6.lean
    decl: Lightlike.kerr_extreme_extraction
    size: S
    difficulty: intermediate
    routes:
      - "At `a = M`, `r₊ = M`, so `M_irr² = M²/2`."
  - id: T-GE6-P7
    milestone: GE6
    kind: proof
    title: "The first law of Kerr black holes dM = (κ/8π) dA + Ω_H dJ along a differentiable family (Carroll (7.154), (7.155))"
    file: Tasks/GE6/T_GE6_P7.lean
    decl: Lightlike.kerr_first_law
    size: M
    difficulty: intermediate
    routes:
      - "Differentiate `r₊ = M + √(M² - a²)` (differentiable since `M² - a² > 0`); use `kerrKappa_eq` and `rplus_sq_add`."

