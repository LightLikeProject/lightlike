  SP4:
    issue: 197
    ranking: 46
    items:
      - id: m1
        kind: main
        text: "Near a non-degenerate critical point of a smooth function, with the critical point at x = 0 and a parameter λ, there are smooth coordinates (a local diffeomorphism fixing λ) in which f(x, λ) = f(0, λ) + Σ wᵢ yᵢ² with every wᵢ = ±1"
        decls: [Lightlike.Morse.morse_diagonal]
      - id: p1
        kind: piece
        text: "The chart of the diagonal normal form is defined: a local diffeomorphism of E × F fixing the parameter, smooth with smooth inverse at the base point"
        decls: [Lightlike.Morse.HasDiagonalMorseChart]
      - id: p2
        kind: piece
        text: "The Morse lemma with parameters: f(x, λ) = f(0, λ) + ½ B(Φ(x, λ), Φ(x, λ)) near (0, λ₀) with Φ smooth, and (x, λ) ↦ (Φ(x, λ), λ) a local diffeomorphism"
        decls: [Lightlike.Morse.morse_lemma_with_parameters, Lightlike.Morse.morse_coordinates]
      - id: t1
        kind: trust
        text: "The number k of negative signs equals the number of negative eigenvalues of the Hessian"
        decls: [Lightlike.Morse.sigNeg_hessQuad_eq_card_neg_eigenvalues, Lightlike.Morse.morse_diagonal_eigenvalues]
      - id: t2
        kind: trust
        text: "x³ at 0 has no diagonal Morse chart"
        decls: [Lightlike.Morse.not_hasDiagonalMorseChart_cube]
      - id: r1
        kind: review
        text: "The statement matches Milnor, Morse Theory, Part I, Lemma 2.2, in its generality: E, F finite-dimensional real normed spaces in Type, f smooth on all of E × F, critical point at x = 0 for λ near λ₀; check that this covers a smooth function on ℝⁿ near any non-degenerate critical point"
        review_evidence: "Milnor, Morse Theory, Part I, Lemma 2.2 itself was NOT read (no readable text; the source registry verifies only the chapter). Compared instead with Benedetti, Lectures on Differential Topology (arXiv:1907.10297), Theorem 1.13 on p. 34 and its proof, text extracted from the PDF and read: for f smooth on an open U of R^n with a non-degenerate critical point 0 of index lambda and f(0) = 0 there is a local diffeomorphism x = phi(u), phi(0) = 0, with f(phi(u)) = u^t I_{n,lambda} u. Statement-level match with Lightlike.Morse.morse_diagonal (MorseLemma.lean): (1) the chart: psi = phi^-1 is a local diffeomorphism at 0, as HasDiagonalMorseChart asks of the chart of E x F fixing the parameter, smooth with smooth inverse at the base point; (2) the normal form u^t I_{n,lambda} u is f(0) + sum w_i y_i^2 with w_i = +-1, the number of negative signs being the index lambda = the negativity index of the Hessian, which is sigNeg of the Hessian (morse_diagonal) and the number of negative eigenvalues (morse_diagonal_eigenvalues); (3) generality: E is any finite-dimensional real normed space (so R^n), and the parameter space F contains the parameter-free statement as F = 0; the Lean statement is for f smooth on all of E x F with the critical point at x = 0, Benedetti for f on an open set U with the critical point at 0. The reduction of the second to the first (a translation, subtracting the constant f(0), and a cut-off by a bump function equal to 1 near the critical point) is the standard one, named in the Limits paragraph of the module docstring and not formalised, so the Lean theorem covers a smooth function on R^n near a non-degenerate critical point only after that reduction. The proofs differ (Benedetti: f = x^t G(x) x and Gram-Schmidt P(x) with psi = P^-1 x; Lightlike: Hadamard with parameter and a smooth square root of B-self-adjoint endomorphisms), the statements do not. No difference to report beyond the unformalised reduction."
      - id: c1
        kind: catalogue
        text: "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map"
        decls: []
