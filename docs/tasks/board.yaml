# The repository whose issues track the tasks, its Project board, and the colours of the task labels.
# Read by two scripts, each the only writer of its own labels (owner, 25 Nov 2026):
#
# `python3 scripts/tasks.py sync` (the claim Action, .github/workflows/tasks.yml: on every issue,
# comment and pull request event, and hourly) keeps current
#   on a proof task's issue: ready, blocked (whether every task it needs is done), claimed (someone
#     commented `/claim`: 48 hours, or while a pull request is open), in review (a pull request with
#     the line `Task: <ID>` is open); it opens the issue when the task becomes ready and closes it
#     when the task's declaration has no sorry on main;
#   on a milestone's issue: claimed and attempting only, and the assignees.
#
# `python3 scripts/sync_github.py apply` (run by the merger after a merge) keeps current, on a
# milestone's issue: its title and body (the checklist computed by scripts/milestone_status.py),
# the plan labels (milestone, area, size, difficulty), one status label for a v1.0 milestone
# (status: ready, status: in-progress, status: review, status: done), the GitHub Milestone "v1.0",
# and the column on the Project board (Not scheduled: an open milestone issue without the v1.0
# Milestone). It opens the issue of a milestone that has none. Neither script closes a milestone's issue: the merger does, after a
# passing review.
org: LightlikeProject
repo: LightlikeProject/lightlike

# The Project board of the milestones (scripts/sync_github.py): its title, and the single-select
# field whose options are the columns.
project:
  title: Lightlike
  field: Status
  columns: [Ready, In progress, In review, Done, Not scheduled]
  # A number field: the ranking of each open v1.0 milestone (`ranking:` of checklists.yaml).
  # Sorting the Ready column by it shows what is next.
  rank_field: Rank

# Label colours and descriptions. A key ending in ":" applies to every label with that prefix.
labels:
  ready: {color: "0e8a16", description: "Everything it needs is done; open to take"}
  blocked: {color: "bfbfbf", description: "Waits for a task it needs (see the issue)"}
  claimed: {color: "fbca04", description: "Someone is working on it (comment `/claim`)"}
  attempting: {color: "c5def5", description: "Retired: proof tasks use claimed (comment `/claim`)"}
  in review: {color: "5319e7", description: "A pull request for it is open"}
  proof-task: {color: "006b75", description: "Replace a sorry in a locked statement"}
  milestone: {color: "1d76db", description: "A roadmap milestone: definitions, theorems and proofs"}
  upstream: {color: "d4c5f9", description: "Candidate for upstreaming"}
  "upstream:": {color: "d4c5f9", description: "Target library for upstreaming"}
  "area:": {color: "ededed", description: "Area of the task"}
  "size:": {color: "f9d0c4", description: "Scope of the task (XS, S, M, L, R)"}
  good first issue: {color: "7057ff", description: "Small and self-contained"}
  intermediate: {color: "c2e0c6", description: "Needs some Lean or domain experience"}
  advanced: {color: "e99695", description: "Needs substantial Lean and domain experience"}
  research-level: {color: "b60205", description: "Open-ended; several routes may be needed"}
  "status: ready": {color: "0e8a16", description: "v1.0 milestone: free to take (the streams take them in ranking order)"}
  "status: in-progress": {color: "fbca04", description: "v1.0 milestone: a stream or a contributor works on it"}
  "status: review": {color: "5319e7", description: "v1.0 milestone: every item but the review items is ticked; waits for its review"}
  "status: done": {color: "0e8a16", description: "v1.0 milestone: reviewed and closed"}
