    file: "Tasks/SF/T_SF10_P2.lean"
    decl: "Lightlike.Asymptotics.Lorentzian.lorHessian_invertible_at_critical"
    routes: ["Reduce to `Im(-H)` injective on the kernel of `Re(-H)`: `Re(-H)` is positive semidefinite (a sum of squares of the linearised alignment conditions) and `-H v = 0` forces `Re(-H) v = 0` and `Im(-H) v = 0`. The closed form of the blocks is `hessBlockMatrix` (`Lightlike/Asymptotics/Lorentzian/HessianAssembly.lean`).", "A certified computation for the regular simplex (numerical evidence: `scripts/asymptotics/lorentzian_hessian_kernel_check.py`) does not settle all nondegenerate data."]
    labels: ["proof-task", "area: spin-foams", "size: L", "research-level"]
