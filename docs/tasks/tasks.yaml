      - {"id": "p1", "kind": "piece", "text": "The sum is a contour integral: Racah's sum equals −Im(Φ(x₂) − Φ(x₁))/π, where Φ is a primitive of the kernel πT(z)/sin(πz)", "decls": ["Lightlike.Asymptotics.racahSum", "Lightlike.Asymptotics.racahKernel", "Lightlike.Asymptotics.racahSum_eq_im_primitive"]}
      - {"id": "p2", "kind": "piece", "text": "Complex Stirling, uniform on sectors: the Gamma quotient is bounded and asymptotic to its Stirling form on sectors, and the kernel equals its leading term up to an explicit bound", "decls": ["Lightlike.Asymptotics.norm_stirMu_le", "Lightlike.Asymptotics.tendsto_Gamma_div_stir", "Lightlike.Asymptotics.racahKernel_eq_lead", "Lightlike.Asymptotics.norm_racahKernel_sub_lead_le"]}
      - {"id": "p3", "kind": "piece", "text": "A descent contour through the saddle in the upper half-plane exists, and the contour can be continued outside the saddle region", "decls": ["Lightlike.Asymptotics.IsEuclid.exists_descent", "Lightlike.Asymptotics.IsEuclid.exists_descent_outside"]}
      - {"id": "p4", "kind": "piece", "text": "The local Laplace estimate along the descent contour, with the estimate on the outer side", "decls": ["Lightlike.Asymptotics.laplace_valley", "Lightlike.Asymptotics.ray_estimate", "Lightlike.Asymptotics.IsEuclid.outer_side"]}
      - {"id": "t1", "kind": "trust", "text": "The formula agrees with the exact Racah sums for a family of growing spins", "decls": ["Lightlike.Asymptotics.racahSumAsymptotics_regular"], "hint": "Only the regular tetrahedron j = (m,…,m) is covered, by a corollary of the main theorem; no check against exact sums for other spin families."}
      - {"id": "t2", "kind": "trust", "text": "The method gives the right asymptotics for a sum whose asymptotics are known independently", "decls": ["Lightlike.Asymptotics.kummerSum_saddle_matches_closed_form", "Lightlike.Asymptotics.kummerSum_saddle_bound", "Lightlike.Asymptotics.tendsto_kummerSum_div_kummerLead", "Lightlike.Asymptotics.tendsto_centralBinom_div_kummerLead"], "hint": "Kummer's sum Σ_t (−1)^t C(m,t)² run through the contour method (Lightlike/Asymptotics/KummerSum/): contour identity, complex Stirling, the saddle α₀ = (1+i)/2 of its own phase with ψ''(α₀) = −4, Laplace's method; the leading term L(2n) = 2^{2n+1}(−1)^n √(π/(2(2n+1)))/π is computed without the value of the sum and agrees with the asymptotics of the closed form (−1)^n C(2n,n) from the real Stirling formula. The Racah phase is not shape-generic (Fin 4/Fin 3 Gamma pattern), so the run reuses only the generic pieces (exists_primitive_im_sub, Stirling.lean, laplace_ray_uniform). Attempt 1: the zero-spin sum is outside the Racah theorem (Lightlike.Asymptotics.not_isEuclid_toReal_zero_spin)."}
      - {"id": "t3", "kind": "trust", "text": "The formula with only one of the two complex-conjugate saddles fails", "decls": ["Lightlike.Asymptotics.not_racahSumAsymptotics_one_saddle_regular"], "hint": "Regular tetrahedron only (half amplitude)."}
      - {"id": "t4", "kind": "trust", "text": "The real-variable estimate (Riemann sum, Euler-Maclaurin) is shown to be wrong for these sums", "decls": ["Lightlike.Asymptotics.racah_cancellation_regular_ten", "Lightlike.Asymptotics.racah_cancellation_regular_twenty", "Lightlike.Asymptotics.racah_cancellation_regular_forty"], "hint": "Racah's sum of the regular tetrahedron at spins 10, 20 and 40: the absolute values of the terms exceed the sum by factors above 100, 800 and 10^6, so a term-wise (Riemann-sum, Euler-Maclaurin) estimate cannot give the sum. Three instances showing exponential growth, not the statement that the ratio is unbounded."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
  - id: "T-SP3"
    kind: "milestone"
    title: "Tauberian theorems for Laplace transforms: Karamata's theorem and Ingham's theorem with exponential growth"
    milestone: "SP3"
    area: "asymptotics"
    tier: "established"
    source_class: "sourced"
    source: "mukhametzhanov-zhiboedov-2019, eq. (1.8)"
    priority: 3
    priority_basis: "recent"
    size: "L"
    difficulty: "advanced"
    mode: "exclusive"
    deps: []
    checks: ["Lebesgue measure gives `α = 1`", "the growth of the spectrum of a free boson", "a signed measure shown to break the conclusion"]
    release: "v1.0"
    issue: 196
    ranking: 45
    labels: ["milestone", "area: asymptotics", "size: L", "advanced"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "For a positive measure ρ on [0, ∞) whose Laplace transform satisfies ∫ e^{−βx} dρ ~ β^{−α} ℓ(1/β) as β → 0 with ℓ slowly varying, ρ[0, X] ~ X^α ℓ(X)/Γ(α+1)", "decls": ["Lightlike.Tauberian.karamata"]}
      - {"id": "m2", "kind": "main", "text": "For a positive measure on [0, ∞) whose Laplace transform grows like e^{a/β}, the counting function ρ[0, X] has the asymptotics of Mukhametzhanov–Zhiboedov 2019, eq. (1.8)", "decls": ["Lightlike.Tauberian.cardy_mz"], "hint": "Ticked on Lightlike.Tauberian.cardy_mz (LL-0182; cardy_relative and cardy_counting are its steps) by owner decision D14 = (A). Difference: MZ (1.8) assumes modular invariance; the general-measure form (a positive measure with only L(β) ~ e^{a/β}) is false (BJM arXiv:1910.03036 §3.2). ingham_log is the real-axis logarithmic companion; the sector-bound form (BJM Theorem 4.1) is open, see docs/notes/sp3-tauberian-backlog.md."}
      - {"id": "p1", "kind": "piece", "text": "Slowly varying functions are defined (ℓ eventually positive, ℓ(ct)/ℓ(t) → 1 for every c > 0)", "decls": ["Lightlike.Tauberian.SlowlyVarying"]}
      - {"id": "t1", "kind": "trust", "text": "Lebesgue measure on [0, ∞) gives α = 1", "decls": ["Lightlike.Karamata.karamata_lebesgue"]}
      - {"id": "t2", "kind": "trust", "text": "The growth of the spectrum of a free boson follows from the Tauberian theorem", "decls": ["Lightlike.Asymptotics.FreeBosonGrowth.free_boson_growth"], "hint": "Logarithmic form only: log N(X)/(2√(π²X/6)) → 1, via ingham_log; not the Hardy-Ramanujan asymptotics of N(X) itself."}
      - {"id": "t3", "kind": "trust", "text": "A signed measure (density 1 + x cos x) shown to break the conclusion of Karamata's theorem", "decls": ["Lightlike.Asymptotics.FreeBosonGrowth.not_tendsto_signedCount"], "hint": "Companion: Lightlike.Asymptotics.FreeBosonGrowth.tendsto_mul_signedLaplace shows the Laplace hypothesis still holds for it (inventory did not read it in full)."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
  - id: "T-SP3-P1"
