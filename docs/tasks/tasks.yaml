  - id: "T-PL7a"
    kind: "milestone"
    title: "Assembly up to PL homeomorphism: PL-homeomorphic closed combinatorial 3-manifolds have triangulations related by the moves on `Complex3`; consequences for the state sums"
    milestone: "PL7a"
    area: "pl-topology"
    tier: "established"
    source_class: "sourced"
    source: "turaev-1994, Chapter VII. Simplicial state sums on 3-manifolds; lickorish-1999, Theorem 5.9"
    priority: 4
    priority_basis: "canonical"
    size: "M"
    difficulty: "intermediate"
    mode: "exclusive"
    deps: ["T-PL2", "T-PL4"]
    checks: []
    release: "v1.0"
    ranking: 37
    labels: ["milestone", "area: pl-topology", "size: M", "intermediate"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "The r = 3 Turaev–Viro state sum is an invariant of closed combinatorial 3-manifolds up to PL homeomorphism", "decls": ["Lightlike.TV.turaevViro3_plHomeomorphic"]}
      - {"id": "m2", "kind": "main", "text": "For the Ponzano–Regge amplitude, the invariance up to PL homeomorphism that follows is stated exactly, given the cutoff and gauge-tree conditions: if triangulations of one manifold have a common forward descendant under Pachner moves, then every gauge-fixed amplitude of each is a gauge-fixed amplitude of the descendant at some tree and cutoff", "decls": ["Lightlike.PR.CommonForward.ampValues_subset", "Lightlike.PR.ampValues_mono_forward", "Lightlike.PR.ampValues_move32_subset", "Lightlike.PR.ampValues_move41_subset"], "hint": "The statement is CommonForward.ampValues_subset: it has the common forward descendant as an antecedent, so it is proven without any open hypothesis. That any two triangulations of one manifold have such a descendant (PachnerForwardHyp, used by the conditional triangulation_independence_of_pachner, LL-0522) is the milestone PL7c."}
      - {"id": "p1", "kind": "piece", "text": "The r = 3 state sum is the same along chains of 3D moves and under renaming of vertices", "decls": ["Lightlike.TV.turaevViro3_move32", "Lightlike.TV.turaevViro3_move41", "Lightlike.TV.turaevViro3_moveEquiv3"]}
      - {"id": "p2", "kind": "piece", "text": "The inputs from PL2 and PL4: Pachner's theorem on Complex3 and Newman's theorem", "decls": ["Lightlike.PL.pachner3", "Lightlike.PL.SComplex.StellarEquiv.of_plHomeomorphic"]}
      - {"id": "r1", "kind": "review", "text": "The statement of the Ponzano–Regge invariance (docs/notes/pl7a-ponzano-regge.md and the PLInvariance docstring) says exactly which invariance up to PL homeomorphism follows, and matches the declarations of m2; the prose is not a Lean theorem, so a reviewer checks it", "review_evidence": "Compared docs/notes/pl7a-ponzano-regge.md (read in full, 50 lines) and the module docstrings of Lightlike/TuraevViro/PLInvariance.lean and Lightlike/PonzanoRegge/TriangulationIndependence/Main.lean with the Lean statements on main (dd1c19ca3): triangulation_independence_of_pachner (hypothesis PachnerForwardHyp Same; Same K K' gives K'' with ampValues K ⊆ ampValues K'' and ampValues K' ⊆ ampValues K''), ampValues_mono_forward (ForwardMoves K K' gives ampValues K ⊆ ampValues K'), ampValues_move32_subset and ampValues_move41_subset (the smaller complex has the smaller value set), and CommonForward.ampValues_subset, whose statement is the text of m2 and which the first theorem applies. Result: the note says that no equality and no unconditional invariance follows, only the inclusion along forward moves under PachnerForwardHyp; the PLInvariance docstring says the same ('Nothing here concerns the Ponzano–Regge amplitude: its regularised values are only included in one another along forward moves'); both match the declarations. Two differences found and recorded: (1) the decls of m2 name triangulation_independence_of_pachner, the hypothesis form, while the item text is the statement of CommonForward.ampValues_subset, which is unconditional and not listed; (2) the note's backlog called PachnerForwardHyp an open question; after the maintainers' decision of 27 Nov it points to the milestone PL7c, which carries the unconditional version. Not checked here: the comparison of turaevViro3_plHomeomorphic with Turaev, Chapter VII, which the PLInvariance docstring states as pending."}
      - {"id": "p4", "kind": "piece", "text": "A stellar subdivision of a closed combinatorial 3-manifold at a tetrahedron or a triangle is a sequence of forward Pachner moves (2-3 and 1-4 only); at an edge the complex and its subdivision have a common forward descendant, and no edge subdivision is itself a forward descendant", "decls": ["Lightlike.PR.ofComplex3_move14_eq_starAt", "Lightlike.PR.ForwardMoves.exists_starAt_triangle", "Lightlike.PR.commonForward_starAt_edge", "Lightlike.PR.not_forwardMoves_starAt_edge"], "hint": "Edge subdivisions are not forward: forward moves only add edges (Lightlike.PR.ForwardMoves.edges_subset) and the subdivision at an edge deletes it (Lightlike.PR.not_forwardMoves_starAt_edge, proved). Search: Mathlib, Physlib and Tau Ceti have no Pachner moves or stellar subdivisions; reused move14, move23, edges_move23, edges_move14, CommonForward and SComplex.starAt from the library."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
