    decl: "Lightlike.OperatorAlgebras.implements_iff_exists_gaussian_vector"
    routes: ["`⇒`: `Ψ = U⁻¹ Ω` has `⟪Ψ, W f Ψ⟫ = ⟪Ω, W (T f) Ω⟫`. `⇐`: the vectors `W (T f) Ω` and `W f Ψ` have the same Gram matrix (the transformation preserves the symplectic form), `Ψ` is cyclic by irreducibility, and the Gram unitary (`exists_unitary_of_gram_eq`) intertwines."]
    labels: ["proof-task", "area: operator-algebras", "size: M", "advanced"]
