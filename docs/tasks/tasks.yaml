    deps: []
    checks: []
    release: "v1.0"
    issue: 41
    ranking: 38
    labels: ["milestone", "area: quantum-groups", "size: M", "intermediate"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "The gauge-fixed Ponzano–Regge amplitude is unchanged along every chain of 2-3, 3-2, 1-4 and 4-1 moves, also with a maximal tree as gauge set", "decls": ["Lightlike.PR.amplitudeGF_eqvGen", "Lightlike.PR.amplitudeGF_eqvGen_tree"]}
      - {"id": "p1", "kind": "piece", "text": "The 1-4 move changes the amplitude by the factor Σ(d+1)² of the new edge (weight and summed amplitude)", "decls": ["Lightlike.PR.weight_move14", "Lightlike.PR.amplitude_move14"]}
      - {"id": "p2", "kind": "piece", "text": "The 3-2 and 4-1 moves are recognised on any complex, and the amplitude is invariant under them", "decls": ["Lightlike.PR.IsMove32", "Lightlike.PR.amplitudeGF_move32", "Lightlike.PR.amplitudeGF_move41"]}
      - {"id": "p3", "kind": "piece", "text": "Changing the maximal tree by triangle exchanges leaves the gauge-fixed amplitude unchanged for every cutoff", "decls": ["Lightlike.PR.amplitudeGF_exchange", "Lightlike.PR.amplitudeGF_eqvGen_exchange"]}
      - {"id": "p4", "kind": "piece", "text": "Closed combinatorial 3-manifolds are preserved by all four moves", "decls": ["Lightlike.PR.isCombManifold_move23_iff", "Lightlike.PR.isCombManifold_move14_iff", "Lightlike.PR.isCombManifold_iff_of_eqvGen"]}
      - {"id": "p5", "kind": "piece", "text": "Combinatorial 2-spheres are connected closed pseudo-surfaces with Euler characteristic 2, and are exactly the intrinsic triangulated 2-spheres", "decls": ["Lightlike.PR.IsSphere2.invariants", "Lightlike.PR.isSphere2_iff_isSurfaceSphere"]}
      - {"id": "p6", "kind": "piece", "text": "Partial answers: the cutoff is irrelevant when the gauge set forces every edge (amplitude 1), and the amplitude with finite cutoffs depends on the maximal tree on a ring of three tetrahedra", "decls": ["Lightlike.PR.amplitudeGF_of_forcesAll", "Lightlike.PR.Test.Manifold.amplitudeGF_S3_star", "Lightlike.PR.Test.Ring.amplitudeGF_tree_dependent", "Lightlike.PR.Test.Ring.not_eqvGen_exchange_T1_T2"]}
      - {"id": "r1", "kind": "review", "text": "The scope of the milestone (the six bullets of ‘what is proven’ in docs/tasks/milestones.md, QU5) is covered by m1 and p1 to p6, and nothing in them claims triangulation independence", "review_evidence": "Compared the QU5 text of docs/tasks/milestones.md ('what is proven' and 'what it does not give') with the items. Proven clauses: the 1-4 move (p1: weight_move14, amplitude_move14); invariance along chains of 2-3, 3-2, 1-4, 4-1 moves, also with a maximal tree (m1: amplitudeGF_eqvGen, amplitudeGF_eqvGen_tree, catalogued as LL-0027); recognition of the 3-2 and 4-1 moves on any complex (p2: IsMove32, amplitudeGF_move32, amplitudeGF_move41); tree exchanges leave the amplitude unchanged for every cutoff (p3: amplitudeGF_exchange, amplitudeGF_eqvGen_exchange, LL-0028); closed combinatorial 3-manifolds preserved by the moves (p4: isCombManifold_move23_iff, isCombManifold_move14_iff, isCombManifold_iff_of_eqvGen); combinatorial 2-spheres are connected closed pseudo-surfaces of Euler characteristic 2 and exactly the intrinsic spheres (p5: IsSphere2.invariants, isSphere2_iff_isSurfaceSphere); the partial answers (p6: amplitudeGF_of_forcesAll, amplitudeGF_S3_star, amplitudeGF_tree_dependent, not_eqvGen_exchange_T1_T2). Every clause of the milestone text has an item. None of the item texts, docstrings or catalogue notes claims triangulation independence: LL-0027 states that independence of the gauge tree in general and removal of the cutoff are not proven, and the entry for the tree-dependence counterexample says the ring of three tetrahedra is not a manifold, outside the assumptions of Freidel-Louapre tree independence, which is stated for triangulated 3-manifolds. Nothing is missing and nothing is overclaimed; no difference to report."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
