  - id: "T-SF10-P2"
    kind: "proof"
    title: "Invertibility of the Hessian of the Lorentzian vertex action at a critical point"
    milestone: "SF10"
    area: "spin-foams"
    tier: "frontier"
    source_class: "sourced"
    source: "bdfhp-2010, §6.4; bdfhp-2010, §4.2.2; bdfhp-2010, §5.4.2; bdfhp-2010, §5.4.3; bdfhp-2010, §6.2; bdfhp-2010, eq. (53); bdfhp-2010, eq. (56); bdfhp-2010, eq. (57)"
