    routes: ["By `T-OP2-P5` there is `Ψ` with `⟪Ψ, W f Ψ⟫ = exp (-‖T f‖² / 4)`. The overlap `|⟪Ω, Ψ⟫|²` is the limit over finite-dimensional subspaces of the Gaussian averages of `W f`, which is `∏ (1 + ‖β eᵢ‖²)⁻¹` for a Hilbert basis `eᵢ`; it is positive, so `∑ ‖β eᵢ‖² < ∞`."]
