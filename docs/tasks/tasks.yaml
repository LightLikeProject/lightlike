  - id: "T-GE7"
    kind: "milestone"
    title: "Conformal compactification: null infinity of Minkowski space, the conformal boundary of anti-de Sitter space"
    milestone: "GE7"
    area: "geometry"
    tier: "established"
    source_class: "sourced"
    source: "hawking-ellis-1973, Chapter: Exact solutions; carroll-1997, eq. (7.100); carroll-1997, eq. (7.87); magoo-2000, eq. (2.24)"
    priority: 4
