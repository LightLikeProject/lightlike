      - {"id": "t2", "kind": "trust", "text": "A non-simple representation is shown to violate the simplicity constraint", "decls": ["Lightlike.SpinFoam.BC.Tests.not_simple_half_zero", "Lightlike.SpinFoam.BC.Tests.simple_half_half"]}
