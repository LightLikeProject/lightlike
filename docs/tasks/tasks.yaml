  - id: "T-HA1"
    kind: "milestone"
    title: "SL(2,ℂ), its Haar measure and its unitary principal series; their restriction to SU(2)"
    milestone: "HA1"
    area: "harmonic-analysis"
    tier: "established"
    source_class: "sourced"
    source: "knapp-1986, Chapter II. Representations of SU(2), SL(2, ℝ) and SL(2, ℂ); martin-dussaud-2019, §2.7; martin-dussaud-2019, §7.3; martin-dussaud-2019, §7.3.6; martin-dussaud-2019, §7.3.4"
    priority: 4
    priority_basis: "highly cited"
    size: "L"
    difficulty: "advanced"
    mode: "exclusive"
    deps: []
    checks: ["the Casimir values", "a non-unitary parameter shown to fail"]
    release: "v1.0"
    issue: 15
    ranking: 8
    labels: ["milestone", "area: harmonic-analysis", "size: L", "advanced"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "The principal-series representations of SL(2,C) (n in Z, rho real) are unitary, and decompose as a Hilbert sum of SU(2) representations of spin j = |k|, |k|+1, ... , each once", "decls": ["Lightlike.Lorentz.principalSeries_mem_unitary", "Lightlike.Lorentz.principalSeries_isHilbertSum"]}
      - {"id": "p1", "kind": "piece", "text": "The principal series pi_{n,rho} is defined as a continuous representation of SL(2,C) on L2(C), a group homomorphism", "decls": ["Lightlike.Lorentz.principalSeries", "Lightlike.Lorentz.principalSeries_mul", "Lightlike.Lorentz.principalSeries_one"]}
      - {"id": "p2", "kind": "piece", "text": "Each pi_{n,rho}(g) preserves the L2 inner product, and the representation is strongly continuous", "decls": ["Lightlike.Lorentz.principalSeries_norm", "Lightlike.Lorentz.principalSeries_inner", "Lightlike.Lorentz.continuous_principalSeries", "Lightlike.Lorentz.continuous_principalSeries_action"]}
      - {"id": "p3", "kind": "piece", "text": "The restriction to SU(2) is equivariant for the spin-j spaces, and an intertwiner onto a spin class occurs exactly once", "decls": ["Lightlike.Lorentz.principalSeries_suV", "Lightlike.Lorentz.intertwiner_eq_zero", "Lightlike.Lorentz.intertwiner_eq_smul"]}
      - {"id": "p4", "kind": "piece", "text": "The Haar measure of SL(2,C) exists, is unimodular (right invariant) with infinite total volume, and has the explicit chart form used for the principal series", "decls": ["Lightlike.Lorentz.SL2C.haar_isMulRightInvariant", "Lightlike.Lorentz.SL2C.haar_univ", "Lightlike.Lorentz.haarC", "Lightlike.Lorentz.isHaarMeasure_haarC"]}
      - {"id": "t1", "kind": "trust", "text": "The Casimir values of the principal series are (k^2 - rho^2 - 1) and k rho", "decls": ["Lightlike.Lorentz.casimir1_eq", "Lightlike.Lorentz.casimir2_eq"], "hint": "Stated on homogeneous functions on C^2 (the chart model), linked to the L2 action by Lightlike.Lorentz.chart_actH, not as an operator on L2(C)."}
      - {"id": "t2", "kind": "trust", "text": "A non-unitary parameter (Im rho != 0) gives a representation that does not preserve the L2 norm", "decls": ["Lightlike.Lorentz.Tests.not_unitary_of_im_ne_zero"]}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
  - id: "T-HA2"
    kind: "milestone"
    title: "The Plancherel measure of SL(2,ℂ) and the harmonic analysis the Lorentzian amplitudes use"
    milestone: "HA2"
    area: "harmonic-analysis"
    tier: "established"
    source_class: "sourced"
    source: "ggv-1966, Chapter: Harmonic analysis on the group of complex unimodular matrices in two dimensions"
    priority: 1
    priority_basis: "canonical"
    size: "L"
    difficulty: "advanced"
    mode: "exclusive"
    deps: ["T-HA1"]
    checks: []
    release: "v1.0"
    issue: 16
    ranking: 15
    labels: ["milestone", "area: harmonic-analysis", "size: L", "advanced"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "For f the restriction of a smooth compactly supported function on 2x2 arrays, the sum over n in Z of the integral over rho of (n^2 + 4 rho^2) times the squared Hilbert-Schmidt norm of pi_{n,rho}(f) equals 16 pi^4 times the integral of |f|^2 over SL(2,C), with every integrand integrable", "decls": ["Lightlike.Lorentz.plancherel"]}
      - {"id": "p1", "kind": "piece", "text": "The trace form: the sum over n and integral over rho of (n^2 + 4 rho^2) tr pi_{n,rho}(F) equals 16 pi^4 F(1)", "decls": ["Lightlike.Lorentz.plancherel_trace"]}
      - {"id": "p2", "kind": "piece", "text": "pi_{n,rho}(f) = integral of f(g) pi_{n,rho}(g) dg is the kernel operator used in the formula (psKernel), and the formula holds for it", "decls": ["Lightlike.Lorentz.piOp", "Lightlike.Lorentz.psKernel", "Lightlike.Lorentz.plancherel_piOp"]}
      - {"id": "p3", "kind": "piece", "text": "The formula in the variables of Perez-Rovelli (sigma = 2 rho) and of Ruhl, with the constants 1/(32 pi^4) and 1/2", "decls": ["Lightlike.Lorentz.plancherel_trace_perezRovelli", "Lightlike.Lorentz.plancherel_trace_ruhl"]}
      - {"id": "p4", "kind": "piece", "text": "The radial (spherical) form of the Plancherel formula", "decls": ["Lightlike.Lorentz.spherical_plancherel"]}
      - {"id": "r1", "kind": "review", "text": "The Plancherel normalisation is compared with Perez-Rovelli (A11)/(A16); the factor 4 is either explained (a convention, stated in the docstring) or corrected", "review_evidence": "Compared plancherel_trace_perezRovelli (Lightlike/Lorentz/Plancherel.lean, constant 1/(32 pi^4), n in Z, sigma in R) with Perez-Rovelli gr-qc/0011037v1 App. A, arXiv PDF pp. 13-14: (A6), (A7), (A8), (A10), (A11), (A12), (A16), and with Simao arXiv:2405.01360 App. B.3 and (B.3.1) (Ruhl's formula as quoted, 1/2 and (2 pi)^-4 haarC, i.e. 1/(32 pi^4)). The objects agree: (A8) is haarC with (i/2)(d beta ^ d beta-bar) = d Re beta d Im beta, (A6) with mu = i sigma is pi_{n,sigma/2}. Independent numerical derivation for K-biinvariant f = exp(-a |g|^2) (n = 0 sector; no use of the Lean polar form or plancherel_check.py): the Bruhat-chart integral of (A8) gives the polar constant 4 pi^3 (ratio 1.00001); the spherical function from (A6) is sin(sigma r/2)/((sigma/2) sinh r) to 8 digits; with F(1) = exp(-2a) the constant 1/(32 pi^4) on sigma in R gives 1.000000 F(1), the printed 1/(8 pi^4) gives 4.000000 F(1) (sigma in R) and 2.000000 F(1) (sigma >= 0 only). Result: the factor 4 is a misprint in (A11) and (A16), not a convention (the range of sigma explains at most 2, the (i/2)^3 reading gives 8); the library statement stays, and the difference is named in the Plancherel.lean docstring and the note of LL-0134. Limits: the weight n^2 + sigma^2 for n != 0 was not re-derived (proved in Lean, checked by plancherel_check.py); Ruhl's book not read; PR's paper does not derive (A11), so the origin of 1/(8 pi^4) is not located. Details: docs/notes/ha2-factor-four.md, section Independent review."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
