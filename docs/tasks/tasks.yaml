  - id: "T-SP4"
    kind: "milestone"
    title: "The Morse lemma, with smooth dependence on parameters"
    milestone: "SP4"
    area: "asymptotics"
    tier: "established"
    source_class: "sourced"
    source: "milnor-1963, Chapter: PART I. NON-DEGENERATE SMOOTH FUNCTIONS ON A MANIFOLD"
    priority: 2
