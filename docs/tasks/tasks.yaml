    milestone: "SF7"
    area: "spin-foams"
    tier: "frontier"
    source_class: "sourced"
    source: "eprl-2008; engle-pereira-2009, Section 4"
    priority: 9
    priority_basis: "highly cited"
    size: "L"
    difficulty: "advanced"
    mode: "exclusive"
    deps: ["T-HA2", "T-SF5c"]
    checks: []
    release: "v1.0"
    issue: 76
    ranking: 39
    labels: ["milestone", "area: spin-foams", "size: L", "advanced"]
    checklist:
      - {"id": "m1", "kind": "main", "text": "The Lorentzian EPRL vertex amplitude (ρ = γ(j+1), k = j) is defined as an integral over four copies of SL(2,ℂ) and is finite for every Immirzi parameter, all spins and all coefficient arrays", "decls": ["Lightlike.Lorentz.eprlVertex", "Lightlike.Lorentz.integrable_eprlIntegrand", "Lightlike.Lorentz.lintegral_enorm_eprlIntegrand_lt_top"], "hint": "The definition has no ε twist on the bra legs (see r1), so finiteness is for this definition, which is not claimed to equal the Engle–Pereira amplitude."}
      - {"id": "p1", "kind": "piece", "text": "The labels ρ = γ(j+1) and k = j, the EPRL vector and the EPRL matrix coefficient", "decls": ["Lightlike.Lorentz.eprlRho", "Lightlike.Lorentz.eprlVec", "Lightlike.Lorentz.eprlCoeff"]}
      - {"id": "p2", "kind": "piece", "text": "The vertex amplitude is the absolutely convergent integral of the contracted integrand (not the junk value 0)", "decls": ["Lightlike.Lorentz.eprlVertex_eq_integral"]}
      - {"id": "r1", "kind": "review", "text": "The vertex amplitude is compared with the source (Engle–Pereira–Rovelli–Livine 2008, Engle–Pereira 2009) and the ε twist on the bra legs is present, or its absence is justified", "review_evidence": "Read Engle-Pereira, arXiv:0805.4696, eq. (22): the regularised amplitude is the integral over four copies of SL(2,C) of the product of the ten matrix coefficients with arguments V_a^-1 V_b (V5 dropped, since the integrand does not depend on it), contracted with the intertwiner i_t at each tetrahedron; eq. (23): A_reg_v(j, i) = A_v[2j, 2 gamma j; j, i]. Compared with Lightlike/Lorentz/EPRL.lean: eprlVertex has the same structure (four free copies, V4 = 1, ten coefficients of the principal series at k = j, contracted with arbitrary coefficient arrays iota), and eprlVertex_eq_integral says it is the absolutely convergent integral of the contracted integrand. Two differences, both documented in the module docstring and in the catalogue note of the finiteness entry: (1) the rho label is gamma (j+1) (Ding-Rovelli) instead of Engle-Pereira gamma j, which the finiteness theorem does not depend on (integrable_linkProd_inner holds for all labels); (2) the epsilon twist (the structure map e_m to +-e_{J-m} identifying the dual of spin j with spin j) on the bra legs is NOT applied: the coefficients are arbitrary arrays, and the twisted array of an SU(2)-invariant intertwiner is again an array, so the finiteness statement is unaffected, but eprlVertex is not claimed to equal the Engle-Pereira amplitude on invariant intertwiners. The absence of the twist is therefore justified for the milestone (finiteness for every coefficient array) and not for equality with the source amplitude. For coherent product arrays eprlVertex is a constant (the fourth power of the Haar scalar factor) times the coherent vertex lorVertex (eprlVertex_eq_lorVertex), which narrows but does not close the gap to the Engle-Pereira amplitude. Only eqs. (22) and (23) of Engle-Pereira were read; the EPRL 2008 paper (0711.0146) was not compared at an equation."}
      - {"id": "c1", "kind": "catalogue", "text": "The theorems of the main theorem and the pieces are entries of docs/results.yaml with status proven, and are cited in the API map", "decls": []}
