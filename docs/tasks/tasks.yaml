  - id: "T-QU5"
    kind: "milestone"
    title: "Triangulation independence of the regularised Ponzano–Regge amplitude as far as it goes without Pachner's theorem"
    milestone: "QU5"
    area: "quantum-groups"
    tier: "established"
    source_class: "sourced"
    source: "barrett-naish-guzman-2009, §2.2.1; freidel-louapre-2004, Section III"
    priority: 4
