- id: LL-0272
  title: A faithful state of a finite matrix algebra is KMS at inverse temperature beta = -1 for its modular dynamics, generated by log rho
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/FiniteModular.lean
  decls: [Lightlike.OperatorAlgebras.isKMS_modular]
  status: proven
  tier: established
  source:
    refs:
      - {ref: jaksic-ogata-pautrat-pillet-2012, location: "Section 2.12.1, p. 63", check: "KMS"}
  review: kernel-checked
  note: "For a positive definite rho of trace 1, rho is KMS for the dynamics generated by H = log rho at beta = -1: tr(rho A B) = tr(rho tau^{-i beta}(B) A) with tau^{-i beta}(B) = e^{beta H} B e^{-beta H}, so tr(rho A B) = tr(rho e^{-log rho} B e^{log rho} A). Sign convention: the Gibbs state e^{-beta H}/tr e^{-beta H} at beta = -1 and H = log rho is rho itself, which is why the modular Hamiltonian is log rho and beta is -1 (the entanglement Hamiltonian -log rho has beta = 1). Compared with Jaksic-Ogata-Pautrat-Pillet, arXiv:1106.3786, Section 2.12.1, pp. 62-63 (read): the modular dynamics varsigma_rho^t(A) = e^{it log rho} A e^{-it log rho} and the (beta = -1)-KMS property of rho; the same sign and the same generator. log rho is built from the spectral decomposition (logPosDef, exp_logPosDef); the proof is isKMS_iff_eq_gibbs (LL-0183) with e^{log rho} = rho."
  since: unreleased
