- id: LL-0594
  title: "The unitary principal series of SL(2,R) on L2(R) is irreducible for every real parameter nu when the parity is even and for every nu different from 0 when it is odd; the odd series at nu = 0 is the only exception (it is reducible)"
  area: Lorentz
  file: Lightlike/Lorentz/SL2RIrreducible/Principal.lean
  decls: [Lightlike.Lorentz.SL2R.principalSeries_isIrreducible, Lightlike.Lorentz.SL2R.exists_weightExp_sub_eq_zero_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kitaev-2017, location: "eq. (15)", check: "irreducibility"}
      - {ref: knapp-1986, location: "Chapter: Chapter II. Representations of SU(2), SL(2, ℝ) and SL(2, ℂ)|10.1515/9781400883974-005"}
  review: kernel-checked
  note: "Compared with Kitaev, arXiv:1711.08169, eq. (15) and Section 3.2 items 1 and 2 (read; page not checked): F_lambda^mu is irreducible unless lambda or -lambda lies in mu + Z, and for lambda = 1/2 + i nu/2, mu = epsilon/2 this is nu = 0 with epsilon odd, where F_{1/2}^{1/2} splits (Section 3.1). Difference of kind: Kitaev's statement is about the algebraic module of K-finite vectors; here irreducibility is topological, the only closed invariant subspaces of the unitary representation on L2(R) are 0 and L2(R), which needs the completeness of the K-weight vectors (weightL2_complete). The theorem takes the exact hypothesis (epsilon even or nu nonzero); exists_weightExp_sub_eq_zero_iff shows that the argument breaks precisely at the excluded point. The comparison with Knapp (1986), Chapter II, and Lang, SL2(R), is pending: the books were not read."
