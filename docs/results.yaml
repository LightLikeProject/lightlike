  review: kernel-checked
  note: "For the momentum P = -i d/dx on L^2(0, 1): the domain of the adjoint is D_max, the functions absolutely continuous on [0, 1] with derivative in L^2 (mem_adjoint_iff_ac, in MomentumBoundary.lean); the closed operator P is the adjoint on D_0 = {psi in D_max : psi(0) = psi(1) = 0} and equals the closure of -i d/dx on the C^2 functions supported inside (0, 1) (momentumZero_eq_closure); a self-adjoint operator B extends P iff B = P_theta, the adjoint on D_theta = {psi in D_max : psi(1) = e^{i theta} psi(0)}, for some real theta. Compared with Bonneau-Faraut-Valent, Section 5.3, eq. (14), p. 8, and Appendix A.3, p. 19 (read). Differences, kind convention, to be approved by a maintainer: (a) the interval is [0, 1] (L = 1); (b) theta ranges over the reals instead of [0, 2 pi] (the same operators)."
