      - {ref: derezinski-2006, location: "Theorem 31, p. 32", check: "Theorem 31"}
  review: kernel-checked
  note: "Compared with Dereziński, arXiv:math-ph/0511030, Theorem 31 (1), (2), p. 32, with Proposition 1, p. 32 (read): for r in O(Y), Y = Re(Z ⊕ Z̄) with the scalar product Re(z|w), a unitary U of the fermionic Fock space with U φ(y) U* = φ(ry) exists iff r in O_2(Y), i.e. q in B²(Z̄, Z) (Hilbert-Schmidt), and U is unique up to a phase. Here r is a surjective real-linear map of Z preserving Re of the inner product (the same as an orthogonal r on Y), q is the antilinear part beta, and the statement is the same equivalence. Uniqueness up to a phase (Theorem 31 (2)) is proved (LL-0390, implementer_unique); the explicit formula (57) of Theorem 31 (3) and the positivity normalisation are not formalised. PARTIAL for OP2: the equivalence and the uniqueness up to a phase are proved; the explicit formula (57) of the implementer is not (it needs exponentials of unbounded quadratic creation operators and the Fredholm determinant on the infinite Fock space). Closes the fermionic Shale criterion of OP2 (both directions, every number of modes). Necessity (summable_beta_of_implementer): the implementer U gives a vector U Omega_0 killed by the transformed annihilators; by irreducibility a word of transformed creation operators on it has nonzero overlap with the vacuum and is killed by the annihilators outside its finite support; pairing with a*(x) Omega_0 gives <a*(alpha b_j) a*(x) Omega_0, Psi> = -conj<beta b_j, x> <Omega_0, Psi>, and Bessel inequalities (one for alpha via R and its inverse, one for the two-particle coefficients of Psi) bound sum |beta b_j|^2 by 4 ||Psi||^2 / |<Omega_0, Psi>|^2 plus the size of the support. No weaker case remains stated here. The Hilbert-Schmidt hypothesis is that the sum of |beta c_i|^2 converges in some Hilbert basis (a basis indexed by a set, as in TraceClass.HilbertSchmidt); its basis independence is proved (hasSum_beta_sq). Proof: the transformed annihilators of any vector are a CAR system; a unit vector killed by them gives a unitary on the words of transformed creation operators (dense by irreducibility of the Fock representation). The vacuum is the limit of the decreasing commuting projections prod (1 - c_k a_k) over the modes of an eigenbasis of K = beta*beta (compact when beta is Hilbert-Schmidt); a_k a*(beta e_k) anticommute with the modes of other eigenvalue classes (the pairing <alpha e_l, beta e_k> vanishes for different eigenvalues, proved from X = S J R J and Y = J S J R with XY = YX = 1), which gives the relative bound ||a_k P_D W Omega|| <= sqrt(mu_k) ||P_D W Omega||, class by class, and 1 - t >= exp(-2t) on [0, 1/2]. The finitely many heavy classes (total weight above 1/2) are handled by flipping modes with the fields p_k = a_k + c_k, losing a factor 2^-|F0|."
