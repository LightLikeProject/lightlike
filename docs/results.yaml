- id: LL-0524
  title: For a locally smooth connection on a manifold modelled with corners on a finite-dimensional space, the curvature is ∇_X ∇_Y Z − ∇_Y ∇_X Z − ∇_{[X,Y]} Z for any fields smooth near the point, without a Hausdorff hypothesis
