  review: kernel-checked
  note: "The slice {y : y_0 = 0} of R^(d+1) is met exactly once by every inextendible future-directed timelike curve; the time coordinate strictly increases along a future-directed timelike curve, so such a curve meets the slice at most once. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Differences to be approved by a maintainer: the definition of a Cauchy surface (difference (a) of the achronality of Cauchy surfaces) and the curve class of the basic relations. Only the slice y_0 = 0 is stated; the others are its translates."
