- id: LL-0570
  title: On a manifold modelled with corners on any finite-dimensional real normed space, in every chart the Riemann tensor, the Ricci tensor and the scalar curvature of a Levi-Civita connection are the coordinate ones, and the Einstein equations hold iff the coordinate vacuum equations hold in every chart
  area: Spacetime
  file: Lightlike/Spacetime/Corners/ChartTransport.lean
  decls: [Lightlike.riemann_coord_trans, Lightlike.ricciAt_coord_trans, Lightlike.scalarCurvatureAt_coord_trans, Lightlike.satisfiesEinstein_iff_chart_trans]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (3.91)", check: "Ricci"}
  review: kernel-checked
  note: "GE11 m5. For a non-degenerate metric g on a C^2 manifold modelled with corners (boundary and corners allowed, no Hausdorff hypothesis) on any finite-dimensional real normed space E, a locally smooth connection that is the Levi-Civita connection of g, and a linear equivalence e : E -> Fin n -> R, the charts e after extChartAt are the charts of the transported model. In them the components of the intrinsic curvature on the coordinate vectors e^-1 d_nu are the coordinate Riemann tensor of the chart metric (riemann_coord_trans), the intrinsic Ricci tensor is the coordinate Ricci tensor (ricciAt_coord_trans), the intrinsic scalar curvature is the coordinate one (scalarCurvatureAt_coord_trans), and g satisfies the Einstein equations with constant Lambda iff the coordinate vacuum equations hold in every chart (satisfiesEinstein_iff_chart_trans). Compared with Carroll, Lecture Notes on General Relativity, eq. (3.91) for the Ricci tensor, read at that location. KIND representation: in Carroll the coordinate formulas are the definitions; here the definitions are intrinsic and the theorems say they agree with the coordinate ones in every chart. The proof transports the connection and the metric along e (Lightlike.transCov, transMetric) and applies the theorems of ChartAgreement.lean for Fin n -> R (LL-0411); the choice of e is the choice of coordinates on E. The comparison with Wald is pending: not read."
  since: unreleased
- id: LL-0571
  title: Constant curvature and maximal symmetry of a pseudo-Riemannian manifold, and constant curvature from the coordinate curvature in every chart
  area: Spacetime
  file: Lightlike/Spacetime/ConstantCurvature.lean
  decls: [Lightlike.HasConstantCurvature, Lightlike.IsMaximallySymmetric, Lightlike.HasConstantCurvature.of_charts, Lightlike.curvatureAt_of_chart, Lightlike.hasConstantCurvature_minkowski]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "For a smooth symmetric nondegenerate metric (any signature) on a manifold modelled on Fin n -> R (any model with corners): HasConstantCurvature g K says that every locally smooth Levi-Civita connection has R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y) at every point (the sign convention of curvatureAt); IsMaximallySymmetric g K adds n(n+1)/2 smooth Killing fields of leviCivita g that are linearly independent (at most n(n+1)/2 exist on a connected manifold, finrank_killingFieldSpace_le for the model of R^n). HasConstantCurvature.of_charts: if in every chart the coordinate Riemann tensor of the coordinate metric is R^rho_{sigma mu nu} = K (delta^rho_mu g_{sigma nu} - delta^rho_nu g_{sigma mu}), the manifold has constant curvature K (through riemann_coord_compW, the chart formula of the curvature). Non-vacuity: Minkowski space has constant curvature 0. Compared with Carroll, Lecture Notes on General Relativity (arXiv gr-qc/9712019), read at section 5, p. 140, before eq. (5.44): 'a maximally symmetric space is one which possesses the largest possible number of Killing vectors, which on an n-dimensional manifold is n(n + 1)/2' (the definition), and section 3, p. 85, eq. (3.106): the curvature of a maximally symmetric space satisfies R_rho sigma mu nu = a^-2 (g_rho mu g_sigma nu - g_rho nu g_sigma mu) (a stated property). IsMaximallySymmetric is the count of the definition (n(n+1)/2 linearly independent smooth Killing fields) with the curvature property (3.106) for a^-2 = K, which with Carroll's convention [nabla_mu, nabla_nu] V^rho = R^rho_sigma mu nu V^sigma is HasConstantCurvature's R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y): the same statement as Carroll's, with his property in addition; HasConstantCurvature quantifies over every locally smooth Levi-Civita connection, a generalization. The cited eq. (8.1) is the FLRW metric, where maximally symmetric slices enter (p. 218, eq. (8.2))."
  since: unreleased
- id: LL-0572
  title: The metric induced by an immersion into a space with a symmetric bilinear form, and its nondegeneracy on the tangent space of a quadric
  area: Spacetime
  file: Lightlike/Spacetime/PullbackMetric.lean
  decls: [Lightlike.NondegMetric.pullback, Lightlike.NondegMetric.pullback_apply, Lightlike.pullback_nondeg_of_quadric, Lightlike.exists_pullback_euclidean, Lightlike.pullback_nondeg_of_quadric_circle]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "NondegMetric.pullback: for a smooth map into a normed space with a symmetric bilinear form L of any signature, the pullback L(d iota, d iota) is a NondegMetric when it is nondegenerate on every tangent space (smoothness and symmetry from pullbackForm). pullback_nondeg_of_quadric: if L is nondegenerate on V, L(x, x) is not zero and a linear map D is injective with image the L-orthogonal complement of x, the pullback L(D, D) is nondegenerate (V is the direct sum of x-perp and the line of x); this is the tangent space of the quadric L(x, x) = c, c nonzero, as used for de Sitter and anti-de Sitter space. Non-vacuity: the identity of a Euclidean space, and the unit circle at e_0. Comparison with the cited section (Carroll, chapter 8, the embedding of maximally symmetric spaces as quadrics) pending: no source was read at the location."
  since: unreleased
- id: LL-0573
  title: Killing fields of an induced metric from the skew linear fields of the ambient space
  area: Spacetime
  file: Lightlike/Spacetime/InducedKilling.lean
  decls: [Lightlike.dι_mlieBracket_of_related, Lightlike.lieDerivMetric_eq_zero_of_related, Lightlike.isKillingAt_of_related, Lightlike.isKillingAt_minkowski_boost]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "On a manifold with corners modelled on a finite-dimensional space, let the metric be induced by a smooth map iota into a finite-dimensional space V with a symmetric bilinear form L, g(u, v) = L(d iota u, d iota v), and let A be L-skew, L(A u, v) + L(u, A v) = 0. A field X with d iota (X q) = A (iota q) at every point satisfies d iota [X, Y] = X(d iota Y) - A(d iota Y) (dι_mlieBracket_of_related, from the commutator formula mfderiv_mlieBracketW tested against every linear functional of V), hence L_X g = 0 at every point where X is differentiable (lieDerivMetric_eq_zero_of_related), and is a Killing field of every Levi-Civita connection of g (isKillingAt_of_related). For de Sitter and anti-de Sitter space as quadrics this gives the Killing fields as restrictions of the generators x_a d_b - x_b d_a of the ambient pseudo-orthogonal algebra. Non-vacuity: the boost field of 1+1 Minkowski space (iota the identity, L the Minkowski form) is a nonzero Killing field of the Levi-Civita connection at every point. Comparison with the cited section (Carroll, chapter 8, maximally symmetric spaces as quadrics) pending: no source was read at the location."
  since: unreleased
