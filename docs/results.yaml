  note: "Comparison pending (no source was read at a cited location): anti-de Sitter space as the hyperboloid in a flat space of signature (2, n) is Carroll, Spacetime and Geometry (2004), section 8.1, to be read before the comparison is claimed. KIND representation: the space is the quadric itself, antiDeSitterSpace m = S^1 x R^m (Mathlib's unit circle of C times R^m, model transported to Fin (m+1) -> R, the circle first), whose circle is timelike, so it has closed timelike curves; in general relativity anti-de Sitter space often means its universal cover R x R^m, which is not constructed; maximal symmetry and the curvature -1/L^2 are proved on the quadric. The metric (Lightlike/Spacetime/SpaceForms/AntiDeSitter.lean) is the pullback of B((a,x),(b,y)) = -<a,b> + <x,y> on C x R^m by iota(theta, y) = (sqrt(L^2 + |y|^2) theta, y), whose image is the whole quadric B(x,x) = -L^2; d iota is injective with image the B-orthogonal complement (exists_dι_adsIncl_eq), so the metric is nondegenerate, and it is Lorentzian at every point (antiDeSitterSpaceLorentzian, explicit orthonormal frame). Killing fields (AntiDeSitterKilling.lean): the skew maps x -> B(v,x) u - B(u,x) v on the pairs of the orthogonal basis (1,0), (i,0), (0,e_k) give so(2,m), and exists_killing_antiDeSitterSpace gives (m+1)(m+2)/2 linearly independent smooth fields, Killing at every point for the Levi-Civita connection. Curvature: hasConstantCurvature_of_quadric with c = -L^2 (for every locally smooth Levi-Civita connection, at every point). L is any nonzero real, m any natural number. Non-vacuity: dimension 4, L = 1, K = -1."
