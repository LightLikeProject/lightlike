  note: "The smooth fields that are Killing near a point (the Lie derivative of g vanishes near the point on all smooth fields) are closed under sums and real multiples (IsKillingNear.add, .smul, from the additivity of the Lie derivative in the field) and, with the bracket of LL-0172, form a real vector space killingSubmodule with a LieRing and LieAlgebra structure; the Jacobi identity is Mathlib's mlieBracket_jacobi. Carroll states only that the commutator of Killing fields is Killing (p. 141, after eq. (5.46)), not the linear structure or the Jacobi identity, which are the standard properties of the bracket. Limits: the carrier is the smooth fields that are Killing near the given point (germs are not identified), so it is a Lie algebra of fields defined on a neighbourhood of that point; it is not a statement about global Killing fields or the dimension bound. Comparison with a source for the Lie algebra structure is pending."
