  review: kernel-checked
  note: "Minkowski space R^(d+1) is strongly causal (minkowski_isStronglyCausal) and its causal diamonds are compact (minkowski_isCompact_diamond). The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Differences to be approved by a maintainer: the definition of global hyperbolicity (strong causality and compact causal diamonds) and the curve class of the basic relations."
  since: unreleased
- id: LL-XXXX-h
  title: In Minkowski space every slice of constant time is a Cauchy surface
  area: Spacetime
  file: Lightlike/Spacetime/Causal/MinkowskiCauchy.lean
  decls: [Lightlike.Causal.minkowski_slice_isCauchySurface]
  status: proven
  tier: established
