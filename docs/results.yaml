  note: "An identity at finite cutoff, the inverse direction of the 2-3 and 1-4 moves of the previous chain entry (LL-0027); Compared with Barrett, Naish-Guzman (2009) Section 2.2.1 (read): in three dimensions the 3-2 move is the Biedenharn-Elliott identity and holds for the unregularised Ponzano-Regge amplitude; the 4-1 move holds exactly with the simple cutoff of Ponzano and Regge; the Biedenharn-Elliott identity is not necessarily true with the cutoff in place, so both moves cannot always be applied. Representation: the statements here (amplitudeGF_move32, amplitudeGF_move41) give explicit inequalities on the cutoffs under which each move holds for the gauge-fixed amplitude; the paper does not state such conditions, so they are the library's own. amplitudeGF_move32: for a 3-2 move on any complex, a gauge set T of old edges not containing the removed edge DE, and a cutoff with cut AD + cut AE <= cut DE, the amplitude of the complex after the move equals that before. amplitudeGF_move41: when no gauge edge touches the vertex E that disappears, the amplitude of the smaller complex with gauge set T equals that of the larger with gauge set T together with the edge DE, under the cutoff conditions cut AD <= cut AE, cut BD <= cut BE, cut CD <= cut CE. The moves are recognised on any complex (IsMove32, IsMove41), not only on manifolds. Independence of the gauge set in general and removal of the cutoff are not proven."
