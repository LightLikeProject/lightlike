- id: LL-0096
  title: The second derivative of the Lorentzian vertex action along a one-parameter subgroup at one node is the sum over its ends of an explicit end formula, a quarter of BDFHP eq. (61) at source ends and different from it at target ends
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/HessianNode.lean
  decls: [Lightlike.Asymptotics.Lorentzian.hessXX_block, Lightlike.Asymptotics.Lorentzian.re_hessRR_neg, Lightlike.Asymptotics.Lorentzian.hessZZ_line, Lightlike.Asymptotics.Lorentzian.hessZZ_block, Lightlike.Asymptotics.Lorentzian.hessXZ_block, Lightlike.Asymptotics.Lorentzian.endForm, Lightlike.Asymptotics.Lorentzian.hasDerivAt_srcCoeff, Lightlike.Asymptotics.Lorentzian.hasDerivAt_tgtCoeff]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "eq. (61)", check: "critical and stationary point"}
  review: kernel-checked
  note: "At a critical configuration (IsLorCritical, critical spinors), with p = gamma k, unit boundary spinors, the overlaps off the cut of the logarithm and the closure sum_e k_e m_e = 0 at the node a, the second derivative at 0 of the action along X_a Y(t), Y' = Y genMat(beta + i alpha) (generators J = i sigma / 2, K = sigma / 2), with the other elements and z fixed, equals the sum over the ends e at a of k [ -1/2 (alpha,alpha) + i s (alpha,beta) + s m.(alpha x beta) ] - (k/2 + i s p) (beta,beta), (u,v) = u.v - (m.u)(m.v), s = +1 at a source end and -1 at a target end. Measured: this agrees with the independent 44 x 44 Hessian of lorentzian_hessian_check.py to 2e-19; BDFHP (61) equals four times it at source ends with s = 1 (their blocks correspond to the generators i sigma and sigma), and no variant of (61) reproduces it at target ends. Also: the real part of the rotation block is negative definite exactly when the normals are not all parallel (re_hessRR_neg), and the second derivative along a straight line in one spinor z_e is the sum of the source and target line values (hessZZ_line, the quadratic form of H^zz). The entries of H^zz in Wirtinger form (hessZZ_block: f_ww tau^2 + 2 f_wwb |tau|^2 + f_wbwb conj(tau)^2) are proved from it, under nonvanishing overlaps and the overlap product off the cut; no criticality is needed. The mixed block H^Xz (hessXZ_block, with xzSource and xzTarget): the derivative along an orbit X_a to X_a Y(s) and a line z_e to z_e + t (tau, 0) is f_w' tau + f_wb' conj(tau) at a source end, the target form at a target end, and 0 at any other node; no criticality is assumed, and the closed form agrees with mixed second differences of the action at non-critical configurations to 1.6e-12 (lorentzian_hessian_noncritical_check.py; the closed form of H^zz agrees to 4.9e-13 at the same configuration; wrong-input controls fail at 1.2, 0.50 and 0.47). NOT PROVED: the nondegeneracy of the 44 x 44 matrix, and the identification with the second Frechet derivative of the pulled-back action (needs the chart of step 5); BDFHP eq. (57) assumes the nondegeneracy without proof (Sec. 6.4, p. 30)."
  since: unreleased
- id: LL-0097
  title: The mixed second derivatives of the Lorentzian vertex action along two different nodes, or two different spinors, vanish, and the 44 x 44 matrix assembled from the node, spinor and mixed blocks is symmetric
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/HessianAssembly.lean
  decls: [Lightlike.Asymptotics.Lorentzian.hessXX_cross, Lightlike.Asymptotics.Lorentzian.hessZZ_cross, Lightlike.Asymptotics.Lorentzian.nodeBilin_self, Lightlike.Asymptotics.Lorentzian.hessBlockMatrix_symm]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "eq. (61)", check: "node block"}
  review: kernel-checked
  note: "The block structure of the Hessian of BDFHP Appendix A, eqs. (58), (59), with the node block of eq. (61): z_e appears only in the term of the edge e (hessZZ_cross, no hypothesis), and the end terms at two different nodes do not couple (hessXX_cross; hypothesis: the product of the two overlaps of every edge is off the cut of the logarithm at X_a to X_a Ya(s) for s near 0, with Yb 0 = 1 and Yb' = Yb L). The chart order of hessBlockMatrix is (theta1, theta2, theta3, phi1, phi2, phi3) for each of the nodes X_1 to X_4 (X_5 is gauge fixed), then (u, v) with w = u + i v for each of the ten edges. hessBlockMatrix collects hessXX_block (through the polarisation nodeBilin of the quadratic form nodeQuad), hessZZ_block and hessXZ_block. For this Lorentzian integral with spinor variables, Re(-H) is positive semidefinite with a kernel of dimension at least 4 (44 variables, 40 linearised alignment conditions): measured at the regular simplex, exactly 4 for gamma = 0.5, 1 and 4, with Re S falling off as the fourth power along the kernel (scripts/asymptotics/lorentzian_hessian_kernel_check.py). So the nondegeneracy of -H is not implied by positivity of the real part; it is checked numerically at the regular simplex (Im(-H) is injective on the kernel, smallest singular value 2.0 at gamma = 0.5), not proved. NOT PROVED: that hessBlockMatrix is the matrix of second derivatives of the action in a chart at a critical point (needs the chart and the vanishing of the first derivative), and the nondegeneracy of the matrix (BDFHP eq. (57) assumes it without proof, Sec. 6.4, p. 30)."
  since: unreleased
- id: LL-0098
  title: The second derivative of the Lorentzian vertex action at a critical configuration along a curve through a node depends only on the velocity of the curve, not on its acceleration
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/HessianNode.lean
  decls: [Lightlike.Asymptotics.Lorentzian.hessXX_curve, Lightlike.Asymptotics.Lorentzian.srcCoeff_adj_gen, Lightlike.Asymptotics.Lorentzian.tgtCoeff_adj_gen]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "eq. (61)", check: "node block"}
  review: kernel-checked
  note: "At a critical configuration (IsLorCritical, critical spinors), with p = gamma k, unit boundary spinors, closure at the node, and the overlap products off the cut of the logarithm, the second derivative of lorAction along X_a Y(t) for a curve Y with Y(0) = 1 and Y' = Y genMat(cv(t)), cv differentiable at 0, equals the sum of the end formulas of hessXX_block at the velocity cv(0): the derivative cv'(0) contributes the first variation in the direction genMat(cv'(0)), which is zero by closure (srcCoeff_adj_gen, tgtCoeff_adj_gen identify it with the logarithmic derivative). hessXX_block is the case of a constant velocity. This is the independence of the Hessian of the curve at a critical point for the node variables. NOT PROVED: the same for the spinor variables and the mixed block (hessZZ_block and hessXZ_block do not need criticality and are stated for straight lines in z), and the identification of the matrix of second derivatives in a chart with hessBlockMatrix (needs the chart and the congruence by its differential)."
  since: unreleased
- id: LL-0099
  title: There is no drawing of the complete bipartite graph K₃,₃ in the plane by continuous arcs
  area: PL
  file: Lightlike/PL/ContK33.lean
  decls: [Lightlike.PL.ContDrawing, Lightlike.PL.no_K33]
  status: proven
  tier: established
  source:
    refs:
      - {ref: klazar-2026, location: "Section 2", check: "Thomassen"}
  review: kernel-checked
  note: "Six distinct points u i, v j (i, j ∈ Fin 3) joined across the two classes by nine continuous injective arcs γ i j : [0, 1] → ℝ² from u i to v j that meet only in common endpoints do not exist (no_K33; ContDrawing is the notion of drawing). This is Claim 3 of the proof of the weak Jordan theorem by Thomassen in the exposition of Klazar, Section 2 (Klazar's numbering). The polygonal case is LL-0091. The reduction to it follows Klazar: radius r such that the closed balls around the six points are disjoint and an arc keeps distance larger than r from the points that are not its ends; each arc is trimmed to the subarc between the last visit of the ball around its first end and the first visit of the ball around its second end (exists_trim); a polygonal chain within ε of the trimmed subarc is obtained from the values of the arc at the points k/N, which gives a chain by uniform continuity (exists_chain_near), and loop erasure turns it into a simple chain in the same set (exists_simple_sub); with ε smaller than a third of the distance between any two trimmed subarcs, the chains are pairwise disjoint and meet the segments from the vertices to the ends of the trimmed subarcs only at the ends of those segments (the segment argument uses that two segments from a centre to different points of one sphere meet only at the centre, segment_inter_sphere); the nine chains, loop-erased with the segments, form a polygonal drawing of K₃,₃, which does not exist by LL-0091. Limits: the arcs are injective continuous images of [0, 1] in the plane; the statement is for K₃,₃ only and does not say anything about the Jordan curve theorem by itself (the next entry). Check: the straight-line drawing of K₃,₃ without the edge (2, 2) of LL-0091 is a drawing by continuous arcs (TestsJordan.contDrawing, ContDrawingOn), so the hypotheses are satisfiable."
  since: unreleased
- id: LL-0100
  title: "The weak Jordan theorem: the complement of a circle embedded in the plane is not connected"
  area: PL
  file: Lightlike/PL/WeakJordanCircle.lean
  decls: [Lightlike.PL.weak_jordan]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: klazar-2026, location: "Section 2", check: "Thomassen"}
  review: kernel-checked
  note: "For a continuous injective map f of the circle into the plane, the complement of the image is not connected (weak_jordan). This is Claim 4 of the proof of the weak Jordan theorem by Thomassen in the exposition of Klazar, Section 2 (Klazar's numbering). The proof: if the image is not contained in a horizontal line, take a highest point a and a lowest point b of the image; rotating the circle, the image is the union of two arcs from a to b that meet only at a and b (exists_two_arcs); if the complement were connected, an outer polygonal arc from a to b is drawn around the image (exists_outer), a horizontal segment between a point c of the first arc and a point d of the second is chosen at minimal distance so that its interior misses both arcs (exists_T), and an arc from an interior point e of the segment to a point g of the outer arc is drawn in the complement (exists_link, using polygonal connectedness of connected open sets, exists_chain_in_open); the nine arcs between a, b, e and c, d, g that this cuts out of the pieces have mutually disjoint interiors (false_of_pieces), a drawing of K₃,₃ by continuous arcs, which does not exist by LL-0099. If the image lies in a horizontal line the coordinates are swapped. Limits: this is the weak Jordan theorem only: the complement is not connected, but it is not shown to have exactly two components, one bounded and one unbounded, with the circle as the boundary of each; this needs the arc theorem (the complement of an arc is connected), which is not proved here. Check: the unit circle satisfies the hypotheses (TestsJordan, unitCircle), and a non-injective map does not."
  since: unreleased
- id: LL-0101
  title: A Jordan curve is approximated by simple polygons, within any distance in both directions
  area: PL
  file: Lightlike/PL/PolygonApprox.lean
  decls: [Lightlike.PL.exists_polygon_near, Lightlike.PL.exists_two_chains]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For a continuous injective map f of the circle into the plane and ε > 0 there is a list of points whose polygon is simple, such that every point of its carrier is within ε of the image of f and every point of the image is within ε of the carrier (exists_polygon_near; the Hausdorff distance between the carrier and the curve is less than ε). The circle is cut into two arcs from a = f 1 to b = f (-1) that meet only at a and b (exists_two_arcs); each arc is trimmed outside small balls around a and b (exists_trim), approximated by a simple chain near the trimmed subarc (exists_simple_chain_near, with loop erasure), and joined to the vertices by segments; the two resulting chains meet only at a and b, by the three arguments of no_K33 specialised to two arcs (exists_two_chains), and glue to a simple polygon (isSimple_two_arcs). The loop erasure could delete a loop of the sample chain and leave part of the arc far from the polygon; this does not happen because the inverse of an arc is uniformly continuous, so that a connected compact set that contains both ends of the arc and lies near it is near every point of it (arc_density, exists_inverse_modulus; Lightlike/PL/ArcDensity.lean). Limits: it approximates by a simple closed polygon, but says nothing about on which side of the polygon the curve lies; that the curve separates the plane into exactly two components needs the Arc Theorem and is not proved here. Check: the theorem applies to the unit circle (TestsJordan.unitCircle); two arcs that cross in a point of their interiors would not have simple chains meeting only at their ends, and the hypothesis of exists_two_chains excludes them."
  since: unreleased
- id: LL-0102
  title: The complement of a Jordan curve has exactly one unbounded component and a bounded component whose frontier lies in the curve
  area: PL
  file: Lightlike/PL/JordanComponents.lean
  decls: [Lightlike.PL.jordan_components]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For a continuous injective map f of the circle into the plane, the complement of the image has exactly one unbounded connected component (the one that contains the plane outside a square around the curve, which is connected, isPreconnected_squareOutside), and, since the complement is not connected (weak_jordan, LL-0100), a bounded component whose frontier lies in the curve (jordan_components). Limits: this is the part of the Jordan curve theorem that holds without the Arc Theorem. That there is exactly one bounded component, and that the curve is the frontier of each component, are open here: they need the Arc Theorem (the complement of an arc is connected), for which no proof is available in this library, and are not claimed. Check: the unit circle satisfies the hypotheses (TestsJordan.unitCircle)."
  since: unreleased
- id: LL-0103
  title: The boundary evaluation QDougall holds for the lowest sixth colours j1 - j5 and j4 - j2 with third colours from j1 - j2 up to j4 + j5 (respectively j1 + j2), by Jackson's sum and its degenerate case
  area: TuraevViro
  file: Lightlike/TuraevViro/Reflect/QDougallMap.lean
  decls: [Lightlike.TV.Refl.qDougall_orbit, Lightlike.TV.Refl.qDougall_nondeg, Lightlike.TV.Refl.qDougall_orbit3, Lightlike.TV.Refl.qDougall_trunc_param, Lightlike.TV.Refl.qDougall_trunc_deg_param, Lightlike.TV.Refl.qDougall_orbit3_trunc_param]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For spins admissible at level r (hypotheses hadmX at every third colour j1 - j2 + 2k, k ≤ n, with 2n = j4 + j5 - (j1 - j2), and hadmQ at q0 = j1 - j5), the boundary evaluation QDougall of LL-0074 holds in the case x0 = j1 - j2, q0 = j1 - j5 in the untruncated range (2n = j4 + j5 - (j1 - j2) and every third colour admissible up to it): jOmega(q0) · Σ_k jOmega(x0+2k) · Sj(q0, x0+2k)² = 1 (qDougall_orbit). When j4 + j5 < j1 + j2 the proof matches the weighted terms with the summand of Jackson's terminating very-well-poised 6φ5 sum at Q = u², u = e^{iπ/r}, with a = Q^(x0+1), b = Q^(j1+2), c = Q^((x0+j4-j5)/2+1), x = Q^n (wTerm_eq_Tj, from the one-term form of Sj at the lowest sixth colour and the one-step ratio of the Δ² factors), applies jackson_sumT with its nonvanishing hypotheses checked from the admissibility (qd_jhyp), writes Jackson's right side as a ratio of quantum factorials (jacksonRhs_val), and finishes with an exact cancellation of the quantum factorials (prod_identity). When j4 + j5 = j1 + j2, where the hypotheses of Jackson's sum fail because a numerator and a denominator vanish together, the same map holds, the summand is the term of a series with fewer parameters, and its partial sums have a closed form proved by induction (tDeg_sum, sDeg_val); the same cancellation closes the proof (qDougall_deg_param). The sum is DLMF §17.7(iii), equation (17.7.16); the location was read in the DLMF page, and no sources.yaml key is used. The case x0 = j1 - j2, q0 = j4 - j2 (the third orbit of the spin symmetries) with j1 + j2 < j4 + j5, and third colours from j1 - j2 up to j1 + j2, is proved the same way (qDougall_orbit3): the one-term form of Sj at q0 = j4 - j2, the summand of Jackson's sum with b = Q^(n+x0+2), c = Q^((x0+j4-j5)/2+1), x = Q^(j2) as the terminating parameter, and the cancellation prod_identity3. Instances: QDougall at level r = 5, spins (2, 2, 1, 1) (qDougall_five), at level r = 5, spins (1, 1, 2, 2) in the third orbit (qDougall_five_orbit3), and at level r = 7, spins (2, 2, 2, 2), in the degenerate case (qDougall_seven_degenerate). Not shown: a Lean proof that every admissible case falls into one of the proved forms for every level r; the forms cover all 1610 cases at levels 5 to 8 by a count (scripts/qracah/qd_coverage_check.py), not by a proof for all r. The truncated first orbit is proved by exchanging b with 1/x in Jackson's summand (the series is symmetric in b, c, 1/x) and terminating at Q^K = b^-1, K = r - 2 - j1, since Q^r = 1 (qDougall_trunc_param for j4 + j5 < j1 + j2, qDougallAt_O1_trunc); the truncated right side equals the untruncated one by [m]! [r-1-m]! = [r-1]!. For j4 + j5 = j1 + j2 the hypotheses of Jackson's sum fail (b = a q x) and the partial sums of the series with fewer parameters are used instead (qDougall_trunc_deg_param). By the symmetries of the four spins, the statement QDougallAt is proved for the untruncated first and third orbit and the truncated first orbit and the truncated third orbit (qDougall_orbit3_trunc_param, qDougallAt_O3_trunc): all 1610 cases at levels 5 to 8 (scripts/qracah/qd_coverage_check.py); the second and fourth orbit never occur alone, since a case matching one of them matches the others too. So LL-0074 and LL-0075 stay conditional on QDougall and QDougallAll."
  since: unreleased
