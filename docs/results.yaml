  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "The manifold is the whole open unit ball of R^n (hyperbolicDomain n as an open subset, model 𝓘(ℝ, Fin n → ℝ)), any n. Its metric poincareBallMetric n is the metric induced by iota(x) = ((1 + |x|^2)/(1 - |x|^2), 2x/(1 - |x|^2)), a map onto the upper sheet of the hyperboloid eta(x, x) = -1 of Minkowski space R^(1,n); the induced form is 4 <u, v>/(1 - |x|^2)^2 (poincareBallMetric_apply), so its components in the coordinates of R^n are exactly the library's hyperbolicMetric n x = 4 delta/(1 - |x|^2)^2 (poincareBallMetric_single): this is the Poincare ball model on which the catalogue defines H^n. MEASURED: positive definite at every point (poincareBallMetric_pos). Every locally smooth Levi-Civita connection has constant curvature -1 (hasConstantCurvature_poincareBall, hasConstantCurvature_of_quadric with c = -1; d iota is injective, and onto the eta-orthogonal complement of the point by dimension, exists_eq_of_injective_of_ker); a basis of the Lorentz algebra skewEta (n+1) gives n(n+1)/2 linearly independent smooth Killing fields (exists_killing_poincareBall, through isKillingAt_of_related and contMDiffAt_section_of_immersion); so the ball is maximally symmetric with K = -1 (isMaximallySymmetric_poincareBall). Compared with Carroll, Lecture Notes on General Relativity (arXiv gr-qc/9712019), read at section 5, p. 140, before eq. (5.44) ('a maximally symmetric space is one which possesses the largest possible number of Killing vectors, which on an n-dimensional manifold is n(n + 1)/2', the definition) and section 3, p. 85, eq. (3.106) (the curvature of a maximally symmetric space satisfies R_rho sigma mu nu = a^-2 (g_rho mu g_sigma nu - g_rho nu g_sigma mu)): IsMaximallySymmetric is that count with the curvature form (3.106), K = a^-2, which with Carroll's convention is HasConstantCurvature; the same statement with the property in addition, and the curvature is stated for every locally smooth Levi-Civita connection, a generalization. The cited eq. (8.1) is the FLRW metric, where maximally symmetric slices enter (p. 218)."
  since: unreleased
