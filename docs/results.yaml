- id: LL-0186
  title: Under the Einstein equations the physical and the geometric forms of the null, weak, strong and dominant energy conditions are equivalent
  area: Spacetime
  file: Lightlike/Spacetime/EnergyConditionsField.lean
  decls: [Lightlike.LorentzianMetric.nullECField_iff_ricci, Lightlike.LorentzianMetric.weakECField_iff_einstein, Lightlike.LorentzianMetric.strongECField_iff_ricci, Lightlike.LorentzianMetric.dominantECField_iff_einstein]
  status: proven
  tier: established
  source:
    refs:
      - {ref: curiel-2014, location: "§2.1", check: "geometric"}
  review: kernel-checked
  note: "For a Lorentzian metric g on a four-manifold, a connection cov and a field T of bilinear forms with G = kappa T (the Einstein equations with Lambda = 0, kappa > 0): T satisfies the null condition everywhere iff Ric(k,k) >= 0 for every null k; the weak condition iff G(xi,xi) >= 0 for every timelike xi; the strong condition iff Ric(xi,xi) >= 0 for every timelike xi (via the trace R = -kappa tr_g T); the dominant condition iff G(xi,xi) >= 0 and the vector G^a_n xi^n is causal for timelike xi, and G(xi,eta) >= 0 for co-oriented timelike xi, eta. A cosmological constant moves into the source (einsteinEq_iff_absorb). Also on the manifold: the perfect-fluid field with a unit timelike velocity field satisfies the four conditions iff the effective forms hold at every point, dust with rho >= 0 satisfies all four, a constant Klein-Gordon field with negative potential violates the weak one, the electromagnetic field satisfies the null one. Compared with E. Curiel, A Primer on Energy Conditions (arXiv 1405.0403), section 2, p. 5 ('the physical formulation is logically equivalent to the geometric formulation if the Einstein field equation is assumed to hold') and the geometric and physical forms of the table of section 2.1, p. 6. Non-vacuity: Minkowski space with T = 0. Limits: the fields need not be smooth; the geometric forms on a boundaryless manifold modelled on a finite-dimensional space. See docs/notes/ge14-energy-conditions.md."
  since: unreleased
- id: LL-0187
  title: The electromagnetic field satisfies the null, weak, strong and dominant energy conditions
  area: Spacetime
  file: Lightlike/Spacetime/EnergyConditionsEM.lean
  decls: [Lightlike.em_weakEC, Lightlike.em_dominantEC, Lightlike.em_strongEC_dim, Lightlike.em_strongEC_of_eq]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kontou-sanders-2020, location: "§2.3", check: "Maxwell"}
  review: kernel-checked
  note: "For an antisymmetric field strength F on a Lorentzian vector space (signature -+...+) and its stress-energy T_ab = F_ac F_b^c - (1/4) F_cd F^cd g_ab: T(v, v) >= 0 for every timelike v (in a Lorentz frame with e_0 = v/|v| the energy density is (1/2) sum_i F_0i^2 + (1/4) sum_ij F_ij^2); the Poynting bound sum_i T(e_0, e_i)^2 <= T(e_0, e_0)^2 (from |A E|^2 <= |A|^2 |E|^2 / 2 for the antisymmetric spatial part A) gives the dominant condition (T(xi, xi) >= 0 and the vector T^a_n xi^n causal for timelike xi, T(xi, eta) >= 0 for co-oriented timelike xi, eta); the strong condition (T - tr_g T/(n - 2) g)(v, v) >= 0 holds in every dimension n >= 3 (in four dimensions T is traceless and the four-dimensional StrongEC is the weak one); all in any dimension; the null condition is em_nullEC. Every unit timelike vector is the time vector of a Lorentz frame (exists_frame_of_timelike, a boost). Compared with E.-A. Kontou and K. Sanders, Energy conditions in general relativity and quantum field theory (arXiv 2003.01815), section 2.3, pp. 13-15: the stress tensor (15) with m = 0 is ours (no Gaussian factor), the energy density (36), the trace (37)-(38), and Table 2: Maxwell satisfies NEC, WEC, DEC and SEC. Limits: pointwise on a vector space. See docs/notes/ge14-energy-conditions.md."
  since: unreleased
- id: LL-0188
  title: The Hamiltonian and momentum constraints of a non-null hypersurface follow from the contracted Gauss and Codazzi relations
  area: Spacetime
  file: Lightlike/Spacetime/HypersurfaceConstraints.lean
  decls: [Lightlike.curvatureAt_linear, Lightlike.ricciAt_frame, Lightlike.scalarCurvatureAt_frame, Lightlike.hamiltonian_constraint, Lightlike.momentum_constraint]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gourgoulhon-2007, location: "Section 2.5", check: "Gauss"}
  review: kernel-checked
  note: "For a level-set hypersurface with unit normal n (g(n, n) = eps = plus or minus one) of a metric of any signature with its Levi-Civita connection, and tangent fields E_a (a < d, d + 1 the dimension) with g(E_a, E_b) = eta_a delta_ab at x0: 2 G(n, n) = -eps sum_ab eta_a eta_b g(R^D(E_b, E_a) E_a, E_b) + K^2 - K_ab K^ab (hamiltonian_constraint) and G(n, E_c) = sum_a eta_a ((D_{E_a} K)(E_c, E_a) - (D_{E_c} K)(E_a, E_a)) (momentum_constraint), G the Einstein tensor, K(v, w) = g(nabla_v n, w), R^D the curvature of the tangential connection, D K its covariant derivative. Read: Gourgoulhon gr-qc/0703035, scalar Gauss (2.95) and contracted Codazzi (2.103) (Section 2.5), giving the constraints (4.19) R + K^2 - K_ij K^ij = 16 pi E and (4.22) D_j K^j_i - D_i K = 8 pi p_i under Einstein's equations (eps = -1; his K is minus ours, which leaves (4.19) unchanged and matches (4.22) with p_i = -T(n, e_i)). The ADM form of the same constraints in coordinates is Lightlike/Canonical/ADM.lean (the ADM constraint densities); here they are derived from the four-dimensional curvature. Traces are taken in the orthonormal basis (n, E_a), with the curvature linear in each slot (curvatureAt_linear) and the Ricci and scalar curvatures as frame sums (ricciAt_frame, scalarCurvatureAt_frame)."
  since: unreleased
- id: LL-0189
  title: The Kruskal-Szekeres spacetime is inextendible (maximality of the Kruskal extension, smooth metrics)
  area: GR
  file: Lightlike/GR/KruskalMaximal.lean
  decls: [Lightlike.kruskal_isInextendible]
  status: proven
  tier: established
  source:
    refs:
      - {ref: sbierski-2016, location: "Abstract", check: "manifestly inextendible"}
  review: kernel-checked
  note: "The Kruskal manifold, the set X^2 - T^2 > -1 times the sphere with the Kruskal metric of mass M > 0, has no extension: no smooth isometric open embedding into a proper subset of a connected Hausdorff Lorentzian manifold of the same dimension with a smooth metric. Proof: a normal chart at a boundary point of the image gives a geodesic of the target that leaves the image; lifted to the Kruskal manifold it is a geodesic on a finite interval, which either has a limit in the manifold (bounds from the constants of motion and Gronwall's inequality) or approaches r = 0, where the Kretschmann scalar 48 M^2 / r^6 is unbounded. Difference from the source (weaker): the source's abstract states inextendibility with twice continuously differentiable metrics and its theorem is inextendibility with continuous metrics; here only extensions with smooth metrics are excluded."
  since: unreleased
- id: LL-0190
  title: The Raychaudhuri identity and geodesic focusing for a vector field on a manifold
  area: Spacetime
  file: Lightlike/Spacetime/RaychaudhuriManifold.lean
  decls: [Lightlike.raychaudhuri_manifold, Lightlike.raychaudhuri_leviCivita, Lightlike.raychaudhuri_focusing_manifold_at, Lightlike.raychaudhuri_focusing_manifold]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kar-sengupta-2007, location: "eq. (12)", check: "Raychaudhuri"}
