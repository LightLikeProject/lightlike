  note: "Carroll's setting (8.21)-(8.23), p = w rho with constant w (w >= 0 at p. 224), for every w > -1/3: for a C^2 scale factor a > 0 on (t1, t2) solving both Friedmann equations with Lambda = 0, rho >= 0, p = w rho, expanding at t0, either a -> 0 as t decreases to t1 or a', a'', rho, p are bounded on (t1, t0]. Proof: (a'^2 + k) a^{1+3w} is constant (its derivative a' a^{3w} (2 a a'' + (1 + 3w)(a'^2 + k)) vanishes by (8.35), (8.36)), i.e. rho a^{3(1+w)} is constant as in (8.23). Reading (a) of p. 224, any rho > 0, p >= 0, is false (onePlusSqrt_friedmann, LL-0226); reading (b), this setting, is proved here."
