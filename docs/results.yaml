- id: LL-0429
  title: "For 0 < γ < 1 the labels j± = |1 ± γ| j / 2 are a pair of spins (n/2, m/2) exactly when n + m = J and n − m = γ J (doubled units), so j₊ + j₋ = j and j₊ − j₋ = γ j"
  area: Spin4
  file: Lightlike/Spin4/EPRL.lean
  decls: [Lightlike.Spin4.isEPRLLabel_iff]
  status: proven
  tier: frontier
  source: pending
  review: kernel-checked
  note: "Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): the paper solves the diagonal simplicity constraint by (j+)^2 = ((gamma+1)/(gamma-1))^2 (j-)^2 (eq. (25)) and selects the SU(2) spin k = j+ + j- for 0 < gamma < 1 (eq. (27)); in the vertex amplitude the spins are (1+gamma) j / 2 and |1-gamma| j / 2 (eq. (31)). The statement here is that relation written in doubled integers (J = n + m and gamma J = n - m); the paper notes that j+ and j- being half-integers imposes a quantization condition on gamma, but does not give the doubled-integer form. The spins are doubled natural numbers J, n, m; the condition IsEPRLLabel says that (n/2, m/2) are the labels |1 + gamma| J/4 and |1 - gamma| J/4 in half-integer form; the Lean statement is the equivalence with the two linear equations. Hypotheses 0 < gamma < 1 are stated in the theorem. No unproved hypothesis."
  since: unreleased
- id: LL-0430
  title: "The admissible EPRL spins for 0 < γ < 1: J is admissible exactly when γ J = p is a natural number with J + p even; for rational γ = p/q this means J = q t with (p + q) t even; for irrational γ only J = 0 is admissible"
  area: Spin4
  file: Lightlike/Spin4/EPRL.lean
