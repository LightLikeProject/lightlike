- id: LL-0030
  title: The Ponzano–Regge asymptotic formula for the 6j symbol
  area: PonzanoRegge
  file: Lightlike/Asymptotics/SaddleAssembly.lean
  decls: [Lightlike.Asymptotics.ponzanoReggeFormula]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: roberts-1999, location: "Theorem 1", check: "Asymptotic formula"}
      - {ref: roberts-1999, location: "Section 6.1", check: "Ponzano"}
  review: kernel-checked
  note: "The statement `PR.PonzanoReggeFormula` (PonzanoRegge/Asymptotics.lean) is proved without hypotheses by `ponzanoReggeFormula`, through the large-spin asymptotics of the Racah sum (`racahSumAsymptotics`), and checked numerically. It is the Ponzano–Regge form, with edge lengths j + 1/2 in the volume and the angles. Roberts' Theorem 1 uses the unshifted tetrahedron; the two forms agree by his Section 6.1 (the Schläfli identity), but that equivalence is not proven here, so Roberts' unshifted form is not stated. Limits: only the Euclidean case (positive squared volume) is stated, not Roberts' Minkowskian case; and the base spins are integers (sixJScaled scales doubled spins as 2λj), so half-integer base spins are not covered."
  since: 0.1.0
- id: LL-0031
  title: Turaev–Viro invariance under the 2-3 and 1-4 moves at level r
  area: TuraevViro
  file: Lightlike/TuraevViro/TuraevViro.lean
  decls: [Lightlike.TV.turaevViro_move23, Lightlike.TV.turaevViro_move14]
  status: conditional
  tier: established
  source:
    refs:
      - {ref: turaev-1994, location: "Chapter: Chapter VII. Simplicial state sums on 3-manifolds|10.1515/9783110883275-008"}
      - {ref: turaev-1994, location: "Chapter: Chapter VI. 6j-symbols|10.1515/9783110883275-007"}
  review: kernel-checked
  hypotheses: [Lightlike.TV.qBiedenharnElliott, Lightlike.TV.qOrthogonality]
  note: "Both moves leave the state sum unchanged, given the q-Biedenharn–Elliott identity and q-orthogonality at level r. q-orthogonality is now proved at every level (LL-0075): turaevViro_move14_of_BE and turaevViro_move23_of_BE in Lightlike/TuraevViro/TuraevViroMoves.lean state both moves with q-Biedenharn–Elliott as their only hypothesis. That identity is proved at r = 3 (LL-0032) and checked numerically at r = 4 to 10, so the result stays conditional for r ≥ 4."
  since: 0.1.0
