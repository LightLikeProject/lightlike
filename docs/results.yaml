- id: LL-0505
  title: A Spin(4) representation (n/2, m/2) with n + m > 0 satisfies the weak simplicity constraint of the Barrett-Crane model, Y^H (K - 0 L) Y = 0 on the image of the highest-spin embedding, exactly when n = m
