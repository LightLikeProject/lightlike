  note: "For a locally smooth connection cov on a manifold modelled with corners on a finite-dimensional space and [IsManifold I 2 M]: if the torsion is zero, R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0 (bianchi_first_provedW); if moreover cov is compatible with a non-degenerate metric g of any signature, g(R(X,Y)Z, W) = g(R(Z,W)X, Y) (riemannLowerAt_pair_symmW; the antisymmetries in each pair are riemannLowerAt_antisymm_lastW and curvatureAt_antisymm_leftW) and the Ricci tensor Ric(Y,Z) = tr(X ↦ R(X,Y)Z) is symmetric (ricciAt_symm_provedW). It is LL-0230 for any ModelWithCorners, with torsion freeness and metric compatibility as two hypotheses instead of IsLeviCivita, and with no Hausdorff hypothesis. Carroll states these in coordinates, eqs. (3.78)-(3.81) and (3.91) (verified locations in the registry: (3.79), (3.80), (3.91)); the statements here are the intrinsic ones (KIND representation). The comparison with Wald, General Relativity, Section 3.2, is pending: the book was not read at the cited location."
