  review: kernel-checked
  note: "For exterior Schwarzschild (r > 2M, 0 < theta < pi) and the Levi-Civita connection of its metric, the coordinate field d_t of every chart is a Killing field (g(nabla_v X, w) + g(v, nabla_w X) = 0, equivalently L_X g = 0) at every point of the chart domain: the coordinate components of the metric do not depend on t, so the criterion for coordinate fields (coordField_killing, CoordKilling.lean) applies. Compared with Carroll's lecture notes (gr-qc/9712019), ch. 7, pp. 173-174, eq. (7.41) (the timelike Killing vector K = d_t of Schwarzschild): match. Limits: the rotation Killing fields of Schwarzschild are not covered."
