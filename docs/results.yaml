  decls: [Lightlike.Flat.IsConformalKillingAt, Lightlike.Flat.isConformalKillingAt_of_killing, Lightlike.Flat.isConformalKillingAt_dilation, Lightlike.Flat.isConformalKillingAt_special, Lightlike.Flat.conformalKilling_classification]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gourgoulhon-2007, location: "eq. (B.8)", check: "conformal Killing"}
  review: kernel-checked
  note: "On a real vector space with a constant symmetric bilinear form B (a flat metric of any signature), X is conformal Killing at y with factor sigma when B(DX u, w) + B(u, DX w) = 2 sigma B(u, w), the vanishing of the conformal Killing operator of Gourgoulhon's (B.1), (B.8) with sigma = div X / n. Killing fields (sigma = 0), the homothety y (sigma = 1) and the special conformal fields B(y, y) b - 2 B(b, y) y (sigma = -2 B(b, y)) are conformal Killing, and conformal Killing fields form a vector space. In dimension at least 3 every C^3 field conformal Killing at every point is c + A y + specialConformal B b y with A conformal (B(Au, w) + B(u, Aw) = 2 sigma(0) B(u, w)) (conformalKilling_classification): the (n + 1)(n + 2)/2 conformal Killing fields, Gourgoulhon's 'maximum dimension of ker L is 10' for n = 3 (Appendix B.1.3). Proof: the second derivative of X is fixed by D sigma, and the symmetry of the third derivative forces D^2 sigma = 0 for n >= 3 (in an orthogonal basis of B)."
  since: unreleased

