- id: LL-0052
  title: The Barrett–Crane vertex amplitude is a sum of squared 15j symbols, so it is real and non-negative
  area: SpinFoam
  file: Lightlike/SpinFoam/BarrettCrane.lean
  decls: [Lightlike.SpinFoam.BC.bcVertex_eq_sum, Lightlike.SpinFoam.BC.bcVertex_im, Lightlike.SpinFoam.BC.bcVertex_nonneg, Lightlike.SpinFoam.BC.abs_bcVertexBC, Lightlike.SpinFoam.BC.bcVertexBC_nonneg_of_even, Lightlike.SpinFoam.BC.bcVertexBC_nonpos_of_odd]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: barrett-crane-1998, location: "Section IV", check: "New Model"}
      - {ref: baez-christensen-2002, location: "Abstract", check: "positive or negative"}
  review: kernel-checked
  note: The vertex is the contraction along the edges of K₅ of five Barrett–Crane intertwiners Σ_i ι_i ⊗ ι_i, in the orthonormal intertwiner basis, with no dimension factor per tetrahedron and edge amplitude 1 (a normalisation convention). Baez and Christensen's Riemannian 10j symbol, when nonzero, is negative exactly when the ten spins sum to a half-integer; the vertex here is non-negative for all spins, so the two conventions differ by a sign. bcVertexBC, the vertex times (−1) to the sum of the doubled spins, follows their sign rule; its absolute value is the vertex, and it is ≥ 0 for even and ≤ 0 for odd sums (abs_bcVertexBC, bcVertexBC_nonneg_of_even, bcVertexBC_nonpos_of_odd). The sign rule is taken from Baez and Christensen; that bcVertexBC equals their 10j as they define it is not proven. On the triangle of spin j/2 the 15j symbol is 1/√(j + 1) and the vertex 1/(j + 1), so at spin 1/2 the two conventions give −1/2 and +1/2. Non-vacuity is shown by the value 1 at spin 0 and 1/(j + 1)² on the closed loop of spin j/2. No published table of 10j values was found to compare against.
  since: 0.2.0
- id: LL-0053
  title: In dimension 2, Lipschitz-weighted Regge deficit angles of fat vertex stars converge to the integral of the Gauss curvature at rate O(h), given the vertex cells
  area: Regge
  file: Lightlike/Regge/CMS/Final.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.cms_convergence]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Section 1", check: "convergence"}
  review: kernel-checked
  note: For a Riemannian metric on a region of the plane, ρ-fat vertex stars of bounded valence with geodesic edge lengths and mesh h, and a Lipschitz weight f, |Σ_v f(v) δ_v − ∫ f K dA| ≤ C h. The angle bound of the stars is derived from fatness (Lightlike.CMS.angle_le_of_fat). The vertex cells, of area ½Σ det2 and covering the region three times outside a boundary layer of area at most b h, are hypotheses; building them from an explicit triangulation is not proven, so this is not yet the theorem of Cheeger, Müller and Schrader (Commun. Math. Phys. 92 (1984) 405), which is in every dimension. As checks, the flat metric gives density 0, the round sphere gives 4π, and the curvature density without the area weight gives 2π², not 4π. Non-vacuity is shown on a single flat star with four neighbours, which meets every hypothesis with an empty region Ω (the cell is its own boundary layer); a non-empty region is LL-0054's grid.
  since: 0.2.0
- id: LL-0054
  title: In dimension 2, Lipschitz-weighted Regge deficit angles of an explicit planar triangulation converge to the integral of the Gauss curvature at rate O(h)
  area: Regge
  file: Lightlike/Regge/CMS/Triangulation.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.cms_convergence_triangulation]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Section 1", check: "convergence"}
  review: kernel-checked
  note: "The vertex cells of LL-0053 are built from a triangulation given by vertex positions and corner maps, not assumed. The star cell of an interior vertex is the union of its triangles, its area is ½Σ det2, and the triangles cover the interior region three times outside the triangles with a corner off V. The corners of a star triangle agree with (v, nb v j, nb v (j+1)) up to a permutation of Fin 3; the first version of the statement fixed their order, which left no triangle with all corners in V, and was corrected. The remaining hypotheses are that distinct triangles overlap in null sets, that the star of every interior vertex winds once (its angles sum to 2π), that the number of boundary triangles times h is bounded, that every triangle lies in K, and that edges at the first corner of each triangle have length at most h; the integral runs over the triangles with all three corners in V. Non-vacuity is shown on a 4×4 vertex grid with the 4 central vertices interior, valence 6 and the flat metric (Lightlike.CMS.grid_triangulation_bound), with 2 interior and 16 boundary triangles and an interior region of positive area (Lightlike.CMS.grid_interior_positive); the flat metric makes the integral 0. For a non-flat metric the n×n grids of the unit square, h = 1/n, satisfy the hypotheses with constants independent of n, so the deficit sum is within C/n of the interior integral for every large n (Lightlike.CMS.refining_grid_bound); for the metric dx² + e^{2x}dy² of scalar curvature −2 (Lightlike.CMS.scalar_hyp) that integral is at most −1/4 for every n ≥ 4 (Lightlike.CMS.hyp_refining_grid). The deficit angles there are those of the chart geodesic distances, which are not computed explicitly. As wrong-model checks, a clockwise star fails the fatness hypothesis for every ρ > 0 (Lightlike.CMS.reversed_star_not_fat), and Lightlike.CMS.volume_real_tri_example computes a triangle area of 3, not the 6 of the unhalved determinant. This is the planar case only, not the theorem of Cheeger, Müller and Schrader in every dimension."
  since: 0.2.0
- id: LL-0055
  title: The Dehn–Sommerville relations 2N₃ = 5N₄ and 2N₁ − 3N₂ + 6N₃ − 10N₄ = 0 for closed combinatorial 4-manifolds
  area: DynamicalTriangulations
  file: Lightlike/DynamicalTriangulations/DehnSommerville.lean
  decls: [Lightlike.PL.SComplex.IsClosedCombManifold.two_mul_card_eq, Lightlike.PL.SComplex.IsClosedCombManifold.dehnSommerville]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: ambjorn-jurkiewicz-loll-2001, location: "Section 3.2, eq. (26)", check: "Dehn-Sommerville"}
  review: kernel-checked
  note: "N_k is the number of faces with k + 1 vertices of a complex in Lightlike.PL. In every dimension n, a face with n vertices of a closed combinatorial n-manifold lies in exactly two top faces and 2N_{n-1} = (n + 1)N_n; in dimension 4 the second relation follows from the Euler characteristic 0 of the vertex links, which are PL 3-spheres. As checks, the boundary of the 5-simplex is a closed combinatorial 4-manifold with N = (6, 15, 20, 15, 6), computed by the kernel, and two 4-simplices glued along a tetrahedron are not a manifold and violate 2N₃ = 5N₄. These are the combinatorial input of four-dimensional dynamical triangulations; the Einstein–Regge action, causal triangulations and ergodicity of the moves are not formalized here."
  since: 0.2.0
- id: LL-0056
  title: Expansion of the squared geodesic distance about the midpoint to sixth order, uniformly on compact sets, with the order sharp
  area: Regge
  file: Lightlike/Regge/Geodesic/Sixth.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.dist_sq_expansion_midpoint6]
  status: proven
  tier: established
  source:
    refs:
      - {ref: brewin-2009, location: "Section 9", check: "geodesic"}
  review: kernel-checked
  note: "For a Riemannian coordinate metric g on U and a compact K ⊆ U, |d(m − Δ/2, m + Δ/2)² − g_m(Δ,Δ) − Q_m(Δ)| ≤ C‖Δ‖⁶ for m in K and small Δ, with the quartic form Q_m(Δ) = (1/24)∂_Δ∂_Δ g(Δ,Δ) − (1/12)g(Γ(Δ,Δ),Γ(Δ,Δ)); about the midpoint the terms of order three and five vanish. The order is sharp: on the cubic shear the remainder is t⁶/576 along Δ = (t, 0), so it is not O(‖Δ‖⁷) (Lightlike.Geodesic.dist_sq_expansion_midpoint6_sharp), and the expansion is checked exactly there (Lightlike.Geodesic.cubicShear_dist_sq_expansion_midpoint6). Brewin (2009), Section 9, gives the expansion in Riemann normal coordinates and the midpoint form d² = g(m)(Δ, Δ) + O(‖Δ‖⁴); the quartic form Q_m and the sixth-order bound are derived here."
  since: 0.2.0
- id: LL-0057
  title: The chart distance of a Riemannian coordinate metric is Mathlib's Riemannian distance
  area: Regge
  file: Lightlike/Regge/Geodesic/Riemannian.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq, Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq_iInf, Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq_of_isPreconnected]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For the Riemannian bundle of g on U, Mathlib's riemannianEDist is the infimum of the lengths of admissible curves, with no hypothesis on the points (the empty infimum is ⊤). If an admissible curve joins x and y it equals ENNReal.ofReal (dist g U x y), and on a preconnected U this holds for all x, y. Without an admissible curve riemannianEDist is ⊤ while the chart distance takes the junk value 0. This connects the geodesic results of this library (LL-0045, LL-0056) to Mathlib's Riemannian distance."
  since: 0.2.0
- id: LL-0058
  title: Near the regular 4-simplex the ten triangle areas determine the ten edge lengths
  area: Regge
  file: Lightlike/Regge/AreaRegge/Deriv.lean
  decls: [Lightlike.AreaRegge.area_local_inj, Lightlike.AreaRegge.areaSqMap_local_inj]
  status: proven
  tier: established
  source:
    refs:
      - {ref: brw-1999, location: "eq. (2)", check: "neighbourhood of the regular four-simplex"}
  review: kernel-checked
  note: "The map from the ten squared edge lengths of a 4-simplex to its ten squared triangle areas (Heron's formula in squared lengths) has invertible Jacobian at the regular simplex (all squared lengths 1; jac_regular_isUnit, through an explicit integer inverse of the edge-triangle incidence matrix), so by the inverse function theorem it is injective on a neighbourhood of the regular simplex with open image, and so are the areas themselves. The result is local: at the corner configuration (squared lengths 1 on the edges at one vertex, 2 on the others) the Jacobian is singular (jac_corner_det, with an explicit kernel vector), and corner_pair gives two different length assignments, the corner configuration moved by plus and minus half that kernel vector, both satisfying the Gram-minor criterion IsSimplex, with the same ten areas. IsSimplex is the positivity of the leading principal minors of the Gram matrix; Realization.lean gives both assignments as the squared distances of affinely independent five-point sets in ℝ⁴, so they are Euclidean 4-simplices of non-zero volume (Lightlike.AreaRegge.corner_pair_realized). scripts/regge/area_jacobian_check.py recomputes det Jac = −48/8¹⁰ at the regular simplex, the corner kernel and the corner pair in SymPy."
  since: 0.2.0
- id: LL-0059
  title: The Einstein–Regge action of dynamical triangulations in terms of N₀, N₄ and χ, and its change under the Pachner moves
  area: DynamicalTriangulations
  file: Lightlike/DynamicalTriangulations/Action.lean
  decls: [Lightlike.DynamicalTriangulations.dtAction_eq, Lightlike.DynamicalTriangulations.dtAction_move, Lightlike.DynamicalTriangulations.dtAction_move_one_five]
  status: proven
  tier: established
  source:
    refs:
      - {ref: ambjorn-jurkiewicz-loll-2001, location: "eq. (42)", check: "standard form of the action"}
      - {ref: ambjorn-jurkiewicz-loll-2001, location: "Section 3.2, eq. (26)", check: "Dehn-Sommerville"}
  review: kernel-checked
  note: "For a closed combinatorial 4-manifold the action −κ₂N₂ + κ₄N₄ equals −2κ₂N₀ + (κ₄ − 2κ₂)N₄ + 2κ₂χ, through N₂ = 2N₀ + 2N₄ − 2χ from the Dehn–Sommerville relations (LL-0055). A move with 2 ≤ #σ and 2 ≤ #τ keeps N₀ and χ and changes the action by (#σ − #τ)(κ₄ − 2κ₂), so the 3-3 move leaves it unchanged; the 1-5 move adds one vertex and changes it by −2κ₂ + 4(κ₄ − 2κ₂) (dtAction_move_one_five). Kernel checks: the boundary of the 5-simplex has action −20κ₂ + 6κ₄ (dtAction_sphere), and the formula without the χ term gives −24κ₂ + 6κ₄ there, the wrong value. Not covered: the Lorentzian action of causal dynamical triangulations, which weighs (4,1) and (3,2) simplices differently. As a non-vacuity check, the 1-5 move of the boundary of the 5-simplex with a new vertex changes the action by −2κ₂ + 4(κ₄ − 2κ₂) (sphere7_dtAction_move), and a 2-4 move on the result by 2(κ₄ − 2κ₂), the formula with #σ = 4 and #τ = 2 (sphere7_dtAction_move24)."
  since: 0.2.0
