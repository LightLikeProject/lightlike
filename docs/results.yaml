- id: LL-0030
  title: The Ponzano–Regge asymptotic formula for the 6j symbol
  area: PonzanoRegge
  file: Lightlike/Asymptotics/SaddleAssembly.lean
  decls: [Lightlike.Asymptotics.ponzanoReggeFormula]
  status: proven
  tier: established
  source:
    refs:
      - {ref: roberts-1999, location: "Theorem 1", check: "Asymptotic formula"}
      - {ref: roberts-1999, location: "Section 6.1", check: "Ponzano"}
  review: kernel-checked
  note: The statement `PR.PonzanoReggeFormula` (PonzanoRegge/Asymptotics.lean) is proved without hypotheses by `ponzanoReggeFormula`, through the large-spin asymptotics of the Racah sum (`racahSumAsymptotics`), and checked numerically. It is the Ponzano–Regge form, with edge lengths j + 1/2 in the volume and the angles. That form is equivalent to Roberts' Theorem 1, which uses the unshifted tetrahedron, via his Section 6.1 (Schläfli identity).
  since: 0.1.0
