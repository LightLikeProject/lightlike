  note: "Source check (27 Nov 2026): Kar and SenGupta (2007) eq. (17) is the null focusing equation, not the identity between the expansion of a null geodesic field and the frame trace. Their Section D, just before eq. (17), constructs the transverse metric h_ab = g_ab + k_a N_b + k_b N_a from an auxiliary null vector N with k.N = -1 (so that k^a h_ab = 0 and N^a h_ab = 0, two-dimensional), takes B_ab = nabla_b k_a, and calls the hatted trace the expansion (read); the identity of this entry, with an orthonormal frame, is the library's own formulation of that construction. G1-012 (closed trapped surfaces), the link between the expansion of the null normals of a surface and the Θ of raychaudhuri_null_focusing_manifold (LL for G1-009). Linear algebra first: in a nondegenerate symmetric form on a space of dimension m + 2 with an orthonormal m-frame orthogonal to a null pair (V, N), g(V, N) = -1, tr A = Σᵢ B(A eᵢ, eᵢ) − B(A V, N) − B(A N, V) (NullFrame.trace_eq); then g(∇_u V, V) = 0 for a null field (trappedExp_cov_null, from the chart statement covD_orthogonal_of_const) and ∇_V V = 0 kill the two correction terms. Hypotheses: V smooth, g(V, V) = 0 near x, ∇_V V = 0 at x, n ≥ 2. It does not say that the frame spans the tangent space of a surface: that, and that V is a null normal of the surface, belong to the definition of the trapped surface. The comparison with Kar and SenGupta is pending (only eq. (17) is a recorded verified location)."
