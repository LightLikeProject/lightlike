- id: LL-0180
  title: Dust with non-negative density satisfies the null, weak, strong and dominant energy conditions, a positive cosmological constant violates the strong one, and a scalar field with negative potential violates the weak one
  area: Spacetime
  file: Lightlike/Spacetime/EnergyConditions.lean
  decls: [Lightlike.dust_energyConditions, Lightlike.cosmo_energyConditions, Lightlike.scalar_negative_potential_violates_weak, Lightlike.fluid_weakEC_iff, Lightlike.fluid_dominantEC_iff, Lightlike.em_nullEC]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (4.72)", check: "weak energy condition"}
  review: kernel-checked
  note: "On a four-dimensional Lorentzian vector space (g, signature -+++) with a symmetric form T: the null condition T(k,k) >= 0 for null k, the weak condition T(v,v) >= 0 for timelike v (Carroll (4.72)), the strong condition (T - (1/2) tr_g(T) g)(v,v) >= 0 for timelike v, and the dominant condition (T(v,v) >= 0 and the g-dual of T(v,.) causal for timelike v, and T(v,w) >= 0 for co-oriented timelike v,w). For dust T = rho u u with g(u,u) = -1 and rho >= 0 all four hold; for T = -rho_Lambda g with rho_Lambda > 0 the null and weak conditions hold and the strong one fails; for the scalar-field tensor dphi dphi - (|dphi|^2/2 + V) g at dphi = 0 with V < 0 the weak condition fails. Proof ingredients: the reverse Cauchy-Schwarz inequality for a timelike vector and the sign rule for timelike vectors in a Lorentz frame. For a perfect fluid (rho + p) u u + p g with g(u,u) = -1 the null condition holds iff rho + p >= 0, the weak one iff rho >= 0 and rho + p >= 0, the strong one iff rho + p >= 0 and rho + 3p >= 0, the dominant one iff |p| <= rho (fluid_nullEC_iff, fluid_weakEC_iff, fluid_strongEC_iff, fluid_dominantEC_iff). For an electromagnetic field strength F (antisymmetric) the stress-energy F_ac F_b^c - F^2 g_ab / 4 satisfies the null condition (em_nullEC; the other three are not proved). Limits: pointwise on a vector space, not a field on a manifold. Compared with sources read: the weak condition with Carroll's lecture notes (gr-qc/9712019) eq. (4.72), p. 117; the null, strong and dominant conditions and the effective forms for a perfect fluid with E. Curiel, A Primer on Energy Conditions (arXiv 1405.0403), section 2.1, pp. 5-6 (not a registered source); the sign convention for the cosmological constant is the standard one (de Sitter = positive, G + Lambda g = 8 pi G T), opposite to Curiel's wording on p. 29-30, so the physical content (positive vacuum energy violates the strong condition) is the same; the stress-energy forms are those of Carroll's lecture notes (1.110), (1.112), (8.25) (pp. 30, 222); the statement that a Klein-Gordon field with negative potential violates the weak condition has no read source (open comparison; Carroll p. 117 and Curiel p. 31 say only that scalar fields can violate the conditions). See docs/notes/ge14-energy-conditions.md."
  since: unreleased
- id: LL-0181
  title: The generator of a one-parameter family of isometries is a Killing field
