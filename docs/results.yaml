  note: "The complement of a simple closed polygon in the plane is the disjoint union of two nonempty, open, connected sets, one bounded (the inside) and one unbounded (the outside), and the polygon is the frontier of each (polygon_jordan, frontier_class). The proof uses the parity of the number of edges met by the horizontal ray to the right of a point, with a half-open rule at the endpoints. A bounded or unbounded connected piece of any such decomposition is identified with the inside or outside (eq_inside_of_isBounded), and the inside of a simple triangle is the interior of its convex hull (inside_eq_interior_hull). Simplicity (nondegenerate edges, non-consecutive edges disjoint, consecutive edges meeting only at the shared vertex) is needed: the bow tie has crossing edges (not_isSimple_bowtie). Checks: the triangle (0,0),(1,0),(0,1) is simple (triangle_isSimple), a polygon with a repeated vertex is not (not_isSimple_degenerate)."
  since: 0.3.0
- id: LL-0077
  title: "A set of triangles that forces every triangle of a closed 4D complex forces every triangle after a 3-3 Pachner move if and only if the closure under the tetrahedra that do not contain the moved triangle is complete"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingMove33.lean
  decls: [Lightlike.SpinFoam.Forcing33.local33_prop, Lightlike.SpinFoam.Forcing33.local33_vars, Lightlike.SpinFoam.Forcing33.forcing_dichotomy, Lightlike.SpinFoam.Forcing33.forces_move33_iff]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is this library's rule (a tetrahedron with three of its triangles in the set forces the fourth), used to show that the gauge-fixed state sum is 1. Statement: for a 3-3 move K -> K' that replaces the triangle sigma by tau, and T a set of triangles of K that does not contain sigma and forces every triangle of K, T forces every triangle of K' exactly when the closure of T under the tetrahedra of K that do not contain sigma reaches every triangle of K other than sigma (forces_move33_iff, ForcesIn is forcing by an arbitrary set of tetrahedra). The proof splits the tetrahedra into those common to K and K' and the three that contain sigma (resp. tau). If the common closure is complete, one tetrahedron forces sigma (resp. tau) from the mixed triangles. If it is not, a derivation can leave the common closure only through a tetrahedron sigma + c whose three mixed triangles are in it (a full row), and after the move only through a full row for tau; if both exist, a finite lemma on the eighteen mixed triangles (local33_prop, a Boolean statement over eighteen variables checked by the kernel with decide) shows that adding sigma, or tau, forces nothing more, so at most one of the two complexes forces (forcing_dichotomy). Non-vacuity: forces_move33_example applies it to the boundary of the 5-simplex after a 1-5 and a 2-4 move, with a set of fifteen triangles and the move {0,2,3} -> {4,5,6}, every hypothesis checked by the kernel. Wrong-input control: local33_control shows that without a full row of tau-triangles the conclusion of the finite lemma fails. Scope: the 3-3 move only, with the set T unchanged by the move and not containing sigma; the 2-4 move and the inverse 4-2 and 5-1 moves are not covered. Numerical evidence (scripts/spinfoam/forcechain.py, not part of the proof): a collapsible forcing gauge set of size E-V+1 on a 48-simplex 4-sphere triangulation loses forcing under a 3-3 move (so the second condition is not automatic), and in about 162,000 random trials the characterization held in every case."
  since: 0.3.0
- id: LL-0078
  title: "For a positive definite Gram matrix the squared lengths of the 36 incidences of the Kuhn triangulation are admissible, and the dihedral angles of each of the seven edge classes add up to 2π"
  area: Regge
  file: Lightlike/Regge/Conv3/StarAngle.lean
  decls: [Lightlike.Regge.Conv3.valid_incQ, Lightlike.Regge.Conv3.jet_angle_sum]
  status: proven
  tier: frontier
  source: structural
  review: kernel-checked
  note: "G is any positive definite 3x3 matrix; the incidences are the 36 pairs (tetrahedron, hinge) of the Kuhn triangulation of the unit cube (six tetrahedra, seven edge directions). Each class of incidences is a fan of four or six tetrahedra around the hinge axis; the proof uses the complex coordinate in the plane quotient, so it holds for every G and does not use G = identity. Limits: only the cube star of one lattice point is treated; nothing is said about a triangulation of a manifold, and the lattice is the standard one (no other triangulations)."
  since: 0.3.0
- id: LL-0079
  title: The Christoffel symbols, Riemann tensor and scalar curvature of a smooth metric at a point are explicit expressions in the metric, its inverse and its first and second partial derivatives
  area: Regge
  file: Lightlike/Regge/Conv3/JetCurvature.lean
  decls: [Lightlike.Regge.Conv3.pd_inv, Lightlike.Regge.Conv3.pd_christoffel, Lightlike.Regge.Conv3.riemann_jet, Lightlike.Regge.Conv3.scalarCurvature_jet]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For a coordinate metric g on an open set U (smooth, symmetric, invertible) and a point m of U: the derivative of the inverse metric is minus g⁻¹ (∂g) g⁻¹ (pd_inv), and the derivative of the Christoffel symbols, the Riemann tensor and the scalar curvature at m are written with (g m)⁻¹, ∂g(m) and ∂∂g(m) only. Limits: this unfolds the coordinate definitions of the library (Lightlike.christoffel, riemann, scalarCurvature); it is the textbook computation, not a statement about tensors or charts."
  since: 0.3.0
- id: LL-0080
  title: The jet-level star identity of the 3D Regge calculus holds at a point where the first derivatives of a Riemannian metric vanish
  area: Regge
  file: Lightlike/Regge/Conv3/FlatStarJet.lean
  decls: [Lightlike.Regge.Conv3.jetStarCore_of_flat, Lightlike.Regge.Conv3.scalar_flat]
  status: proven
  tier: frontier
  source: structural
  review: kernel-checked
  note: "Part of the 3D convergence of the Regge action (T-RC6), which stays open. Scope: at a point m where all first partial derivatives of a Riemannian metric g on an open set of R^3 vanish (for example the centre of normal coordinates); not the general chart. The convergence theorem needs the same statement at every hinge, where the first derivatives do not vanish, and that case is open. For any positive definite g(m) and any second derivatives, the star of one edge of the Kuhn triangulation (flat star: the dihedral angles of each of the seven edge classes add up to 2π; first-order coefficient 0; weights: the hinge lengths √(g(m)(w, w)) of the seven directions w, where g(m)(w, w) is the squared length) satisfies: the sum over the seven classes of the hinge length times the second-order coefficient of the class angle sum equals minus half the scalar curvature times the square root of det g(m) (JetStarCore). The core is an exact polynomial identity in the six entries of g(m) and the 36 independent second derivatives (flat_star_identity), generated and checked in exact arithmetic by scripts/regge/gen_flat_star.py. Limits: second derivatives are those of g at the single point m; the Kuhn triangulation is the standard cubical one; the Gram lengths g(m) are the metric at m, not integrated along edges. Trust checks: the Euclidean metric satisfies the hypotheses, and for sphere-like second derivatives the sum over the 36 incidences is 3, not 0 and not 6 (FlatStarTests.lean)."
  since: 0.3.0
- id: LL-0081
  title: "A set of triangles that forces every triangle of a closed 4D complex, together with the triangle {a, p, q}, forces every triangle after a 2-4 Pachner move if and only if the closure under the tetrahedra other than the removed one is complete"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingMove24.lean
  decls: [Lightlike.SpinFoam.Forcing24.local24, Lightlike.SpinFoam.Forcing24.forcing_dichotomy24, Lightlike.SpinFoam.Forcing24.forces24_of_common, Lightlike.SpinFoam.Forcing24.forces_move24_iff]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is this library's rule (a tetrahedron with three of its triangles in the set forces the fourth), used to show that the gauge-fixed state sum is 1. Statement: for a 2-4 move K -> K' that removes the tetrahedron sigma (shared by the two 4-simplices sigma + p and sigma + q) and adds the edge {p, q}, a vertex a of sigma, and T a set of triangles of K that forces every triangle of K, the set T together with {a, p, q} (the triangle that the gauge rule adds) forces every triangle of K' exactly when the closure of T under the tetrahedra of K other than sigma already reaches every triangle of K (forces_move24_iff). The move keeps all triangles and adds the four triangles {p, q, s} for s in sigma; the tetrahedra before the move are the common ones and sigma, after it the common ones and the six {p, q, s, s'}. If the common closure is complete, K forces trivially and the new triangles are forced one after the other from {a, p, q} and the triangles {p, s, s'}, {q, s, s'} (forces24_of_common). If not, K can leave the common closure only through sigma, when exactly three of its four triangles are in it, and in that case a finite lemma on the sixteen triangles {p, s, s'}, {q, s, s'} and sigma minus a vertex (local24, a Boolean statement checked by the kernel with decide) shows that the new triangles can be added without forcing anything more in K', so at most one of the two complexes forces (forcing_dichotomy24). Non-vacuity: forces_move24_example applies it to the boundary of the 5-simplex after a 1-5 move, with fourteen triangles, a = 0 and the move {0,1,2,3} -> {5,6}, every hypothesis checked by the kernel. Wrong-input control: local24_control shows that without the hypothesis that exactly three triangles of sigma are in the set, the conclusion of the finite lemma fails. Scope: the 2-4 move only, with the triangle {a, p, q} the only one added to T; the 3-3 move is LL-0077, and the inverse 4-2 and 5-1 moves are not covered (numerical evidence in scripts/spinfoam/forcechain.py shows that the transported set can lose forcing there). Numerical evidence, not part of the proof: in about 526,000 random cases (random complexes, random minimal forcing sets, every 2-4 move and every a) the characterization held in every case."
  since: 0.3.0
- id: LL-0082
  title: Every simple closed polygon in the plane has a triangulation by its own vertices
  area: PL
  file: Lightlike/PL/PolygonTriangulation.lean
  decls: [Lightlike.PL.Polygon.exists_triangulation, Lightlike.PL.Polygon.IsTriangulation, Lightlike.PL.Polygon.isTriangulation_triangle, Lightlike.PL.Polygon.isTriangulation_union]
  status: proven
  tier: established
  source:
    refs:
      - {ref: moise-1977, location: "Chapter: The Schönflies theorem for polygons in R 2|10.1007/978-1-4612-9906-6_4"}
  review: kernel-checked
  note: "A simple closed polygon with n ≥ 3 vertices has a triangulation: a finite family of triangles, each spanned by three vertices of the polygon, whose faces form a geometric complex (IsGeom) whose underlying set is the closed region bounded by the polygon (the inside together with the carrier), and in which every edge of the polygon is a face (exists_triangulation). The proof is by induction on n. A triangle is its own triangulation (isTriangulation_triangle). A polygon with at least four vertices has an interior diagonal, a pair of non-neighbouring vertices whose open segment lies in the inside: the extreme vertex has no vertex strictly inside its wedge below the nearest vertex of its corner triangle, or else the two neighbours of the extreme vertex span the diagonal. The diagonal splits the polygon into two simple polygons whose insides are disjoint and add up, with the open diagonal, to the inside (Polygon.inside_split), and the two triangulations fit together along the diagonal (isTriangulation_union). Limits: this entry does not say that the complex is a PL ball (that is the next entry); the triangles use only the polygon's own vertices; the polygon is simple in the sense of Polygon.IsSimple (no repeated vertices, non-consecutive edges disjoint). Check: the theorem applies to the triangle (0,0), (1,0), (0,1) (triangle_triangulation, whose hypothesis is the simplicity checked in triangle_isSimple); the bow tie, which is not simple, is excluded (not_isSimple_bowtie)."
  since: 0.3.0
- id: LL-0083
  title: The triangulated region of a simple closed polygon in the plane is a PL ball
  area: PL
  file: Lightlike/PL/PolygonBall.lean
  decls: [Lightlike.PL.Polygon.exists_ball_triangulation, Lightlike.PL.Polygon.ball_step, Lightlike.PL.Polygon.EdgeUnique]
  status: proven
  tier: established
  source:
    refs:
      - {ref: moise-1977, location: "Chapter: The Schönflies theorem for polygons in R 2|10.1007/978-1-4612-9906-6_4"}
  review: kernel-checked
  note: "A simple closed polygon with n ≥ 3 vertices has a triangulation by its own vertices (see the previous entry), in which every edge of the polygon lies in exactly one triangle (EdgeUnique), and the complex generated by the triangles is a PL ball in the sense of the library, stellar equivalent to a simplex (IsBallIn; exists_ball_triangulation). The proof is by induction on n by clipping an ear: a simple polygon with at least four vertices has an interior diagonal between the vertices k and k + 2 (an ear), found by induction from the splitting along an interior diagonal (Polygon.two_ears: of two ears with non-neighbouring indices in a part, at most one touches the diagonal). The ear triangle is attached to the triangulation of the polygon with the ear removed along the diagonal, which lies in exactly one triangle there; attaching a triangle on a new vertex along such a boundary edge is a stellar equivalence, a stellar subdivision of the edge followed by a bistellar flip (SComplex.stellarEquivIn_closure_insert), so the complex stays a PL ball (ball_step). Limits: this entry does not identify the boundary of the ball with the polygon (the next entry does); the ball is combinatorial (IsBallIn, stellar equivalent to a simplex) with a geometric realisation given by the triangles, not shown here to be PL homeomorphic to a triangle. The polygon is simple in the sense of Polygon.IsSimple. Check: the theorem applies to the triangle (0,0), (1,0), (0,1) (triangle_ball)."
  since: 0.3.0
- id: LL-0084
  title: "The polygonal Schoenflies theorem: the closed region bounded by a simple closed polygon in the plane is a PL ball whose boundary is the polygon"
  area: PL
  file: Lightlike/PL/PolygonBoundary.lean
  decls: [Lightlike.PL.Polygon.polygon_schoenflies, Lightlike.PL.Polygon.mem_bd_closure_iff, Lightlike.PL.Polygon.bd_space_eq_carrier, Lightlike.PL.Polygon.unique_triangle_of_ball]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: moise-1977, location: "Chapter: The Schönflies theorem for polygons in R 2|10.1007/978-1-4612-9906-6_4"}
  review: kernel-checked
  note: "For a simple closed polygon p with n ≥ 3 vertices there is a geometric complex K in the plane (IsGeom) whose underlying set is the closed region bounded by p (the inside together with the carrier), which is a PL ball (IsBallIn, stellar equivalent to a simplex), and whose boundary complex (SComplex.bd: the faces inside a face whose link is a PL ball) has underlying set exactly the polygon (polygon_schoenflies). The complex is the ear-clipping triangulation of the previous entry. The new ingredients are the invariant that every edge of the triangulation that is not an edge of the polygon lies in two triangles (NonBdry), and the computation, by the signed count of the link, that a face whose link is a ball lies in exactly one triangle (unique_triangle_of_ball); the faces of the boundary are then exactly the faces inside an edge of the polygon (mem_bd_closure_iff), and their hulls are the edges (bd_space_eq_carrier). Limits: the ball is combinatorial (stellar equivalent to a simplex) with the geometric realisation given by the triangles; a PL homeomorphism of the region onto a triangle is not constructed, and this is the polygonal case only, not the Schoenflies theorem for arbitrary Jordan curves. The polygon is simple in the sense of Polygon.IsSimple. Check: the theorem applies to the triangle (0,0), (1,0), (0,1) (triangle_schoenflies); the bow tie, which is not simple, is excluded (not_isSimple_bowtie)."
  since: 0.3.0
- id: LL-0085
  title: One link of the principal-series Lorentzian vertex is the exponential of the coherent action times the density of Omega, for the lowest level and coherent boundary data (assembled over the ten links in LL-0087)
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/Bridge.lean
  decls: [Lightlike.Asymptotics.Lorentzian.link_eq_lor, Lightlike.Asymptotics.Lorentzian.link_pointwise, Lightlike.Asymptotics.Lorentzian.exp_triAction_nat, Lightlike.Asymptotics.Lorentzian.lam_emb_cohState, Lightlike.Asymptotics.Lorentzian.suV_ae, Lightlike.Asymptotics.Lorentzian.inner_principalSeries_eq_integral]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "Section 4, eq. (17)", check: "action"}
      - {ref: bdfhp-2010, location: "Section 3.3, eqs. (15), (16)", check: "coherent states"}
      - {ref: engle-pereira-2009, location: "eq. (22)", check: "independent"}
      - {ref: engle-pereira-2009, location: "eq. (23)", check: "regularize"}
  review: kernel-checked
  note: "For a doubled spin n = 2k and the lowest SU(2) level, with the source spinor the first column of the complex conjugate of g1 and the target spinor the first column of w g2, conj F_{g1}(Z) F_{g2}(Z') = e^S / (|Z|^2 |Z'|^2), where F = hvec n 0 rho of the coherent state, e^S is the power-form action (exp_triAction_nat) and Z, Z' are the transported chart spinors; no sign and no constant appear. This entry is the single link only: the integral form with the explicit constant (n+1)/pi is LL-0086, and the assembly over the ten links, the Haar-invariant substitution X = conj(a) and the identity eprlVertex = lorVertex are LL-0087 (finiteness of the integral is LL-0088). The limits stand: the lowest SU(2) level, SU(2) boundary data, product coherent arrays and nonvanishing overlaps (a null set is excluded)."
  since: 0.3.0
- id: LL-0086
  title: One link of the principal-series Lorentzian vertex is an integral over the chart with the explicit constant (n+1)/pi (the identity eprlVertex = lorVertex is not proved)
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/NormLowest.lean
  decls: [Lightlike.Asymptotics.Lorentzian.link_integral_explicit, Lightlike.Asymptotics.Lorentzian.nrmA_sq_lowest]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "Section 4, eq. (17)", check: "action"}
      - {ref: engle-pereira-2009, location: "eq. (22)", check: "independent"}
  review: kernel-checked
  note: "For n a natural number (the lowest SU(2) level of the principal series (n/2, rho)), SU(2) data g1, g2 and a, b in SL(2,C), the sum over m, m' of conj(coherent_m(g1)) coherent_m'(g2) D_{m m'}(a^-1 b) equals ((n+1)/pi) times the integral over C of e^S / (|Z|^2 |Z'|^2), with Z = a^T (w,1), Z' = b^T (w,1), source spinor the first column of conj(g1), target spinor the first column of w g2 and S the power-form action with 2k = n, p = rho; the constant is pi/(n+1) = the squared norm of the lowest-level vector, from the integral of u^n (1+u)^(-n-2) over (0, infinity) equal to 1/(n+1). NOT PROVED: eprlVertex = lorVertex (the sum over the ten links, the integral over SL(2,C)^4, and the substitution X = conj(a) are open); finiteness of lorVertex is not claimed. Only the lowest K-type and product coherent boundary data. Checked numerically in scripts/asymptotics/link_integral_check.py (not a proof)."
  since: unreleased
- id: LL-0087
  title: The coherent principal-series Lorentzian vertex equals the coherent vertex of BDFHP up to an explicit Haar normalisation factor, for the lowest level and product coherent boundary arrays
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/CoherentVertex.lean
  decls: [Lightlike.Asymptotics.Lorentzian.eprlVertex_eq_lorVertex, Lightlike.Asymptotics.Lorentzian.integrable_lorOuter, Lightlike.Asymptotics.Lorentzian.eprlIntegrand_coh, Lightlike.Asymptotics.Lorentzian.map_conjSL_haar, Lightlike.Asymptotics.Lorentzian.link_value_spin_zero]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "Section 4, eq. (17)", check: "action"}
      - {ref: engle-pereira-2009, location: "eq. (22)", check: "independent"}
      - {ref: engle-pereira-2009, location: "eq. (23)", check: "regularize"}
      - {ref: engle-pereira-2009, location: "eq. (30)", check: "contraction"}
  review: kernel-checked
  note: "For every Immirzi parameter gamma, every family of doubled spins J and SU(2) data G, eprlVertex gamma J (iotaProd (uCoh J G)) = (haarScalarFactor haarC SL2C.haar)^4 * lorVertex (n_e/2) (rho_e) ((n_e+1)/pi) (bdry G). The factor appears because LL-0046's haar4 is the product of four copies of the chart measure haarC, which is haarScalarFactor haarC SL2C.haar times SL2C.haar; it is not claimed to be 1. Limits: only the lowest SU(2) level of each representation (EPRL k = j); boundary arrays are products of coherent states (not the SU(2)-invariant Livine-Speziale intertwiner, and no epsilon twist); SU(2) boundary data, with the boundary spinors of lorVertex the conjugate of G at the source end and w G at the target end of each edge; rho_e = gamma (n_e/2 + 1) and p_e are one free parameter (no claim about which labels are EPRL); the constants c_ab dk_ab and the sign (-1)^chi of BDFHP are not compared. Consequence: the outer integral of lorVertex is finite (integrable_lorOuter), because LL-0046 is; the integrability of the inner integral over C^10 is in the entry LL-0088; the asymptotics is not part of this entry. Non-vacuity: link_value_spin_zero (the spin-zero link at the identity has the value pi). lorVertex is an iterated integral, so no joint bound on SL(2,C)^4 x C^10 is needed."
  since: unreleased
- id: LL-0088
  title: The integrand of the coherent Lorentzian vertex is integrable on C^10 at every point of SL(2,C)^5, so the vertex is a genuine integral
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/InnerIntegrable.lean
  decls: [Lightlike.Asymptotics.Lorentzian.integrable_lorInner, Lightlike.Asymptotics.Lorentzian.integrable_lorInner_coh, Lightlike.Asymptotics.Lorentzian.integrable_edge]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "Section 4, eq. (17)", check: "action"}
  review: kernel-checked
  note: "For nonnegative spin parameters and boundary spinors of unit norm, the integrand of lorVertex (the exponential of the action times the densities of Omega, in the chart z = (w, 1) of each CP^1) is integrable on C^10 at every point of SL(2,C)^5. It is a product over the ten edges of functions of one variable, each bounded by the density 1/(|Z|^2 |Z'|^2) of Omega, where Z = X_a^dagger (w,1) and Z' = X_b^dagger (w,1). The bound |e^S| <= 1 holds for spin parameters k_e >= 0, boundary spinors of unit norm, nonzero Z and Z' (automatic: X^dagger is invertible and (w,1) is nonzero) and nonvanishing overlaps <Z, xi> and <J xi', Z'>, which fail at most at one point w of C (they are affine in w or conj w with coefficients not both zero, because X is invertible and the spinor is nonzero); it is |e^S| = triReal^k <= 1, the Cauchy-Schwarz bound of BDFHP Section 4, the first term of eq. (17) (the real-part condition, eqs. (18)-(20)). The density is integrable because ||X^dagger v||^2 >= ||v||^2 / (sum of the squared moduli of the entries of the adjugate) gives density <= C (1+|w|^2)^-2. No joint bound is needed. With the finiteness of the outer integral (LL-0087, from LL-0046) this makes lorVertex a genuine integral for the coherent boundary data of LL-0087. Not claimed: any asymptotics; boundary data other than SU(2) coherent data are covered by the general statement integrable_lorInner only as far as its hypotheses (unit spinors, nonnegative spins) go."
  since: unreleased
- id: LL-0089
  title: "A set of triangles that forces every triangle of a closed 4D complex even with any one tetrahedron removed still does so after a 1-5 Pachner move, when the four gauge triangles of the move are added"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingRobust.lean
  decls: [Lightlike.SpinFoam.Robust, Lightlike.SpinFoam.robust_of_robustBy, Lightlike.SpinFoam.Move15.robust_move15]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is this library's rule (a tetrahedron with three of its triangles in the set forces the fourth). A set T is robust for a complex K (Robust K T) if it forces every triangle of K using the tetrahedra of K with any one of them removed. Statement: if T is robust for K, then T together with the four gauge triangles {v, a_0, a_j} of a 1-5 move is robust for the complex after the move (robust_move15). The old triangles are forced as before, because the 1-5 move only adds tetrahedra; the ten new triangles {v, x, y} are forced by the tetrahedron {v, a_0, x, y}, and when that tetrahedron is the removed one, through a fifth vertex z (the triangles {v, x, z} and {v, y, z} by {v, a_0, x, z} and {v, a_0, y, z}, then {v, x, y} by {v, z, x, y}). Non-vacuity: robust_move15_example applies it on the boundary of the 5-simplex, where the ten triangles through a vertex are robust (Robust K0 starK0, checked by the kernel by robustBy with explicit forcing steps for each of the fifteen removed tetrahedra). Scope: the 1-5 move only. Conjecture, not claimed: robust sets stay robust under the 3-3 and 2-4 moves, so that a robust forcing gauge set exists on every complex reached from the boundary of the 5-simplex by forward moves. Numerical evidence only (scripts/spinfoam/robust_check.py (longer runs of the same code)): the gauge set carried along from the boundary of the 5-simplex was robust at every one of 1,104,480 tetrahedra on random complexes, the condition of the 3-3 characterization held at every 3-3 location (38,176 of 38,176), and robustness held after each of 822 consecutive forward moves; robustness implies the conditions of forces_move33_iff and forces_move24_iff only through an unproved lemma (that a robust set never needs the moved triangle), measured at 34,270 of 34,270 3-3 locations."
  since: unreleased
