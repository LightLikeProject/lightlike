- id: LL-0299
  title: "The scalar curvature of the round unit n-sphere in stereographic coordinates is n(n-1)"
  area: GR
  file: Lightlike/Geometry/HeatKernel/StereoCurvature.lean
  decls: [Lightlike.HeatKernel.scalarCurvature_stereo]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (3.106)", check: "maximally symmetric"}
      - {ref: vassilevich-2003, location: "eq. (4.27)", check: "6E"}
  review: kernel-checked
  note: "Source of the value n(n-1) (read, 26 Nov 2026): Carroll, Lecture Notes on General Relativity, gr-qc/9712019, eq. (3.106): in any number of dimensions the curvature of a maximally symmetric space satisfies R_{rho sigma mu nu} = a^{-2} (g_{rho mu} g_{sigma nu} - g_{rho nu} g_{sigma mu}); the round unit n-sphere is maximally symmetric with a = 1, and contracting once gives R_{sigma nu} = (n-1) a^{-2} g_{sigma nu}, twice R = n(n-1) a^{-2}, so R = n(n-1) (the contraction is the reader's step, not printed there). Vassilevich eq. (4.27) is the a_2 heat coefficient and is cited only for the a_1 formula below, not for the value of R. Used to tie the a₁ coefficient of the sphere heat traces to Lightlike's scalar curvature. Convention: the sign of R is that of Lightlike.scalarCurvature (positive on spheres). Compared with Vassilevich (2003), arXiv:hep-th/0306138, eq. (4.27), p. 40 (read): a_2(f, D) = (4π)^{-n/2} 6^{-1} ∫ tr{f(6E + R)}, so for the scalar Laplacian (E = 0, f = 1) a_1 = (4π)^{-n/2} ∫R/6 in the Lightlike normalisation (the heat trace coefficient of t^{1-n/2}), with R positive on spheres as in the source; on the unit 2-sphere this is (4π)^{-1}·(2/6)·4π = 1/3, and eq. (4.28) gives the next coefficient (4π)^{-1} 360^{-1} ∫(5R² - 2R_ij R_ij + 2R_ijkl R_ijkl) = 24/360 = 1/15, the t/15 of the milestone (computed by hand from the source, not formalised). This is an example-level result: the general Seeley-DeWitt expansion on a compact Riemannian manifold is NOT proved (Mathlib has no Laplace-Beltrami operator, manifold heat kernel or elliptic theory), so GE8 stays open."
  since: unreleased
