- id: LL-0380
  title: "For every k and sign epsilon the eigenvalue epsilon (k+1) of the Dirac operator of the unit 2-sphere in the stereographic chart has an injective linear image of k+1 copies of the spinor module among its eigenspinors"
  area: GR
  file: Lightlike/Dirac/EigenAngular.lean
  decls: [Lightlike.Dirac.sphere_dirac_lower_bound, Lightlike.Dirac.modeMap_injective, Lightlike.Dirac.modeMap_eigen, Lightlike.Dirac.sphere_eigen_mode, Lightlike.Dirac.angG_flat_eigen, Lightlike.Dirac.dirac_angular]
  status: proven
  tier: established
  source:
    refs:
      - {ref: boldt-2015, location: "Theorem 3.1", check: "multiplicities"}
  review: kernel-checked
  note: "Compared with Boldt, arXiv:1504.03121, Theorem 3.1, p. 6 (read): the Dirac eigenvalues of the round S^n are +-(n/2 + k) with multiplicity 2^[n/2] C(n+k-1, k); for n = 2 this is +-(k+1) with multiplicity 2(k+1). Here, in the stereographic chart and for an arbitrary Clifford module V of Cl(R^2), the k+1 angular modes c1 = (1+|y|^2)^-(k+1) z^(n+1) G_n(|y|^2), c2 = (1+|y|^2)^-(k+1) z^n F_n(|y|^2) (n = 0..k, G_n a terminating hypergeometric polynomial of degree k-n) give eigenspinors h^(1/2) (Lv c1 + gamma_0 Lv c2) of eigenvalue epsilon (k+1), and the map (v_0..v_k) to the sum is linear and injective. For V = C^2 this is the lower bound 2(k+1) over C. WEAKER: a lower bound only; no completeness (no statement that there are no other eigenvalues or eigenspinors), no regularity condition at the north pole of the sphere and no L^2 or spinor-bundle statement; the chart carries no such notion in the library. Riemannian only: the metric is positive definite and the structure group is Spin(n); the Lorentzian case (Spin(1,3), time orientation) is not covered by this entry."
  since: unreleased
- id: LL-0381
  title: "Fermionic Shale theorem in infinitely many modes (Shale 1962 for the CAR): a surjective real-linear map R of a complex Hilbert space Z preserving the real part of the inner product is implemented by a unitary of the fermionic Fock space, U phi(w) = phi(R w) U, if and only if its antilinear part is Hilbert-Schmidt (sum of |beta b_j|^2 over the Fock basis converges). Sufficiency, in detail: a surjective real-linear map R of a complex Hilbert space Z preserving the real part of the inner product, whose antilinear part beta (R w + i R(i w))/2 is Hilbert-Schmidt, is implemented by a unitary of the fermionic Fock space, U phi(w) = phi(R w) U; and for any such R, a unit vector killed by the transformed annihilation operators gives such a unitary"
