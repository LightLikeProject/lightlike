- id: LL-0592
  title: The q-Biedenharn–Elliott identity holds at every level r ≥ 2
  area: TuraevViro
  file: Lightlike/TuraevViro/QBiedenharnElliott.lean
  decls: [Lightlike.TV.qBiedenharnElliott_all]
  status: proven
  tier: established
  source:
    refs:
      - {ref: turaev-1994, location: "Chapter: Chapter VI. 6j-symbols|10.1515/9783110883275-007"}
  review: kernel-checked
  note: "For every level r ≥ 2, qBiedenharnElliott hr (the pentagon identity of the quantum 6j symbols at q = e^{iπ/r}, in the form used by the Turaev–Viro state sum, LL-0031) is a theorem with no hypothesis. Route: the recoupling coefficient of the Temperley–Lieb model is the Kauffman–Lins coefficient at generic q (TemperleyLieb.Fc_eq_klCoef); with it the Temperley–Lieb pentagon gives the generic identity GenBE θ at every angle θ with sin(nθ) ≠ 0 for 1 ≤ n ≤ 2S + 4 (genBE_of_generic, S the sum of the nine arguments); these finitely many conditions hold on a punctured neighbourhood of π/r (eventually_sin_ne: at a zero of sin(nθ) the derivative n cos(nθ) does not vanish), and the limit θ → π/r gives the identity at the root of unity (qBiedenharnElliott_of_genBE). It contains the earlier cases r = 3 (qBiedenharnElliott_three) and r = 4, 5 (the task files Tasks/QU/T_QU1_P2.lean and T_QU1_P4.lean), which stay as they are. Checked: the statement is the existing qBiedenharnElliott hr, unchanged."
  since: unreleased
