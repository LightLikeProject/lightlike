- id: LL-0185
  title: The self-adjoint extension of the momentum on the unit interval with the boundary condition psi(1) = e^{i theta} psi(0) has the purely discrete spectrum theta + 2 pi Z, with the orthonormal eigenfunctions e^{i(theta + 2 pi n)x}
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/MomentumSpectrum.lean
  decls: [Lightlike.OperatorAlgebras.spectrum_momentumTheta, Lightlike.OperatorAlgebras.pointSpectrum_momentumTheta, Lightlike.OperatorAlgebras.momentumTheta_planeWave, Lightlike.OperatorAlgebras.orthonormal_planeWave, Lightlike.OperatorAlgebras.eigenvalue_momentumTheta, Lightlike.OperatorAlgebras.eigenvector_momentumTheta]
