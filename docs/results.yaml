- id: LL-0289
  title: The Turaev–Viro state sum at r = 3 is an invariant of closed combinatorial 3-manifolds up to PL homeomorphism
  area: TuraevViro
  file: Lightlike/TuraevViro/PLInvariance.lean
  decls: [Lightlike.TV.turaevViro3_plHomeomorphic]
  status: proven
  tier: established
  source:
    refs:
      - {ref: turaev-1994, location: "Chapter: Chapter VII. Simplicial state sums on 3-manifolds|10.1515/9783110883275-008"}
  review: kernel-checked
  note: "Let K and L be complexes on Complex3 with at least one tetrahedron each, K a closed combinatorial 3-manifold, whose generated simplicial complexes are PL homeomorphic. Then K and L have the same Turaev–Viro state sum at r = 3. Proof: Newman's theorem (PL homeomorphic implies stellar equivalent) and the ergodicity of the 2-3, 3-2, 1-4 and 4-1 moves on closed combinatorial 3-manifolds (moveEquiv3_lift_iff_stellarEquiv, which uses Pachner's theorem in dimension 3, on main), together with the invariance of the r = 3 state sum under the four moves (turaevViro3_move23 and turaevViro3_move14, and the inverse moves, which follow by composition), and under relabelling of the vertices, which the lifts to V ⊕ ℕ need. The statement is a consequence of the invariance in the book; the comparison with Turaev, Chapter VII, is pending (not read at the location). Limits: only r = 3; for r ≥ 4 the invariance under the moves is conditional on q-Biedenharn–Elliott (LL-0031). Nothing is claimed about the Ponzano–Regge amplitude: its regularised values are only included in one another along forward moves (TriangulationIndependence/Main.lean), so PL homeomorphism gives no equality there. Trust check: the boundary of the 4-simplex (5 tetrahedra) and of the 16-cell (16 tetrahedra) are PL homeomorphic and their r = 3 sums agree (turaevViro3_simplex4_cell16)."
  since: unreleased
- id: LL-0290
  title: "The large-spin asymptotics of Racah's alternating sum for the 6j symbol of a Euclidean tetrahedron, proved by the complex saddle-point method: the scaled sum minus cos(S_Regge + π/4)/(√(12π)(2π)²) tends to 0"
  area: PonzanoRegge
  file: Lightlike/Asymptotics/SaddleAssembly.lean
  decls: [Lightlike.Asymptotics.racahSumAsymptotics]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gurau-2008, location: "Theorem 1", check: "saddle"}
  review: kernel-checked
  note: "Statement RacahSumAsymptotics (Assembly.lean): for every Euclidean tetrahedron with integer edges j, √(√vol2(ℓ)) e^{-D(ℓ)} racahSum(λj) - cos(S_Regge(ℓ) + π/4)/(√(12π)(2π)²) → 0 as λ → ∞, with edge lengths ℓ_e = λ j_e + 1/2. The proof is by the contour integral and a descent contour through the saddle (not the real-variable Riemann-sum step of Gurau, which is not valid as stated, see the milestone SP2). Trust checks: the formula with only one of the two complex-conjugate saddles is false at the regular tetrahedron (not_racahSumAsymptotics_one_saddle_regular, RacahSaddles/OneSaddle.lean); the formula with phase 0 or -π/4 is false (SaddleAssemblyTests.lean). The comparison with Gurau (2008), Theorem 1, is pending: the paper was not read at the cited location. It is the input of the Ponzano–Regge formula LL-0030."
  since: unreleased
- id: LL-0291
  title: "The Lichnerowicz formula in a torsion-free skew frame on R^n: D^2 f = -sum of second covariant derivatives plus (s/4) f, with s the scalar curvature of the frame connection, given the pair symmetry and the first Bianchi identity of that curvature"
  area: GR
  file: Lightlike/Dirac/LichnerowiczGeneral.lean
  decls: [Lightlike.Dirac.lichnerowicz_general]
  status: conditional
  tier: established
  source:
    refs:
      - {ref: friedrich-kirchberg-2001, location: "eq. (11)", check: "Lichnerowicz"}
  review: kernel-checked
  hypotheses: [Lightlike.Dirac.CurvPairSymm, Lightlike.Dirac.CurvBianchi]
  note: "Conditional (inventory, 25 Nov 2026) on the pair symmetry and the first Bianchi identity of the frame curvature (hypotheses hP, hB: CurvPairSymm, CurvBianchi). Both are derived elsewhere on main: lichnerowicz_general' (Lightlike/Dirac/CurvatureSymmetry.lean) derives the pair symmetry from the Bianchi identity, and lichnerowicz_frame_general (Lightlike/Dirac/LichnerowiczFrame.lean) proves the same formula with neither hypothesis. It is not this entry's statement, because its conditions are stronger: a C² frame (not only differentiable), a frame linearly independent at x, and the skewness, bracket and torsion relations on a neighbourhood of x (not only at x). That theorem is left for a later entry of its own. Compared with Friedrich and Kirchberg, arXiv:math/0104121, the Schrödinger-Lichnerowicz formula (11), nabla*nabla = D^2 - R/4 (read; the formula is displayed in the proof of the Weitzenböck estimate, not at the start). Differences: REPRESENTATION, the statement is local, for V-valued C^2 functions on R^n with a Clifford representation (no spinor bundle, no spin structure), a torsion-free skew frame connection with structure functions and the Riemann pair and first Bianchi symmetries as hypotheses (the symmetries are not derived from torsion freeness), and it is pointwise at a point x, so it is not the global operator identity on a closed spin manifold. The Bochner Laplacian is the frame Hessian trace -sum hessF f x i i. Riemannian only: the metric is positive definite and the structure group is Spin(n); the Lorentzian case (Spin(1,3), time orientation) is not covered by this entry."
  since: unreleased
- id: LL-0292
  title: "Friedrich's eigenvalue bound on the round sphere in the stereographic chart: a nonzero compactly supported C^2 eigenspinor of the Dirac operator has lambda^2 at least n^2/4 (n at least 2)"
  area: GR
  file: Lightlike/Dirac/StereoFriedrich.lean
  decls: [Lightlike.Dirac.eigen_sq_ge_friedrich_stereo]
  status: proven
  tier: established
  source:
    refs:
      - {ref: friedrich-kirchberg-2001, location: "Section 0", check: "eigenvalue"}
  review: kernel-checked
  note: "Compared with Friedrich and Kirchberg, arXiv:math/0104121, Section 0 (Introduction), p. 1 (read): on a compact Riemannian spin manifold with scalar curvature R > 0 every Dirac eigenvalue satisfies lambda^2 >= n R0 / (4 (n-1)), R0 the minimum of R; for the unit sphere R = n (n-1), so the bound is n^2/4. WEAKER: the statement is for spinors in the stereographic chart (a Clifford representation, compactly supported C^2 functions on R^n, so vanishing near the north pole) and not for all eigenspinors of a closed spin manifold; the Dirac operator is the one of the chart metric (stereoF, stereoOmega). No equality case. Riemannian only: the metric is positive definite and the structure group is Spin(n); the Lorentzian case (Spin(1,3), time orientation) is not covered by this entry."
  since: unreleased
