- id: LL-0027
  title: The cutoff gauge-fixed Ponzano–Regge amplitude (spin 0 on the gauge set, finite cutoffs on the other edges) is unchanged along chains of 2-3, 1-4 and recut steps
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/GaugeFixed.lean
  decls: [Lightlike.PR.amplitudeGF_eqvGen, Lightlike.PR.amplitudeGF_eqvGen_tree]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2004, location: "Section III", check: "gauge"}
      - {ref: barrett-naish-guzman-2009, location: "§2.2.1", check: "Pachner moves"}
  review: kernel-checked
  note: An identity at finite cutoff. Independence of the gauge tree in general and removal of the cutoff are not proven. The gauge set is modelled on Freidel–Louapre's gauge fixing (Section III), with spin 0 on a tree; there is no dual tree. Barrett–Naish-Guzman is cited for the cutoff and the Pachner moves only; they do not read the cutoff as a gauge fixing.
  since: 0.1.0
