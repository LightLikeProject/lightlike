- id: LL-0411
  title: In every chart the Riemann tensor, the Ricci tensor and the scalar curvature of a Levi-Civita connection are the coordinate ones
  area: Spacetime
  file: Lightlike/Spacetime/Corners/ChartAgreement.lean
  decls: [Lightlike.riemann_coord_compW, Lightlike.ricciAt_coordW, Lightlike.scalarCurvatureAt_coordW]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (3.91)", check: "Ricci"}
  review: kernel-checked
  note: "For a locally smooth Levi-Civita connection of a nondegenerate metric on a manifold modelled on R^n (any model with corners, boundary included, derivatives within the range of the model), the components of the intrinsic curvature R(X,Y)Z = nabla_X nabla_Y Z - nabla_Y nabla_X Z - nabla_[X,Y] Z on the coordinate fields are the coordinate Riemann tensor of the chart metric at the chart image of the point, the intrinsic Ricci tensor Ric(Y,Z) = tr(X -> R(X,Y)Z) on coordinate fields is the coordinate Ricci tensor, and the intrinsic scalar curvature is the coordinate scalar curvature. Compared with Carroll, Lecture Notes on General Relativity, eq. (3.91) for the Ricci tensor, read at that location. KIND representation: in Carroll the coordinate formulas are the definitions; here the definitions are intrinsic (Connection.lean) and the theorems say they agree with the coordinate ones in every chart. This entry has no weaker difference: it holds for any model with corners (the boundaryless entry LL-0412 is the one restricted to models without boundary). The coordinate Riemann and scalar curvature formulas (3.67) and (3.92) are not recorded as verified locations in the registry, and the comparison with Wald, General Relativity, is pending. The hypotheses are a locally smooth connection with IsLeviCivita for the metric (existence and uniqueness: LL-0229); the metric may have any signature. The boundaryless version on Fin n -> R is Lightlike.riemann_coord_comp, ricciAt_coord and scalarCurvatureAt_coord, and the two agree (Corners/Bridge.lean)."
  since: unreleased

- id: LL-0412
  title: The curvature of a connection defined with extensions of tangent vectors does not depend on the extensions, and in a chart it is an expression in the Christoffel tensor and its derivative
  area: Spacetime
