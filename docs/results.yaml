  note: "For the translation group (U(t) psi)(x) = psi(x + t) on L^2(R) and psi in the domain of its generator, there are smooth compactly supported functions psi_n with psi_n -> psi and psi_n' -> i A psi in L^2, where A is the generator: C_c^infinity is a core, and the generator is the momentum operator -i d/dx. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Difference to be approved by a maintainer: the core property is stated through approximating sequences, not as the equality of the closure of the restriction with the generator."
