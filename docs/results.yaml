- id: LL-0428
  title: A gauge set of the 4D Ooguri model has E - V + 1 triangles - if the vertices, the edges and the triangles of T form a collapsible 2-complex, then the number of triangles of T is the number of edges minus the number of vertices plus one
  area: SpinFoam
  file: Lightlike/SpinFoam/Ooguri.lean
  decls: [Lightlike.SpinFoam.IsGauge.card_eq]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Compared with Freidel and Louapre (2003), Section IV.B (read): the paper fixes the 3D Ponzano-Regge model with a maximal tree of V - 1 edges (eqs. (52), (53)); the 4D gauge rule IsGauge and the count E - V + 1 of its triangles are the library's own analogue, not a statement of the paper. The count is the Euler characteristic of the collapsible complex gaugeCx K T, which is 1 (Collapsible.euler_eq), with the vertices counted with sign +, the edges -, the triangles +, so #T - #edges + #vertices = 1. The value E - V + 1 is the degree of divergence that Bonzom and Smerlak find for a triangulated 4-sphere (comparison pending for this sentence: Bonzom and Smerlak was not read here, the claim about their result is from the earlier inventory). Non-vacuity: gauge sets exist (isGauge_starK0, isGauge_T14, with ten and fourteen triangles; these are checked in the kernel in Tests.lean). The count for a given complex says nothing on whether the gauge-fixed state sum is finite."
