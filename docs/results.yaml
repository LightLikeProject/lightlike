- id: LL-0416
  title: The recoupling identity behind the 4D Pachner 3-3 move of the Ooguri model - the sum over the colours of the inner triangle and the three inner tetrahedra of the product of the three vertex amplitudes is the evaluation of a reduced spin network, and the reduced networks of the two sides agree
  area: SpinFoam
  file: Lightlike/SpinFoam/Move33.lean
  decls: [Lightlike.SpinFoam.Move33.inner_eq, Lightlike.SpinFoam.Move33.lhs_eq_ev_NL, Lightlike.SpinFoam.Move33.ev_NL_rev]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: ooguri-1992, location: "Abstract", check: "Alexander moves"}
      - {ref: perez-2013, location: "§6.1.3", check: "BF theory"}
  review: kernel-checked
  note: "Compared with Ooguri (1992), the part on the Alexander moves, eqs. (10) and (11) (read): the paper lists the basic moves of a four-dimensional complex (1 to 5, 2 to 4 and 3 to 3, and the reverses of the first two), says that the 15j symbols of the model can be written as sums of products of 6j symbols so that the Biedenharn-Elliott identity and the orthonormality of the 6j symbols show that the partition function is invariant up to a multiplicative factor, and then gives a different proof, writing the model as an integral over group elements on the tetrahedra whose spin sums over triangles produce delta functions (flat bundle); the divergent factor delta(1,1) of the 1-5 move is regularised by a cutoff on the spins, referring to another paper, and is not treated in detail. It does not display the identity of this entry. Representation: the identity here is the finite-cutoff recoupling form of the Biedenharn-Elliott step, with explicit cutoff inequalities; that form is the library's own. For each of the 20 cases c, with the inner triangle colour weighted by its dimension jA + 1, lhs_eq_ev_NL expresses the left side as the evaluation (NL c).ev of the reduced network once the cutoffs exceed the triangle inequalities (hypotheses h1, h2, hA, h3); inner_eq is the same for colourings of the vertex set V, and ev_NL_rev says (NL c).ev = (NL c.rev).ev (a gauge transformation and a relabelling). The 3-3 invariance of the state sum, LL-0049, is built from these. The networks are the library's own encoding (Recoupling.fifteenJSimplex_eq identifies the vertex amplitude with the 15j symbol). Checked in the kernel on 4-spheres (amplitudeGF_move33_example)."
  since: unreleased
