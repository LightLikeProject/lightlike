  note: "For a smooth metric g of any signature on R^4 whose Lie derivative vanishes along the three spatial translations and the three spatial rotations (checked on the coordinate basis fields), g_{0k} = 0, g_{ij} = a(t) delta_{ij} and g_{00} = b(t), with a and b functions of the time alone: the flat FLRW form with lapse b and scale factor a. Limits: only the flat case (k = 0); the curved cases (Killing fields of S^3 and H^3, classification of three-dimensional maximally symmetric spaces), the converse (the FLRW metric has these Killing fields) and the statement for isometry groups acting (not only infinitesimally) are follow-up tasks; the comparison with the source is pending and the location is the chapter."
