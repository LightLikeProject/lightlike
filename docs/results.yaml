      - {ref: livine-speziale-2007, location: "Abstract", check: "coherent states"}
  review: kernel-checked
  note: "For self-dual labels J, anti-self-dual labels K and group elements (g₊, g₋), cohInt4 J K g = ι⁺(g₊) ⊗ ι⁻(g₋) is invariant under the Spin(4) action ρ_J(h₊) ⊗ ρ_K(h₋) (cohInt4_invariant); the overlap is the product of the two SU(2) overlaps (inner_cohInt4); and Π_a (J_a + 1)(K_a + 1) ∫∫ |ι⁺ ⊗ ι⁻⟩⟨ι⁺ ⊗ ι⁻| = P_J ⊗ P_K for the product of the Haar measures (resolution_cohInt4). The statements are the Spin(4) form of LL-0472; compared at the abstract of Livine–Speziale only."
