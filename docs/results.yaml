  note: "Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): the paper remarks only that eq. (25) imposes a quantization condition on gamma because the labels j+ and j- are half-integers (pointing to an earlier paper); it does not state the set of admissible spins. The classification here (gamma J = p natural with J + p even; J = q t with (p + q) t even for gamma = p/q; only J = 0 for irrational gamma) is the library's own working-out of that remark. The set is determined by the requirement that j+ and j- are half-integers (isEPRLLabel_iff); the rational statement is for coprime p, q with 0 < p < q, and the irrational one shows that for irrational gamma the EPRL condition is empty except at J = 0. Hypotheses on gamma are stated in the Lean theorems. No unproved hypothesis."
