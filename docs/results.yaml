  note: "Conditional (inventory, 25 Nov 2026) on the Ricci identity for the frame Hessian (hypothesis hRicci, FrameRicciIdentity); R is any array with the Riemann symmetries hR1, hP, hB, which are part of the statement. For the curvature of the frame connection itself, lichnerowicz_general (LL-0291) uses ricci_identity in place of hRicci. GE5 (G1-017). In a frame with antisymmetric connection form ω, D²f = -Σᵢ ∇²f(eᵢ, eᵢ) + (s/4) f with s = Σ Rᵢⱼⱼᵢ, for a curvature with the Riemann symmetries. The Ricci identity (the antisymmetric part of the frame Hessian is the spinor curvature ¼ Σ Rᵢⱼₖₗ γₖγₗ acting on f) is a HYPOTHESIS here, not derived. Compare LL entry for lichnerowicz_general (torsion-free skew frame on ℝⁿ). Not covered: a spin manifold (spin structure, global Dirac operator) and the Lichnerowicz formula on it. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number). Riemannian only: the metric is positive definite and the structure group is Spin(n); the Lorentzian case (Spin(1,3), time orientation) is not covered by this entry."
