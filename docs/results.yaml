  review: kernel-checked
  note: "For a smooth metric on R^2 with nonzero determinant, the coordinate Ricci tensor is one half of the scalar curvature times the metric, so R^{ab} - R g^{ab}/2 = 0 and the first variation of the Einstein-Hilbert action vanishes for every perturbation of compact support (trust check of the Gauss-Bonnet theorem). Compared with D. Grumiller, W. Kummer and D. V. Vassilevich, Dilaton gravity in two dimensions (hep-th/0204253), section 1.2.2 (Two dimensions), eqs. (1.48)-(1.50), pp. 16-17 of the pdf: in D = 2 the curvature has one independent component, the Ricci scalar, and the Hilbert-Einstein action in two dimensions is a total divergence (Gauss-Bonnet, (1.50)): match (a total divergence has zero variation for perturbations of compact support). Limits: coordinates on R^2; the integral (1.50) over a closed surface is not proved."
