  note: "Curved slices, the curved case of LL-0221 (curved_flrw_of_killing): for every k, if the three spatial rotations and the curved translations P_m = (1 - k|x|^2/4) d_m + (k/2) x_m (x . d) are Killing on D_k = {1 + k|x|^2/4 > 0}, then on D_k g_{0k} = 0, g_{ij} = a(t) delta_{ij}/(1 + k|x|^2/4)^2 and g_{00} = b(t), with a and b functions of the time alone (isotropy at (t, 0), and the Killing equation integrated along rays from (t, 0), ray_relation). Limits: the Killing fields are given in the isotropic chart; the classification of three-dimensional maximally symmetric spaces and the statement for isometry groups are not here."
