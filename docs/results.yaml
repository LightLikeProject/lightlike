  source: structural
  review: kernel-checked
  note: "A cycle graph (CycleGraph) is a nonempty set of edges in which every vertex lies in exactly two edges and any two vertices are joined by a path of edges. Such a graph is reached from the boundary of a triangle by subdividing edges and their inverses (CycleGraph.isSphere1): a vertex with neighbours u and w is removed and the edge uw is added, which gives a smaller cycle graph unless u and w are adjacent, and then the graph is a triangle; the induction runs on the number of vertices. Subdividing an edge by a new vertex is a bistellar move (Move1, stellarEquiv_of_move1), so the generated complex is stellar equivalent to the boundary of a triangle, a PL 1-sphere (CycleGraph.isPLSphere, isPLSphere_closure_of_isSphere1). This is the one-dimensional case of the identification of the combinatorial 2-spheres of the Ponzano–Regge API with PL 2-spheres (isPLSphere_closure_of_isSphere2). Limits: the statement is for edge graphs of finite vertex sets in any type with decidable equality; it is a bridge between this library's graph-theoretic and PL definitions, not a new topological theorem. Check: the boundary of a triangle is a cycle graph (bdry1), and subdividing one of its edges gives a cycle graph with four vertices."
  since: 0.3.0
- id: LL-0141
  title: The triangles of a closed combinatorial surface generate a closed combinatorial 2-manifold
  area: Surfaces
  file: Lightlike/Surfaces/PLBridge.lean
  decls: [Lightlike.Surfaces.isCycleGraph_lk2, Lightlike.Surfaces.IsSurface.isClosedCombManifold]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "A closed combinatorial surface (IsSurface: every edge in two triangles, every vertex link connected, the 1-skeleton connected) generates a closed combinatorial 2-manifold in the sense of the PL area: the link of every vertex is a connected graph with two edges at every vertex (isCycleGraph_lk2), hence a PL 1-sphere by the previous entry (IsSurface.isClosedCombManifold). The edge counts come from the closedness condition by the bijection between the triangles through an edge and the edges of the vertex link. Limits: this is the direction from the surface conditions to the PL conditions; the converse, that a closed combinatorial 2-manifold has these properties, is not proved here. Check: the 6-vertex projective plane and the 9-vertex torus of the surface checks satisfy the hypothesis."
  since: 0.3.0
- id: LL-0142
  title: Stellar equivalent closed combinatorial surfaces are related by chains of 2D bistellar moves of their triangles
  area: Surfaces
  file: Lightlike/Surfaces/PLMoves.lean
  decls: [Lightlike.Surfaces.exists_move2, Lightlike.Surfaces.eqvGen_move2_of_stellarEquiv]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "A bistellar move κ(σ, τ) on the complex generated by the triangles L of a closed combinatorial 2-manifold has #σ + #τ = 4 and is one of the three kinds: a triangle is subdivided by a new vertex (sub13), an edge is flipped (flip22), or a vertex of degree three is removed (the inverse of sub13); in each case the generating triangles of the result are L with the corresponding move of the Ponzano–Regge API applied (exists_move2, eqvGen_bnew_sub, eqvGen_bnew_flip, eqvGen_bnew_unsub). By Pachner's theorem in the stellar form (LL-0023), closed surfaces whose complexes are stellar equivalent are therefore related by a chain of such moves on their triangles placed in V ⊕ ℕ, where the extra vertices are the new vertices of the moves (eqvGen_move2_of_stellarEquiv). This is the two-dimensional case of pachner3 for the 3D moves. The converse direction is stellarEquiv_of_eqvGen_move2. Limits: it applies to closed surfaces (IsSurface), through the identification of the previous entry; the triangles are placed in V ⊕ ℕ, and relabelling keeps the Euler characteristic and orientability (euler2_mapTri, isOrientable_mapTri_iff). Check: the theorem applies to the two certificate tori (TestsPL)."
  since: 0.3.0
- id: LL-0143
  title: Closed combinatorial surfaces are PL homeomorphic exactly when they have the same orientability and Euler characteristic
  area: Surfaces
  file: Lightlike/Surfaces/PLClassify.lean
  decls: [Lightlike.Surfaces.plHomeomorphic_iff, Lightlike.Surfaces.existsUnique_plHomeomorphic_stdModel]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9", check: "bistellar"}
      - {ref: moise-1977, location: "Chapter: The classification of compact connected 2-manifolds|10.1007/978-1-4612-9906-6_23"}
  review: kernel-checked
  note: "Two closed combinatorial surfaces L and L' on an infinite vertex type have PL homeomorphic generated complexes exactly when they are both orientable or both not and have the same Euler characteristic (plHomeomorphic_iff), and every closed surface is PL homeomorphic to exactly one standard model, a sphere with handles or a connected sum of projective planes (existsUnique_plHomeomorphic_stdModel). The PL statement comes from composing the PL form of Pachner's theorem (LL-0065, Lickorish Theorem 5.9) with the classification of closed surfaces up to 2D bistellar moves (the surface API, which classifies by orientability and Euler characteristic, in the sense of the chapter of Moise cited; the Surfaces proof is by moves and is not Moise's): a PL homeomorphism gives a bistellar equivalence (LL-0065), which is a chain of 2D moves on the triangles by the previous entry and so preserves orientability and Euler characteristic; conversely a chain of 2D moves from each surface to its standard model gives stellar equivalence (stellarEquiv_of_eqvGen_move2) and so a PL homeomorphism, with the two placements of the model related by relabelling. The vertex type is infinite as a hypothesis because the moves of a chain need new vertices. Limits: the statement is about the PL homeomorphism of the combinatorial realisations of closed surfaces; it does not say that a PL homeomorphism of such surfaces maps given triangulations in a particular way, and it is not the classification of topological surfaces. Differences from the cited sources: the PL homeomorphism is defined by a PL bijection of the realisations, not by a simplicial isomorphism of subdivisions as in Lickorish, and the equivalence of the two definitions is not formalised; Lickorish Theorem 5.9 has not been compared with the statement word for word, and the theorem number of the Moise chapter has not been verified (only the chapter is located). The comparison with the cited source is pending. Check: the 9-vertex torus and Möbius' 7-vertex torus, with no move between them given, are PL homeomorphic (T9_plHomeomorphic_T7); the torus is not PL homeomorphic to the projective plane, to the sphere or to the Klein bottle (TestsPL)."
  since: 0.3.0
- id: LL-0144
  title: Closed combinatorial surfaces are related by 2D bistellar moves to exactly one standard model, determined by orientability and Euler characteristic
  area: Surfaces
  file: Lightlike/Surfaces/Classify.lean
  decls: [Lightlike.Surfaces.classify, Lightlike.Surfaces.isSurface_iff_classify, Lightlike.Surfaces.classify_unique, Lightlike.Surfaces.exists_eqvGen_stdModel_iff]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "Every closed combinatorial surface (IsSurface) on an infinite vertex type is related by finitely many 2D bistellar moves and their inverses (Move2) to a placed standard model, a sphere with handles stdModel true g or a connected sum of k + 1 projective planes stdModel false k (classify, isSurface_iff_classify); the model is unique, because the moves preserve orientability and the Euler characteristic, which determine it (classify_unique, exists_eqvGen_stdModel_iff). This is the combinatorial form of the classification of compact connected 2-manifolds, which Moise states up to homeomorphism (Moise, chapter The classification of compact connected 2-manifolds, as cited for LL-0024); the statement and the proof here are about moves, by connected sums with the 6-vertex projective plane and the 9-vertex torus and Dyck's relation, and are not Moise's. The classification up to PL homeomorphism is the entry LL-0143. Limits: closed surfaces are finite sets of triangles with every edge in two triangles, every vertex link connected and the 1-skeleton connected; no boundary. Check: the 6-vertex projective plane, the 9-vertex torus and Möbius' 7-vertex torus are related to their standard models, and the Klein bottle, the sphere, a single triangle and two disjoint spheres are rejected as models of the torus (Surfaces/Tests.lean)."
  since: 0.3.0
- id: LL-0145
  title: A stellar subdivision is a PL homeomorphism, and the Euler characteristic is an invariant of stellar equivalence
  area: PL
  file: Lightlike/PL/Euler.lean
  decls: [Lightlike.PL.SComplex.StellarEquiv.euler_eq, Lightlike.PL.SComplex.not_stellarEquiv_of_euler_ne]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 4.5", check: "stellar"}
  review: kernel-checked
  note: "The Euler characteristic of a simplicial complex is unchanged by stellar subdivisions and welds, so by stellar equivalence (StellarEquiv.euler_eq, from the signed count of faces being unchanged by a stellar subdivision), and complexes with different Euler characteristics are not stellar equivalent (not_stellarEquiv_of_euler_ne). Together with Newman's theorem (LL-0064) this gives that realisations of complexes with different Euler characteristics, both or neither containing the empty face, are not PL homeomorphic (not_plHomeomorphic_of_euler_ne, Lightlike/PL/Newman.lean). The converse direction of Newman's theorem, that a stellar subdivision of a complex is PL homeomorphic to it by an explicit map, and so any chain of subdivisions and welds, is PLHomeomorphic.starAt and PLHomeomorphic.of_stellarEquiv (Lightlike/PL/StellarHomeo.lean), the easy half of Lickorish, Theorem 4.5. Limits: the Euler characteristic is the alternating count of nonempty faces for a complex with the empty face; the invariance is under stellar equivalence inside an unlimited supply of new vertices (StellarEquiv), not Lickorish's equivalence up to isomorphism, and the invariance of the Euler characteristic is not a statement of Lickorish Theorem 4.5. Differences from the cited source: the location of Theorem 4.5 was read, but its statement was not compared with the statement here word for word. The comparison with the cited source is pending. Check: the boundary of a tetrahedron and two disjoint 2-spheres, with Euler characteristics 2 and 4, are not stellar equivalent (not_stellarEquiv_tetrahedron_twoSpheres), the boundary of a triangle and the triangle are not PL homeomorphic (not_plHomeomorphic_boundary_simplex), and an edge and its subdivision at a new vertex are PL homeomorphic through the explicit map starMap (stellarEquiv_edge_edgeSub)."
  since: 0.3.0
- id: LL-0146
  title: The bracket of two smeared momentum constraints is the smeared constraint of the Lie bracket of the shifts
  area: Canonical
  file: Lightlike/Canonical/MomentumBracket.lean
  decls: [Lightlike.Canonical.bracket_momentum_momentum]
  status: proven
  tier: established
  source:
    refs:
      - {ref: thiemann-2007, location: "Chapter: Classical Hamiltonian formulation of General Relativity|10.1017/CBO9780511755682.005"}
  review: kernel-checked
  note: "{D[xi], D[eta]} = D[[xi, eta]] for smooth compactly supported shifts, smooth h and continuous pi, with D[xi] = integral of pi^ij (L_xi h)_ij and the bracket computed with Gateaux derivatives along compactly supported variations (the pi-gradient of D[xi] is L_xi h). Differences, approved by the maintainers (17 November 2026): (a) same setting as the source, (b) partial, (c) convention, (d) and (e) representation (compared with Thiemann, arXiv:gr-qc/0110034, §I.1.1, eqs. (I.1.1.27), (I.1.1.28), (I.1.1.36), (I.1.1.37) (the lecture-note version of the cited book); Hojman-Kuchar-Teitelboim 1976 has not been read): (a) C^infinity data and compactly supported test fields; (b) one global chart R^d, no manifold and no foliation; (c) units 16 pi G = 1 and the kinetic coefficient 1/(d-1) of the Hamiltonian density (1/2 for d = 3), which does not enter this bracket; (d) the momentum constraint in the Lie-derivative form, equal to the ADM form -2 xi_i pi^ij_|j by an integration by parts, formalised as `Lightlike.Canonical.momentumConstraint_eq_adm_of_smooth`; (e) the bracket is defined through pi-gradients and Gateaux derivatives, and the signs of the bracket and of the Lie bracket are fixed by admBracket and lieBracket. The result is partial until the hypersurface version (task F11) replaces the one global chart (b)."
  since: 0.3.0
- id: LL-0147
  title: The bracket of a smeared momentum constraint with a smeared Hamiltonian constraint is the Hamiltonian constraint smeared with the derivative of the lapse along the shift
  area: Canonical
  file: Lightlike/Canonical/HamiltonianBracket.lean
  decls: [Lightlike.Canonical.admBracket_momentum_hamiltonian]
  status: proven
  tier: established
  source:
    refs:
      - {ref: thiemann-2007, location: "Chapter: Classical Hamiltonian formulation of General Relativity|10.1017/CBO9780511755682.005"}
  review: kernel-checked
  note: "{D[xi], H[N]} = H[xi^k d_k N] for smooth compactly supported xi and N, smooth data with positive definite h, with the Hamiltonian density (tr (h pi h pi) - (tr h pi)^2/(d-1))/sqrt(det h) - sqrt(det h) R computed from the coordinate scalar curvature of the geometry API. The proof shows that the scalar curvature is a smooth function of the 2-jet of the metric, that it is covariant under the flow of xi (the library's finite pullback law), that the kinetic term is a scalar density, and differentiates the smeared constraint under the integral sign. Differences, approved by the maintainers (17 November 2026): (a) same setting as the source, (b) partial, (c) convention, (d) and (e) representation (compared with Thiemann, arXiv:gr-qc/0110034, §I.1.1, eqs. (I.1.1.27), (I.1.1.28), (I.1.1.36), (I.1.1.37) (the lecture-note version of the cited book); Hojman-Kuchar-Teitelboim 1976 has not been read): (a) C^infinity data, positive definite h and compactly supported test fields; (b) one global chart R^d, no manifold and no foliation; (c) units 16 pi G = 1 and the kinetic coefficient 1/(d-1) in dimension d (1/2 for d = 3), the one for which the algebra of the constraints closes; (d) the momentum constraint in the Lie-derivative form; (e) the bracket is defined through pi-gradients and Gateaux derivatives, and the signs of the bracket and of the Lie bracket are fixed by admBracket and lieBracket. A grid computation in dimension two (scripts/adm_algebra_check.py) agrees to three digits. The result is partial until the hypersurface version (task F11) replaces the one global chart (b)."
  since: 0.3.0
- id: LL-0148
  title: The dual of a connected colored graph is a normal pseudo-manifold
  area: GFT
  file: Lightlike/GFT/Dual.lean
  decls: [Lightlike.GFT.ColoredGraph.dual_isNormalPseudoManifold, Lightlike.GFT.ColoredGraph.dual_isSimplicial]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gurau-2010, location: "Theorem 2", check: "normal simplicial pseudo manifold"}
  review: kernel-checked
  note: "Gurau (2010), Theorem 2: any connected colored graph is dual to a normal simplicial pseudo-manifold. The dual Delta_G is built as a graded poset of pairs (S, B) of a set of colors and a bubble of the other colors, ordered by inclusion of the colors and reverse inclusion of the bubble, with the number of colors as rank, so that two simplices with the same vertex set stay distinct (as the source's multiset requires). For a connected graph of dimension D it is pure, non-branching (a simplex of rank D, the dual of a line, is a face of exactly two top simplices), strongly connected, and normal (the link of every simplex of rank at most D - 1 is a pseudo-manifold), and the lower interval of every simplex is the powerset of its colors (dual_isSimplicial), which is the simplicial structure. Limits: the vertex sets of the simplices are not part of the structure, so a simplicial complex in the sense of a set of vertex sets is not claimed (it fails already for the graph with two vertices and three lines); Theorem 1 (the link of a simplex is the dual of the bubble, as a colored graph) is not part of this entry. Comparison with the source: the statement of Theorem 2 and the definitions of its Section 2 were read in arXiv:1006.0714 (the proof was not compared). Differences from the source: (1) Gurau states a normal simplicial pseudo-manifold, a collection of subsets of a vertex set that may repeat (his eq. (21) is the graph with two vertices and four lines), while this entry states it for a graded poset with indexed simplices, with the simplicial property only as Boolean lower intervals; the two are not proved equivalent. (2) Gurau defines a pseudo-manifold as normal if all its links are pseudo manifolds; here normality is asked only for the links of simplices of rank at most D - 1 (links of dimension at least 1), so the links of the simplices of rank D (two points) and D + 1 (empty) are not required to be pseudo-manifolds, a range the source does not restrict. The maintainers approved both differences on 17 November 2026 as differences of representation (asking normality for the links of rank at most D - 1 is the standard definition); the agreement of the indexed form with the set-of-faces form when no simplices repeat is proved in Lightlike/GFT/DualVertexSets.lean (le_iff_vertexSet_subset_of_injective, vertexSetOrderIso)."
  since: 0.3.0
- id: LL-0149
  title: The link of a simplex of the dual of a colored graph is the dual of a bubble, as a colored graph
  area: GFT
  file: Lightlike/GFT/DualLink.lean
  decls: [Lightlike.GFT.ColoredGraph.linkIso, Lightlike.GFT.ColoredGraph.link_isDual_of_two_le]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gurau-2010, location: "Theorem 1", check: "link graphs"}
  review: kernel-checked
  note: "Gurau (2010), Theorem 1: the p-bubbles of a colored graph are the link graphs of the (n - p)-simplices of the gluing. For a simplex sigma = (S, B) of the dual Delta_G (a set S of colors and a bubble B of the other colors) the simplices that contain sigma are in order-preserving bijection with the simplices of the dual of the colored graph G' of the lines of the colors outside S restricted to B (ColoredGraph.restrict), by linkIso, and the bijection lowers the rank by the rank of sigma (linkIso_rk); link_isDual (a supporting lemma, for every simplex that does not have all colors, p >= 1) gives it with the colors outside S enumerated in increasing order, and link_isDual_of_two_le states it in the range of the source, at least two colors outside S (p >= 2). The bijection is built from the two maps linkTo and linkOf, inverse to each other, and the bubbles of the restricted graph are the bubbles of G (mem_bubble_restrict). Limits: the link is the set of simplices containing sigma with the induced order, as a graded poset; the vertex sets of the simplices are not part of the structure; the statement is for the colored graph restricted to a bubble, not for the stranded graph of Gurau's Section 3.1. Comparison with the source: the statement of Theorem 1 was read in arXiv:1006.0714, Section 5 (the proof was not compared). Differences from the source: Gurau states that for p >= 2 the p-bubbles are the link graphs (stranded graphs of his Section 3.1) of the (n - p)-simplices, an identification of graphs; this entry gives an order isomorphism between the link poset and the dual of the colored graph of the bubble, with no stranded graph, in the range p >= 2 that the source states. The maintainers approved this form on 17 November 2026, as a difference of representation. If stranded graphs are defined in the library, their equivalence with this form becomes a task."
  since: 0.3.0
- id: LL-0150
  title: Exterior Schwarzschild (the region r > 2M) is a vacuum solution on the manifold layer
  area: Spacetime
  file: Lightlike/Spacetime/SchwarzschildManifold.lean
  decls: [Lightlike.schwarzschild_coordMetric, Lightlike.schwarzschild_satisfiesEinstein, Lightlike.schwarzschild_ricci_eq_zero, Lightlike.schwarzschild_exists_vacuum_connection]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (7.29)", check: "Schwarzschild metric"}
  review: kernel-checked
  note: "The exterior region r > 2M only. The manifold form of LL-0005, through schwarzschild_coordMetric (in every chart the components of the manifold metric are the coordinate metric schMetric of LL-0005). The manifold is the chart domain r > 2M, 0 < theta < pi of the coordinates (t, r, theta, phi), with phi unrestricted, so it covers the exterior region with the axis removed and is not R x (2M, infinity) x S^2; there is no extension across r = 2M; signature is -+++. The vacuum equations and the vanishing of the Ricci tensor are proved for every C^infinity Levi-Civita connection of the metric; such a connection exists (the Levi-Civita connection of the metric is smooth). The differences listed here were approved on 17 November 2026. The comparison with Carroll's chapter 7 and with Wald's chapter 6 is pending: they were not read at the cited locations."
  since: 0.3.0
- id: LL-0151
  title: A limit of future causal curves with converging endpoints is a future causal curve, in one chart
  area: Spacetime
  file: Lightlike/Spacetime/CausalLadder/LimitCurve.lean
  decls: [Lightlike.Causal.exists_limit_curve]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "Around every point p of a Lorentzian manifold with a time orientation there is a neighbourhood W such that, for every compact K in the interior of W, future-directed causal curves with values in K whose initial points converge to x in K and whose final points converge to y in K (in the chart at p) have a future-directed causal curve from x to y (exists_limit_curve); hence y is in the causal future of x (exists_limit_mem_causalFuture). The proof reparametrises the chart images by a fixed linear functional that is nondecreasing along causal curves and controls the displacement (the chart cone estimate, exists_cone_estimate_curve), extracts a uniformly convergent subsequence by Arzela-Ascoli, and shows that the derivative of the limit lies in the closed future cone: the metric frozen at the point bounds the cone from one side (exists_functional_estimate), a uniform limit inherits the bound (functional_le_of_tendstoUniformlyOn), and the future causal cone is self-dual (IsLorentzianForm.futureCausal_of_forall_nonpos). The textbook statement is Hawking-Ellis, Lemma 6.2.1 (also Beem-Ehrlich-Easley, Theorem 3.31; Minguzzi, Lorentzian causality theory, Section 2.4). The comparison with the cited source is pending: the registry location is the chapter, and the lemma was not read there. Differences to be approved by a maintainer: (a) endpoint form, with converging endpoints, not a limit curve through a point of accumulation of an inextendible curve, so the inextendible form is not covered; (b) one chart and a compact subset of its domain, so no statement about curves leaving a chart; (c) the regularity class of causal curves is the library's (IsFutureCausalCurve: locally Lipschitz, with velocity in the future causal cone almost everywhere); (d) no Hausdorff or second countability hypothesis is needed. Check: the hypotheses hold for a constant sequence of constant curves, whose limit is a constant curve (exists_limit_curve_const); the hypotheses are not checked on a nonconstant example, and no wrong-model control is given. The result is partial: (a) and (b) are weaker forms of the source's statement; the full version, a limit curve through a limit point of future-inextendible causal curves across charts, is the task T-GE2-P20."
  since: 0.3.0
- id: LL-0152
  title: The Lie-derivative form of the smeared momentum constraint equals the ADM form with the covariant divergence of the momentum
  area: Canonical
  file: Lightlike/Canonical/MomentumADM.lean
  decls: [Lightlike.Canonical.momentumConstraint_eq_adm_of_smooth]
  status: proven
  tier: established
  source:
    refs:
      - {ref: adm-1962, location: "Section 4", check: "constraint"}
  review: kernel-checked
  note: "For smooth data with positive definite h and symmetric pi and a smooth compactly supported shift xi, the integral of pi^ij (L_xi h)_ij equals the integral of -2 xi_i pi^ij_|j with xi_i = h_ik xi^k and the covariant divergence of Lightlike.christoffel; pointwise the difference is 2 d_j (pi^ij xi_i), and the integral of a derivative of a compactly supported function is zero. The representation difference (d) of the CA1 brackets: approved by the maintainers as representation (17 November 2026). Same setting as the source; one global chart (b) as in the other CA1 results."
  since: 0.3.0
- id: LL-0153
  title: The bracket of two smeared Hamiltonian constraints is the smeared momentum constraint of the shift given by the inverse metric applied to the antisymmetrized derivatives of the lapses
  area: Canonical
  file: Lightlike/Canonical/HamiltonianHHBracket.lean
  decls: [Lightlike.Canonical.bracket_hamiltonian_hamiltonian_of_smooth]
  status: proven
  tier: established
  source:
    refs:
      - {ref: thiemann-2007, location: "Chapter: Classical Hamiltonian formulation of General Relativity|10.1017/CBO9780511755682.005"}
  review: kernel-checked
  note: "{H[N], H[M]} = D[Y] with Y^i = h^ij (N d_j M - M d_j N) for smooth compactly supported N and M, smooth data with positive definite h and symmetric pi, in dimension d at least 2, with the Hamiltonian density (tr (h pi h pi) - (tr h pi)^2/(d-1))/sqrt(det h) - sqrt(det h) R, D[xi] the integral of pi^ij (L_xi h)_ij, and the bracket computed with Gateaux derivatives along compactly supported variations. The proof differentiates the first-order form of H[N] along M times the pi-gradient of H[M], antisymmetrizes, and reduces the remaining coefficient to -2 times the covariant divergence of pi by an index computation with the Christoffel symbols; the ADM form of the momentum constraint closes the argument. Compared with Thiemann, arXiv:gr-qc/0110034, sec. I.1.1, eq. (I.1.1.37) (the lecture-note version of the cited book), same signs and structure function; Hojman-Kuchar-Teitelboim 1976 has not been read. Differences, approved by the maintainers (17 November 2026): (a) same setting as the source; (b) partial: one global chart R^d, no manifold and no foliation (task F11); (c) convention: units 16 pi G = 1 and the kinetic coefficient 1/(d-1); (d) representation: D[xi] in the Lie-derivative form, equal to the ADM form by Lightlike.Canonical.momentumConstraint_eq_adm_of_smooth; (e) representation: the bracket through pi-gradients and Gateaux derivatives. The result is partial until the hypersurface version (task F11) replaces the one global chart (b)."
  since: 0.3.0
- id: LL-0154
  title: The chronological future of a point lies in its causal future, the causal future contains the point, and both relations are transitive
  area: Spacetime
  file: Lightlike/Spacetime/Causal/BasicRelations.lean
  decls: [Lightlike.Causal.chron_subset_causal, Lightlike.Causal.self_mem_causalFuture, Lightlike.Causal.causal_trans, Lightlike.Causal.chron_trans]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "On a Lorentzian manifold with a time orientation, I+(x) is the set of end points of future-directed timelike curves from x and J+(x) that of future-directed causal curves (IsFutureCausalCurve: locally Lipschitz, with velocity in the future causal cone almost everywhere). A timelike curve is causal (chron_subset_causal); the constant curve is causal, so x lies in J+(x) (self_mem_causalFuture); joining curves end to end makes J+ (causal_trans) and I+ (chron_trans) transitive. The comparison with the cited source is pending: the registry location is the chapter, and the statements were not read there. Differences to be approved by a maintainer: (a) the time orientation is a continuous timelike vector field, not a continuous choice of future cone; (b) the regularity class of curves is the library's."
  since: 0.3.0
- id: LL-0155
  title: A causal spacetime is chronological, and a strongly causal spacetime is causal
  area: Spacetime
  file: Lightlike/Spacetime/Causal/BasicRelations.lean
  decls: [Lightlike.Causal.chronological_of_causal, Lightlike.Causal.causal_of_stronglyCausal]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "Chronological: no x lies in I+(x). Causal: y in J+(x) and x in J+(y) imply x = y. Strongly causal: every neighbourhood of a point contains a causally convex neighbourhood, one that contains every causal curve with both end points in it. A closed timelike curve through x passes through a point other than x, so a causal spacetime is chronological (chronological_of_causal); a strongly causal spacetime whose points are closed (T1) is causal (causal_of_stronglyCausal). These are two steps of the causal ladder. The comparison with the cited source is pending: the registry location is the chapter, and the statements were not read there. Differences to be approved by a maintainer: (a) the time orientation is a continuous timelike vector field; (b) the regularity class of curves is the library's; (c) the T1 hypothesis, which a Hausdorff space-time satisfies."
  since: 0.3.0
- id: LL-0156
  title: A spacetime with a time function is strongly causal
  area: Spacetime
  file: Lightlike/Spacetime/CausalLadder/StrongCausality.lean
  decls: [Lightlike.Causal.isStronglyCausal_of_isStablyCausal_aux]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "If a Hausdorff time-oriented Lorentzian manifold has a time function (a continuous function strictly increasing along future causal curves between distinct points), it is strongly causal. The library defines stable causality (IsStablyCausal) as the existence of a time function. The proof uses the chart cone estimate (exists_cone_estimate_curve). The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Differences to be approved by a maintainer: (a) stable causality originally means that causality survives small widenings of the light cones; its equivalence with the existence of a time function (Hawking, 1969) is not formalised, so the statement covers the source's theorem only through that equivalence; (b) the time orientation and curve class of the basic relations. The result is partial because of (a): the full version needs the equivalence, which is not yet a task."
  since: 0.3.0
- id: LL-0157
  title: A globally hyperbolic spacetime without boundary is causally simple
  area: Spacetime
  file: Lightlike/Spacetime/CausalLadder/GlobHypSimple.lean
  decls: [Lightlike.Causal.isCausallySimple_of_isGloballyHyperbolic_boundaryless]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "Globally hyperbolic: strongly causal, with compact causal diamonds J+(x) and J-(y) intersected. Causally simple: causal, with closed J+(x) and J-(x) for every x. On a Hausdorff manifold without boundary, global hyperbolicity implies causal simplicity. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. The no-boundary hypothesis (BoundarylessManifold) is approved by the maintainers as a change that makes the statement match its source, which takes space-time without boundary (18 November 2026). Differences to be approved by a maintainer: the time orientation and curve class of the basic relations."
  since: 0.3.0
- id: LL-0158
  title: A Cauchy surface is achronal
  area: Spacetime
  file: Lightlike/Spacetime/Causal/Extension.lean
  decls: [Lightlike.Causal.IsCauchySurface.isAchronal_of_boundaryless]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "A Cauchy surface is a set that every inextendible future-directed timelike curve meets exactly once; achronal means that no two of its points are joined by a timelike curve. On a Hausdorff, second countable manifold without boundary every Cauchy surface is achronal: a timelike curve between two of its points extends to an inextendible timelike curve (exists_inextendible_of_timelike), which would meet the surface twice. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. The no-boundary and second-countability hypotheses are approved by the maintainers as changes that make the statement match its source, which takes space-time connected, Hausdorff, paracompact and without boundary (18 November 2026). Differences to be approved by a maintainer: (a) the definition of a Cauchy surface through timelike curves met exactly once is one standard form, and its agreement with the source's definition is not checked; (b) the time orientation and curve class of the basic relations."
  since: 0.3.0
- id: LL-0159
  title: In Minkowski space the causal future of a point is its closed future light cone
  area: Spacetime
