- id: LL-0431
  title: "The EPRL map V_j → V_{j₊} ⊗ V_{j₋} (j = j₊ + j₋) is unique up to a scalar among the SU(2)-equivariant maps, and its image is the eigenspace of the diagonal Casimir with the eigenvalue of spin j"
  area: Spin4
