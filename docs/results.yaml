  note: "The same statement as LL-0126 (stationary_phase, on EuclideanSpace R^n) for functions on the product type Fin n -> R, with Mathlib's Lebesgue measure on the product. Hypotheses: phi smooth with Im phi >= 0 on the support of the smooth compactly supported amplitude a; the critical points in the support (Im phi = 0 and d phi = 0) form a finite set K and are nondegenerate (det(-i H) not zero); critical points on the boundary of the support are allowed, where a is flat. The square root is invSqrtDet, the product of the principal roots of the eigenvalues of -iH, not the principal root of the determinant. Comparison with Hörmander, ALPDO I, Theorem 7.7.5 pending: the book was not read at the theorem; the registry verifies only the chapter. The Fresnel integral check is fresnel_bump (QuadraticPhaseTests.lean); the wrong-model check, that a degenerate phase i x^4 changes the order so the non-degeneracy hypothesis cannot be dropped, is stationary_phase_needs_nondegenerate (StationaryPhaseTests.lean)."
