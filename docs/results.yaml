  tier: established
  source:
    refs:
      - {ref: weinberg-1995, location: "Chapter: RELATIVISTIC QUANTUM MECHANICS|10.1017/CBO9781139644167.004"}
  review: kernel-checked
  note: "HA6 (G1-055), the lockable statement of the milestone. WignerClassification is a Prop, NOT proved: every such representation is trivial on the translations, or equivalent to a massive poincareRep, or to a massless finite-helicity lightPoincareRep, or massless of infinite spin (MasslessNotHelicity). Its proof needs Mackey's imprimitivity theorem; isSystemOfImprimitivity_inducedL2 (Imprimitivity.lean) is one ingredient. Non-vacuity: trivialRep_classified (the trivial representation falls in the first case). The statement uses the library's own definitions of equivalence and positive energy; comparison with Weinberg and Wigner pending (not read). Compared with Wigner, Ann. Math. 40 (1939) 149-204, Section 7B, p. 198, The final result (read): the classes P_+^j (P > 0, j = n/2: EquivMassive with P = m²), 0_+^s (s = h/2, an integer or half-integer of either sign or zero: EquivMassless) and 0_+(Xi), 0'_+(Xi) (continuous spin, Xi > 0, single or double valued: MasslessNotHelicity) are the positive-energy classes; the class 0_0 (every translation trivial) and the class P < 0 are 'not determined' there; the negative-energy classes P_-, 0_- and the space-like class are excluded here by positive energy. The first case of the statement is Wigner's 0_0. Differences: (1) the continuous-spin classes are given only negatively (not a helicity representation), so for the massless part the statement says only that the spectrum lies in the light cone; (2) only completeness is stated: that each listed representation is irreducible is LL-0310 and LL-0311, and that different parameters give inequivalent representations is not stated; (3) Weinberg, QFT I, Section 2.5, was not read: that comparison is pending."
