  status: proven
  tier: established
  source: pending
  review: kernel-checked
  note: "PARTIAL step toward the Plancherel formula of SL(2,R) (layer 1 of three): only the K-types (l, r) of radial generators G (functions of the hyperbolic distance, G o cosh), by induction on l from the K-types (r, 0) (the earlier entry on the K-types (l, 0), base l = 0 through the change of variables v = cosh xi, Nform_zero). The step is N_{l+1,r}(F,F) = N_{l,r}(F, QF) + l (l+1) N_{l,r}(F,F) (Nform_succ): adjointness of the ladder operators on [a, B] (ladder_adjoint_boundary), the Casimir factorisation ladDown (l+1) r (ladUp l r F) = Cas + l (l+1) (ladDown_ladUp_local), the Casimir on the ladder images of a radial function is the radial Laplacian of the generator (radialCasimir_hLR), the boundary term at a to 0 vanishing since the closed form sinh^(l+r) u_l(cosh) is continuous on all of R (the ladder images vanish to order l + r at xi = 0) and the one beyond the support vanishing, then polarisation with (QF)^ = (1/4 + rho^2) F^ as in the K-types (l, 0). The weight is multiplied by (l+1/2)^2 + rho^2. No source states the formula in this form; the ladder factors are those of Kitaev arXiv:1711.08169 eq. (60) (read, as in the entry on the K-types (l, 0)); comparison with Lang or Knapp pending. NOT proved: the sum over all K-types (l, r) to the Plancherel formula on L2(SL(2,R)) (layer 2) and the discrete series terms (layer 3), so the full Plancherel formula is still open."
