- id: LL-0182
  title: The Cardy asymptotics of the integrated spectral density with relative error O(Δ^{-1/2}) from modular invariance (Mukhametzhanov–Zhiboedov)
  area: Asymptotics
  file: Lightlike/Asymptotics/Tauberian/CardyRelative.lean
  decls: [Lightlike.Tauberian.cardy_mz]
  status: proven
  tier: established
  source:
    refs:
      - {ref: mukhametzhanov-zhiboedov-2019, location: "eq. (1.8)"}
  review: kernel-checked
  note: "For a positive measure σ (the spectrum in the variable x = Δ - c/12, v = c/12) whose Laplace transform Z(β) = ∫ e^{-βx} dσ is finite for β > 0, invariant under z ↦ 4π²/z for Re z > 0 (MZ (2.2)), and satisfies |Z(β) - e^{a/β}| ≤ C e^{(a-g)/β} for real 0 < β < β₀ (a = 4π² v = π² c/3, g > 0), the integrated density F(Δ) = σ(-∞, Δ - v] satisfies |F(Δ) · 2π (cΔ/3)^{1/4} e^{-2π√(cΔ/3)} - 1| ≤ K Δ^{-1/2} for large Δ (cardy_mz), i.e. MZ (1.8). cardy_counting (CardyCounting.lean) is the intermediate form |σ(-∞, x] - I₀(2√(a x))| ≤ K x^{-3/4} e^{2√(a x)}, I₀(s) = (1/π) ∫₀^π e^{s cos θ} dθ. Compared with the source at eq. (1.8) and (2.2)-(2.4) (read 19 November 2026). Representation difference (reported to the maintainers, decision pending): a positive measure in the shifted variable instead of the density ρ(Δ) = Σ δ(Δ - Δ_O). The high-temperature hypothesis is assumed only for real β (MZ: |β| → 0 with Re β > 0), which is a weaker hypothesis. Route: MZ's Sections 3-5 with a pole-free smoothing in place of the contour functional (docs/notes/sp3-full-strength-attempts.md, attempt D). Non-vacuity: σ = δ_{-v} + ρ₀ (CardyExample.lean). Difference recorded for the milestone item on the Tauberian theorem (owner decision D14 = (A)): MZ (1.8) assumes modular invariance; the general-measure form, a positive measure whose Laplace transform only satisfies L(β) ~ e^{a/β}, is false (Bringmann–Jennings-Shaffer–Mahlburg, arXiv:1910.03036, Section 3.2); the sector-bound form of Ingham's theorem (their Theorem 4.1) is open (docs/notes/sp3-tauberian-backlog.md)."
  since: unreleased
- id: LL-0183
  title: For a finite quantum system with Hamiltonian H, a state is KMS at inverse temperature beta iff it is the Gibbs state e^{-beta H} / tr e^{-beta H}
  area: OperatorAlgebras
