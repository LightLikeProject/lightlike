- id: LL-0525
  title: For any non-degenerate metric on a manifold modelled with corners, the curvature of a Levi-Civita connection satisfies the first Bianchi identity and the pair symmetry, and the Ricci tensor is symmetric, without a Hausdorff hypothesis
  area: Spacetime
