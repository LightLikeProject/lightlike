# Registry of headline results with stable IDs.
#
# Rules (checked by `scripts/api_map.py check`):
# - IDs are `LL-` and four digits, assigned in increasing order, never reused or renumbered.
# - A result that is withdrawn keeps its entry, with `status: retired` and a `note` saying why.
# - `decls` are full Lean names; each must exist in `file` (checked by `scripts/NameCheck.lean`).
# - `status` is `proven` (no hypotheses beyond the statement's own), `conditional` (the listed
#   `hypotheses`, Lean propositions, are assumed), `stated` (the statement is defined, not proven)
#   or `retired`.
# - `area` is a folder of `Lightlike/` with an `API-map.md`.
# - `tier` is `established`, `frontier` or `exploratory` (defined in docs/RESULTS.md); an exploratory
#   result lives in an `Exploratory/` folder.
# - `source` is `{refs: [{ref, location, check}]}` with keys of docs/tasks/sources.yaml and a
#   location verified by `scripts/sources.py verify`, or the label `structural` or `exploratory`
#   (checked by `scripts/sources.py check`).
# - `review` is `kernel-checked` or `human-reviewed` (with `review_ref`: the issue where an
#   expert left the review).
# docs/RESULTS.md is generated from this file: `python3 scripts/api_map.py generate`.

