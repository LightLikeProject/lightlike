  area: SpinFoam
  file: Lightlike/SpinFoam/Move15Global.lean
  decls: [Lightlike.SpinFoam.Move15.amplitudeGF_move15, Lightlike.SpinFoam.Move15.isGauge_move15, Lightlike.SpinFoam.Move15.amplitudeGF_move15_gauge, Lightlike.SpinFoam.Move15.amplitudeGF_move51_gauge]
