  title: "Anti-de Sitter space is conformal to a region of the Einstein static universe: with tan θ the radial coordinate, its metric is cos⁻²θ (−dτ² + dθ² + sin²θ dΩ²) on 0 ≤ θ < π/2, and the boundary θ = π/2 carries the metric −dτ² + dΩ²"
