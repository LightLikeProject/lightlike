  note: "On R^(d+1) with the Minkowski form eta = diag(-1, 1, ..., 1) and the time orientation of the first coordinate, J+(x) is the set of y with (y - x)_0 >= 0 and eta(y - x, y - x) <= 0. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Difference to be approved by a maintainer: the curve class of the basic relations; the signature is the library's (-, +, ..., +)."
