- id: LL-0438
  title: Stone's theorem, existence - every self-adjoint operator on a complex Hilbert space is the generator of a strongly continuous one-parameter unitary group, the strong limit of the groups generated by its Yosida approximants
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/YosidaLimit.lean
  decls: [Lightlike.OperatorAlgebras.generator_stoneGroup]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
      - {ref: moretti-2016, location: "Theorem 142, p. 83", check: "Stone"}
  review: kernel-checked
  note: "Compared with Moretti (2016), Theorem 142 and the paragraph before it (read): for a self-adjoint A the paper says that U_t = e^{itA} is a strongly continuous one-parameter unitary group, 'as one easily proves using the functional calculus'; Theorem 142(a) gives the unique self-adjoint generator with U_t = e^{-itA}. The library's construction of the group as the strong limit of the groups of the Yosida approximants does not use the functional calculus and is not in the paper (Hall 2013, cited at chapter level, was not compared). For a self-adjoint A (IsSelfAdjoint A: dense domain and A equal to its adjoint) the group stoneGroup is built as the strong limit of exp(i t A_n) for the Yosida approximants A_n, and its generator is A (generator_stoneGroup); the other directions are LL-0163 (the generator of a group is self-adjoint) and LL-0164 (uniqueness). Difference to be approved by a maintainer (convention, as in LL-0163): the library's generator is -i d/dt U(t) at 0, with U(t) = exp(itA), the negative of Moretti's (U(t) = exp(-itA))."
  since: unreleased
