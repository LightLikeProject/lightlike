  note: "GE7 (G1-016). Compared with Aharony, Gubser, Maldacena, Ooguri and Oz, Large N Field Theories, String Theory and Gravity (hep-th/9905111), Section 2.2.1, eqs. (2.23)-(2.25) and the text after them, on the arXiv text: with tan θ = sinh ρ (0 ≤ θ < π/2) the global AdS metric is R²/cos²θ (-dτ² + dθ² + sin²θ dΩ²) (2.24), multiplied by R⁻² cos²θ it is the Einstein static universe metric (2.25), and AdS is conformally mapped to one half of the Einstein static universe, with the boundary at θ = π/2. The Lean coordinates are the same (r = tan θ with r = sinh ρ in the global metric -(1 + r²)dτ² + (1 + r²)⁻¹dr² + r²dΩ²), with R = 1. Blau, Lecture Notes on General Relativity (not a registered source), Section 39.3.2, eqs. (39.79)-(39.86) of the 24 November 2026 version, gives the same formulas and states that the boundary θ = π/2 is timelike with metric -dτ² + dΩ² (the boundary metric of ads_boundary_metric). The conformal action of SO(2,3) on the boundary is NOT proved here."
