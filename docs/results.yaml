- id: LL-0046
  title: The Lorentzian EPRL vertex amplitude is finite for every Immirzi parameter, all spins and every coefficient array
  area: Lorentz
  file: Lightlike/Lorentz/EPRL.lean
  decls: [Lightlike.Lorentz.integrable_eprlIntegrand, Lightlike.Lorentz.lintegral_enorm_eprlIntegrand_lt_top, Lightlike.Lorentz.eprlVertex_eq_integral, Lightlike.Lorentz.integrable_linkProd_inner]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Abstract", check: "Lorentzian"}
      - {ref: engle-pereira-2009, location: "Section 4", check: "finiteness"}
  review: kernel-checked
  note: Labels k = j and ρ = γ(j + 1), in Ding and Rovelli's form; Engle–Pereira's ρ = γj in this normalisation (ρ = 2γj in theirs). One of the five integrations is dropped (V₄ = 1), as in Engle–Pereira. The coefficients are arbitrary arrays, contracted without the ε twist on the bra legs, so invariant intertwiners are covered as special arrays, but equality with Engle–Pereira's amplitude on invariant intertwiners is not proven. The proof uses only the decay of the vectors, so finiteness holds for every choice of labels. Non-vacuity is shown at spin 0 for γ in some neighbourhood of 0. The amplitude is defined up to the normalisation of the Haar measure.
  since: unreleased
- id: LL-0047
  title: The large-spin asymptotic formula of the Euclidean EPRL vertex amplitude in coherent boundary states
  area: Asymptotics
  file: Lightlike/Asymptotics/EPRL/Formula.lean
  decls: [Lightlike.Asymptotics.EPRL.Coh15jAsymptoticFormula, Lightlike.Asymptotics.EPRL.EPRLAsymptoticFormula]
  status: stated
  tier: frontier
  source:
    refs:
      - {ref: bdfgh-2009, location: "Section 4", check: "Asymptotic formula"}
  review: kernel-checked
  note: The proof target, stated as two propositions; their proofs are open. For a nondegenerate 4-simplex, spins proportional to its triangle areas with an even spin sum at every node, and a nonsingular Hessian at both critical points, the coherent 15j integral over SU(2)^5 in the Regge boundary state is (2π/λ)^6 2^4 (4π)^-8 (e^(iλS) A₊ + e^(-iλS) A₋) + O(λ^-7), with S the Regge action Σ (n_e/2) Θ_e (Coh15jAsymptoticFormula). The EPRL form, for 0 < γ < 1, has four terms with phases ±S and ±γS and remainder O(λ^-13) (EPRLAsymptoticFormula); it follows from two instances of the 15j form by Fubini, as in Barrett–Fairbairn–Hellmann. Equality of the coherent integral with eprlVertex on Livine–Speziale intertwiners is not proven, and the nonsingular Hessian is a hypothesis, as in Barrett et al. The hypotheses hold at the regular 4-simplex (regular_coh15j_hyps, regular_eprl_hyps). Checked numerically against the exact integral at the regular 4-simplex.
  since: unreleased
