- id: LL-XXXX-j
  title: The generator of a strongly continuous one-parameter unitary group is self-adjoint
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneGenerator.lean
  decls: [Lightlike.OperatorAlgebras.UnitaryGroup.generator_isSelfAdjoint]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_9"}
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
  review: kernel-checked
  note: "For a strongly continuous one-parameter group of unitaries U(t) on a complex Hilbert space, the generator A psi = -i d/dt U(t) psi at t = 0, on the vectors where the derivative exists, is self-adjoint: A is contained in its adjoint and its adjoint in A. This is one direction of Stone's theorem; the converse, that every self-adjoint operator generates such a group, is the task T-OP1-P2. The comparison with the cited source is pending: the registry locations are the chapters, and the statement was not read there. Difference to be approved by a maintainer: the sign convention U(t) = exp(itA) is the library's."
  since: unreleased
- id: LL-XXXX-k
  title: Two strongly continuous one-parameter unitary groups with the same generator are equal
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneUnique.lean
  decls: [Lightlike.OperatorAlgebras.UnitaryGroup.eq_of_generator_eq]
