- id: LL-0168
  title: Every complex inner product space has a Fock representation of the Weyl relations
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/FockExists.lean
  decls: [Lightlike.OperatorAlgebras.fockRepOf]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bratteli-robinson-1997, location: "Chapter: Continuous Quantum Systems. I|10.1007/978-3-662-03444-6_2"}
  review: kernel-checked
  note: "For a complex inner product space h, fockRepOf h is a Fock representation: Weyl unitaries W(f) satisfying the Weyl relations, with a unit vector Omega that is cyclic for them and has <Omega, W(f) Omega> = exp(-|f|^2 / 4). The Hilbert space is the reproducing kernel Hilbert space of the Fock kernel (Mathlib's RKHS.OfKernel). The representation difference is approved by the maintainers (18 November 2026): a Fock representation is characterised by its cyclic vacuum and vacuum expectation, not built on the symmetric Fock space; any two such representations are unitarily equivalent (uniqueness of the Fock representation). The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there."
  since: 0.3.0
- id: LL-0169
  title: Any two Fock representations of the Weyl relations are unitarily equivalent
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/FockUnique.lean
  decls: [Lightlike.OperatorAlgebras.fockUnitary_spec]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bratteli-robinson-1997, location: "Chapter: Continuous Quantum Systems. I|10.1007/978-3-662-03444-6_2"}
  review: kernel-checked
  note: "For two Fock representations R on K1 and S on K2 (complete) of the same complex inner product space, the unitary fockUnitary R S from K1 onto K2 maps the vacuum to the vacuum and intertwines the Weyl unitaries. The map W(f) Omega to W(f) Omega' is well defined and norm preserving on the dense span of these vectors and extends to a unitary. The representation difference of the existence of a Fock representation is approved by the maintainers (18 November 2026). The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there."
  since: 0.3.0
- id: LL-0170
  title: The Morse lemma with parameters, with its diagonal normal form (a generalisation of Milnor's Morse lemma)
  area: Asymptotics
  file: Lightlike/Asymptotics/MorseLemma.lean
  decls: [Lightlike.Morse.morse_lemma_with_parameters, Lightlike.Morse.morse_coordinates, Lightlike.Morse.morse_diagonal, Lightlike.Morse.not_hasDiagonalMorseChart_cube]
  status: proven
  tier: established
  source:
    refs:
      - {ref: milnor-1963, location: "Chapter: PART I. NON-DEGENERATE SMOOTH FUNCTIONS ON A MANIFOLD|10.1515/9781400881802-002"}
      - {ref: benedetti-2019, location: "Theorem 1.13", check: "Morse Lemma"}
  review: kernel-checked
  note: "A smooth function f of a variable x in a finite-dimensional real normed space E and a parameter l, with a critical point at x = 0 for every l near l0 and a nondegenerate Hessian at (0, l0), is f(0, l) plus the sum of w_i y_i^2, w_i = plus or minus one, in coordinates (y, l) that are a smooth local diffeomorphism of (x, l) near (0, l0). The number of negative signs is the Morse index (the largest dimension of a subspace on which the Hessian is negative definite). The function x^3 at 0 has no such chart. The parametric form generalises the Morse lemma as stated in Benedetti, Lectures on Differential Topology (arXiv:1907.10297), Theorem 1.13, p. 34 (read): a nondegenerate critical point 0 of index lambda of f with f(0) = 0 has a local diffeomorphism x = phi(u), phi(0) = 0, with f(phi(u)) = u^t I_{n,lambda} u; at a fixed parameter ours is that statement, with the index the number of negative signs. Milnor's book (the same lemma, Part I) was not opened. Limits: f is smooth on the whole of E times F; the critical point is at x = 0; the index is not shown to equal the number of negative eigenvalues for an inner product."
  since: unreleased
- id: LL-0171
  title: The Lie derivative of a metric along a vector field equals the symmetrised covariant derivative of the field for the Levi-Civita connection, so Killing fields are those with vanishing Lie derivative
  area: Spacetime
  file: Lightlike/Spacetime/LieMetric.lean
  decls: [Lightlike.lieDerivMetric_eq_of_isLeviCivita, Lightlike.isKillingAt_iff_lieDerivMetric_eq_zero]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (5.42)", check: "Killing"}
  review: kernel-checked
  note: "For a metric g of any signature and a torsion-free connection compatible with g, X(g(V, W)) - g([X, V], W) - g(V, [X, W]) = g(nabla_V X, W) + g(V, nabla_W X) at every point where the fields are differentiable; hence the pointwise Killing equation holds at x iff the Lie derivative of g along X vanishes on all fields differentiable at x. Limits: pointwise statement only, no flows or isometries; not the Lie derivative of general tensors; the flow characterisation of Killing fields (Carroll (5.39)-(5.40)) is not covered. Compared with Carroll's lecture notes (gr-qc/9712019), eq. (5.33), p. 138 (the Lie derivative of the metric is 2 nabla_(mu V_nu)) and eqs. (5.41)-(5.42), p. 140 (Killing's equation): match; ours is pointwise, for the Levi-Civita connection of a metric of any signature."
  since: unreleased
- id: LL-0172
  title: The bracket of two Killing fields of a metric of any signature is a Killing field
  area: Spacetime
  file: Lightlike/Spacetime/KillingAlgebra.lean
  decls: [Lightlike.IsKillingNear.lieBracket, Lightlike.lieDerivMetric_lieBracket]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (5.46)", check: "commutator"}
  review: kernel-checked
  note: "If X and Y are smooth near x and the Lie derivative of g along each vanishes near x on all fields smooth near x, then so does the Lie derivative along the bracket [X, Y], by the Jacobi identity and [X, Y] f = X (Y f) - Y (X f). Compared with Carroll's lecture notes, p. 141 (after eq. (5.46)): 'the commutator of two Killing vector fields is a Killing vector field' (stated, left as an exercise): match. Limits: local statement (Killing near x)."
  since: unreleased
- id: LL-0173
  title: In Minkowski space the affine fields with skew linear part are Killing, the dilation is not, and affine fields close under the bracket with the Poincare relations
  area: Spacetime
  file: Lightlike/Spacetime/PoincareKilling.lean
  decls: [Lightlike.affField_killing_iff, Lightlike.not_isKillingAt_dilation, Lightlike.mlieBracket_affField, Lightlike.skew_comm_skew]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (5.44)", check: "Killing"}
  review: kernel-checked
  note: "On R^n with the Minkowski metric and the flat connection, the field y -> A y + c satisfies the Killing equation at every point iff A is skew for the metric; the dilation y -> y does not (n at least 1); [A y + c, B y + d] = (B A - A B) y + (B c - A d); the commutator of two skew endomorphisms is skew. Compared with Carroll's lecture notes, pp. 140-141, eq. (5.44): n translations and n(n-1)/2 rotations, n(n+1)/2 independent Killing vectors of R^n, 'the same kind of counting argument applies to ... Minkowski space': the translations and the eta-skew (Lorentz) fields are Killing here, the dilation is not: match. Limits: that these are all the Killing fields and the count n(n+1)/2 are proved in KillingMinkowski.lean; the 2-sphere check is not included."
  since: unreleased
- id: LL-0174
  title: The second fundamental form of the level sets of a function is symmetric, and the Gauss and Codazzi relations hold for a non-null hypersurface
  area: Spacetime
  file: Lightlike/Spacetime/Hypersurface.lean
  decls: [Lightlike.Hypersurface.secondFF_symm_fields, Lightlike.Hypersurface.gauss_relation, Lightlike.Hypersurface.codazzi_relation]
  status: proven
  tier: established
  source:
    refs:
      - {ref: gourgoulhon-2007, location: "eq. (2.92)", check: "Gauss"}
      - {ref: gourgoulhon-2007, location: "eq. (2.101)", check: "Codazzi"}
  review: kernel-checked
  note: "For a smooth function phi with a unit normal field n (g(n, n) = eps = plus or minus one, the kernel of d phi equal to the orthogonal of n), tangent fields X, Y, Z, W near a point and a metric compatible connection, g(R(X, Y) Z, W) equals the same expression for the tangential connection D plus the term minus eps (K(Y, Z) K(X, W) - K(X, Z) K(Y, W)) with K(v, w) = g(nabla_v n, w); for the Levi-Civita connection K is symmetric on tangent fields and g(R(X, Y) Z, n) = -((D_X K)(Y, Z) - (D_Y K)(X, Z)). Limits: the leaves are not given a manifold structure, so the intrinsic curvature of a leaf is that of the tangential connection D; existence of the unit normal is a hypothesis; the sphere and FLRW trust checks are not included; compared with Gourgoulhon, 3+1 Formalism (gr-qc/0703035), eq. (2.43), p. 24 (extrinsic curvature), the Gauss relation (2.92), p. 35, and the Codazzi relation (2.101), p. 36: match, with two differences: convention, the sign of the extrinsic curvature (ours K(v, w) = g(nabla_v n, w), Gourgoulhon's (2.43) K(u, v) = -u . nabla_v n; the quadratic Gauss term does not depend on it); Gourgoulhon treats spacelike hypersurfaces (eps = -1), ours every non-null one (eps = +1 or -1; the timelike case compared with M. Ammann's Lorentzian geometry notes, Thm. 2.3.7 and 2.3.11, pp. 70-72, read, not a registered source). See docs/notes/ge13-carroll-comparison.md."
  since: unreleased
- id: LL-0175
  title: The first variation of the Einstein-Hilbert density at a point is the Einstein tensor plus a divergence (the Palatini identity in coordinates)
  area: Spacetime
  file: Lightlike/Spacetime/PalatiniCoord.lean
  decls: [Lightlike.palatini_coord, Lightlike.hasDerivAt_lagrangian]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (4.60)", check: "check this yourself"}
  review: kernel-checked
  note: "For smooth symmetric g and h on R^n and a point x with det g(x) nonzero, the coordinate Ricci tensor of g + t h varies by the linearised Ricci tensor; with W^rho = g^{sigma nu} delta Gamma^rho_{sigma nu} - g^{rho sigma} delta Gamma^kappa_{kappa sigma}, sqrt|g| g^{sigma nu} delta R_{sigma nu} equals the divergence of sqrt|g| W^rho; and d/dt of sqrt|g_t| (R(g_t) - 2 Lambda) at t = 0 is minus sqrt|g| (R^{ab} - R g^{ab}/2 + Lambda g^{ab}) h_{ab} plus that divergence. Limits: pointwise statement in coordinates; the integral over a compact region (the divergence integrates to zero), the differentiation under the integral sign and the manifold statement are later stages; compared with Carroll's lecture notes, eqs. (4.56) and (4.60), p. 115 (the variation of the action in three terms and the Palatini identity delta R^rho_{mu lambda nu} = nabla_lambda delta Gamma^rho_{nu mu} - nabla_nu delta Gamma^rho_{lambda mu}): ours is this identity contracted with g^{mu nu}, in coordinates (representation), and the metric is perturbed as g + t h instead of varying the inverse metric delta g^{mu nu} = -g^{mu alpha} g^{nu beta} h_{alpha beta} (representation)."
  since: unreleased
- id: LL-0176
  title: The first variation of the Einstein-Hilbert action on a compact region is the Einstein tensor plus the cosmological term contracted with the perturbation, without a boundary term
  area: Spacetime
  file: Lightlike/Spacetime/VariationIntegral.lean
  decls: [Lightlike.eh_first_variation, Lightlike.contDiffAt_lagDensity]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (4.66)", check: "arbitrary variations"}
  review: kernel-checked
  note: "For a smooth metric g on R^n with nonzero determinant everywhere, a smooth symmetric perturbation h supported in a compact set T and Lambda real, d/dt of the integral over T of sqrt|det g_t| (R(g_t) - 2 Lambda), g_t = g + t h, at t = 0 is minus the integral over T of sqrt|det g| (R^{ab} - R g^{ab}/2 + Lambda g^{ab}) h_{ab}. Limits: coordinates on R^n; the vacuum Einstein equations as critical points (fundamental lemma), the manifold statement and the trust checks (two dimensions, sign of Lambda) are later stages; compared with Carroll's lecture notes, eqs. (4.54)-(4.55), p. 114 (the action), (4.61), p. 115 (the divergence term drops by Stokes for variations vanishing at infinity), (4.63)-(4.66), p. 116, and (4.73), p. 118 (the cosmological term): match, with the representation differences of LL-0175 (g + t h instead of delta g^{mu nu}, hence the minus sign) and a perturbation of compact support for Carroll's variation vanishing at infinity."
  since: unreleased
