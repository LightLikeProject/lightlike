- id: LL-0445
  title: The Euclidean EPRL vertex amplitude (Immirzi parameter below 1) is the contraction along the complete graph K5 of five EPRL node tensors, which are the matrices of the EPRL map of the SU(2) intertwiners, and it is the fusion-coefficient sum of products of two SU(2) 15j symbols
  area: Spin4
  file: Lightlike/Spin4/Vertex.lean
  decls: [Lightlike.Spin4.eprlNode_eq_eprlIntertwiner, Lightlike.Spin4.eprlVertex_eq_sum, Lightlike.Spin4.eprlVertex_eq_fifteenJ]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): for Immirzi parameter below 1 the paper's vertex amplitude is eq. (31), a sum over the SU(2) intertwiners i+, i- of the product over the five nodes of the fusion coefficients f (eq. (32)) times the 15j symbols with spins (1+gamma) j_ab / 2 and |1-gamma| j_ab / 2; eprlVertex_eq_fifteenJ is that form. The file header and docstring of Vertex.lean cited eq. (52) of the preprint, which is not the vertex amplitude; corrected to eq. (31) (27 Nov 2026). Representation: the two SU(2) spins are the doubled labels n and m, the intertwiners are in the recoupling basis, and the first form (eprlVertex_eq_sum) as a contraction of five EPRL node tensors along K5 is the library's own; Section III does not state it in that form. Doubled spins; node a carries the SU(2) intertwiner iota_{z a} in the recoupling basis. eprlNode_eq_eprlIntertwiner: the node tensor is the matrix entry of the EPRL map Phi(iota_z) of Spin4/EPRL.lean (up to the sign of the invariant forms that turn the two incoming legs into outgoing ones). eprlVertex_eq_sum: A_v = sum over the node channels P of prod_a f_a(z_a; x_a, y_a) times a self-dual and an anti-self-dual SU(2) contraction; eprlVertex_eq_fifteenJ: the two contractions are the 15j symbols of the 4-simplex (Recoupling.fifteenJSimplex), i.e. A_v = sum_{x,y} prod_a f_a {15j}(n; x) {15j}(m; y). Holds for all labels as an identity of the definitions; no admissibility hypothesis, but for a node label outside the admissible channel iota_z is not an intertwiner and the value is junk (documented in Vertex.lean). Edge and face amplitudes and the normalisation of the boundary intertwiners beyond the recoupling basis are not part of the vertex."
  since: unreleased
- id: LL-0446
  title: Selection rules, the zero-spin value and the BF limit of the Euclidean EPRL vertex - the vertex vanishes unless the self-dual (and the anti-self-dual) spins at every node add up to an even number, it equals 1 at zero spins, and with trivial anti-self-dual spins it is the SU(2) 15j symbol of the Ooguri model
  area: Spin4
  file: Lightlike/Spin4/Vertex.lean
  decls: [Lightlike.Spin4.eprlVertex_eq_zero_of_not_even_left, Lightlike.Spin4.eprlVertex_eq_zero_of_not_even_right, Lightlike.Spin4.eprlVertex_zero, Lightlike.Spin4.eprlVertex_zero_right]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): the paper gives the vertex amplitude, eq. (31), but not these value checks; they are statements about the library's definition. The selection rule (an odd spin sum at a node leaves no node channel) is the parity condition on the intertwiner channels of the 15j symbol; in the paper it is not stated for the vertex. Doubled spins. The two selection rules hold for all labels (an odd spin sum at one node on either side leaves no node channel, so the sum is empty). eprlVertex_zero: eprlVertex 0 0 0 = 1. eprlVertex_zero_right assumes IsVertexBoundary n 0 z: with m = 0 (formally gamma = 1, j- = 0) the vertex is Recoupling.fifteenJSimplex of the same spins and intertwiners, the SU(2) BF vertex; this is a limit of the formula, not the gamma -> 1 limit of the model (for 0 < gamma < 1 the labels have m > 0)."
  since: unreleased
- id: LL-0447
  title: On an admissible boundary the Euclidean EPRL vertex is the sum of products of two 15j symbols with the fusion coefficients written as products of two SU(2) 9j symbols, and it is real
  area: Spin4
  file: Lightlike/Spin4/Vertex.lean
  decls: [Lightlike.Spin4.eprlVertex_eq_vertexNineJ, Lightlike.Spin4.eprlVertex_im]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Compared with Alesci, Bianchi, Magliaro, Perini, arXiv:0809.3718, eqs. (4), (7), (8) (read): the EPRL fusion coefficient is, up to a sign and a normalisation factor (in the dimensions 2i+1, 2iL+1, 2iR+1 and 2j_n+1), the product of two 9j symbols q(j1,j2) q(j3,j4), with q the 9j symbol of eq. (8), and it vanishes outside the triangle inequality |iL - iR| <= i <= iL + iR (eq. (9)). Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): the vertex is eq. (31) with those coefficients inserted. Representation: the library writes q as vertexNineJ with the SU(2) spins J = n + m as a separate argument; the sign convention and the normalisation of the coefficients are fixed by the library's recoupling basis, and the comparison is of the structure (product of two 9j), not of the numerical values against a published table (none exists). Both statements assume IsVertexBoundary n m z (the node labels lie in the admissible channel); outside it the vertex is a junk value. The vertex vertexNineJ n m J z takes the SU(2) spins J as a separate argument; here J = n + m. Trust checks: VertexTests compares values with exact SymPy values (no published table exists) and shows that a wrong simplicity constraint J different from n + m changes the amplitude (the compared boundaries differ, so this shows different inputs give different numbers, not a same-boundary perturbation)."
  since: unreleased
