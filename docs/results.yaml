  note: "Compared with Lickorish (1999), Definition 5.1 and Theorem 5.9 (read): the paper notes that kappa(B, A) is the inverse move to kappa(A, B) (the involutivity here) and that any kappa(A, B) is the composition of a stellar subdivision and a weld, (B, a)^(-1) (A, a), which is the statement 'every bistellar move is a stellar equivalence' (the paper writes the composition with the new vertex a). Theorem 5.9 states that closed combinatorial n-manifolds are PL homeomorphic iff bistellar equivalent; the statements here are two ingredients (involutivity of the bistellar move, and the easy half 'bistellar moves are stellar equivalences', whose proof composes two stellar subdivisions through a new vertex taken from an unlimited supply, so no hypothesis on the vertex type is needed after relabelling), and the theorem itself is LL-0065 / LL-0023. Representation: the paper's vertex a is a new vertex of an unlimited supply; here that is made explicit by relabelling. Hypothesis: IsBistellar K A B for the move, as in the Lean theorems."
