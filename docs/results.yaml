- id: LL-0075
  title: q-orthogonality of the 6j symbol at every level r ≥ 2
  area: TuraevViro
  file: Lightlike/TuraevViro/Reflect/QDougallAll.lean
  decls: [Lightlike.TV.Refl.qOrthogonality_proved]
  status: proven
  tier: established
  source:
    refs:
      - {ref: koekoek-swarttouw-1996, location: "eq. (3.2.1)", check: "q-Racah"}
      - {ref: koekoek-swarttouw-1996, location: "eq. (3.2.2)", check: "orthogonality"}
  review: kernel-checked
  note: "The diagonal orthogonality qOrthogonality of the model holds at every level r ≥ 2, without hypothesis: the q-Dougall boundary evaluation QDougallAll is now a theorem (qDougallAll_proved, LL-0104) and qOrthogonality_proved applies qOrthogonality_of to it. The earlier conditional form qOrthogonality_of remains in Lightlike/TuraevViro/Reflect/OrthConditional.lean. Together with qBiedenharnElliott this would give the Turaev–Viro invariance of LL-0031 at level r. Not proved: qBiedenharnElliott for r ≥ 4."
