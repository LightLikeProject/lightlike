  note: "For a smooth metric g on R^n of any signature with nonzero determinant everywhere and a real Lambda: the first variation of the integral of sqrt|det g| (R - 2 Lambda) vanishes for every smooth symmetric perturbation of compact support (over any compact region containing the support) iff R^{ab} - R g^{ab}/2 + Lambda g^{ab} is antisymmetric in (a, b), that is (it is symmetric) iff it vanishes. Limits: coordinates on R^n; the manifold statement and the trust checks (two dimensions, sign of Lambda) are later stages; compared with Carroll's lecture notes, eqs. (4.66)-(4.67), p. 116 ('this should vanish for arbitrary variations, so we are led to Einstein's equations in vacuum') and (4.73), p. 118: match; Carroll's step 'for arbitrary variations' is the fundamental lemma of the calculus of variations, proved here."
  since: unreleased
- id: LL-0178
  title: In two dimensions the Einstein tensor of a smooth nondegenerate metric vanishes, so every metric is a critical point of the Einstein-Hilbert action without cosmological term
  area: Spacetime
  file: Lightlike/Spacetime/EinsteinTwoDim.lean
  decls: [Lightlike.ricci_two_dim, Lightlike.isEHCritical_two_dim]
  status: proven
