  review: kernel-checked
  note: "On a manifold modelled on R^n with a metric of any signature and its Levi-Civita connection (main's leviCivita g, or any torsion-free metric connection that is locally smooth), for a smooth vector field V with nabla_V V = 0 near x and the expansion Theta = tr(u -> nabla_u V): V(Theta) = -tr((nabla V)^2) - Ric(V, V) at x (raychaudhuri_manifold, raychaudhuri_leviCivita), Kar and SenGupta's identity behind (12), with no normalisation of V; the proof reads the identity in the chart at x (the components of nabla_u V are covD, the trace and Ric are the coordinate ones) and applies raychaudhuri_coord. For a Lorentzian metric and V unit (g(V, V) = -1) and geodesic near x, rotation-free at x (g(nabla_u V, w) = g(nabla_w V, u), Kar and SenGupta's omega = 0) with Ric(V, V) >= 0: V(Theta) <= -Theta^2/(n-1) (raychaudhuri_focusing_manifold_at), and along an integral curve gamma of V on [0, L) with these hypotheses along gamma and Theta(gamma(0)) < 0, L <= (n-1)/|Theta(gamma(0))| (raychaudhuri_focusing_manifold): the paragraph after their (16), convergence as the bound on the parameter interval on which Theta stays finite. Limits: the null version (their (17)) is not here."
  since: unreleased
- id: LL-0191
  title: The comoving congruence of FLRW has expansion 3 a'/a and obeys Raychaudhuri's equation, and de Sitter's does not focus
  area: Cosmology
  file: Lightlike/Cosmology/Raychaudhuri.lean
  decls: [Lightlike.Cosmology.flrw_comoving_covDeriv, Lightlike.Cosmology.flrw_comoving_geodesic, Lightlike.Cosmology.flrw_comoving_expansion, Lightlike.Cosmology.flrw_raychaudhuri, Lightlike.Cosmology.minkowski_comoving_expansion, Lightlike.Cosmology.deSitter_no_focusing]
  status: proven
