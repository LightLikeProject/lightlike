  review: kernel-checked
  note: "G1-024 in four dimensions (route (A)). For a C^1 family of fields Y near c(t0), indexed like the Killing algebra of the space form of curvature k (translations P_m, rotations R_ab), Killing for a symmetric G near c(t0), with the brackets S_k there, and with the rotations vanishing along a differentiable curve c: in the chart Phi(t, xi) = exp(T sum xi_e Y_e)(c t), G(d_t, d_t) = G(c t)(c' t, c' t), G(d_t, d_zeta) = 0 and G(d_zeta, d_zeta') = a(t) delta/(1 + k|x|^2/4)^2 (o_2 xi)(Do_2 zeta, Do_2 zeta') with a(t) = G(c t)(P_0, P_0) and o_2 the orbit chart of the space form; at xi = 0, d_t Phi = c' t, d_zeta Phi = T sum zeta_e Y_e(c t), Do_2 = T id on the translation directions. Cross terms: the rotations fix c' (they vanish along c), so G(c', P_m) = 0 at c t, and along the orbits G(J_{c'}, Y) solves a homogeneous linear equation. Limits: the Killing algebra and its structure constants are hypotheses (not derived from an isometry group; two attempts recorded in docs/notes/co1-carroll-comparison.md: the group route needs Myers-Steenrod and the Lie group exponential, the infinitesimal route needs the rigidity of Killing fields and a real Schur lemma for so(3), none in Mathlib or Physlib); t is not normalised (b(t) for Carroll's -1)."
  since: unreleased
- id: LL-0226
  title: With the strong energy condition and p <= rho the big bang singularity of an expanding FLRW universe is at a = 0, and p <= rho cannot be dropped
  area: Cosmology
  file: Lightlike/Cosmology/BigBangSingularity.lean
  decls: [Lightlike.Cosmology.friedmann_834, Lightlike.Cosmology.bigBang_singularity, Lightlike.Cosmology.onePlusSqrt_friedmann, Lightlike.Cosmology.onePlusSqrt_not_dominant]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.35)", check: "Big Bang"}
      - {ref: carroll-1997, location: "eq. (8.36)", check: "Friedmann"}
  review: kernel-checked
  note: "For a C^2 scale factor a > 0 on (t1, t2) solving both Friedmann equations with Lambda = 0, rho + 3p >= 0 and p <= rho, expanding at t0: either a -> 0 as t decreases to t1, or a', a'', rho and p are bounded on (t1, t0] (bigBang_singularity), so a singularity at the left end of the interval is at a = 0. Proof: ((a'^2 + k) a^4)' = 2 a' a^3 (a a'' + 2(a'^2 + k)) = 8 pi G a' a^5 (rho - p) >= 0 (Carroll's (8.34), a''/a + 2(a'/a)^2 + 2k/a^2 = 4 pi G (rho - p), which combines (8.35) and (8.36)), so rho a^6 stays bounded in the past while a >= L > 0. The hypothesis p <= rho is needed: a = 1 + sqrt t on (0, infinity), k = 0, solves both equations with rho > 0, p > 0, a' > 0, a'' < 0, and a' -> infinity as t -> 0 while a -> 1 (onePlusSqrt_friedmann); hence p > rho somewhere (onePlusSqrt_not_dominant). Carroll's 'we necessarily reach a singularity at a = 0' (p. 224) under rho > 0, p >= 0 alone fails for this a."
  since: unreleased

