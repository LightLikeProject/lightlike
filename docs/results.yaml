  note: "Compared with Martinetti, arXiv:1604.00499, Section 2, eqs. (2.10) and (2.11), p. 6 (read): for a complete Riemannian (spin) manifold, with D the signature operator or the Dirac operator, the spectral distance between pure states equals the geodesic distance; the norm of the commutator [D, f] is the Lipschitz norm of f (p. 6, citing Rieffel and [22]). Differences: REPRESENTATION, our D is the flat Dirac operator on R^n for an arbitrary skew Clifford representation on a nontrivial normed space (not L^2 spinors), the test functions are C^1 with sup norm of the gradient at most 1 (Lip1), and only the flat case is proved, with Leibniz rule D(f psi) = f D psi + cliff(grad f) psi; no general spin manifold. Lemmas it uses from other files: Lightlike.Dirac.dirac_smul, Lightlike.Dirac.opNorm_cliff (Lightlike/Dirac/ConnesDistance.lean)."
