- id: LL-0046
  title: The Lorentzian EPRL vertex amplitude is finite for every Immirzi parameter, all spins and every coefficient array
  area: Lorentz
  file: Lightlike/Lorentz/EPRL.lean
  decls: [Lightlike.Lorentz.integrable_eprlIntegrand, Lightlike.Lorentz.lintegral_enorm_eprlIntegrand_lt_top, Lightlike.Lorentz.eprlVertex_eq_integral, Lightlike.Lorentz.integrable_linkProd_inner]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Abstract", check: "Lorentzian"}
      - {ref: engle-pereira-2009, location: "Section 4", check: "finiteness"}
  review: kernel-checked
  note: Labels k = j and ρ = γ(j + 1), in Ding and Rovelli's form; Engle–Pereira's ρ = γj in this normalisation (ρ = 2γj in theirs). One of the five integrations is dropped (V₄ = 1), as in Engle–Pereira. The coefficients are arbitrary arrays, contracted without the ε twist on the bra legs, so invariant intertwiners are covered as special arrays, but equality with Engle–Pereira's amplitude on invariant intertwiners is not proven. The proof uses only the decay of the vectors, so finiteness holds for every choice of labels. Non-vacuity is shown at spin 0 for γ in some neighbourhood of 0. The amplitude is defined up to the normalisation of the Haar measure.
