  title: Expansion of the squared geodesic distance about the midpoint to sixth order, uniformly on compact sets, with the order sharp
  area: Regge
  file: Lightlike/Regge/Geodesic/Sixth.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.dist_sq_expansion_midpoint6]
  status: proven
  tier: established
  source:
    refs:
      - {ref: brewin-2009, location: "Section 9", check: "geodesic"}
  review: kernel-checked
  note: "For a Riemannian coordinate metric g on U and a compact K ⊆ U, |d(m − Δ/2, m + Δ/2)² − g_m(Δ,Δ) − Q_m(Δ)| ≤ C‖Δ‖⁶ for m in K and small Δ, with the quartic form Q_m(Δ) = (1/24)∂_Δ∂_Δ g(Δ,Δ) − (1/12)g(Γ(Δ,Δ),Γ(Δ,Δ)); about the midpoint the terms of order three and five vanish. The order is sharp: on the cubic shear the remainder is t⁶/576 along Δ = (t, 0), so it is not O(‖Δ‖⁷) (Lightlike.Geodesic.dist_sq_expansion_midpoint6_sharp), and the expansion is checked exactly there (Lightlike.Geodesic.cubicShear_dist_sq_expansion_midpoint6). Brewin (2009), Section 9, gives the expansion in Riemann normal coordinates and the midpoint form d² = g(m)(Δ, Δ) + O(‖Δ‖⁴); the quartic form Q_m and the sixth-order bound are derived here."
  since: 0.2.0
- id: LL-0057
  title: The chart distance of a Riemannian coordinate metric is Mathlib's Riemannian distance
  area: Regge
  file: Lightlike/Regge/Geodesic/Riemannian.lean
  decls: [Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq, Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq_iInf, Lightlike.Geodesic.IsRiemMetric.riemannianEDist_eq_of_isPreconnected]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "For the Riemannian bundle of g on U, Mathlib's riemannianEDist is the infimum of the lengths of admissible curves, with no hypothesis on the points (the empty infimum is ⊤). If an admissible curve joins x and y it equals ENNReal.ofReal (dist g U x y), and on a preconnected U this holds for all x, y. Without an admissible curve riemannianEDist is ⊤ while the chart distance takes the junk value 0. This connects the geodesic results of this library (LL-0045, LL-0056) to Mathlib's Riemannian distance."
  since: 0.2.0
- id: LL-0058
  title: Near the regular 4-simplex the ten triangle areas determine the ten edge lengths
  area: Regge
  file: Lightlike/Regge/AreaRegge/Deriv.lean
  decls: [Lightlike.AreaRegge.area_local_inj, Lightlike.AreaRegge.areaSqMap_local_inj]
  status: proven
  tier: established
  source:
    refs:
      - {ref: brw-1999, location: "eq. (2)", check: "neighbourhood of the regular four-simplex"}
  review: kernel-checked
  note: "The map from the ten squared edge lengths of a 4-simplex to its ten squared triangle areas (Heron's formula in squared lengths) has invertible Jacobian at the regular simplex (all squared lengths 1; jac_regular_isUnit, through an explicit integer inverse of the edge-triangle incidence matrix), so by the inverse function theorem it is injective on a neighbourhood of the regular simplex with open image, and so are the areas themselves. The result is local: at the corner configuration (squared lengths 1 on the edges at one vertex, 2 on the others) the Jacobian is singular (jac_corner_det, with an explicit kernel vector), and corner_pair gives two different length assignments, the corner configuration moved by plus and minus half that kernel vector, both satisfying the Gram-minor criterion IsSimplex, with the same ten areas. IsSimplex is the positivity of the leading principal minors of the Gram matrix; Realization.lean gives both assignments as the squared distances of affinely independent five-point sets in ℝ⁴, so they are Euclidean 4-simplices of non-zero volume (Lightlike.AreaRegge.corner_pair_realized). scripts/regge/area_jacobian_check.py recomputes det Jac = −48/8¹⁰ at the regular simplex, the corner kernel and the corner pair in SymPy."
  since: 0.2.0
- id: LL-0059
  title: The Einstein–Regge action of dynamical triangulations in terms of N₀, N₄ and χ, and its change under the Pachner moves
  area: DynamicalTriangulations
  file: Lightlike/DynamicalTriangulations/Action.lean
  decls: [Lightlike.DynamicalTriangulations.dtAction_eq, Lightlike.DynamicalTriangulations.dtAction_move, Lightlike.DynamicalTriangulations.dtAction_move_one_five]
  status: proven
  tier: established
  source:
    refs:
      - {ref: ambjorn-jurkiewicz-loll-2001, location: "eq. (42)", check: "standard form of the action"}
      - {ref: ambjorn-jurkiewicz-loll-2001, location: "Section 3.2, eq. (26)", check: "Dehn-Sommerville"}
  review: kernel-checked
  note: "For a closed combinatorial 4-manifold the action −κ₂N₂ + κ₄N₄ equals −2κ₂N₀ + (κ₄ − 2κ₂)N₄ + 2κ₂χ, through N₂ = 2N₀ + 2N₄ − 2χ from the Dehn–Sommerville relations (LL-0055). A move with 2 ≤ #σ and 2 ≤ #τ keeps N₀ and χ and changes the action by (#σ − #τ)(κ₄ − 2κ₂), so the 3-3 move leaves it unchanged; the 1-5 move adds one vertex and changes it by −2κ₂ + 4(κ₄ − 2κ₂) (dtAction_move_one_five). Kernel checks: the boundary of the 5-simplex has action −20κ₂ + 6κ₄ (dtAction_sphere), and the formula without the χ term gives −24κ₂ + 6κ₄ there, the wrong value. Not covered: the Lorentzian action of causal dynamical triangulations, which weighs (4,1) and (3,2) simplices differently. As a non-vacuity check, the 1-5 move of the boundary of the 5-simplex with a new vertex changes the action by −2κ₂ + 4(κ₄ − 2κ₂) (sphere7_dtAction_move), and a 2-4 move on the result by 2(κ₄ − 2κ₂), the formula with #σ = 4 and #τ = 2 (sphere7_dtAction_move24)."
  since: 0.2.0
- id: LL-0060
  title: At a flat SU(2) connection on a 2-complex the twisted coboundary d1 is the differential of the holonomy map, so H² = 0 iff every face-holonomy variation is realised
  area: SpinFoam
  file: Lightlike/SpinFoam/TwistedCohomologySU2.lean
  decls: [Lightlike.SpinFoam.holonomy_hasDerivAt, Lightlike.SpinFoam.face_variation_iff, Lightlike.SpinFoam.h2_trivial_iff_face_variation]
  status: proven
  tier: established
  source:
    refs:
      - {ref: barrett-naish-guzman-2009, location: "§4.4", check: "Existence criterion"}
  review: kernel-checked
  note: "The twisted cochain complex of a finite 2-complex with an edge connection g and a real representation has d1 ∘ d0 = 0 exactly when g is flat and the face boundaries are closed walks (d1_comp_d0, TwistedCohomology.lean); H² = C²/im d1 is trivial iff d1 is onto (d1_surjective_iff). For SU(2) acting on su(2) = ℝ³ by the adjoint action, varying each edge holonomy along exp(tΦ_e)g_e changes the face holonomies at a flat connection with derivative d1 Φ (holonomy_hasDerivAt), so a first-order change X of the face holonomies is realised exactly when X = d1 Φ (face_variation_iff). The tests: d1 is onto for the disc and not onto for the 2-sphere with one edge, and a non-flat connection breaks d1 ∘ d0 = 0 (TwistedCohomologyTests.lean, real multiplicative coefficients). For SU(2) with the adjoint action, the 2-sphere with one edge and two faces at the trivial connection has d1 not onto and H² ≠ 0 (sphere_su2_H2_nontrivial, TwistedCohomologyTests.lean); on the disc at the trivial connection d1 is onto and every face-holonomy variation is realised (disc_su2_d1_surjective, disc_su2_face_variation), so both sides of the criterion are instantiated for SU(2). Barrett and Naish-Guzman's theorem (§4.4) is existence of the partition function as a distribution; only the finite-dimensional step, d1 = the differential of the holonomy map, is proved here, not the measure-theoretic step. Not covered: the link from H² = 0 to the removal of the Ponzano–Regge cut-off."
  since: 0.2.0
- id: LL-0061
  title: "The Racah sum rule, and the Ponzano–Regge sum of Bing's house: summed over the room spins first it is 1, while the simple cut-off at spin 1 truncates a room sum and gives 37/12"
  area: SpinFoam
  file: Lightlike/SpinFoam/BingsHouse.lean
  decls: [Lightlike.SpinFoam.racah_sum, Lightlike.SpinFoam.bingIterated_eq_one, Lightlike.SpinFoam.bingCutoff_two, Lightlike.SpinFoam.bingCutoff_two_ne_iterated]
  status: proven
  tier: established
  source:
    refs:
      - {ref: barrett-naish-guzman-2009, location: "§2.4", check: "Bing"}
  review: kernel-checked
  note: "The sum rule Σ_{a ≤ 2c} (−1)^a (2a+1) {a c c; c c c} = δ_{c0} follows from the orthogonality of the 6j symbols (racah_sum, from sixJSym_orth_all). For Bing's house with two rooms, BNG §2.4 write the Ponzano–Regge sum as Z = Σ_c Σ_{b ≤ 2c} Σ_{a ≤ 2c} (−1)^(a+b) (2a+1)(2b+1)(2c+1) {a c c; c c c}{b c c; c c c}. Its summand stays of order 1 at large spins, so the sum is not absolutely convergent and its value depends on how it is summed; the model takes its value from a regularisation. Two summations are proved here (Lean uses doubled spins). Room spins first: for each central spin c the sums over a and b run to their full range 2c, where each is δ_{c0}, and any cut-off N on c then gives 1 (bingIterated_eq_one). Simple cut-off Λ on all spins (BNG §2.2): at Λ = 1 the room sums for c = 1 stop at a = 1 instead of 2, which drops the term 5/6 (from {2 1 1; 1 1 1} = 1/6), so Z_1 = 1 + 3 (5/6)² = 37/12 (bingCutoff_two, bingCutoff_two_ne_iterated). 37/12 is one partial sum, not a limit: Z_Λ has no limit (BNG fig. 6, numerical; scripts/spinfoam/bing_house_check.py computes Z_Λ exactly up to Λ = 14, with values between 1 and 8.15 that do not settle). The two values therefore show no inconsistency of the Ponzano–Regge model: the simple cut-off truncates the room sums before 2c, which BNG give as the cause of its divergence, and BNG state (not proved here) that the Turaev–Viro regularisation gives 1 for every q. The sum formula is taken from BNG §2.4; it is not derived in Lean from a state sum on a 2-complex. Not covered: that H² = 0 makes the cut-off removable (BNG §4.4)."
  since: 0.2.0
- id: LL-0062
  title: The Einstein–Regge action of 3D dynamical triangulations in terms of N₀ and N₃, and its change under the 3D Pachner moves
  area: DynamicalTriangulations
  file: Lightlike/DynamicalTriangulations/Action3.lean
  decls: [Lightlike.DynamicalTriangulations.dtAction3_eq, Lightlike.DynamicalTriangulations.dtAction3_move23, Lightlike.DynamicalTriangulations.dtAction3_move14]
  status: proven
  tier: established
  source:
    refs:
      - {ref: ambjorn-jurkiewicz-loll-2001b, location: "eq. (24)", check: "Euclidean Einstein action"}
      - {ref: ambjorn-jurkiewicz-loll-2001b, location: "eq. (26)", check: "any triangle is shared by two tetrahedra"}
  review: kernel-checked
  note: "For a closed combinatorial 3-manifold the Dehn–Sommerville relations give N₂ = 2N₃ and N₁ = N₀ + N₃, so χ = 0 (dehnSommerville3, card_tris, card_edges, euler_eq_zero in DehnSommerville3.lean), and the action −κ₁N₁ + κ₃N₃ equals −κ₁N₀ + (κ₃ − κ₁)N₃. The 2-3 move changes it by κ₃ − κ₁ and the 1-4 move by 3κ₃ − 4κ₁. Checks: after a 1-4 move on the boundary of the 4-simplex a 2-3 move applies and changes the action by κ₃ − κ₁ (dtAction3_S3_14_23); the boundary of the 4-simplex has counts (5, 10, 10, 5) and action −10κ₁ + 5κ₃; two tetrahedra glued along a triangle violate N₂ = 2N₃ and are not a combinatorial manifold (Tests3.lean)."
  since: 0.2.0
- id: LL-0063
  title: In dimension 2, the linearized deficit angles of the diagonal grid converge to the linearized Gauss curvature at rate O(1/n)
  area: Regge
  file: Lightlike/Regge/Linear/Converge.lean
  decls: [Lightlike.Regge.Linear.linearized_regge_converges]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Proposition 3.1", check: "The derivative of the deficit angle"}
  review: kernel-checked
  note: "For a symmetric, C³, compactly supported perturbation h of the flat metric of the plane and a C¹ compactly supported weight f, the weighted sum of the linearized vertex deficit angles of the diagonal grid of mesh 1/n differs from ∫ f · linCurv h by at most C/n, where linCurv h = ∂₀∂₁h₀₁ − ½(∂₁²h₀₀ + ∂₀²h₁₁) is the linearized Gauss curvature (linearized_regge_converges). The squared edge lengths are ∫₀¹ (δ + εh)(e, e) dt along the edge vector e, that is ℓ_e²(1 + ε ⨍_e h(t_e, t_e)), Christiansen's degrees of freedom of the Regge interpolant (eq. (5)); this is the first variation of the squared length, not the distance of the perturbed metric; tying them to that distance is open. For a quadratic perturbation the deficit is exactly s² linCurv (linDef_model), and the flat star has deficit 0. Christiansen works in dimension 3; this is the 2D analogue on one grid family, and the Regge action itself is not treated. A perturbation with a positive limit shows non-vacuity, and dropping the ∂₀∂₁h₀₁ term gives the limit 0, which the deficits do not approach. The nonlinear 2D statement, for geodesic edge lengths, is LL-0053 (after Cheeger, Müller and Schrader)."
  since: 0.2.0
- id: LL-0064
  title: Newman's theorem, PL homeomorphic simplicial complexes are stellar equivalent
  area: PL
  file: Lightlike/PL/Newman.lean
  decls: [Lightlike.PL.SComplex.StellarEquiv.of_plHomeomorphic]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 4.5"}
  review: kernel-checked
  note: "Two simplicial complexes whose geometric realisations are PL homeomorphic (a map piecewise linear on one realisation and bijective onto the other) are related by finitely many stellar moves (StellarEquiv.of_plHomeomorphic). The proof shows that every geometric subdivision is stellar equivalent to the complex it subdivides (subdivStellar, Lightlike/PL/SubdivCells.lean), by induction on the dimension: a subdivision is cut out by finitely many affine functionals, the slicings of the two complexes are isomorphic (stellarEquiv_of_cutting), and each complex is stellar equivalent to its slicing. Both complexes must have or both lack the empty face: the complex with no faces is a geometric subdivision of {∅}, both with empty underlying set, but the two are not stellar equivalent (not_stellarEquiv_void_null)."
  since: 0.2.0
- id: LL-0065
  title: Pachner's theorem, PL form, closed combinatorial manifolds are PL homeomorphic iff related by bistellar moves
  area: PL
  file: Lightlike/PL/PachnerPL.lean
  decls: [Lightlike.PL.SComplex.pachner_plHomeomorphic, Lightlike.PL.SComplex.isClosedCombManifold_iff_plHomeomorphic]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9"}
  review: kernel-checked
  note: "For a closed combinatorial n-manifold K and a complex L, both containing the empty face, K and L are PL homeomorphic exactly when they are related by finitely many bistellar moves (pachner_plHomeomorphic). It combines Newman's theorem (LL-0064), which turns a PL homeomorphism into stellar equivalence, with the stellar version of Pachner's theorem (LL-0023), which turns stellar equivalence of a closed combinatorial manifold into bistellar equivalence; conversely, bistellar equivalence gives stellar equivalence (LL-0023), and stellar equivalent complexes are PL homeomorphic (PLHomeomorphic.of_stellarEquiv). The hypothesis is Lickorish's combinatorial manifold: isClosedCombManifold_iff_plHomeomorphic shows that the vertex links being stellar equivalent to boundaries of simplices (the definition used here) is the same as their being PL homeomorphic to them (Lickorish, Definition 2.2), by Newman's theorem (LL-0064) and PLHomeomorphic.of_stellarEquivIn. Check: the boundary of a triangle and its subdivision at a new vertex on an edge are related by bistellar moves, derived through the PL homeomorphism of a stellar subdivision (PLHomeomorphic.starAt)."
  since: 0.2.0
- id: LL-0066
  title: "The tetrahedron integral: the Haar integral over SU(2)^4 of the product of the six edge characters is the square of the 6j symbol of the six edge spins"
  area: SpinFoam
  file: Lightlike/SpinFoam/TetrahedronSixJ.lean
  decls: [Lightlike.SpinFoam.tetraInt_eq_sixJ_sq]
  status: proven
  tier: established
  source:
    refs:
      - {ref: freidel-louapre-2004, location: "eq. (94)", check: "square of the"}
  review: kernel-checked
  note: "For edge spins s (doubled units; edges 01, 02, 03, 12, 13, 23) the integral over SU(2)^4 of Π_e χ_{s e}(g_i g_j⁻¹) equals {s₀₁ s₀₂ s₀₃; s₂₃ s₁₃ s₁₂}² (tetraInt_eq_sixJ_sq). The proof expands each character in the matrix coefficients of the spin representations, integrates them with the Haar measure into products of 3j vectors, and identifies the resulting sum with a 6j symbol up to a sign (ZR_eq). This is Freidel–Louapre's Ponzano–Regge observable of the 1-skeleton of the two-tetrahedron triangulation of S³, eq. (94), read on the dual graph: their group variables sit on the four triangles and the holonomy around an edge is g_i g_j⁻¹ for the two triangles i, j containing it, so the Lean edge ij carries the spin of the edge shared by triangles i and j, and the triads at the Lean vertices are the triangles of the triangulation. Checks: all spins 0 give 1 (tetraInt_zero), all spins 1 (doubled spin 2) give (1/6)² = 1/36 (tetraInt_two), and an inadmissible triad at a vertex gives 0 (tetraInt_eq_zero_of_not_tri, tetraInt_ones_vertex)."
  since: 0.2.0
- id: LL-0067
  title: "The cut-off sum of the tetrahedron, Σ Π(s+1)·(6j)² over doubled edge spins ≤ N, is at least (N+1)², so it has no limit without rescaling"
  area: SpinFoam
  file: Lightlike/SpinFoam/TetrahedronCutoff.lean
  decls: [Lightlike.SpinFoam.tetraTerm_zeroSpin, Lightlike.SpinFoam.tetraPartition_ge, Lightlike.SpinFoam.tetraPartition_unbounded, Lightlike.SpinFoam.not_tetraRemovable]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "The tetrahedron sum over the six doubled edge spins up to a cut-off N has the nonnegative terms Π(s_e+1)·{s₀ s₁ s₂; s₅ s₄ s₃}² (tetraTerm_nonneg). At the doubled spins (0, n, n, n, n, 0) the dimension factor is (n+1)⁴ and the 6j symbol is ±1/(n+1) by the zero-spin formula (sixJSym_zero_left; DLMF eq. 34.5.1 after the 34.5(ii) column symmetry), so the term is (n+1)² (tetraTerm_zeroSpin). Hence the sum is at least (N+1)² (tetraPartition_ge), it is unbounded (tetraPartition_unbounded), and by the monotone-limit criterion it has no limit (not_tetraRemovable). This is the sum without the rescaling M_Λ^{-v} of the simple cut-off of Barrett and Naish-Guzman (§2.2), who do not define M_Λ here; whether the rescaled limit exists is not decided. The tests: the cut-off values 1, 29, 2393/4 at doubled cut-offs 0, 1, 2 are numerical (scripts/spinfoam/tetra_partition_check.py) and lie above (N+1)². Not covered: existence of the sum as a distribution and H² = 0 (Barrett and Naish-Guzman, §4.4), and the link from H² = 0 to the removal of the cut-off."
  since: 0.3.0
- id: LL-0068
  title: "The gauge-fixed Ooguri state sum at finite cutoff is constant along every chain of 4D Pachner moves, and a gauge set that forces every triangle gives 1 at every cutoff (a new result, not from the literature)"
  area: SpinFoam
  file: Lightlike/SpinFoam/GaugeChain.lean
  decls: [Lightlike.SpinFoam.amplitudeGF_congr_cut, Lightlike.SpinFoam.GFStep4.isGauge, Lightlike.SpinFoam.amplitudeGF_eqvGen4, Lightlike.SpinFoam.amplitudeGF_tendsto_one_of_forces]
  status: proven
  tier: frontier
  main: true
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "The three moves 3-3, 2-4 and 1-5 (LL-0049 to LL-0051) are put into one relation GFStep4 on triples (complex, gauge set, cutoffs), with the hypotheses of the three move theorems and a step recut that changes the cutoffs on faces that are not summed (amplitudeGF_congr_cut). A step takes a gauge set to a gauge set (GFStep4.isGauge), and the gauge-fixed amplitude is constant along every chain of steps and their inverses, which are the 4-2 and 5-1 moves (amplitudeGF_eqvGen4). If a gauge set T forces every triangle, the state sum is 1 at every constant cutoff, so it converges as the cutoff is removed (amplitudeGF_tendsto_one_of_forces). Non-vacuity: amplitudeGF_chain_example runs a 1-5 move followed by a 2-4 move on the boundary of the 5-simplex with ten gauge triangles; amplitudeGF_tendsto_starT is the forcing case on the boundary of the 5-simplex. A new result, not from the literature; the gauge fixing generalizes Freidel–Louapre's 3D construction (gr-qc/0212001 §IV): the gauge rule is this library's 4D analogue of their maximal tree (Section IV.B of the paper, the gauge-fixing procedure; the location checked in the registry is the title of Section IV); their independence of the choice of tree is argued there by BRST invariance and is formal. Not proven: finite cutoff only, the cutoffs must be re-chosen by recut between moves and the cutoff conditions are sufficient, not necessary; independence of the gauge set is not proven for gauge sets that do not force every triangle (numerical examples in scripts/spinfoam/gauge_independence_check.py show finite-cutoff dependence for non-forcing sets); the second tree, the global symmetry left at the root vertex, the Faddeev-Popov measure and the limit of the ungauged sum are not treated. Observation, not a proof: for the gauge set of the closed 4-sphere with 24 4-simplices in scripts/spinfoam/gauge_manifold_check.py, which obeys the gauge rule but forces only 38 of its 62 triangles, the cutoff state sum at doubled cutoffs 2, 4, ..., 40 (scripts/spinfoam/gauge_cutoff_limit.py; exact 3j symbols, double-precision contraction, summation-order spread 3e-15 at cutoff 10 and 8e-14 at cutoff 20, not measured at larger cutoffs) changes sign seven times and its largest absolute value grows from 6.0 (cutoffs up to 8) to 33.8 (cutoffs from 12), so numerically the cutoff sums do not settle for that gauge set. The check at 32 and above in higher precision is open. On the boundary of the 5-simplex and on two small 4-spheres every sampled gauge set (3000, 2000 and 2000 random sets) forces every triangle."
  since: 0.3.0
- id: LL-0069
  title: "A set of triangles that forces every triangle of a closed 4D complex still forces every triangle after a 1-5 Pachner move, when the four gauge triangles of the move are added"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingMoves.lean
  decls: [Lightlike.SpinFoam.Forces.mono, Lightlike.SpinFoam.Forces.of_union, Lightlike.SpinFoam.Move15.forces_move15]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is the rule that a tetrahedron with three of its triangles in the set forces the fourth (Forces); the rule is this library's, used to show that the gauge-fixed state sum is 1 (amplitudeGF_tendsto_one_of_forces). Forces is monotone in the tetrahedra and in the starting set (Forces.mono) and composes (Forces.of_union). The 1-5 move only adds tetrahedra, and each new triangle {v, x, y} is forced by the tetrahedron {v, a_0, x, y} from the four gauge triangles {v, a_0, a_j} (forces_move15). Non-vacuity: forces_move15_example applies it on the boundary of the 5-simplex with the ten triangles through a vertex. Scope: for complexes reached from the boundary of the 5-simplex by 1-5 moves, and in general whenever the hypothesis Forces K K.tris T holds. Open, not proven: the 3-3 and 2-4 moves. A proof that stays inside the six vertices of a 3-3 move cannot work: over the 2^18 sets of the 18 triangles on the six vertices, the closure before the move minus the triangle sigma is not contained in the closure after the move in 3744 cases, and the converse fails in 3744; the map that replaces sigma by tau sends 12016 of the 39942 closed local sets to non-closed ones. What holds locally (exhaustive): all 18 mixed triangles are forced before the move iff they are forced after it. Numerical evidence only (scripts/spinfoam/forcechain.py): random sequences of 3-3, 2-4 and 1-5 moves from the boundary of the 5-simplex kept the gauge set forcing in every sampled case; the inverse 4-2 and 5-1 moves lose forcing of the transported set at some locations, though a forcing gauge set was found directly on every such complex sampled. Counterexample for the 3-3 move (numerical, pinned by counterexample_33() in scripts/spinfoam/forcechain.py): on a closed triangulation of the 4-sphere with 48 simplices there is a collapsible forcing gauge set of size E-V+1 that stops forcing after a 3-3 move with the set unchanged (42 triangles left unforced). Random search found such cases in 11 of about 99,000 trials, so forcing is not preserved by 3-3 for every forcing gauge set. Measured in about 162,000 further trials with random minimal forcing sets: T forces after the 3-3 move exactly when the closure of T under the tetrahedra that do not contain the moved triangle sigma already reaches every other triangle (no forcing step needs sigma); the characterization for the 3-3 move is the separate entry LL-0077 (proved in Lean)."
  since: 0.3.0
- id: LL-0070
  title: Three-term recurrence of the real q-Racah sum at a root of unity
  area: TuraevViro
  file: Lightlike/TuraevViro/Reflect/RacahReal.lean
  decls: [Lightlike.TV.Refl.real_recurrence]
  status: proven
  tier: established
  source:
    refs:
      - {ref: koekoek-swarttouw-1996, location: "eq. (3.2.1)", check: "q-Racah"}
      - {ref: koekoek-swarttouw-1996, location: "eq. (3.2.2)", check: "orthogonality"}
  review: kernel-checked
  note: "For the finite q-Racah sum SR at q = e^{iπ/r}, the three-term recurrence in the third colour holds under explicit conditions: some a_i = L + 1 with L ≥ 0, b₁ - a_i ≤ r - 2, b₂ - L ≤ r - 2, b₃ - L ≤ r - 2, and r does not divide b₂ + b₃ - a₂ - a₃ + k for k = 0, 1, 2. The case where all a_i = 0, and the case where r divides one of those quantum-integer arguments (which occurs for admissible data), are not covered by this statement. Compare Koekoek–Swarttouw (3.2.5); the coefficients were not compared term by term with that source."
  since: 0.3.0
