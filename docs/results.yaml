  note: "Second source (25 Nov 2026, read): Yamagami, arXiv:0801.1739, Section 2.2, p. 5 (between Proposition 2.7 and Proposition 2.8): for a quasi-free state phi_S(e^{ix}) = e^{-S(x,x)/2} of a CCR C*-algebra with polarization S (S(x,y) - S(y*,x*) = i sigma(x*,y)), 'phi_S is a pure state if and only if S is extremal in Pol(V, sigma), i.e., S is a projection' (stated as known, by the theory of Fock representations and purification, Section 5; no proof there). His S is half the complexified form eta + i omega of this library up to the factor of the exponent (exp(-S(x,x)/2) against exp(-eta(x,x)/4)), and S a projection is the compatible complex structure here; the same one-sided difference: only sufficiency is proved. Bratteli-Robinson 2 (the row names it) was not accessible, so no comparison with its text; Manuceau-Verbeure, Comm. Math. Phys. 9 (1968) 293 was seen only as an abstract (pure states are the Fock states). Compared with Gérard, arXiv:1901.10175, Section 4.9.1, Proposition 4.9.1 (read, text extracted from the PDF): a quasi-free state with covariance eta (his convention omega(W(x)) = exp(-(1/2) x.eta x), so his 2 eta is the eta here with exp(-(1/4) eta)) is pure iff (2 eta^cpl, sigma^cpl) is Kahler, i.e. there is an anti-involution j in Sp with sigma j = 2 eta; the proof there is cited to Derezinski-Gerard, Theorem 17.13, and is not read. Differences: WEAKER, only the sufficiency half is proved (a compatible J gives purity); the necessity (pure implies a compatible J) is not proved. REPRESENTATION, the space is finite-dimensional with eta positive definite on the quotient; the proof identifies the GNS space with a Fock space of the complex inner product eta + i omega and uses irreducibility of the Fock representation, not the Kahler argument; the sign of the J relation (omega = -eta J) is a convention. Lemmas it uses from other files: Lightlike.OperatorAlgebras.QuasiFreeState.isPureState_qfState_of_equiv (Lightlike/OperatorAlgebras/QuasiFreeState/FockEquiv.lean)."
