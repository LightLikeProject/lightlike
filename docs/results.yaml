- id: LL-0462
  title: The Lorentzian discrete Einstein equations - for non-degenerate squared edge lengths, the Lorentzian Regge action is stationary under every variation of the squared lengths that fixes the boundary lengths exactly when the sum over the interior triangles at each interior edge of the derivative of the triangle area with respect to the squared edge length times the Lorentzian deficit vanishes
  area: Regge
  file: Lightlike/Regge/Lorentzian/ReggeEquations.lean
  decls: [Lightlike.ReggeLor.lorReggeAction_stationary_iff]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: sorkin-2019, location: "Section 9", check: "defect"}
  review: kernel-checked
  note: "Compared with Sorkin (2019), Section 9 (read), for the angles and deficits only: the Regge action is the sum over interior hinges of area times defect angle, theta = flat value - sum of the dihedral angles (eq. (26)), with theta = -2 pi i - sum theta_j at a spacelike hinge (eq. (27)) and 2 pi - sum theta_j at a timelike hinge (eq. (28)), the area taken non-negative; the paper also notes that angle additivity implies stationarity of the action in the continuum, but does not write the discrete Regge equation. Comparison pending for the equation itself (Sorkin 1975 and Asante-Dittrich-Padua eq. (3.2) were not read); the form here, a sum of area derivative times deficit over the triangles at an interior edge, is the library's. Hypothesis LorLengthsNondeg4 K L: no null triangle, no null tetrahedron, every 4-simplex Lorentzian (gram4L < 0), in every labelling. The variation is along a line of signed squared lengths L + tau v with v = 0 on the boundary edges; the action lorReggeAction is complex (Sorkin's complex angles with the causal-type weights), HasDerivAt at tau = 0 with derivative 0, and the equations are the complex sum over interior triangles of lorAreaPartial * lorDeficit = 0, where lorAreaPartial = +- (L_f + L_g - L_e)/(4 sqrt|triHL|) with the sign of triHL. The derivative of the angles drops out by the Lorentzian Schlaefli identity (lorSchlaefli4_finset). The statement says nothing on solutions other than flat Minkowski space (the flat case is the separate flat-solution entry). Non-vacuity: the cone example in Tests.lean (lorReggeAction_stationary_iff applied at an interior edge of the cone, with four interior triangles) instantiates the hypotheses."
  since: unreleased
- id: LL-0463
  title: Time evolution exp(-i t H) of a self-adjoint Hamiltonian on a finite-dimensional Hilbert space is a one-parameter unitary group that preserves inner products
  area: QM
  file: Lightlike/QM/Basic.lean
  decls: [Lightlike.QM.evolve_add, Lightlike.QM.inner_evolve]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: A First Approach to Quantum Mechanics|10.1007/978-1-4614-7116-5_3"}
  review: kernel-checked
  note: "On a finite-dimensional complex inner product space, for a self-adjoint operator Hm, U(t) = exp(-i t Hm) (built as Mathlib's selfAdjoint.expUnitary of -t Hm, so U(t) is unitary by construction) satisfies U(s + t) = U(s) U(t) (evolve_add; with evolve_zero a one-parameter group) and ⟨U(t) φ, U(t) ψ⟩ = ⟨φ, ψ⟩ (inner_evolve: transition amplitudes are preserved; the norm case is norm_evolve in LL-0006). The Schrödinger equation is schrodinger (LL-0006). The source location is the chapter on quantum mechanics of Hall's book, chapter level only: no statement was compared at a section or equation number."
  since: unreleased

- id: LL-0464
  title: The Born probabilities of an observable in a unit state sum to one, ‖P_μ ψ‖² over the eigenvalues μ
  area: QM
  file: Lightlike/QM/Basic.lean
  decls: [Lightlike.QM.sum_bornProb]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: A First Approach to Quantum Mechanics|10.1007/978-1-4614-7116-5_3"}
  review: kernel-checked
  note: "For a self-adjoint operator A on a finite-dimensional complex Hilbert space with eigenvalues μ and orthogonal projections P_μ onto the eigenspaces, the Born probability of the outcome μ in the state ψ is bornProb A ψ μ = ‖P_μ ψ‖², it is nonnegative, and for a unit vector ψ the probabilities sum to 1 (sum_bornProb; Parseval for the eigenspace decomposition, sum_bornProb_eq_norm_sq, from Mathlib's spectral theorem). They form a probability distribution bornPMF on the eigenvalues. The probability is defined with the eigenspace projection, so it does not depend on a choice of eigenvectors in a degenerate eigenspace. This is the Born rule as a definition plus a normalisation theorem: the statement that measurement outcomes occur with these probabilities is a postulate and is not proved. Source location chapter-level only (Hall 2013, chapter on a first approach to quantum mechanics)."
  since: unreleased

- id: LL-0465
  title: The expectation value ⟨ψ, A ψ⟩ is the Born-weighted sum of the eigenvalues of A
  area: QM
  file: Lightlike/QM/Basic.lean
  decls: [Lightlike.QM.expectation_eq_sum]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: A First Approach to Quantum Mechanics|10.1007/978-1-4614-7116-5_3"}
  review: kernel-checked
  note: "For a self-adjoint operator A on a finite-dimensional complex Hilbert space and any vector ψ, ⟨ψ, A ψ⟩ = Σ_μ μ ‖P_μ ψ‖² over the eigenvalues μ of A, with P_μ the orthogonal projection onto the eigenspace (expectation_eq_sum), by the spectral theorem isometry H ≅ ⊕ E_μ. For a unit vector the weights are the Born probabilities of LL-0464. Source location chapter-level only (Hall 2013)."
  since: unreleased

- id: LL-0466
  title: The Born probabilities of an observable that commutes with the Hamiltonian are conserved under time evolution
  area: QM
  file: Lightlike/QM/Basic.lean
  decls: [Lightlike.QM.bornProb_evolve_of_commute]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: A First Approach to Quantum Mechanics|10.1007/978-1-4614-7116-5_3"}
  review: kernel-checked
  note: "If the self-adjoint operator A commutes with the self-adjoint Hamiltonian Hm, then for every real t, vector ψ and eigenvalue μ of A, bornProb A (U(t) ψ) μ = bornProb A ψ μ, where U(t) = exp(-i t Hm) (bornProb_evolve_of_commute). Proof: U(t) commutes with A, so it maps each eigenspace into itself, commutes with each eigenspace projection P_μ and preserves the norm. Source location chapter-level only (Hall 2013)."
  since: unreleased
- id: LL-0467
  title: The map from the ten squared edge lengths of a 4-simplex to the ten squared areas of its triangles is strictly differentiable at every point, with derivative the Jacobian matrix of the squared areas
  area: Regge
  file: Lightlike/Regge/AreaRegge/Deriv.lean
  decls: [Lightlike.AreaRegge.hasStrictFDerivAt_areaSqMap]
  status: proven
  tier: established
  source:
    refs:
      - {ref: brw-1999, location: "eq. (2)", check: "neighbourhood of the regular four-simplex"}
  review: kernel-checked
  note: "Compared with Barrett, Rocek, Williams (1999), eq. (2) (read): the squared area of the triangle ijk is (2 (s_ij s_jk + s_ik s_jk + s_ij s_ik) - s_ij^2 - s_jk^2 - s_ik^2) / 16 in the squared edge lengths s, Heron's formula as used here (triAreaSq); the paper then uses the Jacobian of the edge-length to area map, non-singular near the regular simplex, and states no differentiability result (a polynomial map is smooth). areaSqMap s t is Heron's formula for the squared area of triangle t in the squared edge lengths s (triAreaSq, a polynomial, so the map is smooth on all of R^10, with no non-degeneracy hypothesis; at degenerate or non-geometric s the 'areas' are the polynomial values, possibly negative). The derivative jacCLM s is the continuous linear map of the matrix jac s; strict differentiability (HasStrictFDerivAt) is the hypothesis of the inverse function theorem used for the local invertibility entry (Near the regular 4-simplex the ten triangle areas determine the ten edge lengths)."
  since: unreleased
- id: LL-0468
  title: "Stationary phase with complex phase, leading term, for phase and amplitude on Fin n -> R (Hörmander, Theorem 7.7.5): the integral of a e^{i tau phi} is the sum over the nondegenerate critical points of e^{i tau phi(x0)} (2 pi/tau)^{n/2} det(-iH)^{-1/2} a(x0) up to O(tau^{-n/2-1})"
  area: Oscillatory
