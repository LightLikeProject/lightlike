      - {ref: hinterbichler-2012, location: "eq. (2.1)", check: "Fierz-Pauli"}
  review: kernel-checked
  note: "Part of the linearization of 3D Regge calculus (T-RC3), which stays open. For a C^3 symmetric field h of 3x3 matrices on R^3 invariant under integer translations, the integral over the unit cube of -1/4 Sum h_ij eps_ikl eps_jmn d_k d_m h_ln (the Saint-Venant form, the limit of Qn_converges) equals the integral of -1/4 Sum (d_l h_mn)^2 + 1/2 |div h|^2 - 1/2 (div h).(d tr h) + 1/4 |d tr h|^2, one half of the massless Fierz-Pauli Lagrangian of a time-independent field with the term d_m h_nl d_n h_ml written as (div h)^2 (saintVenant_eq_fierzPauli). Proof: the difference of the two densities is the divergence of an explicit periodic C^1 field (fp_identity, a polynomial identity for symmetric h, dh, dd; div_Tfield), and the integral of a periodic divergence over the unit cube is zero (integral_div_periodic, Mathlib's divergence theorem on the box). The hypothesis eq. (2.1) of the reference is the Fierz-Pauli action by name only; the comparison of the density with it is made in the module docstring, not by the source tool. Limits: C^3 periodic symmetric fields on the torus R^3/Z^3, Euclidean indices; that the eta^2 coefficient of the cube integral of (R/2) sqrt(det g) for g = 1 + eta h is half the integral of fpDens (the integral itself being the second eta-derivative) is proved in a later entry (LL-0130), not here; no gauge condition, no mass term. Trust checks: scripts/regge/fierz_pauli_check.py integrates both densities over the unit cube for random periodic trigonometric fields (difference below 1e-13) and shows that a field with a non-periodic polynomial part gives a difference of about 2.8 (numerical evidence, not proof)."
  since: 0.3.0
- id: LL-0130
  title: The eta^2 coefficient of the cube integral of the scalar-curvature density of 1 + eta h is half the integral of the Fierz-Pauli density, with an O(|eta|^3) remainder
  area: Regge
  file: Lightlike/Regge/Linear3/EtaCoefficient.lean
  decls: [Lightlike.Regge.Linear3.eh_eta_sq_coeff, Lightlike.Regge.Linear3.eh_eta_sq_coeff_zero]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: hinterbichler-2012, location: "eq. (2.1)", check: "Fierz-Pauli"}
  review: kernel-checked
  note: "The expansion of the Einstein-Hilbert density of 1 + eta h to second order in eta, whose quadratic term is the Fierz-Pauli density (the form cited from Hinterbichler 2012, eq. (2.1), is the Fierz-Pauli action); the term-by-term agreement is a statement of the module docstring FierzPauli.lean, not checked by the source tool. Fourth step of the comparison of the linearized Regge action with the Einstein-Hilbert action (T-RC3 in dimension 3, which stays open). For a C-infinity symmetric Z^3-periodic matrix field h on R^3 there are C and eta_0 > 0 such that for |eta| <= eta_0 the integral over the unit cube of (R/2) sqrt(det g) for g = 1 + eta h differs from (eta^2/2) times the integral over the unit cube of the Fierz-Pauli density fpDens(dh) = -1/4 |dh|^2 + 1/2 |div h|^2 - 1/2 div h . d tr h + 1/4 |d tr h|^2 by at most C |eta|^3 (eh_eta_sq_coeff). The first coefficient integrates to zero because it is the divergence of the periodic field S_i = sum_j d_j h_ij - d_i tr h, and the second coefficient differs from fpDens by the divergence of an explicit periodic field T' (F2_eq in CurvaturePoly.lean), so both integrate by Mathlib's divergence theorem on the box with the faces cancelling by periodicity; the pointwise expansion is the uniform second-order expansion of the curvature density (feta_expansion) applied to the jet of h, restricted to the cube. Together with the convergence of the linearized Regge coefficient to the Saint-Venant form and the equality of the Saint-Venant and Fierz-Pauli integrals (LL-0129), this identifies the limit of the linearized Regge coefficient with the second eta-derivative (twice the eta^2 coefficient) of the integrated curvature density of 1 + eta h. Limits: dimension 3; the unit cube with periodic C-infinity symmetric fields (C-infinity as IsCoordMetric requires); the remainder constant is not explicit; the statement is about the integral of the density of the metric 1 + eta h, not about the Regge action, about interpolated or geodesic edge lengths or about a limit of triangulations; two parts of the 3D linearization (RC3) stay open: the envelope step relating geodesic edge lengths to the interpolated ones, and the 3D wrong-model control. Trust checks: the zero field satisfies the hypotheses (eh_eta_sq_coeff_zero); the coefficient for a non-zero field is checked numerically (scripts/regge/regge3d_linearized_check.py: the second eta-derivative of the integrated density equals the Fierz-Pauli integral to six digits for one random field), not in Lean."
  since: 0.3.0
- id: LL-0131
  title: The Regge action of the periodic Kuhn complex of the 3-torus with geodesic lengths of a periodic Riemannian metric tends to half the Einstein-Hilbert action
  area: Regge
  file: Lightlike/Regge/Linear3/TorusConvergence.lean
  decls: [Lightlike.Regge.Linear3.torus_regge_converges]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Section 1", check: "converges in the sense of measures"}
  review: kernel-checked
  note: "A special case, for one periodic family of triangulations, of the convergence theorem of Cheeger, Mueller and Schrader (1984), cited as described in Christiansen 2011, Section 1; the comparison with the original paper is pending: it was not read. For a Z^3-periodic Riemannian metric g on R^3, the Regge action of the periodic Kuhn complex of the 3-torus with mesh 1/N and the geodesic edge lengths of g equals the lattice hinge sum of the convergence theorem on the cube (reggeAction_torus_eq; edges are in bijection with (cell, class) pairs, the dihedral angles are the angles of the squared corner distances, no boundary layer), so it converges to the integral over the unit cube of (R/2) sqrt(det g) (torus_regge_converges). Limits: convergence only, no rate; the standard cubical Kuhn triangulation of the torus; one periodic Riemannian metric; not the theorem of Cheeger, Mueller and Schrader for arbitrary fine triangulations of a manifold."
  since: 0.3.0
- id: LL-0132
  title: The sum Q_n of the linearized Regge action of the periodic Kuhn complex converges to the Saint-Venant form
  area: Regge
  file: Lightlike/Regge/Linear3/LinearizedLimit.lean
  decls: [Lightlike.Regge.Linear3.Qn_converges]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "eq. (5)", check: "The degrees of freedom (5) make sense"}
      - {ref: christiansen-2011, location: "Proposition 3.2", check: "constant Euclidean metric"}
  review: kernel-checked
  note: "For a C^3 symmetric Z^3-periodic matrix field h on R^3, Q_n(h) = sum over edges of (mu_e / (2 l_e)) delta_e'(0) for the periodic Kuhn complex of mesh 1/n with the squared lengths l_e^2 + eps mu_e(h), mu_e the degrees of freedom of the Regge interpolant (Christiansen 2011, eq. (5)), tends as n goes to infinity to the integral over the unit cube of -1/4 sum h_ij eps_ikl eps_jmn d_k d_m h_ln, the Saint-Venant form (Qn_converges). Proof: the lattice form of Q_n, the second-order expansion of the degrees of freedom, the vanishing of the zeroth and first order class sums, the pointwise identity of the 36 incidences, Riemann sums with cell sample points. Limits: convergence only, no rate; the interpolated lengths, not the geodesic lengths; one smooth periodic field on the standard cubical Kuhn complex; the sign of the deficit angle relative to 2 pi minus the angle sum is fixed by the numerical check, not by the paper. Trust checks: non-zero field, the numerical check scripts/regge/regge3d_linearized_check.py (sign and factor controls fail)."
  since: 0.3.0
- id: LL-0133
  title: Einstein's equations for an FLRW spacetime with a perfect fluid are equivalent to Friedmann's two equations
  area: Cosmology
  file: Lightlike/Cosmology/FLRW.lean
  decls: [Lightlike.Cosmology.flrw_einstein_iff_friedmann]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.36)", check: "Friedmann"}
  review: kernel-checked
  note: "The FLRW metric -dt² + a(t)² dx² / (1 + k|x|²/4)² in isotropic coordinates, for every real k, on the set where t ∈ I and 1 + k|x|²/4 > 0 (the Poincaré ball for k < 0, all of ℝ³ for k ≥ 0), with a smooth positive a on an open interval I and the perfect fluid (ρ + p) u u + p g at rest in the chart: G + Λ g = 8πG T holds there iff Friedmann's first and second equations hold at every t ∈ I (units c = 1). The same statement with Physlib's FirstOrderFriedmann and SecondOrderFriedmann at c = 1 on the right is flrw_einstein_iff_physlib_friedmann in Lightlike/Cosmology/FLRWPhyslib.lean. The continuity equation follows (friedmann_continuity, for G ≠ 0). Trust checks: de Sitter with k = 0 solves the equations iff H² = 8πGρ/3; Einstein's static dust universe with k = 1 iff Λ = 1/a² = 4πGρ; with k = -1 there is no static dust solution; scripts/flrw_check.py recomputes the Ricci and Einstein components with sympy and shows that the metric with the sign of k flipped fails them. Limits: a statement in one chart, not on a manifold I × Σ; for k > 0 the chart misses one point of the 3-sphere; ρ and p depend on t only and the fluid is comoving, by assumption. The comparison with the cited source is pending."
  since: 0.3.0
- id: LL-0134
  title: The Plancherel formula of SL(2,ℂ) for smooth compactly supported functions, Σ_n ∫ (n² + 4ρ²) ‖π_{n,ρ}(f)‖²_HS dρ = 16π⁴ ∫ |f|² dg
  area: Lorentz
  file: Lightlike/Lorentz/Plancherel.lean
  decls: [Lightlike.Lorentz.plancherel, Lightlike.Lorentz.plancherel_trace, Lightlike.Lorentz.plancherel_trace_perezRovelli, Lightlike.Lorentz.plancherel_trace_ruhl]
  status: proven
  tier: established
  source:
    refs:
      - {ref: knapp-1986, location: "Chapter: Chapter II. Representations of SU(2), SL(2, ℝ) and SL(2, ℂ)|10.1515/9781400883974-005"}
  review: kernel-checked
  note: "For f smooth with compact support on SL(2,ℂ) (the restriction of a smooth compactly supported function on 2×2 complex arrays), the principal series π_{n,ρ} (n ∈ ℤ, ρ ∈ ℝ, on L²(ℂ)) satisfy Σ_{n∈ℤ} ∫_ℝ (n² + 4ρ²) ‖π_{n,ρ}(f)‖²_HS dρ = 16π⁴ ∫ |f|² dg (plancherel), with every integrand integrable, and equivalently Σ_n ∫ (n² + 4ρ²) tr π_{n,ρ}(F) dρ = 16π⁴ F(1) (plancherel_trace). Normalization: dg is the Haar measure haarC = d²β d²γ d²δ/|δ|² in the chart g = [[(1+βγ)/δ, β],[γ, δ]]; π_{n,ρ}(g)φ(z) = m_{n,ρ}(βz+δ) φ((αz+γ)/(βz+δ)) with m_{n,ρ}(λ) = |λ|^{2iρ−2}(λ/|λ|)^n; n runs over all of ℤ and ρ over ℝ, so each class π_{n,ρ} ≅ π_{−n,−ρ} is counted twice. The constant 16π⁴ depends on these choices; in the variables of Perez–Rovelli (σ = 2ρ) the formula reads F(1) = (1/(32π⁴)) Σ_n ∫ (n² + σ²) tr T_{n,σ}(F) dσ (plancherel_trace_perezRovelli), and in Rühl's variables with dg_R = (2π)⁻⁴ haarC it reads F(1) = ½ Σ_ν ∫ (ν² + ρ_R²) tr D^χ(F) dρ_R (plancherel_trace_ruhl; the identification of Rühl's labels is argued in the docstring, not formalised, and Rühl's text was not consulted, only its quotation in Simão arXiv:2405.01360 App. B). Perez–Rovelli (gr-qc/0011037, A11 and A16) print 1/(8π⁴), which is four times too large: kind of the difference, a misprint in the source (the Haar measure (A8) and the representations (A6) are those used here, and the range of σ accounts for a factor 2 at most); the library agrees with Rühl as quoted by Simão, arXiv:2405.01360, App. B.1, B.3 and eq. (B.3.1) (checked against the thesis text: labels, the constant 1/2 and the measure are as Plancherel.lean quotes them). Lean witness: testLF_perezRovelli_constant. Checks: scripts/lorentz/plancherel_check.py reproduces the constant from the kernel alone to 2e-7 relative (numerical evidence, not the proof), and gives 4.0000008 F(1) for the 1/(8π⁴) constant. Independent hand check for K-biinvariant f: the n = 0 sector alone, with the spherical function sin(ρr)/(ρ sinh r), haar radial form 4π³∫F(cosh r) sinh² r dr (Radial.lean) and ∫_ℝ ρ sin(ρr) dρ = −2π δ′(r), gives F(1) exactly. Scope: smooth compactly supported functions only; not the full Plancherel theorem for L². The source locations are chapter-level only (Knapp 1986 chapter II here; the milestone cites Gelfand–Graev–Vilenkin 1966, chapter on harmonic analysis on the complex unimodular 2×2 matrices): no section or equation number was checked against the constant. The comparison with the cited source at chapter level is pending; the comparison of the constant with Perez–Rovelli (A11), (A16) and with Rühl is as stated above."
  since: 0.3.0
- id: LL-0135
  title: The scaled Lorentzian vertex is an integral over R^44 of a(x) e^{lambda S(x)} in the fixed charts of SL(2,C) with Lebesgue density, and a stationary-phase expansion holds there under named hypotheses
  area: Asymptotics
  file: Lightlike/Asymptotics/Lorentzian/VertexFixChart.lean
  decls: [Lightlike.Asymptotics.Lorentzian.lorVertex_asymptotics_fixChart, Lightlike.Asymptotics.Lorentzian.lorChartAction_fixVertexChart_contDiffOn, Lightlike.Asymptotics.Lorentzian.fixVertexChart_group_contDiffOn]
  status: conditional
  hypotheses: [Lightlike.Asymptotics.Lorentzian.VertexJointIntegrable, Lightlike.Asymptotics.Lorentzian.CriticalSetIs, Lightlike.Asymptotics.Lorentzian.HessianInvertible, Lightlike.Asymptotics.Lorentzian.FarRemainderBound]
  tier: frontier
  source:
    refs:
      - {ref: bdfhp-2010, location: "eq. (53)", check: "Regge state"}
  review: kernel-checked
  note: "The Haar measure of SL(2,C) is Lebesgue measure in the chart g_0 (FixedChart.lean, density 1); through a measure-preserving linear identification of R^44 with (C^3)^4 x C^10 the vertex of the scaled data (lambda j, lambda p) with constants cc(lambda) is (prod cc) s^-4 times the integral over R^44 of a(x) e^{lambda S(x)}, a = prod 1/(|Z_ab|^2 |Z_ba|^2) independent of lambda, s the Haar normalisation factor (VertexHaarChart.lean). The chart is smooth where the third coordinate of each chart is nonzero, and the sum over the critical points with the error O(lambda^(m - 23)) follows from weighted_asymptotics_local. Each named hypothesis is its own proof task, with a statement and an open proof: T-SF10-P1 (VertexJointIntegrable), T-SF10-P2 (HessianInvertible at a critical point), T-SF10-P3 (FarRemainderBound), T-SF10-P4 (CriticalSetIs: finiteness and classification of the critical set). In the fixed chart, lorVertex_suppressed_fixChart (VertexSuppressed.lean) proves the non-closing case of item 4 of the theorem (BDFHP eq. (56): boundary data whose normals do not close at a node are suppressed faster than every power), given the far-remainder bound. NOT PROVED (named hypotheses): the joint integrability of the integrand on SL(2,C)^4 x C^10 and the measurability of the outer integral (the vertex is defined as an iterated integral; the existing finiteness is of the complex inner integral, not of its modulus), the classification of the critical set (hK), the invertibility of the Hessian (hdet), the remainder bound (hfar) and its integrability (hint), and the weight bound. The two-point formula with the constants of eq. (57) for an action smooth only on an open set is lorVertex_asymptotic_formula_local (AsymptoticFormulaLocal.lean), under the same hypotheses; the constants of eq. (57) are not computed.  Status conditional, as the hypotheses are open facts about lorVertex itself, not conditions on the input data: joint integrability hjoint and measurability hF of the vertex integrand, the invertibility of the Hessian hdet (assumed by BDFHP), the remainder estimate hfar with its integrability hint (not in BDFHP; hint is assumed only for lambda in N, the integer sequence the proof uses: the form for all real tau fails for tau < 0 wherever an overlap vanishes), and the classification hK of the critical points (BDFHP Sec. 5.4.3, outside SU(2) via the bivector theorem of arXiv:0902.1170); the cutoff chi, the weight bound hw and the boundary data are conditions checked per instance. The error exponent m - 23: the stationary phase in 44 real dimensions gives the leading term order lambda^(-44/2) = lambda^(-22) and the error one further power lambda^(-23), times the order lambda^m of the weight (hw). Differences from BDFHP eq. (53), read at Sec. 6.4: the statement is the generic stationary-phase sum over an abstract finite critical set K, with an error bound O(lambda^(m - 23)) where the source states an asymptotic equivalence; it does not identify the phase with gamma Sum k Theta, the sign (-1)^(chi + M), the order lambda^(-12) or the two parity-related critical points of eq. (53); and lambda runs over the natural numbers. Update (24 Nov 2026): VertexJointIntegrable is proved for positive spins and unit boundary spinors (vertexJointIntegrable_of_unit, T-SF10-P1); the other three hypotheses remain. FarRemainderBound asks the integrability of (1 - chi) a e^{lambda S} for every lambda >= 1 (not lambda = 0, where e^{lambda S} = 1 and a need not be integrable) and the O(lambda^-23) bound; the hypothesis integrability of the remainder in lorVertex_asymptotics_local is stated for lambda >= 1 likewise."
  since: 0.3.0
- id: LL-0136
  title: "A set of triangles that is robust for a closed 4D complex, together with the triangle {a, p, q}, forces every triangle after any 2-4 Pachner move"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingRobust.lean
  decls: [Lightlike.SpinFoam.forces_move24_of_robust]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is this library's rule (a tetrahedron with three of its triangles in the set forces the fourth). T is robust for K (Robust K T) if it forces every triangle of K with any one tetrahedron removed. Statement: if T is robust for K and a 2-4 move removes the tetrahedron sigma and adds the edge {p, q}, then T together with {a, p, q}, a in sigma, forces every triangle of the complex after the move (forces_move24_of_robust). Proof: the closure condition of forces_move24_iff (the closure of T under the tetrahedra other than sigma is complete) is robustness at sigma, because the only tetrahedron that contains sigma is sigma. Non-vacuity: forces_move24_of_robust_example, on the boundary of the 5-simplex after a 1-5 move, with fourteen triangles robust for the 25 tetrahedra (checked by the kernel from explicit forcing steps) and the move {0,1,2,3} -> {5,6}. Scope: the 2-4 move only. Not claimed: that robust sets stay robust under the 2-4 move (false in general: 1 of 67,712 random locations), or that a robust forcing set exists on every complex reached from the boundary of the 5-simplex. Compared with Freidel and Louapre (2003), Section IV.B (read): the paper fixes the translational gauge symmetry of the 3D Ponzano-Regge model with a maximal tree T of the 1-skeleton (V - 1 edges), sets j_e = 0 on the edges of T and collapses them (eqs. (52) and (53)), the result being independent of the tree. Representation: the 4D forcing rule on triangles of a 4D complex, robustness under the 2-4 move, has no counterpart in the paper; it is the library's own combinatorial analogue."
  since: 0.3.0
- id: LL-0137
  title: "A set of triangles that is robust for a closed 4D complex and does not contain the triangle removed by a 3-3 Pachner move forces every triangle after the move"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingRobust.lean
  decls: [Lightlike.SpinFoam.Forcing33.lemmaX_abstract, Lightlike.SpinFoam.Forcing33.forcesIn_common_of_robust_33, Lightlike.SpinFoam.Forcing33.forces_move33_of_robust]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Forcing is this library's rule (a tetrahedron with three of its triangles in the set forces the fourth); a set T is robust for K if it forces every triangle with any one tetrahedron removed. Statement (Lemma X): if T is robust for K, does not contain the triangle sigma that a 3-3 move removes, then the closure of T under the tetrahedra that do not contain sigma already reaches every other triangle (forcesIn_common_of_robust_33); with forces_move33_iff, T forces every triangle after the move (forces_move33_of_robust). Proof: if the closure A misses a triangle, the complement of A among the common triangles is a nonempty blocking set for the common tetrahedra that avoids T. In the tetrahedron sigma + c_k it meets n_k of the three triangles {s_i, s_j, c_k}. The set A plus sigma is closed under sigma + c_k when n_k is not 1, and A when n_k is not 0; of the three values n_k, at most one is 1 or at most one is 0, so one of the two sets is closed under all tetrahedra but one, and the robustness hypothesis for that tetrahedron puts sigma, or every triangle, in it, a contradiction (lemmaX_abstract, by soundness of forcing). Non-vacuity: forces_move33_of_robust_example on the boundary of the 5-simplex after a 1-5 and a 2-4 move, with fifteen triangles robust for the 30 tetrahedra (checked by the kernel from explicit forcing steps) and the move {0,2,3} -> {4,5,6}. Scope: forcing after the 3-3 move, not robustness after it. Robustness is not kept in general under the 3-3 move: robust_not_kept_by_move33 (Tests.lean) proves it by decide on an explicit 4-sphere with 20 simplices and a set of 23 triangles that is robust for K and not for the complex after the move (checked independently by scripts/spinfoam/robust_counterexample_verify.py); for the 2-4 move a random search found a counterexample in 1 of 67,712 locations (numerical evidence only); whether the gauge set carried along from the boundary of the 5-simplex stays robust is open (robust in every sample). Compared with Freidel and Louapre (2003), Section IV.B (read): the paper fixes the translational gauge symmetry of the 3D Ponzano-Regge model with a maximal tree T of the 1-skeleton (V - 1 edges), sets j_e = 0 on the edges of T and collapses them (eqs. (52) and (53)), the result being independent of the tree. Representation: the 4D forcing rule on triangles of a 4D complex, robustness under the 3-3 move, has no counterpart in the paper; it is the library's own combinatorial analogue."
  since: 0.3.0
- id: LL-0138
  title: "Robustness of a forcing set of triangles is not kept by the 3-3 Pachner move"
  area: SpinFoam
  file: Lightlike/SpinFoam/ForcingRobustCounterexample.lean
  decls: [Lightlike.SpinFoam.robust_Kcex, Lightlike.SpinFoam.not_robust_Kcex_move, Lightlike.SpinFoam.robust_not_kept_by_move33]
  status: proven
  tier: frontier
  source: structural
  review: kernel-checked
  note: "A set T of triangles is robust for a complex K if it forces every triangle with any one tetrahedron removed (forcing: a tetrahedron with three of its triangles in the set forces the fourth). Statement: there is a 4-sphere K, a 3-3 move that removes a triangle sigma, and a set T that is robust for K, does not contain sigma, and is not robust for the complex after the move (robust_not_kept_by_move33). The example has 20 simplices on 8 vertices and |T| = 23, with the move {3,6,7} -> {0,2,4}; T forces every triangle of K with any of its 50 tetrahedra removed (robust_Kcex, from 1450 explicit forcing steps checked by the kernel), and in the complex after the move, with the tetrahedron {0,2,3,6} removed, a set of 18 triangles that avoids T is closed under the complement of the forcing rule, so forcing from T never reaches it (not_robust_Kcex_move, by soundness of forcing). The example was found by random search and is checked independently by scripts/spinfoam/robust_counterexample_verify.py. Scope: the 3-3 move; for the 2-4 move a random search found a counterexample in 1 of 67,712 locations (numerical evidence only). It does not say that the gauge set carried along from the boundary of the 5-simplex fails to stay robust: that is open (robust in every sample). Compile time: about 33 seconds."
  since: 0.3.0
- id: LL-0139
  title: The deficit angles of a closed triangulated surface with Euclidean triangles add up to 2π(V − E + F), and the octahedron in the unit sphere gives 4π
  area: Regge
  file: Lightlike/Regge/GaussBonnet2D.lean
  decls: [Lightlike.Regge.discrete_gauss_bonnet, Lightlike.Regge.sum_angleOf, Lightlike.Regge.octahedron_deficit_sum, Lightlike.Regge.octOpen_deficit_sum_ne]
  status: proven
  tier: established
  source: structural
  review: kernel-checked
  note: "Part of T-RC6, which stays open: this is the 2D check that the deficit angles of the round sphere add up to 4π, not the convergence theorem. For a finite set of triangles in which every edge lies in exactly two triangles, with angles that add up to π in every triangle, the deficit angles 2π minus the sum of the angles around a vertex add up to 2π(V − E + F). The sum of the angles over all vertices is πF (a double count of the vertex–triangle incidences) and 3F = 2E (a double count of the edge–triangle incidences); the angles of a Euclidean triangle add up to π (Mathlib's EuclideanGeometry.angle_add_angle_add_angle_eq_pi). Instance: the octahedron inscribed in the unit sphere (vertices ±e_i, eight equilateral faces, the chordal edge lengths of the sphere) has V = 6, E = 12, F = 8, so the deficit sum is 4π = 2πχ. Wrong model: the octahedron minus one face is not closed and its deficit sum is 2π·6 − π·7 = 5π, not 2π(6 − 12 + 7) = 2π, so the closedness hypothesis is needed. Limits: an abstract set of triangles with Euclidean angles, no Regge action and no convergence statement, no triangulation of a manifold other than this closed one; only the octahedron is checked as an instance."
  since: 0.3.0
