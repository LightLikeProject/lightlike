- id: LL-0162
  title: A time-oriented Lorentzian manifold has a smooth future-directed timelike vector field
  area: Spacetime
  file: Lightlike/Spacetime/Causal/SmoothOrientation.lean
  decls: [Lightlike.Causal.exists_smooth_field]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hawking-ellis-1973, location: "Chapter: Causal structure|10.1017/CBO9780511524646.007"}
  review: kernel-checked
  note: "On a Hausdorff, second countable, finite-dimensional Lorentzian manifold with a time orientation given by a continuous timelike field X, there is a smooth vector field X' with g(X', X') < 0 and g(X', X) < 0 everywhere: X' is timelike and future-directed. A smooth partition of unity glues local smooth fields; the future timelike cone is convex (IsLorentzianForm.convex_futureTimelike), so the glued field stays in it. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Differences to be approved by a maintainer: the time orientation as a continuous field, and the second-countability hypothesis, which a connected paracompact manifold satisfies."
  since: 0.3.0
- id: LL-0163
  title: The generator of a strongly continuous one-parameter unitary group is self-adjoint
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneGenerator.lean
  decls: [Lightlike.OperatorAlgebras.UnitaryGroup.generator_isSelfAdjoint]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_9"}
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
      - {ref: moretti-2016, location: "Theorem 142, p. 83", check: "Stone"}
  review: kernel-checked
  note: "For a strongly continuous one-parameter group of unitaries U(t) on a complex Hilbert space, the generator A psi = -i d/dt U(t) psi at t = 0, on the vectors where the derivative exists, is self-adjoint: A is contained in its adjoint and its adjoint in A. This is one direction of Stone's theorem; the converse, that every self-adjoint operator generates such a group, is the task T-OP1-P2. Compared with Moretti, Theorem 142, p. 83 (read): (a) there is a unique self-adjoint generator A with U(t) = exp(-itA), (b) A psi = i lim (U(t) - 1) psi / t on the vectors where the limit exists; also with Teschl, Mathematical Methods in Quantum Mechanics (AMS online edition), Theorems 5.1 and 5.2, pp. 123-124 (read). The Hall chapters are cited but were not read. Difference to be approved by a maintainer (convention): the library's generator is -i d/dt U(t) at 0, with U(t) = exp(itA), the negative of Moretti's (U(t) = exp(-itA))."
  since: 0.3.0
- id: LL-0164
  title: Two strongly continuous one-parameter unitary groups with the same generator are equal
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneUnique.lean
  decls: [Lightlike.OperatorAlgebras.UnitaryGroup.eq_of_generator_eq]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
      - {ref: moretti-2016, location: "Theorem 142, p. 83", check: "Stone"}
  review: kernel-checked
  note: "On a complex Hilbert space, a strongly continuous one-parameter unitary group is determined by its generator: if U and V have the same generator then U(t) = V(t) for all t. This is the uniqueness part of Stone's theorem. Compared with Moretti, Theorem 142, p. 83 (read): (a) there is a unique self-adjoint generator A with U(t) = exp(-itA), (b) A psi = i lim (U(t) - 1) psi / t on the vectors where the limit exists; also with Teschl, Mathematical Methods in Quantum Mechanics (AMS online edition), Theorems 5.1 and 5.2, pp. 123-124 (read). The Hall chapters are cited but were not read. Difference to be approved by a maintainer (convention): the library's generator is -i d/dt U(t) at 0, with U(t) = exp(itA), the negative of Moretti's (U(t) = exp(-itA))."
  since: 0.3.0
- id: LL-0165
