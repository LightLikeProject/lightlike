  note: "Compared with Ooguri (1992), the part on the Alexander moves, eqs. (10) and (11) (read): the paper lists the basic moves of a four-dimensional complex (1 to 5, 2 to 4 and 3 to 3, and the reverses of the first two), says that the 15j symbols of the model can be written as sums of products of 6j symbols so that the Biedenharn-Elliott identity and the orthonormality of the 6j symbols show that the partition function is invariant up to a multiplicative factor, and then gives a different proof, writing the model as an integral over group elements on the tetrahedra whose spin sums over triangles produce delta functions (flat bundle); the divergent factor delta(1,1) of the 1-5 move is regularised by a cutoff on the spins, referring to another paper, and is not treated in detail. It does not display the identity of this entry. Representation: the identity here is the finite-cutoff recoupling form of the Biedenharn-Elliott step, with explicit cutoff inequalities; that form is the library's own. For each of the 15 cases c, lhs_eq_ev_NL24 evaluates the union of the four vertex networks, summed over the colours of the inner triangles (weights x + 1) and the six inner tetrahedra, as the reduced network (NL c).ev, under nine cutoff inequalities; sumB_eq_ev_QB evaluates the union of the two vertex networks summed over the colour of the inner tetrahedron as (QB c).ev under one triangle inequality; the reduced networks NL and QB are related by ev_NL_eq_QB in the same file (not catalogued separately). The 2-4 invariance of the state sum, LL-0050, is built from these. Checked in the kernel on a 4-sphere (amplitudeGF_move24_example)."
