- id: LL-0047
  title: The large-spin asymptotic formula of the Euclidean EPRL vertex amplitude in coherent boundary states
  area: Asymptotics
  file: Lightlike/Asymptotics/EPRL/EPRLFormula.lean
  decls: [Lightlike.Asymptotics.EPRL.eprlAsymptoticFormula]
  status: proven
  tier: frontier
  main: true
  source:
    refs:
      - {ref: bdfgh-2009, location: "Section 4", check: "Asymptotic formula"}
      - {ref: bfh-2010, location: "eq. (16)", check: "Hessian"}
      - {ref: bfh-2010, location: "eq. (26)", check: "without complex conjugation"}
  review: kernel-checked
  note: Both propositions are proved (coh15jAsymptoticFormula in MaxSetFinite.lean, eprlAsymptoticFormula in EPRLFormula.lean). For a nondegenerate 4-simplex, spins proportional to its triangle areas with an even spin sum at every node, and a nonsingular Hessian at both critical points, the coherent 15j integral over SU(2)^5 in the Regge boundary state is (2π/λ)^6 2^4 (4π)^-8 (e^(iλS) A₊ + e^(-iλS) A₋) + O(λ^-7), with S the Regge action Σ (n_e/2) Θ_e (Coh15jAsymptoticFormula). The EPRL form, for 0 < γ < 1, has four terms with phases ±S and ±γS and remainder O(λ^-13) (EPRLAsymptoticFormula); it follows from two instances of the 15j form by Fubini, as in Barrett–Fairbairn–Hellmann. BFH's sign factor (−1)^χ is not part of the statement. Equality of the coherent integral with eprlVertex on Livine–Speziale intertwiners is not proven, and the nonsingular Hessian is a hypothesis, as in Barrett et al. At the regular 4-simplex every hypothesis except the Hessian conditions is checked in the kernel (regular_coh15j_hyps, regular_eprl_hyps); the Hessian conditions are checked numerically (Re(−H) positive definite, det(−H₊) ≈ 1185 − 898i for doubled spins 3). Spins not proportional to the areas, or with an odd node sum, violate them (regular_wrong_spins); boundary data that do not glue are exponentially suppressed (coh15j_exp_decay, coh15j_oneData_decay). Checked numerically against the exact integral at the regular 4-simplex (scripts/asymptotics/eprl_asymptotics_check.py).
  since: 0.1.0
- id: LL-0048
  title: "Lorentzian Regge calculus with Sorkin's complex angles: flat Minkowski regions have zero deficit angles and solve the Regge equations"
  area: Regge
  file: Lightlike/Regge/Lorentzian/FlatSolution.lean
  decls: [Lightlike.ReggeLor.IsGeometric4.lorReggeAction_stationary]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: sorkin-2019, location: "Section 9", check: "defect"}
  review: kernel-checked
  note: "Sorkin's complex Lorentzian angles, with the complex action weighted by Z = -i on spacelike and 1 on timelike triangles. For a 4D triangulation embedded in Minkowski space, every deficit angle vanishes (IsGeometric4.lorDeficit_eq_zero), the action is differentiable in the squared edge lengths with the Lorentzian Schläfli identity (lorSchlaefli4_finset, hasFDerivAt_lorReggeAction), and the flat configuration is stationary (lorReggeAction_stationary). Euclidean angles on the same Lorentzian data give deficit π, so the Lorentzian angles are needed (wrong_eucAngle_T). Null triangles and tetrahedra are excluded (IsNonNull4); the null cases are not covered. Checked numerically (scripts/regge)."
  since: 0.2.0
- id: LL-0049
  title: The gauge-fixed Ooguri state sum at finite cutoff is invariant under the 4D Pachner 3-3 move, and the gauge rule survives the move
  area: SpinFoam
  file: Lightlike/SpinFoam/Move33.lean
  decls: [Lightlike.SpinFoam.amplitudeGF_move33, Lightlike.SpinFoam.amplitudeGF_move33_gauge]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: ooguri-1992, location: "Abstract", check: "Alexander moves"}
      - {ref: perez-2013, location: "§6.1.3", check: "BF theory"}
  review: kernel-checked
  note: "An identity at finite cutoff: the cutoff conditions make the cutoffs on the faces inside the move non-binding. The gauge rule (IsGauge: the vertices, the edges and the gauge triangles form a collapsible 2-complex) is this library's proposal for the 4D analogue of the maximal tree, not a construction from the literature. Non-vacuity: amplitudeGF_move33_example and amplitudeGF_move33_star1 check every hypothesis in the kernel on closed 4-spheres. A perturbed vertex amplitude breaks the identity (ampBad_breaks_move33). Removal of the cutoff and independence of the gauge set are not proven."
  since: 0.2.0
- id: LL-0050
  title: The gauge-fixed Ooguri state sum at finite cutoff is invariant under the 4D Pachner 2-4 and 4-2 moves, and the gauge rule survives the 2-4 move
  area: SpinFoam
  file: Lightlike/SpinFoam/Move24Global.lean
  decls: [Lightlike.SpinFoam.amplitudeGF_move24, Lightlike.SpinFoam.IsGauge.move24, Lightlike.SpinFoam.amplitudeGF_move24_gauge, Lightlike.SpinFoam.amplitudeGF_move42_gauge]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: ooguri-1992, location: "Abstract", check: "Alexander moves"}
      - {ref: perez-2013, location: "§6.1.3", check: "BF theory"}
  review: kernel-checked
  note: "An identity at finite cutoff: the cutoff conditions make the cutoffs on the faces inside the move non-binding. The 2-4 move adds one triangle to the gauge set (IsGauge.move24); the 4-2 move is the 2-4 move read backwards (the gauge set is given on the complex after the 4-2 move). Non-vacuity: amplitudeGF_move24_example checks every hypothesis of amplitudeGF_move24 in the kernel on the 1-5 subdivision of the boundary of the 5-simplex, with no gauge triangles, and amplitudeGF_move24_gauge_example does the same for the gauge-fixed form with a gauge set of fourteen triangles (isGauge_T14), so the gauge-fixed statement is instantiated in the kernel; the two sums are shown equal, their value is not computed. There is no wrong-model check for this move; the perturbed amplitude ampBad is checked against the 3-3 move only (LL-0049). Removal of the cutoff and independence of the gauge set are not proven."
