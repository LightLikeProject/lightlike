  status: proven
  tier: frontier
  source: pending
  review: kernel-checked
  note: "Compared with Engle, Pereira, Rovelli, Livine (2008), Section III (read): the paper defines the projection of L2(Spin(4)) onto the constrained subspace by the Clebsch-Gordan embedding of the highest SU(2) irreducible into (j+, j-) (eq. (29), with k = j+ + j- from eq. (27)), the map of this entry; it does not state its uniqueness up to a scalar or the Casimir eigenspace description. Both are the library's own statements (Schur's lemma on the multiplicity-free decomposition). Uniqueness is Schur's lemma applied to the multiplicity-free decomposition of V_{j+} (x) V_{j-} under the diagonal SU(2) action (spin j = j+ + j- occurs once); the image statement is stated with the matrix casDiag n m of the diagonal Casimir. No hypotheses beyond equivariance in eprlMap_unique."
