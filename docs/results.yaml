- id: LL-0376
  title: "Minkowski space is conformal to a region of the Einstein static universe: in the coordinates η = arctan u + arctan v, χ = arctan u − arctan v the Minkowski metric is ω⁻²(−dη² + dχ² + sin²χ dΩ²) with ω = (cos η + cos χ)/2, the map (η, χ) ↦ (t, r) is a bijection of {0 < χ, |η| + χ < π} onto {r > 0}, and the conformal factor vanishes exactly on |η| + χ = π"
  area: Spacetime
  file: Lightlike/Spacetime/MinkowskiCompactification.lean
  decls: [Lightlike.minkowski_eq_conformal_esu, Lightlike.bijOn_comp, Lightlike.compOmega_eq_zero_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (7.100)"}
  review: kernel-checked
  note: "GE7 (G1-016). Compared with Carroll, Lecture Notes on General Relativity (gr-qc/9712019), Chapter 7, eqs. (7.86)-(7.102), on the arXiv text: the null coordinates u = (t + r)/2, v = (t - r)/2 (7.88), U = arctan u, V = arctan v with the ranges (7.92), η = U + V, χ = U - V (7.98), the metric ω⁻²(-dη² + dχ² + sin²χ dΩ²) with ω = cos U cos V = (cos η + cos χ)/2 (7.100), (7.101), and the Einstein static universe (7.102). The Lean statement uses the same coordinates and the same ω. Differences: (a) representation: the statement is a metric identity on tangent vectors in the (η, χ) coordinates on the open region 0 < χ, |η| + χ < π (the polar form, which leaves out the axis χ = 0; Carroll includes it, p. 196), not a manifold embedding; (b) Carroll's ranges (7.99) are a rectangle and the image of Minkowski space is the interior of the Penrose diagram, which is the region |η| + χ < π; the library states this region and proves the bijection. The conformal infinity (null infinity η ± χ = ±π with i⁰ and i^±, Carroll p. 196-197) is the vanishing locus of ω (compOmega_eq_zero_iff); the null character of the boundary and the action of the Poincaré group on it are NOT proved here."
  since: unreleased
- id: LL-0377
  title: "The conformal embedding of Minkowski space in Cartesian form, axis included: the map (η, p) ↦ (t, x⃗) from the region {|η| < π, p ∈ S³, ω > 0} of ℝ × S³ is a bijection onto ℝ × ℝ³, the metric is ω⁻² times the Einstein static universe metric, and the axis r = 0 is the ordinary point p = (1, 0⃗)"
  area: Spacetime
  file: Lightlike/Spacetime/MinkowskiCompactificationAxis.lean
