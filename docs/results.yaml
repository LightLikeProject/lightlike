    refs:
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
  review: kernel-checked
  note: "On a complex Hilbert space, a strongly continuous one-parameter unitary group is determined by its generator: if U and V have the same generator then U(t) = V(t) for all t. This is the uniqueness part of Stone's theorem. The comparison with the cited source is pending: the registry location is the chapter, and the statement was not read there. Difference to be approved by a maintainer: the library's sign convention U(t) = exp(itA) for the generator."
