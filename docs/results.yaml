  review: kernel-checked
  note: "For a symmetric bilinear form T and a Lorentzian form g in dimension four on a normed real vector space, with the conditions as in LL-0180: the dominant condition contains the weak one, the weak condition implies the null condition, the strong condition implies the null condition, hence the dominant condition implies the null one. The null conditions follow from the timelike ones by continuity: a null vector k is the limit of the timelike vectors k + eps w, with w timelike and g(k, w) <= 0, and the functions v -> T(v, v) and v -> (T - (1/2) tr_g T g)(v, v) are continuous. The comparison with Curiel, section 2.1, is pending: the implications are not read at that location. Limits: pointwise, dimension four; the strong condition does not imply the weak one and the weak does not imply the strong one (cosmo_energyConditions and the perfect-fluid equivalences of LL-0180), so no further implication is claimed. Trust check: dust satisfies the dominant condition, hence the null condition through the implication (the example at the end of the file)."
