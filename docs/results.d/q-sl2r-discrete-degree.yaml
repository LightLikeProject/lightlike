- id: LL-XXXX-y
  title: "Schur orthogonality of the holomorphic discrete series of SL(2,R) against the lowest weight vector: for n >= 2, every v in the weighted Bergman space A^2_n with holomorphic representative phi, <e_0, v> = (4 pi/(n-1)) (-2i)^(-n) phi(i), |<v, D_n(g) e_0>|^2 = |c_0|^2 Im(u)^n |phi(u)|^2 with u = (g^-1)^T i, and the integral over SL(2,R) of |<v, D_n(g) e_0>|^2 is 2 pi |c_0|^2 ||v||^2"
  area: Lorentz
  file: Lightlike/Lorentz/SL2RPlancherel/DiscreteSchur.lean
