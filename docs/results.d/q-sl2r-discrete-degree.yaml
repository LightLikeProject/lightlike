  review: kernel-checked
  note: "Comparison pending (no source read at a cited location). Proof: the reproducing property of e_0 (LL-XXXX-x), unitarity of D_n, the Iwasawa integral over SL(2,R) (the integrand depends only on z = g.i since D_n(k_theta) e_0 is a phase times e_0), (g_z^-1)^T i = -1/z and the invariance of the hyperbolic measure under z -> -1/z. This also shows that e_0 is cyclic. WEAKER: Schur orthogonality for pairs of arbitrary vectors needs the irreducibility of D_n^+ and is not proved; formal degree for e_0 itself is LL-XXXX-q."
