- id: LL-XXXX-c
  title: The Schatten p-norms of a compact operator, the supremum formula (6.23) equal to the sum of the p-th powers of the singular values, so independent of the canonical form, with norm and adjoint bounds
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/Spectral/Schatten.lean
  decls: [Lightlike.OperatorAlgebras.CompactSpectral.schattenSum, Lightlike.OperatorAlgebras.CompactSpectral.schattenSum_eq_tsum, Lightlike.OperatorAlgebras.CompactSpectral.schattenSum_le_tsum, Lightlike.OperatorAlgebras.CompactSpectral.tsum_le_schattenSum, Lightlike.OperatorAlgebras.CompactSpectral.norm_rpow_le_schattenSum, Lightlike.OperatorAlgebras.CompactSpectral.schattenSum_adjoint]
  status: proven
  tier: established
  source:
    refs:
      - {ref: teschl-2009, location: "Lemma 6.12, p. 141", check: "Schatten"}
  review: kernel-checked
  note: "Compared with Teschl, Section 6.3, (6.19)-(6.23) and Lemma 6.12, pp. 141-142 (read, online edition). schattenSum p K is the supremum (6.23) to the power p, over pairs of finite orthonormal families; for every canonical form and p >= 1 it equals the sum of s_j^p (6.19), so that sum does not depend on the canonical form. (6.21) and (6.22) are stated for schattenSum."
  since: unreleased
- id: LL-XXXX-d
