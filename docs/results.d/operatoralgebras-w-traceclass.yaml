- id: LL-XXXX-e
  title: "The trace-class operators form a two-sided ideal of the bounded operators, are closed under sums, and a product of two Hilbert-Schmidt operators is trace class"
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/TraceClass/GeneralProduct.lean
  decls: [Lightlike.OperatorAlgebras.TraceClass.isTraceClass_mul_mul, Lightlike.OperatorAlgebras.TraceClass.isTraceClass_mul_of_isHilbertSchmidt, Lightlike.OperatorAlgebras.TraceClass.isTraceClass_add]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "A T B is trace class for trace-class T and bounded A, B; R S is trace class for Hilbert-Schmidt R, S; T + T' is trace class for trace-class T, T'. The textbook statements are in Reed-Simon, Methods of Modern Mathematical Physics I, Section VI.6, and Teschl, Mathematical Methods in Quantum Mechanics, Section 6.3; they were not read at a theorem for this entry, and the source registry verifies no location in them for these statements, so the entry has no registered source and the comparison is pending. Every theorem holds on an arbitrary complex Hilbert space (no separability). IsTraceClass T: the diagonal sum of the positive part |T| converges in a Hilbert basis; IsHilbertSchmidt: the square sum of the norms of T on a Hilbert basis converges."
  since: unreleased
