- id: LL-XXXX-i
  title: "The trace of a trace-class operator is the diagonal sum in every Hilbert basis"
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/TraceClass/GeneralIdeal.lean
  decls: [Lightlike.OperatorAlgebras.TraceClass.trace_eq_of_hilbertBasis]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "For trace-class T and every Hilbert basis b the trace of T is the sum over b of the inner products of b i with T (b i); the trace is therefore independent of the basis. No self-adjointness or positivity of T is assumed. The textbook statements are in Reed-Simon, Methods of Modern Mathematical Physics I, Section VI.6, and Teschl, Mathematical Methods in Quantum Mechanics, Section 6.3; they were not read at a theorem for this entry, and the source registry verifies no location in them for these statements, so the entry has no registered source and the comparison is pending. Every theorem holds on an arbitrary complex Hilbert space (no separability). IsTraceClass T: the diagonal sum of the positive part |T| converges in a Hilbert basis; IsHilbertSchmidt: the square sum of the norms of T on a Hilbert basis converges."
