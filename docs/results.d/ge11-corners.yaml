- id: LL-XXXX-a
  title: For a locally smooth connection on a manifold modelled with corners on a finite-dimensional space, the curvature is ∇_X ∇_Y Z − ∇_Y ∇_X Z − ∇_{[X,Y]} Z for any fields smooth near the point, without a Hausdorff hypothesis
  area: Spacetime
  file: Lightlike/Spacetime/Corners/CurvatureSymmetries.lean
  decls: [Lightlike.curvatureAt_apply_eventuallyW]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "Chapter 3", check: "curvature"}
  review: kernel-checked
  note: "The statement of LL-0412 (curvatureAt_apply_proved) for any ModelWithCorners (boundary and corners allowed), a locally smooth connection (LocallySmoothConnectionW) and [IsManifold I 2 M], with no Hausdorff hypothesis: the curvature curvatureAt x of the values of fields X, Y, Z that are smooth near x (SmoothNearW) is cov (cov Z ∘ Y) x (X x) − cov (cov Z ∘ X) x (Y x) − cov Z x ([X,Y] x), so it does not depend on the extensions. It is the Corners layer used by the Bianchi and Ricci statements below. Carroll defines the curvature through these fields in Chapter 3 (the chapter is a verified location; equations (3.67), (3.71) were read in the docstring of ChartCurvature.lean). KIND representation: the statement is intrinsic, Carroll's are coordinate expressions."
  since: unreleased

- id: LL-XXXX-b
  title: For any non-degenerate metric on a manifold modelled with corners, the curvature of a Levi-Civita connection satisfies the first Bianchi identity and the pair symmetry, and the Ricci tensor is symmetric, without a Hausdorff hypothesis
  area: Spacetime
  file: Lightlike/Spacetime/Corners/CurvatureSymmetries.lean
  decls: [Lightlike.bianchi_first_provedW, Lightlike.riemannLowerAt_pair_symmW, Lightlike.ricciAt_symm_provedW]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (3.91)", check: "Ricci"}
  review: kernel-checked
  note: "For a locally smooth connection cov on a manifold modelled with corners on a finite-dimensional space and [IsManifold I 2 M]: if the torsion is zero, R(X,Y)Z + R(Y,Z)X + R(Z,X)Y = 0 (bianchi_first_provedW); if moreover cov is compatible with a non-degenerate metric g of any signature, g(R(X,Y)Z, W) = g(R(Z,W)X, Y) (riemannLowerAt_pair_symmW; the antisymmetries in each pair are riemannLowerAt_antisymm_lastW and curvatureAt_antisymm_leftW) and the Ricci tensor Ric(Y,Z) = tr(X ↦ R(X,Y)Z) is symmetric (ricciAt_symm_provedW). It is LL-0230 for any ModelWithCorners, with torsion freeness and metric compatibility as two hypotheses instead of IsLeviCivita, and with no Hausdorff hypothesis. Carroll states these in coordinates, eqs. (3.78)-(3.81) and (3.91) (verified locations in the registry: (3.79), (3.80), (3.91)); the statements here are the intrinsic ones (KIND representation). The comparison with Wald, General Relativity, Section 3.2, is pending: the book was not read at the cited location."
  since: unreleased

- id: LL-XXXX-c
  title: The second Bianchi identity for a locally smooth torsion-free connection on a manifold modelled with corners, without a Hausdorff hypothesis
  area: Spacetime
  file: Lightlike/Spacetime/Corners/BianchiSecond.lean
  decls: [Lightlike.bianchi_second_provedW]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (3.88)", check: "Bianchi"}
  review: kernel-checked
  note: "For a locally smooth torsion-free connection on a manifold modelled with corners on a finite-dimensional space ([IsManifold I 2 M], boundary and corners allowed, no Hausdorff hypothesis), (∇_X R)(Y,Z)W + (∇_Y R)(Z,X)W + (∇_Z R)(X,Y)W = 0 with covDerivCurvatureAt of Connection.lean (bianchi_second_provedW). It is LL-0231 for any ModelWithCorners with only cov.torsion = 0 as hypothesis (the task statement is for the Levi-Civita connection; that is a special case). Carroll's (3.88), read at that location in the registry, is the coordinate form; KIND representation: the statement is intrinsic."
  since: unreleased

- id: LL-XXXX-d
  title: The covariant derivative of the Levi-Civita connection of a non-degenerate metric is smooth on a manifold modelled with corners on R^n, without a Hausdorff hypothesis
  area: Spacetime
  file: Lightlike/Spacetime/Corners/LeviCivitaSmooth.lean
  decls: [Lightlike.contMDiffAt_leviCivitaW]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "For a manifold modelled with corners on Fin n → R (any ModelWithCorners, derivatives in the chart within the range of the model), C², and a non-degenerate metric g, the section ∇σ of the bundle of endomorphisms of the tangent bundle is C^∞ at p for every vector field σ that is smooth near p (contMDiffAt_leviCivitaW); this is the local smoothness that the Corners layer uses (LocallySmoothConnectionW of leviCivita g). The proof reads ∇σ in the trivialization at p as D σ̂(∂_a) + Γ̂(σ̂, a), with Γ̂ the Christoffel symbol of the smooth coordinate metric. This is a regularity statement of the construction, not a statement of a source; no source location applies. Limits: the model space is Fin n → R, not an arbitrary finite-dimensional space (the generalisation to any finite-dimensional model space is open, see GE11 m4 and m5)."
  since: unreleased
