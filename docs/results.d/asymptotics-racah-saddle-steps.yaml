- id: LL-XXXX-a
  title: "Racah's alternating 6j sum is the imaginary part of a contour integral: for Racah's kernel f(z) = πT(z)/sin(πz), with T entire and built from 1/Γ, real x₁ left of a face sum and x₂ right of a quadrilateral sum, f has a primitive Φ on the closed upper half-plane minus the integers, continuous at x₁ and x₂, and racahSum = −Im(Φ(x₂) − Φ(x₁))/π"
  area: Asymptotics
  file: Lightlike/Asymptotics/ContourIdentity.lean
  decls: [Lightlike.Asymptotics.racahSum_eq_im_primitive]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location for this statement; it is a step of the complex saddle-point proof of the Racah-sum asymptotics (LL-0290), which the library proves in place of the real-variable step of Gurau 2008. The kernel has Racah's term as its residue at each integer (T is built from 1/Gamma), so the sum is given by the imaginary parts of the primitive at the two ends. The spins are given by the six natural numbers J (the integer edges); faceN and quadN are the face sums and quadrilateral sums of J. Hypotheses stated in the Lean theorem: x1 is below some face sum and x2 above some quadrilateral sum. No unproved hypothesis."
  since: unreleased
