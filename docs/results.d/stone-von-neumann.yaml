- id: LL-XXXX-i
  title: The Stone-von Neumann theorem - a regular representation of the Weyl relations of a finite-dimensional symplectic space is a Hilbert sum of copies of the Fock (Schrodinger) representation, and it is irreducible iff the multiplicity space is one-dimensional
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneVN.lean
  decls: [Lightlike.OperatorAlgebras.stone_von_neumann, Lightlike.OperatorAlgebras.isIrreducible_iff_finrank_vnRange]
  status: proven
  tier: established
  main: true
  source:
    refs:
      - {ref: derezinski-2006, location: "Theorem 4, p. 12", check: "Stone"}
      - {ref: faulhuber-2022, location: "Theorems 7.32 and 7.35, pp. 90-94", check: "Stone-von Neumann"}
  review: kernel-checked
  note: "Compared with Derezinski, Theorem 4, p. 12 (statement) and Faulhuber, Section 7.3.1, pp. 90-94 (von Neumann's proof), read. The symplectic space is a finite-dimensional complex inner product space h with sigma = Im<.,.> (the repository's CCRRep, regular by definition); the reference representation is the repository's Fock representation fockRepOf h (cyclic vacuum with <Omega, W f Omega> = exp(-|f|^2/4)), not the Schrodinger representation on L^2(X), to which it is unitarily equivalent by the Bargmann transform (not formalized); L^2(X) tensor K is the Hilbert sum over an orthonormal basis of the range of the Gaussian projection P0 = (2 pi)^{-d} int exp(-|z|^2/4) W z dz of the closed invariant subspaces generated by the basis vectors, each a Fock representation. 'Irreducible iff K = C' is proved for nonzero spaces (as printed it fails for H = {0}, irreducible by the p. 10 definition)."
  since: unreleased
