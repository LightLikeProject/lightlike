- id: LL-XXXX-a
  title: "The gauge-fixed Ooguri state sum depends on the gauge set only through its forcing closure: mutually forcing gauge sets give equal sums at every cutoff, and a gauge set whose closure is every triangle gives 1"
  area: SpinFoam
  file: Lightlike/SpinFoam/OoguriGaugeFixed/ForcingClosure.lean
  decls: [Lightlike.SpinFoam.amplitudeGF_union_of_forces, Lightlike.SpinFoam.amplitudeGF_eq_forcedTris, Lightlike.SpinFoam.amplitudeGF_eq_of_mutual_forces]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Part of SF5d (G2-023). Removes the word every from LL-0068/amplitudeGF_eq_of_forces: the state sum depends on a gauge set T only through forcedTris K T, whether or not that is all of K.tris. Finite cutoff statements and sufficient criteria only: nothing says that gauge sets with different closures give different sums. The comparison with Freidel-Louapre (2003), Section IV, is pending: the gauge rule is this library's proposal for the 4D analogue of the maximal tree, not a construction from the literature."
  since: unreleased
- id: LL-XXXX-b
  title: "The forcing closure of a set of triangles is a closure operator, forcing is its inclusion order, and the gauge-fixed state sum is constant on forcing classes"
  area: SpinFoam
  file: Lightlike/SpinFoam/OoguriGaugeFixed/ForcingClosureOrder.lean
  decls: [Lightlike.SpinFoam.forces_iff_forcedTris_subset, Lightlike.SpinFoam.Forces.trans', Lightlike.SpinFoam.forcedTris_eq_iff_mutual_forces, Lightlike.SpinFoam.amplitudeGF_eq_of_forces_forces]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Part of SF5d (G2-023). Order structure of the forcing relation inside K.tris: Forces K T' T iff forcedTris K T' is in forcedTris K T; equal closures iff mutual forcing. Combinatorial statement about this library's gauge rule; no literature counterpart, comparison pending."
  since: unreleased
- id: LL-XXXX-c
  title: "Trust check of the gauge-fixed Ooguri state sum on the boundary of the 5-simplex: the cone gauge set obeys the gauge rule and gives 1, and a gauge set that violates the rule gives 5"
  area: SpinFoam
  file: Lightlike/SpinFoam/OoguriGaugeFixed/Capstone.lean
  decls: [Lightlike.SpinFoam.gaugeFixed_sphere6_trust]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2003, location: "Section IV", check: "GAUGE SYMMETRIES AND DIVERGENCES"}
  review: kernel-checked
  note: "Capstone of SF5d (G2-023), the two trust checks of the milestone: starT obeys IsGauge and gives amplitude 1; gauge9 (starT minus one triangle) violates it and gives 5, so a gauge set that breaks the hypotheses changes the amplitude. Cutoff 1/2 on every triangle. Invariance under the five Pachner moves and gauge independence are LL-0049 to LL-0051 and LL-0068. Comparison with Freidel-Louapre pending."
  since: unreleased
