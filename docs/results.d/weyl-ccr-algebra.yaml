- id: LL-XXXX-m
  title: The elements of a Weyl system of a symplectic vector space are unitary and linearly independent
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/WeylAlgebra.lean
  decls: [Lightlike.OperatorAlgebras.IsWeylSystem.mem_unitary, Lightlike.OperatorAlgebras.IsWeylSystem.linearIndependent]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bgp-2007, location: "Proposition 4.2.3, p. 117", check: "Weyl system"}
  review: kernel-checked
  note: "Compared with Bar-Ginoux-Pfaffle, Definition 4.2.1, p. 116 and Proposition 4.2.3 (1), (4), pp. 117-119 (read). A Weyl system is a map W from a real symplectic vector space into a unital star algebra over C with W(0) = 1, W(-phi) = W(phi)* and the Weyl relation."
  since: unreleased
- id: LL-XXXX-n
  title: The CCR algebra of a symplectic vector space, the C*-algebra generated by the Weyl operators on l2(V), with its Weyl system; the Weyl unitaries of a representation of the CCR form a Weyl system
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/WeylAlgebra.lean
  decls: [Lightlike.OperatorAlgebras.ccrAlgebra, Lightlike.OperatorAlgebras.isWeylSystem_ccrW, Lightlike.OperatorAlgebras.isWeylSystem_weylOp, Lightlike.OperatorAlgebras.CCRRep.isWeylSystem]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bgp-2007, location: "Example 4.2.2, p. 116", check: "Weyl system"}
  review: kernel-checked
  note: "Compared with Bar-Ginoux-Pfaffle, Example 4.2.2, pp. 116-117 (read): CCR(V, omega) is the C*-subalgebra of L(l2(V)) generated by (W(phi)F)(psi) = exp(i omega(phi, psi)/2) F(phi + psi); here l2(V) is any Hilbert space with a Hilbert basis indexed by V. Uniqueness up to *-isomorphism (Theorem 4.2.9) is not stated."
  since: unreleased
