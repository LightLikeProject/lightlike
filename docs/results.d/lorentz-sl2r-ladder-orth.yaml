  note: "Layer 2c-iii of the Plancherel formula on SL(2,R), part 2. The adjointness of the ladder operators with boundary terms (ladder_adjoint_boundary) on the intervals (R/(n+1), R], and the limit as the lower end tends to 0, where the boundary term is the hypothesis. This is the orthogonality of the ladder images to the (non-normalisable or discrete series) kernel elements; the converse, that nothing else is orthogonal, is layer 2c-iv. Standard; no source consulted."
