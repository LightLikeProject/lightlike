- id: LL-XXXX-a
  title: "Parseval identity on the square (0,1] x (0,1] for a continuous complex function P: the sum over (m,n) in Z^2 of the squared moduli of the Fourier coefficients, the integrals of e^(-2 pi i (m x_0 + n x_1)) P(x) over the square, equals the integral of the squared modulus of P over the square"
  area: Lorentz
  file: Lightlike/Lorentz/SL2RPlancherel/TorusParseval.lean
