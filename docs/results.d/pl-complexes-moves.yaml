- id: LL-XXXX-a
  title: "Links, stars and cones of finite simplicial complexes: the closed star of a face is the join of the face with its link, st(σ) = σ * lk(σ); the link of the apex of a cone on K is K; and lk(τ, lk(σ, K)) = lk(σ ∪ τ, K) for disjoint faces σ, τ"
  area: PL
  file: Lightlike/PL/Complex.lean
  decls: [Lightlike.PL.SComplex.star_eq_join, Lightlike.PL.SComplex.link_cone_apex, Lightlike.PL.SComplex.link_link]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location for these statements; they are the standard identities for links, stars and cones of abstract simplicial complexes (finite sets of finite sets of vertices closed under subsets). Hypotheses stated in the Lean theorems: the apex of the cone is not a vertex of K; the faces sigma and tau are disjoint. No unproved hypothesis."
  since: unreleased
- id: LL-XXXX-b
  title: "Welding undoes a stellar subdivision and subdividing undoes a weld: for a nonempty face A of K and a new vertex a, welding the stellar subdivision (A, a) K at (a, A) gives K back; conversely, if the link of a is the join of the boundary of A with a complex L disjoint from A, and A is not a face, subdividing the weld gives K back"
  area: PL
  file: Lightlike/PL/Stellar.lean
  decls: [Lightlike.PL.SComplex.weld_starAt, Lightlike.PL.SComplex.starAt_weld]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location (the module docstring cites Lickorish 1999, section 1, for the stellar subdivision, which is not a registered source location). The two directions make the weld the inverse of the stellar subdivision, so that stellar equivalence is symmetric as an equivalence relation generated by subdivisions. Hypotheses stated in the Lean theorems (A a face, nonempty, a a new vertex; for the second statement the link, disjointness and non-face conditions above). No unproved hypothesis."
  since: unreleased
- id: LL-XXXX-c
  title: "A bistellar move κ(A, B) is undone by κ(B, A), and every bistellar move is a stellar equivalence"
  area: PL
  file: Lightlike/PL/Bistellar.lean
  decls: [Lightlike.PL.SComplex.bistellar_bistellar, Lightlike.PL.SComplex.StellarEquiv.bistellar]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9"}
  review: kernel-checked
  note: "Comparison pending: Theorem 5.9 states that closed combinatorial n-manifolds are PL homeomorphic iff bistellar equivalent; the statements here are two ingredients (involutivity of the bistellar move, and the easy half 'bistellar moves are stellar equivalences', whose proof composes two stellar subdivisions through a new vertex taken from an unlimited supply, so no hypothesis on the vertex type is needed after relabelling), and the theorem itself is LL-0065 / LL-0023. The comparison with the source was not made for this entry. Hypothesis: IsBistellar K A B for the move, as in the Lean theorems."
  since: unreleased
- id: LL-XXXX-d
  title: "A PL n-sphere is a closed combinatorial n-manifold, and in a closed combinatorial n-manifold the link of every nonempty face σ is stellar equivalent to the boundary of a simplex on n + 2 − #σ vertices"
  area: PL
  file: Lightlike/PL/Links.lean
  decls: [Lightlike.PL.SComplex.IsPLSphere.isClosedCombManifold, Lightlike.PL.SComplex.IsClosedCombManifold.link_face]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Definition 2.2"}
  review: kernel-checked
  note: "Comparison pending: Definition 2.2 gives the combinatorial n-ball and n-sphere as complexes PL homeomorphic to the n-simplex or its boundary; in this library IsPLSphere is the stellar-equivalence form (stellar equivalent to the boundary of an (n+1)-simplex), which agrees with the PL form by Newman's theorem (LL-0064), and IsClosedCombManifold requires every vertex link to be a PL sphere. The comparison of these definitions with the source was not made for this entry. Hypotheses stated in the Lean theorems. No unproved hypothesis."
  since: unreleased
