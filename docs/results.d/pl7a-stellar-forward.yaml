- id: LL-XXXX-a
  title: Stellar subdivisions of a closed combinatorial 3-manifold at a tetrahedron or a triangle are forward Pachner moves, and no edge subdivision is a forward descendant
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/TriangulationIndependence/StellarForward.lean
  decls: [Lightlike.PR.ofComplex3_move14_eq_starAt, Lightlike.PR.ForwardMoves.exists_starAt_triangle, Lightlike.PR.ForwardMoves.edges_subset, Lightlike.PR.not_forwardMoves_starAt_edge]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "For a complex of tetrahedra (Complex3): the stellar subdivision at a tetrahedron is exactly one 1-4 move (ofComplex3_move14_eq_starAt, in the starAt form of the library's stellar subdivisions); at a triangle shared by two tetrahedra it is a 1-4 move followed by one 2-3 move (ForwardMoves.exists_starAt_triangle); no edge subdivision is a forward descendant, because forward moves (2-3 and 1-4) only add edges (ForwardMoves.edges_subset) while the subdivision at an edge deletes it (not_forwardMoves_starAt_edge). Piece p4 of PL7a, with LL-XXXX-b for edges. Search: Mathlib, Physlib and Tau Ceti have no Pachner moves or stellar subdivisions."
  since: unreleased
- id: LL-XXXX-b
  title: The stellar subdivision of a closed combinatorial 3-manifold at an edge has a common forward descendant with the complex
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/TriangulationIndependence/StellarEdge.lean
  decls: [Lightlike.PR.commonForward_starAt_edge]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "At an edge of degree d >= 3 of a closed combinatorial 3-manifold, the complex and its stellar subdivision at the edge have a common forward descendant (commonForward_starAt_edge): the complex reaches it by one 1-4 move and d - 2 2-3 moves, the subdivision by one 2-3 move. With LL-XXXX-a this is piece p4 of PL7a: an edge subdivision is not itself forward (LL-XXXX-a), so the forward route meets it at a common descendant."
  since: unreleased
