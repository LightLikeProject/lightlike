- id: LL-XXXX-g
  title: A quadric with the induced metric has constant curvature 1/c, intrinsically on the manifold
  area: Spacetime
  file: Lightlike/Spacetime/QuadricCurvature.lean
  decls: [Lightlike.mvfderiv_mlieBracket_vec, Lightlike.g_cov_eq_of_induced, Lightlike.dι_cov_quadric, Lightlike.hasConstantCurvature_of_quadric]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "For a manifold modelled on Fin n -> R (any model with corners) with a smooth map iota into a finite-dimensional space V with a symmetric bilinear form L of any signature, a metric with g(u, v) = L(d iota u, d iota v), the image on the quadric L(x, x) = c with c nonzero, and d iota injective onto the L-orthogonal complement of the point: every locally smooth Levi-Civita connection has R(X, Y) Z = (1/c) (g(Y, Z) X - g(X, Z) Y) at every point (hasConstantCurvature_of_quadric, HasConstantCurvature g (1/c)). The proof is the Gauss formula on the manifold: the flat derivative D of V-valued functions satisfies D_[X,Y] = D_X D_Y - D_Y D_X (mvfderiv_mlieBracket_vec, from mfderiv_mlieBracketW and linear functionals); the Koszul formula gives g(nabla_X Y, Z) = L(D_X d iota Y, d iota Z) (g_cov_eq_of_induced); on the quadric d iota (nabla_Y Z) = D_Y (d iota Z) + (g(Y, Z)/c) iota (dι_cov_quadric); applying it twice, with D flat and nabla torsion free, gives the curvature. Instances: the sphere (c = r^2), de Sitter space (c = L^2, hasConstantCurvature_deSitterSpace, the non-vacuity), anti-de Sitter space (c = -L^2) and the hyperboloid model of hyperbolic space (c = -1). Comparison with the cited section (Carroll, chapter 8) and with the Gauss formula (O'Neill, Semi-Riemannian Geometry, ch. 4) pending: no source was read at the location."
  since: unreleased
- id: LL-XXXX-h
  title: De Sitter space R x S^m is maximally symmetric with constant curvature 1/L^2
  area: Spacetime
  file: Lightlike/Spacetime/SpaceForms/DeSitterCurvature.lean
  decls: [Lightlike.hasConstantCurvature_deSitterSpace, Lightlike.isMaximallySymmetric_deSitterSpace]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "On the whole manifold deSitterSpace m = R x S^m (dimension m + 1, any m) with the metric induced from the hyperboloid eta(x, x) = L^2 of R x R^(m+1), L nonzero: every locally smooth Levi-Civita connection has constant curvature 1/L^2 at every point (hasConstantCurvature_deSitterSpace, an instance of hasConstantCurvature_of_quadric), and with the n(n+1)/2 linearly independent smooth Killing fields of exists_killing_deSitterSpace (n = m + 1) the metric is maximally symmetric in the sense of IsMaximallySymmetric (isMaximallySymmetric_deSitterSpace). The metric is Lorentzian at every point (isLorentzianForm_deSitterSpaceMetric). Compared with Carroll, Lecture Notes on General Relativity (arXiv gr-qc/9712019), read at section 5, p. 140, before eq. (5.44): 'a maximally symmetric space is one which possesses the largest possible number of Killing vectors, which on an n-dimensional manifold is n(n + 1)/2', and section 3, p. 85, eq. (3.106): in any dimension the curvature of a maximally symmetric space satisfies R_rho sigma mu nu = a^-2 (g_rho mu g_sigma nu - g_rho nu g_sigma mu), stated without proof. IsMaximallySymmetric is the count of (5.44), as n(n+1)/2 linearly independent smooth Killing fields (that no metric has more is a general bound, not part of the statement), together with the curvature form (3.106) with a^-2 = K: with Carroll's convention [nabla_mu, nabla_nu] V^rho = R^rho_sigma mu nu V^sigma, (3.106) is R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y), the form of HasConstantCurvature. So the theorem is Carroll's definition with his curvature property in addition, not a weaker statement; the curvature is stated for every locally smooth Levi-Civita connection, a generalization. The cited location eq. (8.1) is the FLRW metric, where the maximally symmetric slices are introduced (p. 218, eq. (8.2) the same curvature form in three dimensions)."
  since: unreleased
