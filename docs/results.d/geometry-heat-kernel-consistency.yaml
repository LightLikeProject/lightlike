- id: LL-XXXX-a
  title: The coefficients of the small-time asymptotic expansion of a heat trace are unique - two expansions of the same function K in powers t^(-n/2 + k) to the same finite order have the same coefficients, and two full expansions are equal
  area: GR
  file: Lightlike/Geometry/HeatKernel/Unique.lean
  decls: [Lightlike.HeatKernel.HasHeatExpansionTo.coeff_unique, Lightlike.HeatKernel.HasHeatExpansion.coeff_unique]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "An elementary fact of asymptotic expansions (the coefficient of the first term in which two expansions differ is the limit of the difference over its power of t), used to compare the coefficients of a heat trace with the Seeley-DeWitt formulas; no source states it at a location. HasHeatExpansionTo n m K a: K t minus the sum over k < m of a k t^(k - n/2) is O(t^(m - n/2)) as t tends to 0 from above. The finite-order statement gives a k = b k for k < m; the full-expansion statement gives a = b."
  since: unreleased
- id: LL-XXXX-b
  title: The heat trace of the unit round 2-sphere, the sum over l of (2l+1) e^(-t l(l+1)), has the Seeley-DeWitt expansion of the scalar Laplacian to order t^2 with volume 4 pi, scalar curvature 2, squared Ricci tensor 2 and squared Riemann tensor 4
  area: GR
  file: Lightlike/Geometry/HeatKernel/Consistency.lean
  decls: [Lightlike.HeatKernel.hasHeatExpansionTo_sphereTrace_geom]
  status: proven
  tier: established
  source:
    refs:
      - {ref: vassilevich-2003, location: "eq. (4.27)", check: "6E"}
  review: kernel-checked
  note: "Comparison pending for the coefficient formula heatCoeffs n V R |Ric|^2 |Riem|^2 (the library's formula for a_0, a_1, a_2 of the Laplacian, with a_1 = (4 pi)^(-n/2) V R/6 compared with Vassilevich, arXiv:hep-th/0306138, eq. (4.27) in the earlier entry on the curvature of the round sphere); the a_2 term (the combination of R^2, |Ric|^2 and |Riem|^2) was not compared here. The statement is an expansion of the explicit spectral sum of the round 2-sphere with the geometric data of the sphere put into the formula, with three coefficients (k = 0, 1, 2, powers t^-1, t^0, t^1) and remainder O(t^2); it is not a derivation of the formula from the operator, and the general compact manifold is not covered."
  since: unreleased
