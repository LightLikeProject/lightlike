- id: LL-XXXX
  title: For a finite quantum system with Hamiltonian H, a state is KMS at inverse temperature beta iff it is the Gibbs state e^{-beta H} / tr e^{-beta H}
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/FiniteKMS.lean
  decls: [Lightlike.OperatorAlgebras.isKMS_iff_eq_gibbs, Lightlike.OperatorAlgebras.isKMS_gibbs]
  status: proven
  tier: established
  source:
    refs:
      - {ref: jaksic-ogata-pautrat-pillet-2012, location: "Proposition 2.20, p. 53", check: "KMS"}
  review: kernel-checked
  note: "On Matrix n n C with tau^{-i beta}(B) = e^{beta H} B e^{-beta H}: a matrix rho of trace 1 satisfies tr(rho A B) = tr(rho tau^{-i beta}(B) A) for all A, B (the beta-KMS condition, eq. (2.24)) iff rho = e^{-beta H} / tr e^{-beta H}. Compared with Jaksic-Ogata-Pautrat-Pillet, Section 2.9, eq. (2.24) and Proposition 2.20, p. 53 (read). The statement is more general than the source's: H is any matrix with tr e^{-beta H} != 0 (the source takes H self-adjoint, where this holds), and rho is only required to have trace 1 (the source's states are positive)."
  since: unreleased
