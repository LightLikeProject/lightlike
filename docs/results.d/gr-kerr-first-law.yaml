  note: "Geometric units G = c = 1, 0 < M and a^2 < M^2 along the family (M t, a t). A = 4 pi (r_+^2 + a^2) is the exact Kerr horizon area (kerrArea), J = M a, with kappa and Omega_H as in Lightlike/GR/KerrHorizon.lean. Curve form: A and J are differentiable and the identity holds for their derivatives. Row G1-066, milestone GE6."
