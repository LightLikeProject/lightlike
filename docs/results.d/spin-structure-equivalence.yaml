- id: LL-XXXX-s
  title: "Spin structures: the principal-bundle definition and the atlas form are equivalent; every lift of the orthonormal frame bundle through Spin(n) -> SO(n) is the principal bundle of a spin structure in atlas form, and has a smooth spin atlas"
  area: GR
  file: Lightlike/Dirac/SpinLiftSmooth.lean
  decls: [Lightlike.Dirac.SpinLift.exists_spinStructure_equiv, Lightlike.Dirac.SpinLift.smoothSpinAtlas]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending (no source was read at a cited location): the definition is Lawson and Michelsohn, Spin Geometry (1989), Chapter II, Definition 1.3 (a principal Spin(n)-bundle with an equivariant map to the oriented orthonormal frame bundle), to be read before the comparison is claimed. What is proved: for a smooth manifold M without boundary (model with I.Boundaryless, M : Type) with a smooth positive definite metric g, EVERY lift L of the orthonormal frame bundle of TM through the vector action Spin(n) -> SO(n) (any OrthonormalFrameLift over the Riemannian bundle of g: a topological principal bundle with a continuous equivariant frame map, no smoothness assumed) has a smooth spin atlas (SpinLift.smoothSpinAtlas: local sections with smooth frames and smooth transition elements), so it is equivalent, as a lift, to the principal bundle SpinStructure.principal of a spin structure in atlas form (SpinLift.exists_spinStructure_equiv, via SpinStructure.ofSmoothAtlas and SpinStructure.ofSmoothAtlasEquiv in Lightlike/Dirac/SpinPrincipalEquiv.lean); conversely every atlas spin structure gives such a lift (SpinStructure.principal), and reading back its unit sections gives its frames and lifts (SpinStructure.ofSmoothAtlas_frame, SpinStructure.ofSmoothAtlas_lift). Ingredients: the kernel of the vector action is {±1} (vecConj_eq_id_iff, Lightlike/Bundles/SpinKernel.lean), an explicit smooth local inverse of the vector action near the identity (spinOfFrame, Lightlike/Bundles/SpinLocalSection.lean), smooth orthonormal frames by Gram-Schmidt (ported from Tau Ceti, Lightlike/Bundles/Manifold/VectorBundle/GramSchmidt.lean). The double-cover property of L is not assumed nor stated. Non-vacuity: the principal bundle of the standard spin structure of R^n."
  since: unreleased
