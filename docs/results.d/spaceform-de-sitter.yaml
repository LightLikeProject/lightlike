- id: LL-XXXX-e
  title: De Sitter space as the whole manifold R x S^m with the metric induced from the hyperboloid, Lorentzian at every point
  area: Spacetime
  file: Lightlike/Spacetime/SpaceForms/DeSitter.lean
  decls: [Lightlike.deSitterSpace, Lightlike.dSIncl, Lightlike.dSForm_dSIncl_self, Lightlike.dι_dSIncl, Lightlike.dι_dSIncl_injective, Lightlike.exists_dι_dSIncl_eq, Lightlike.deSitterSpaceMetric, Lightlike.isLorentzianForm_deSitterSpaceMetric, Lightlike.deSitterSpaceLorentzian, Lightlike.isLorentzianForm_of_frame]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "The manifold is the whole of R x S^m (Mathlib's product of the line and the unit sphere of R^(m+1), the model transported to Fin (m+1) -> R, time first), m any natural number and L any nonzero real. The metric is the pullback of the Minkowski form -ab + <x, y> of R x R^(m+1) by iota(tau, omega) = (L sinh tau, L cosh tau omega), whose image is the hyperboloid eta(x, x) = L^2 (dSForm_dSIncl_self); in the coordinates (tau, omega) it is L^2 (-dtau^2 + cosh^2 tau dOmega^2), the global form of de Sitter space. d iota is injective with image exactly the eta-orthogonal complement of the point (dι_dSIncl_injective, exists_dι_dSIncl_eq), so the metric is nondegenerate on every tangent space (deSitterSpaceMetric, through pullback_nondeg_of_quadric). MEASURED: the metric has Lorentzian signature (-, +, ..., +) at every point (isLorentzianForm_deSitterSpaceMetric), shown with an explicit eta-orthonormal frame, (1/L) d_tau and (L cosh tau)^(-1) times preimages of an orthonormal basis of the orthogonal complement of omega, and isLorentzianForm_of_frame (n eta-orthonormal vectors of an n-dimensional space form a basis); deSitterSpaceLorentzian is the resulting LorentzianMetric. Curvature and Killing fields are separate entries. Comparison with the cited section (Carroll, chapter 8, de Sitter space as a hyperboloid in Minkowski space) pending: no source was read at the location."
  since: unreleased
