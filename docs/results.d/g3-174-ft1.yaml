- id: LL-XXXX-b
  title: "The coefficient of λ² in the formal integral of the quartic potential λx⁴/4! is 35/384"
  area: FieldTheory
  file: Lightlike/FieldTheory/ZeroDim/FormalIntegral.lean
  decls: [Lightlike.FieldTheory.formalIntegral_quartic_two]
  status: proven
  tier: established
  source:
    refs:
      - {ref: borinsky-2018, location: "Abstract"}
  review: kernel-checked
  note: "FT1 trust check, Borinsky's formal integral at order ħ², the value 35/384 = 1/128 + 1/16 + 1/48. A wrong symmetry factor is shown to fail by an unnamed example in the same file (1/128 + 1/16 + 1/24 ≠ 35/384, the melon graph taken with 1/24 instead of 1/48). The comparison with the sources named in Lightlike/FieldTheory/API-map.md is pending in the registry: only the Abstract of Borinsky (2018) is recorded as verified, the other sources are not registered."
  since: unreleased
- id: LL-XXXX-c
  title: "The vacuum graphs of the quartic model with two vertices are exactly the figure-eights, the dumbbell and the melon graph, with automorphism groups of orders 128, 16 and 48, and the sum of the inverse orders is 35/384"
  area: FieldTheory
  file: Lightlike/FieldTheory/ZeroDim/Graphs.lean
  decls: [Lightlike.FieldTheory.sum_inv_aut_two, Lightlike.FieldTheory.vacuum_graphs_two]
  status: proven
  tier: established
  source:
    refs:
      - {ref: borinsky-2018, location: "Abstract"}
  review: kernel-checked
  note: "FT1. The graphs are the orbits of the pairings of the half-edges under S_4 ≀ S_2 (order 24² · 2), the symmetry factor is the inverse order of the stabilizer. The three orbits are pairwise distinct (vacuum_graphs_two) and their stabilizers have orders 128, 16, 48. The comparison with the sources named in Lightlike/FieldTheory/API-map.md is pending in the registry: only the Abstract of Borinsky (2018) is recorded as verified, the other sources are not registered."
  since: unreleased
