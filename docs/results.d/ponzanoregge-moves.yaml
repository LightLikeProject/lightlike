- id: LL-XXXX-a
  title: The gauge-fixed Ponzano-Regge amplitude is unchanged by the 3-2 and 4-1 Pachner moves under the cutoff conditions of the inverse 2-3 and 1-4 moves
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/InverseMoves.lean
  decls: [Lightlike.PR.amplitudeGF_move32, Lightlike.PR.amplitudeGF_move41]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2004, location: "Section III", check: "gauge"}
      - {ref: barrett-naish-guzman-2009, location: "§2.2.1", check: "Pachner moves"}
  review: kernel-checked
  note: "An identity at finite cutoff, the inverse direction of the 2-3 and 1-4 moves of the previous chain entry (LL-0027); comparison pending for these two statements. amplitudeGF_move32: for a 3-2 move on any complex, a gauge set T of old edges not containing the removed edge DE, and a cutoff with cut AD + cut AE <= cut DE, the amplitude of the complex after the move equals that before. amplitudeGF_move41: when no gauge edge touches the vertex E that disappears, the amplitude of the smaller complex with gauge set T equals that of the larger with gauge set T together with the edge DE, under the cutoff conditions cut AD <= cut AE, cut BD <= cut BE, cut CD <= cut CE. The moves are recognised on any complex (IsMove32, IsMove41), not only on manifolds. Independence of the gauge set in general and removal of the cutoff are not proven."
  since: unreleased
- id: LL-XXXX-b
  title: A combinatorial 2-sphere is a connected closed pseudo-surface with Euler characteristic 2
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/SphereInvariants.lean
  decls: [Lightlike.PR.IsSphere2.invariants]
  status: proven
  tier: established
  source:
    refs:
      - {ref: moise-1977, location: "Chapter: The classification of compact connected 2-manifolds|10.1007/978-1-4612-9906-6_23"}
  review: kernel-checked
  note: "The comparison with Moise (1977) is pending: the book was not read at the cited location. IsSphere2 is the library's inductive definition of the combinatorial 2-spheres of a finite set of triangles (generated from the boundary of the tetrahedron by the 2D Pachner moves, as in the previous sphere-recognition entry, LL-0024); the statement is the conjunction of euler2 L = 2, IsConnected2 L and IsClosed2 L, the invariants preserved by the moves. The converse (these invariants characterise the spheres) is the sphere-recognition entry."
  since: unreleased
- id: LL-XXXX-c
  title: When the gauge set forces every edge of a 3-complex, the gauge-fixed Ponzano-Regge amplitude is 1 for every cutoff
  area: PonzanoRegge
  file: Lightlike/PonzanoRegge/Forcing.lean
  decls: [Lightlike.PR.amplitudeGF_of_forcesAll]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: freidel-louapre-2004, location: "Section III", check: "gauge"}
  review: kernel-checked
  note: "Comparison pending (Freidel-Louapre treat the gauge fixing with a maximal tree; the forcing criterion is this library's). ForcesAll K T: the edges of K are all in T, or a triangle {p, q, r} of K with two of its edges {p, r} and {q, r} in T and the third {p, q} not in T lets the induction continue with {p, q} added. By the triangle inequality with spins 0 on two edges the third edge is forced to spin 0, so only the colouring with all spins 0 contributes, with weight 1. Hypothesis T is a subset of the edges of K. This removes the cutoff for such gauge sets."
  since: unreleased
