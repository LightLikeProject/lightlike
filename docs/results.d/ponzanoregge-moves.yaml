  since: unreleased
- id: LL-XXXX-e
  title: Independence of the maximal tree fails for the gauge-fixed Ponzano-Regge amplitude with a finite cutoff on a ring of three tetrahedra, and the two trees are not connected by triangle exchanges
  area: PonzanoRegge
  file: Lightlike/Tests/TreeDependence.lean
  decls: [Lightlike.PR.Test.Ring.amplitudeGF_tree_dependent, Lightlike.PR.Test.Ring.not_eqvGen_exchange_T1_T2]
  status: proven
  tier: frontier
  source: exploratory
  review: kernel-checked
  note: "A counterexample on the ring R of three tetrahedra {0123}, {2345}, {4501} on six vertices with the constant cutoff 1 (the definition half): T1 and T2 are maximal trees of R and their gauge-fixed amplitudes are -7 and -15, so they differ. R is not a combinatorial 3-manifold (the link of vertex 0 has Euler characteristic 1, not_isCombManifold_R), so the example lies outside the assumptions of Freidel-Louapre's tree independence, which is stated for triangulated 3-manifolds; it shows that the tree-exchange invariance of the gauge-change entry cannot be extended to all complexes. not_eqvGen_exchange_T1_T2: T1 and T2 are not related by a chain of triangle exchanges (otherwise the amplitudes would agree)."
  since: unreleased
