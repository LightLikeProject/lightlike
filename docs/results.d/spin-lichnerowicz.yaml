- id: LL-XXXX
  title: "The Lichnerowicz formula on a spin manifold: for a smooth spinor field of a spin structure of a Riemannian manifold (atlas form) and its Levi-Civita spin connection, D^2 psi = nabla*nabla psi + (R/4) psi, with D and nabla*nabla the frame-independent Dirac operator and rough Laplacian on spinor fields and R the scalar curvature"
  area: GR
  file: Lightlike/Dirac/SpinLichnerowicz.lean
  decls: [Lightlike.Dirac.SpinStructure.dirac_sq_eq_rough_add_scal_div_four, Lightlike.Dirac.SpinStructure.dirac_sq]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending (no source was read at a cited location): the formula is Lawson and Michelsohn, Spin Geometry (1989), Chapter II, Theorem 8.8 (D^2 = nabla*nabla + kappa/4), to be read before the comparison is claimed. KIND representation: the spin structure is the atlas form (SpinStructure: local orthonormal frames on open domains covering M, with Spin(n) lifts of the frame changes satisfying the cocycle condition), equivalent to the principal Spin(n)-bundle form of II Def. 1.3 for every lift of the orthonormal frame bundle (SpinLift.exists_spinStructure_equiv, Lightlike/Dirac/SpinLiftSmooth.lean), so not a difference of meaning. Spinor fields are families of local representations related by rho(lift) on overlaps (SpinorField); D and nabla*nabla are defined frame-wise and shown to transform correctly (SpinStructure.dirac_lift, SpinStructure.roughLaplacian_lift), so they are operators on spinor fields. The identity is pointwise in every frame (SpinStructure.dirac_sq: for phi smooth near x), for smooth spinor fields (SpinorField.IsSmooth); no compactness, L2 or self-adjointness statement. Non-vacuity: constant spinor fields of the Euclidean spin structure of R^n. The 2-sphere carries a SpinStructure instance: sphereSpinStructure (Lightlike/Dirac/SphereSpin.lean) on the library's S2 (Mathlib's unit sphere of R^3, model I2) with the round metric, its two orthonormal frames built from explicit stereographic projections from the north and the south pole (not from Mathlib's stereographic charts, whose orthonormal basis is not explicit), the frame change a rotation with the Spin(2) lift iota(y/|y|) iota(e_1). On it the trust check holds on the smooth sections of the spinor bundle (sphere_dirac_spectrum_sections, Lightlike/Dirac/SphereSpectrumSections.lean: spectrum ±(k+1), real multiplicity 4(k+1)); its proof uses the two-chart model of sphere_spectrum (Lightlike/Dirac/SphereSpectrum.lean: a smooth V-valued f on the north chart with D f = λ f for the chart operator diracF and smooth transfer f_S(y/|y|²) = |y|⁻¹ ρ(y) J f(y)) as the engine, identified with the eigensections by a linear isomorphism (eigenSectionsEquiv)."
  since: unreleased
