  note: "Proved by Stone–Weierstrass for the separation of points (PeterWeylSeparation.lean, through convolution operators, which are compact and self-adjoint) and the density of C(G) in L². The comparison with Bröcker and tom Dieck (1985), Chapter III, is pending: the book was not read at the cited location."
