- id: LL-XXXX-a
  title: "Peter–Weyl (density form): for a compact Hausdorff group, the matrix coefficients of finite-dimensional unitary representations are dense in C(G) in the sup norm and, for a Haar measure, in L²(G)"
  area: SU2
  file: Lightlike/HarmonicAnalysis/PeterWeyl.lean
