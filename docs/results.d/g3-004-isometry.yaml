- id: LL-XXXX-u
  title: The generator of a one-parameter family of isometries is a Killing field
  area: Spacetime
  file: Lightlike/Spacetime/IsometryKilling.lean
  decls: [Lightlike.killing_of_isometry_family]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "Chapter 5", check: "Killing"}
  review: kernel-checked
  note: "Carroll's (5.39)-(5.41): 'If a one-parameter family of isometries is generated by a vector field V, then V is known as a Killing vector field', Lie derivative of g along V zero. In coordinates on a real Banach space E with the metric a field G of bilinear forms: for a C^2 map Phi(s, y) with Phi(0, .) = id whose maps Phi(s, .) preserve G at p for s near 0 (G(Phi(s, p))(D_y Phi u, D_y Phi w) = G(p)(u, w)), the generator X(y) = d_s Phi(0, y) satisfies Killing's equation DG(p)(X p)(u, w) + G(p)(DX(p) u, w) + G(p)(u, DX(p) w) = 0. Proof: differentiate the isometry condition at s = 0, with the symmetry of the second derivative of Phi. The converse (the local flow of a Killing field is an isometry) is killing_flow_isometry on regge/g1-024-orbit."
  since: unreleased
