- id: LL-XXXX-a
  title: "The Lichnerowicz formula on the spinor bundle of a spin manifold: for every smooth section σ of the spinor bundle of a spin structure (frames with Spin(n) lifts of the frame changes) of a Riemannian manifold and every point x, D(Dσ)(x) = (∇*∇σ)(x) + (R(x)/4) σ(x), with D the Dirac operator, ∇*∇ the rough Laplacian of the spin connection and R the scalar curvature of the Levi-Civita connection"
  area: GR
  file: Lightlike/Dirac/SpinorLichnerowicz.lean
  decls: [Lightlike.Dirac.SpinorSection.dirac_dirac]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending (no source was read at a cited location): the formula is Lawson and Michelsohn, Spin Geometry (1989), Chapter II, Theorem 8.8, to be read before the comparison is claimed. The sections are the smooth sections (Mathlib ContMDiffSection) of the spinor bundle built from the spin structure's Spin(n) cocycle (Lightlike/Dirac/SpinorBundle.lean); D and ∇*∇ act on them; the identity is pointwise at every point of the manifold (no compactness, L² or self-adjointness statement). The spin structure is given by local orthonormal frames with Spin(n) lifts of the frame changes (atlas form); this is equivalent to the principal Spin(n)-bundle form of Lawson and Michelsohn II Def. 1.3 for every lift of the orthonormal frame bundle (SpinLift.exists_spinStructure_equiv, Lightlike/Dirac/SpinLiftSmooth.lean), so not a difference of meaning. Non-vacuity: constant sections of the Euclidean spin structure of ℝⁿ; it applies to the round 2-sphere through sphereSpinStructure."
  since: unreleased
- id: LL-XXXX-b
  title: "The Dirac spectrum of the round unit 2-sphere on the sections of its spinor bundle: for a Clifford module of real dimension 4 and the spin structure of the 2-sphere, a nonzero smooth section σ of the spinor bundle with Dσ = λσ exists exactly for λ = ±(k+1), k a natural number, and these eigenvalues have real multiplicity 4(k+1), i.e. complex multiplicity 2(k+1)"
  area: GR
  file: Lightlike/Dirac/SphereSpectrumSections.lean
  decls: [Lightlike.Dirac.sphere_dirac_spectrum_sections, Lightlike.Dirac.eigenSections, Lightlike.Dirac.mem_eigenSections, Lightlike.Dirac.sphereSpinStructure]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending (no source was read at a cited location). The manifold is the library's S2 (Mathlib's unit sphere of ℝ³, model I2) with the round metric; sphereSpinStructure has two orthonormal frames from explicit stereographic projections from the north and the south pole, the frame change a rotation and its Spin(2) lift ι(y/|y|)ι(e₁) (Lightlike/Dirac/SphereSpin.lean). eigenSections ρ λ = {σ | σ.dirac = λ • σ} (mem_eigenSections). The proof identifies the eigensections with the two-chart eigenspinors of sphere_spectrum through the north chart: the spin-connection coefficients of the north frame are y_c δ_ab − y_b δ_ac (connForm_sphere_north, Koszul formula), so the Dirac operator in the north frame is the chart operator diracF ρ stereoF stereoOmega (dirac_sphere_north), and the south frame gives the transfer of the two-chart model (transfer_identity). Non-vacuity: the quaternions as the Cl₂-module (SphereSpectrumTests)."
  since: unreleased
