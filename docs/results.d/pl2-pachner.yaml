- id: LL-XXXX-a
  title: Stellar equivalence and bistellar equivalence agree for closed combinatorial manifolds, in both directions, inside an infinite vertex type
  area: PL
  file: Lightlike/PL/PachnerMain.lean
  decls: [Lightlike.PL.SComplex.StellarEquivIn.bistellarEquivIn, Lightlike.PL.SComplex.BistellarEquiv.stellarEquiv]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9", check: "bistellar"}
  review: kernel-checked
  note: "The two directions of Pachner's theorem, stellar version, the pieces of LL-0023. A bistellar equivalence implies a stellar equivalence for any complexes (BistellarEquiv.stellarEquiv, in Pachner.lean). A stellar equivalence inside an infinite vertex type, from a closed combinatorial n-manifold K (IsMfdIn false n K), implies a bistellar equivalence inside it (StellarEquivIn.bistellarEquivIn), by induction on the stellar moves using that stellar equivalence preserves being a closed combinatorial manifold and that the stellar move at a face of a manifold is a chain of bistellar moves (bistellarEquivIn_starAt). KIND representation: Lickorish's Theorem 5.9 (Newman, Pachner), read at that location in the registry, states the equivalence for PL homeomorphic complexes; the statements here are about stellar equivalence, and the PL homeomorphism form is pachner_plHomeomorphic (LL-0065, from Newman's theorem), as the docstring says. The vertex type must be infinite (unlimited supply of new vertices), which the final statement SComplex.pachner removes by working with BistellarEquiv."
  since: unreleased

- id: LL-XXXX-b
  title: Stellar-equivalent closed combinatorial 3-manifolds (4-manifolds) given by their tetrahedra (4-simplices) are related by chains of the 2-3, 3-2, 1-4 and 4-1 moves (the 4D moves), and conversely
  area: PL
  file: Lightlike/PL/PachnerMoves.lean
  decls: [Lightlike.PL.pachner3, Lightlike.PL.pachner4]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9", check: "bistellar"}
  review: kernel-checked
  note: "For closed combinatorial 3-manifolds K, K' of Lightlike.PR.Complex3 (a nonempty complex given by its tetrahedra, with the 2-3, 3-2, 1-4 and 4-1 moves of the Ponzano-Regge file), the generated complexes are stellar equivalent exactly when the copies of K and K' on the vertex type V + N (an unlimited supply of new vertices) are related by a chain of those four moves (Relation.EqvGen Move3Step). It follows from Pachner's theorem (LL-0023, SComplex.pachner) and the fact that a bistellar move with 5 vertices on the generated complex is one of the four moves (exists_move3). pachner4 is the same statement for closed combinatorial 4-manifolds given by their 4-simplices (IsCombManifold4, nonempty) with the 4D moves of the four-dimensional file (Move4Step). KIND representation: Lickorish's Theorem 5.9 is about general complexes and bistellar moves, here specialised to the pure 3- and 4-complexes given by their top simplices; the chain runs on the copies on V + N because stellar moves need new vertices; the stellar version is used as in LL-0023."
  since: unreleased

- id: LL-XXXX-c
  title: The moves 2-3, 3-2, 1-4 and 4-1 of the Ponzano-Regge 3-complexes are bistellar moves, and a closed combinatorial 3-manifold of those complexes is one in the general sense
  area: PL
  file: Lightlike/PL/Complex3.lean
  decls: [Lightlike.PL.isBistellar_move23, Lightlike.PL.isBistellar_move32, Lightlike.PL.isBistellar_move14, Lightlike.PL.isBistellar_move41, Lightlike.PL.isClosedCombManifold_ofComplex3]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Definition 2.2", check: "manifold"}
      - {ref: lickorish-1999, location: "Theorem 5.9", check: "bistellar"}
  review: kernel-checked
  note: "On the simplicial complex generated by the tetrahedra of a Complex3 K (ofComplex3 K): the 2-3 move (IsMove23) is the bistellar move kappa(ABC, DE), the 3-2 move is kappa(DE, ABC), the 1-4 move is kappa(A, BCDE)-type and the 4-1 move its inverse (the sizes (#A, #B) = (3, 2), (2, 3), (1, 4), (4, 1)); and a closed combinatorial 3-manifold in the sense of the Ponzano-Regge file (every vertex link a combinatorial 2-sphere, reached from the boundary of a tetrahedron by 2D moves) is a closed combinatorial manifold of dimension 3 in the general sense of Lickorish's Definition 2.2 (vertex links PL spheres). Definition 2.2 and Theorem 5.9 are verified locations in the registry; the identification of the four named moves with the bistellar moves kappa(sigma, tau) of the stellar framework is this library's, not a statement of the source."
  since: unreleased

- id: LL-XXXX-d
  title: The 4D Pachner moves of the four-dimensional complexes are bistellar moves, and they preserve and reflect closed combinatorial 4-manifolds
  area: PL
  file: Lightlike/PL/Complex4.lean
  decls: [Lightlike.PL.isBistellar_move4, Lightlike.PL.ofComplex4_move, Lightlike.PL.isMove_of_isBistellar, Lightlike.PL.isCombManifold4_move_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: lickorish-1999, location: "Theorem 5.9", check: "bistellar"}
  review: kernel-checked
  note: "For a 4-dimensional pure complex K given by its 4-simplices (Complex4) with the 4D moves of the four-dimensional file: a move is the bistellar move kappa(sigma, tau) on the generated complex (isBistellar_move4) and the moved complex is the bistellar one (ofComplex4_move); conversely a bistellar move with #sigma + #tau = 6 on the generated complex is a 4D move (isMove_of_isBistellar); closed combinatorial 4-manifolds (all vertex links PL 3-spheres, IsCombManifold4) are preserved and reflected by the moves (isCombManifold4_move_iff); Pachner's theorem for these complexes is pachner4 (LL-XXXX-b). The identification of the 4D moves with the bistellar moves kappa(sigma, tau) is this library's (KIND representation); Theorem 5.9 is the verified location of Pachner's theorem."
  since: unreleased
