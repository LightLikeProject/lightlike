- id: LL-XXXX-a
  title: Stone's theorem, existence - every self-adjoint operator on a complex Hilbert space is the generator of a strongly continuous one-parameter unitary group, the strong limit of the groups generated by its Yosida approximants
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/YosidaLimit.lean
  decls: [Lightlike.OperatorAlgebras.generator_stoneGroup]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
      - {ref: moretti-2016, location: "Theorem 142, p. 83", check: "Stone"}
  review: kernel-checked
  note: "Comparison pending for this entry (the cited locations were read for LL-0163 and LL-0164, not again here). For a self-adjoint A (IsSelfAdjoint A: dense domain and A equal to its adjoint) the group stoneGroup is built as the strong limit of exp(i t A_n) for the Yosida approximants A_n, and its generator is A (generator_stoneGroup); the other directions are LL-0163 (the generator of a group is self-adjoint) and LL-0164 (uniqueness). Difference to be approved by a maintainer (convention, as in LL-0163): the library's generator is -i d/dt U(t) at 0, with U(t) = exp(itA), the negative of Moretti's (U(t) = exp(-itA))."
  since: unreleased
- id: LL-XXXX-b
  title: Stone's theorem on a complex Hilbert space, both directions - the generator of a strongly continuous one-parameter unitary group is self-adjoint, and every self-adjoint operator is the generator of exactly one such group
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/StoneMomentum/MomentumCapstone.lean
  decls: [Lightlike.OperatorAlgebras.StoneMomentum.stone_theorem]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2013, location: "Chapter: The Spectral Theorem for Unbounded Self-Adjoint Operators|10.1007/978-1-4614-7116-5_10"}
      - {ref: moretti-2016, location: "Theorem 142, p. 83", check: "Stone"}
  review: kernel-checked
  note: "Comparison pending for this entry (the cited locations were read for LL-0163 and LL-0164, not again here). The statement is the conjunction of LL-0163 (generator_isSelfAdjoint) and, for every self-adjoint A, existence (generator_stoneGroup, the previous entry) and uniqueness (LL-0164, eq_of_generator_eq) of a UnitaryGroup with generator A, with the library's sign convention (generator -i d/dt U(t) at 0, U(t) = exp(itA), the negative of Moretti's). The Hilbert space is any complex Hilbert space, no separability is assumed. Non-vacuity: the phase group (exp(i lambda t)) is an instance (stoneGroup_phaseGroup), and the translation group on L2(R) has the momentum operator as its generator (momentumSmoothR_ofCS, in the same file)."
  since: unreleased
