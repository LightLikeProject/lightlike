  title: The Lorentzian discrete Einstein equations - for non-degenerate squared edge lengths, the Lorentzian Regge action is stationary under every variation of the squared lengths that fixes the boundary lengths exactly when the sum over the interior triangles at each interior edge of the derivative of the triangle area with respect to the squared edge length times the Lorentzian deficit vanishes
  area: Regge
