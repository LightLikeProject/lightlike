- id: LL-XXXX-i
  title: With the strong energy condition and p <= rho the big bang singularity of an expanding FLRW universe is at a = 0, and p <= rho cannot be dropped
  area: Cosmology
  file: Lightlike/Cosmology/BigBangSingularity.lean
  decls: [Lightlike.Cosmology.friedmann_834, Lightlike.Cosmology.bigBang_singularity, Lightlike.Cosmology.onePlusSqrt_friedmann, Lightlike.Cosmology.onePlusSqrt_not_dominant]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.35)", check: "Big Bang"}
      - {ref: carroll-1997, location: "eq. (8.36)", check: "Friedmann"}
  review: kernel-checked
  note: "For a C^2 scale factor a > 0 on (t1, t2) solving both Friedmann equations with Lambda = 0, rho + 3p >= 0 and p <= rho, expanding at t0: either a -> 0 as t decreases to t1, or a', a'', rho and p are bounded on (t1, t0] (bigBang_singularity), so a singularity at the left end of the interval is at a = 0. Proof: ((a'^2 + k) a^4)' = 2 a' a^3 (a a'' + 2(a'^2 + k)) = 8 pi G a' a^5 (rho - p) >= 0 (Carroll's (8.34), a''/a + 2(a'/a)^2 + 2k/a^2 = 4 pi G (rho - p), which combines (8.35) and (8.36)), so rho a^6 stays bounded in the past while a >= L > 0. The hypothesis p <= rho is needed: a = 1 + sqrt t on (0, infinity), k = 0, solves both equations with rho > 0, p > 0, a' > 0, a'' < 0, and a' -> infinity as t -> 0 while a -> 1 (onePlusSqrt_friedmann); hence p > rho somewhere (onePlusSqrt_not_dominant). Carroll's 'we necessarily reach a singularity at a = 0' (p. 224) under rho > 0, p >= 0 alone fails for this a."
  since: unreleased

- id: LL-XXXX-j
  title: For the equation of state p = w rho with constant w > -1/3 the big bang singularity of an expanding FLRW universe is at a = 0
  area: Cosmology
  file: Lightlike/Cosmology/BigBangEOS.lean
  decls: [Lightlike.Cosmology.bigBang_singularity_of_eos]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.35)", check: "Big Bang"}
      - {ref: carroll-1997, location: "eq. (8.36)", check: "Friedmann"}
  review: kernel-checked
  note: "Carroll's setting (8.21)-(8.23), p = w rho with constant w (w >= 0 at p. 224), for every w > -1/3: for a C^2 scale factor a > 0 on (t1, t2) solving both Friedmann equations with Lambda = 0, rho >= 0, p = w rho, expanding at t0, either a -> 0 as t decreases to t1 or a', a'', rho, p are bounded on (t1, t0]. Proof: (a'^2 + k) a^{1+3w} is constant (its derivative a' a^{3w} (2 a a'' + (1 + 3w)(a'^2 + k)) vanishes by (8.35), (8.36)), i.e. rho a^{3(1+w)} is constant as in (8.23). Reading (a) of p. 224, any rho > 0, p >= 0, is false (onePlusSqrt_friedmann, LL-XXXX-i); reading (b), this setting, is proved here."
  since: unreleased
