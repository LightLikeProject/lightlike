- id: LL-XXXX
  title: Constant curvature and maximal symmetry of a pseudo-Riemannian manifold, and constant curvature from the coordinate curvature in every chart
  area: Spacetime
  file: Lightlike/Spacetime/ConstantCurvature.lean
  decls: [Lightlike.HasConstantCurvature, Lightlike.IsMaximallySymmetric, Lightlike.HasConstantCurvature.of_charts, Lightlike.curvatureAt_of_chart, Lightlike.hasConstantCurvature_minkowski]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "For a smooth symmetric nondegenerate metric (any signature) on a manifold modelled on Fin n -> R (any model with corners): HasConstantCurvature g K says that every locally smooth Levi-Civita connection has R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y) at every point (the sign convention of curvatureAt); IsMaximallySymmetric g K adds n(n+1)/2 smooth Killing fields of leviCivita g that are linearly independent (at most n(n+1)/2 exist on a connected manifold, finrank_killingFieldSpace_le for the model of R^n). HasConstantCurvature.of_charts: if in every chart the coordinate Riemann tensor of the coordinate metric is R^rho_{sigma mu nu} = K (delta^rho_mu g_{sigma nu} - delta^rho_nu g_{sigma mu}), the manifold has constant curvature K (through riemann_coord_compW, the chart formula of the curvature). Non-vacuity: Minkowski space has constant curvature 0. Comparison with the cited section (Carroll, chapter 8) pending: no source was read at the location for these definitions."
  since: unreleased
