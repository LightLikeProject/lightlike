- id: LL-XXXX
  title: Constant curvature and maximal symmetry of a pseudo-Riemannian manifold, and constant curvature from the coordinate curvature in every chart
  area: Spacetime
  file: Lightlike/Spacetime/ConstantCurvature.lean
  decls: [Lightlike.HasConstantCurvature, Lightlike.IsMaximallySymmetric, Lightlike.HasConstantCurvature.of_charts, Lightlike.curvatureAt_of_chart, Lightlike.hasConstantCurvature_minkowski]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "For a smooth symmetric nondegenerate metric (any signature) on a manifold modelled on Fin n -> R (any model with corners): HasConstantCurvature g K says that every locally smooth Levi-Civita connection has R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y) at every point (the sign convention of curvatureAt); IsMaximallySymmetric g K adds n(n+1)/2 smooth Killing fields of leviCivita g that are linearly independent (at most n(n+1)/2 exist on a connected manifold, finrank_killingFieldSpace_le for the model of R^n). HasConstantCurvature.of_charts: if in every chart the coordinate Riemann tensor of the coordinate metric is R^rho_{sigma mu nu} = K (delta^rho_mu g_{sigma nu} - delta^rho_nu g_{sigma mu}), the manifold has constant curvature K (through riemann_coord_compW, the chart formula of the curvature). Non-vacuity: Minkowski space has constant curvature 0. Compared with Carroll, Lecture Notes on General Relativity (arXiv gr-qc/9712019), read at section 5, p. 140, before eq. (5.44): 'a maximally symmetric space is one which possesses the largest possible number of Killing vectors, which on an n-dimensional manifold is n(n + 1)/2' (the definition), and section 3, p. 85, eq. (3.106): the curvature of a maximally symmetric space satisfies R_rho sigma mu nu = a^-2 (g_rho mu g_sigma nu - g_rho nu g_sigma mu) (a stated property). IsMaximallySymmetric is the count of the definition (n(n+1)/2 linearly independent smooth Killing fields) with the curvature property (3.106) for a^-2 = K, which with Carroll's convention [nabla_mu, nabla_nu] V^rho = R^rho_sigma mu nu V^sigma is HasConstantCurvature's R(X, Y) Z = K (g(Y, Z) X - g(X, Z) Y): the same statement as Carroll's, with his property in addition; HasConstantCurvature quantifies over every locally smooth Levi-Civita connection, a generalization. The cited eq. (8.1) is the FLRW metric, where maximally symmetric slices enter (p. 218, eq. (8.2))."
  since: unreleased
