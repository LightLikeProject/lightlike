- id: LL-XXXX-a
  title: "For 0 < γ < 1 the labels j± = |1 ± γ| j / 2 are a pair of spins (n/2, m/2) exactly when n + m = J and n − m = γ J (doubled units), so j₊ + j₋ = j and j₊ − j₋ = γ j"
  area: Spin4
  file: Lightlike/Spin4/EPRL.lean
  decls: [Lightlike.Spin4.isEPRLLabel_iff]
  status: proven
  tier: frontier
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location for this statement (LL-0037 cites Engle-Pereira-Rovelli-Livine 2008, Section III, for the EPRL map). The spins are doubled natural numbers J, n, m; the condition IsEPRLLabel says that (n/2, m/2) are the labels |1 + gamma| J/4 and |1 - gamma| J/4 in half-integer form; the Lean statement is the equivalence with the two linear equations. Hypotheses 0 < gamma < 1 are stated in the theorem. No unproved hypothesis."
  since: unreleased
- id: LL-XXXX-b
  title: "The admissible EPRL spins for 0 < γ < 1: J is admissible exactly when γ J = p is a natural number with J + p even; for rational γ = p/q this means J = q t with (p + q) t even; for irrational γ only J = 0 is admissible"
  area: Spin4
  file: Lightlike/Spin4/EPRL.lean
  decls: [Lightlike.Spin4.eprlAdmissible_iff, Lightlike.Spin4.eprlAdmissible_rat_iff, Lightlike.Spin4.eprlAdmissible_irrational_iff]
  status: proven
  tier: frontier
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location. The set is determined by the requirement that j+ and j- are half-integers (isEPRLLabel_iff); the rational statement is for coprime p, q with 0 < p < q, and the irrational one shows that for irrational gamma the EPRL condition is empty except at J = 0. Hypotheses on gamma are stated in the Lean theorems. No unproved hypothesis."
  since: unreleased
- id: LL-XXXX-c
  title: "The EPRL map V_j → V_{j₊} ⊗ V_{j₋} (j = j₊ + j₋) is unique up to a scalar among the SU(2)-equivariant maps, and its image is the eigenspace of the diagonal Casimir with the eigenvalue of spin j"
  area: Spin4
  file: Lightlike/Spin4/EPRL.lean
  decls: [Lightlike.Spin4.eprlMap_unique, Lightlike.Spin4.mem_range_eprlMap_iff]
  status: proven
  tier: frontier
  source: exploratory
  review: kernel-checked
  note: "Comparison pending: no source was read at a cited location. Uniqueness is Schur's lemma applied to the multiplicity-free decomposition of V_{j+} (x) V_{j-} under the diagonal SU(2) action (spin j = j+ + j- occurs once); the image statement is stated with the matrix casDiag n m of the diagonal Casimir. No hypotheses beyond equivariance in eprlMap_unique."
  since: unreleased
