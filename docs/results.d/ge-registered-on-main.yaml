- id: LL-XXXX-a
  title: "The Dirac operator squares to minus the Laplacian on flat space: D(D f) = -Δ f for a C² function with values in a Clifford module"
  area: GR
  file: Lightlike/Dirac/Flat.lean
  decls: [Lightlike.Dirac.dirac_dirac]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bgv-1992, location: "Chapter: Clifford Modules and Dirac Operators|10.1007/978-3-642-58088-8_4"}
  review: kernel-checked
  note: "GE5 (G1-017). In flat ℝⁿ, for a C² map into any Clifford module (Q v = -‖v‖²), D(D f) = -Δ f: the flat case of D² = ∇*∇ + R/4 with R = 0. Supporting: clifford_double_sum (Dirac/SecondOrder.lean), pure Clifford algebra: Σ γᵢγⱼ aᵢⱼ = -Σ aᵢᵢ + ½ Σ γᵢγⱼ(aᵢⱼ - aⱼᵢ). Spin structures and the Dirac operator on a manifold are NOT in this entry. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
- id: LL-XXXX-b
  title: "Lichnerowicz in a frame: for a frame connection with antisymmetric connection form and a curvature with the Riemann symmetries, D² f = −Σ ∇²f(eᵢ, eᵢ) + (s/4) f, given the Ricci identity for the frame Hessian"
  area: GR
  file: Lightlike/Dirac/LichnerowiczFormula.lean
  decls: [Lightlike.Dirac.lichnerowicz_frame]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bgv-1992, location: "Chapter: Clifford Modules and Dirac Operators|10.1007/978-3-642-58088-8_4"}
  review: kernel-checked
  note: "GE5 (G1-017). In a frame with antisymmetric connection form ω, D²f = -Σᵢ ∇²f(eᵢ, eᵢ) + (s/4) f with s = Σ Rᵢⱼⱼᵢ, for a curvature with the Riemann symmetries. The Ricci identity (the antisymmetric part of the frame Hessian is the spinor curvature ¼ Σ Rᵢⱼₖₗ γₖγₗ acting on f) is a HYPOTHESIS here, not derived. Compare LL entry for lichnerowicz_general (torsion-free skew frame on ℝⁿ). Not covered: a spin manifold (spin structure, global Dirac operator) and the Lichnerowicz formula on it. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
- id: LL-XXXX-c
  title: "On the unit 2-sphere the curvature term of the Lichnerowicz formula is s/4 and not s/2"
  area: GR
  file: Lightlike/Dirac/LichnerowiczTests.lean
  decls: [Lightlike.Dirac.curvatureTerm_sphere, Lightlike.Dirac.sphere_half_formula_fails]
  status: proven
  tier: established
  source:
    refs:
      - {ref: bgv-1992, location: "Chapter: Clifford Modules and Dirac Operators|10.1007/978-3-642-58088-8_4"}
  review: kernel-checked
  note: "GE5 (G1-017), the trust checks of the milestone at the curvature term: on the unit 2-sphere (scalar curvature 2) the curvature term of the Clifford generators is (1/2)•1 = (s/4)•1, and the version with s/2 instead of s/4 is shown to fail. Only the S² curvature term is checked here; the Dirac spectrum on S² (±(k+1)) is in other files. The S² spectrum with multiplicities is NOT in this entry. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
- id: LL-XXXX-d
  title: "Raychaudhuri focusing under the strong energy condition: a unit geodesic rotation-free congruence with negative expansion Θ_0 in dimension 4 cannot be continued beyond parameter 3/|Θ_0|, when G = κT with κ > 0 and T satisfies the strong energy condition"
  area: Spacetime
  file: Lightlike/Spacetime/Raychaudhuri/FocusingSEC.lean
  decls: [Lightlike.raychaudhuri_focusing_strongEC]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "Chapter 4"}
      - {ref: hawking-ellis-1973, location: "Chapter: The physical significance of curvature|10.1017/CBO9780511524646.005"}
  review: kernel-checked
  note: "GE3 (G1-005). In dimension 4 with Λ = 0, G = κ T, κ > 0 and the strong energy condition for the field T: for a unit (g(V,V) = -1) geodesic rotation-free field V along an integral curve on [0, L) with Θ(γ 0) < 0, L ≤ 3/|Θ(γ 0)|. By strongECField_iff_ricci the strong condition is Ric(ξ,ξ) ≥ 0, and then raychaudhuri_focusing_manifold applies. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
