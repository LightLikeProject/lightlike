- id: LL-XXXX-h
  title: "The Klein–Gordon field satisfies the null energy condition for every potential, while a constant field with negative potential violates the weak energy condition although it satisfies the null condition"
  area: Spacetime
  file: Lightlike/Spacetime/GERow10/KleinGordonNEC.lean
  decls: [Lightlike.scalar_nullEC, Lightlike.scalarField_nullECField, Lightlike.scalarField_const_nullEC_not_weakEC]
  status: proven
  tier: established
  source:
    refs:
      - {ref: curiel-2014, location: "§2.1"}
  review: kernel-checked
  note: "GE14 (G1-010). For T = dφ⊗dφ − (½|dφ|² + V) g in 4-dimensional Lorentzian signature, T(k,k) = (dφ k)² ≥ 0 for null k, so the null energy condition holds for every φ and potential (pointwise and as a field); with dφ = 0 and a negative potential value the null condition holds and the weak condition fails (the trust check of the milestone, beyond scalarField_const_violates_weak). The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
- id: LL-XXXX-i
  title: "With a Klein–Gordon source the Ricci curvature of a null vector is κ(dφ k)², nonnegative and zero exactly when dφ k = 0"
  area: Spacetime
  file: Lightlike/Spacetime/GERow10/KleinGordonRicci.lean
  decls: [Lightlike.scalarField_ricciAt_null_nonneg, Lightlike.scalarField_ricciAt_null_eq_zero_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: curiel-2014, location: "§2.1"}
  review: kernel-checked
  note: "GE14 (G1-010). Under the Einstein equations with Λ = 0 and κ ≥ 0, Ric(k,k) = κ (dφ k)² ≥ 0 for null k for the Klein–Gordon source, with equality for κ > 0 exactly when dφ k = 0. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
- id: LL-XXXX-j
  title: "The weak energy condition of a Klein–Gordon field is exactly 0 ≤ ½|dφ|² + V for a vanishing or spacelike gradient"
  area: Spacetime
  file: Lightlike/Spacetime/GERow10/ScalarWeakECSharp.lean
  decls: [Lightlike.scalar_weakEC_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: curiel-2014, location: "§2.1"}
  review: kernel-checked
  note: "GE14 (G1-010). The sharp weak energy condition of a Klein–Gordon field at a point with vanishing or spacelike gradient is 0 ≤ ½|dφ|² + V (4 dimensions); the null and timelike gradients are scalar_weakEC_iff_of_null (0 ≤ V) in ScalarWeakECNull.lean and scalar_weakEC_iff_of_timelike (0 ≤ V − ½|dφ|²) in ScalarWeakECTimelike.lean, and scalar_weakEC_of_nonneg_potential (ScalarWeakEC.lean) says the weak condition holds whenever V ≥ 0. The comparison with the source is pending in the registry (the location cited is the only recorded verified one; the docstring of the Lean file claims no equation number)."
  since: unreleased
