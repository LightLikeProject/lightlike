- id: LL-XXXX-d
  title: "Components of mixed parity vanish: for a continuous complex function f on SL(2,R), the (m,n)-th Fourier coefficient of (alpha, theta) to f(k_alpha a(xi) k_theta), the integral over the angles in (0,1]^2 (alpha = 2 pi x_0, theta = 2 pi x_1) of e^(-2 pi i (m x_0 + n x_1)) f(k_alpha a(xi) k_theta), is zero for every xi when m - n is odd"
  area: Lorentz
  file: Lightlike/Lorentz/SL2RPlancherel/ParityKK.lean
  decls: [Lightlike.Lorentz.SL2R.kkCoeff_eq_zero_of_odd]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Layer 2c-iii of the Plancherel formula on SL(2,R), part 1. The element -1 = k_pi is central, so k_(alpha + pi) a(xi) k_(theta - pi) = k_alpha a(xi) k_theta, and the Fourier coefficient is multiplied by (-1)^(m-n) under the half-turn of both angles; the shift is justified by the periodicity of the integrand in each angle. Standard; no source consulted."
  since: unreleased
