- id: LL-XXXX-g
  title: A real finite spectral triple over a sum of real matrix algebras Mₙᵢ(ℝ) is unitarily equivalent to the model of its multiplicity matrix, with π acting through the fundamental representations
  area: NCG
  file: Lightlike/NCG/RealSummands.lean
  decls: [Lightlike.NCG.exists_unitary_realSummands, Lightlike.NCG.realComplexification, Lightlike.NCG.sigmaR, Lightlike.NCG.sigmaR_injective, Lightlike.NCG.phiR]
  status: proven
  tier: established
  source:
    refs:
      - {ref: krajewski-1998, location: "Section 3.1", check: "irreducible representation"}
      - {ref: krajewski-1998, location: "Section 3.2", check: "charge conjugation"}
  review: kernel-checked
  note: "Compared with Krajewski, arXiv:hep-th/9701081, Section 2, p. 2 (A = ⊕ Mₙᵢ(K), K = ℝ, ℂ, ℍ) and Section 3.1, p. 10 (read): 'Mₙ(ℝ) and Mₙ(ℍ) have only one irreducible representation, the fundamental one ... all our formulae remain valid, provided the indices i and j label irreducible representations of A'. Here A = ⊕ Mₙᵢ(ℝ): π extends to the complex-linear σ(x) = π(Re x) + i π(Im x) of ⊕ Mₙᵢ(ℂ), J is a real structure for it, and the uniqueness theorem for complex summands gives the unitary. Mₙ(ℍ) summands, Mₙ(ℂ) summands acting real-linearly, mixed algebras and the sign conditions of Table 1, p. 14 are not covered."
  since: unreleased

- id: LL-XXXX-h
  title: A real finite spectral triple with a complexification, a faithful complex-linear representation σ of a sum of complex matrix algebras with π = σ ∘ φ and σ in the complex span of π, is unitarily equivalent to the model of the multiplicity matrix of its complexification
  area: NCG
  file: Lightlike/NCG/Complexification.lean
  decls: [Lightlike.NCG.Complexification, Lightlike.NCG.Complexification.triple, Lightlike.NCG.Complexification.realStructure, Lightlike.NCG.Complexification.isComplexLinear, Lightlike.NCG.Complexification.exists_unitary, Lightlike.NCG.commJ_span]
  status: proven
  tier: established
  source:
    refs:
      - {ref: krajewski-1998, location: "Section 3.1", check: "irreducible representation"}
  review: kernel-checked
  note: "Compared with Krajewski, arXiv:hep-th/9701081, Section 3.1, p. 10 (read): 'all our formulae remain valid, provided the indices i and j label irreducible representations of A'. Here the irreducible representations are given by a complexification (σ, φ) of the triple; the order-zero and first-order conditions pass from π(A) to its complex span, and the uniqueness theorem for complex summands applies to σ. The complexification is an input; for A = ⊕ Mₙᵢ(ℝ) it is constructed in RealSummands.lean."
  since: unreleased

- id: LL-XXXX-i
  title: A real finite spectral triple over a sum of quaternionic matrix algebras Mₙᵢ(ℍ) is unitarily equivalent to the model of the multiplicity matrix of its complexification, with π acting through the fundamental representations on ℂ^{2nᵢ}
  area: NCG
  file: Lightlike/NCG/QuaternionSummands.lean
  decls: [Lightlike.NCG.exists_unitary_quatSummands, Lightlike.NCG.quatComplexification, Lightlike.NCG.unitsH, Lightlike.NCG.unitsH_hom_phiH, Lightlike.NCG.phiH, Lightlike.NCG.UH]
  status: proven
  tier: established
  source:
    refs:
      - {ref: krajewski-1998, location: "Section 3.1", check: "irreducible representation"}
      - {ref: krajewski-1998, location: "Section 3.2", check: "charge conjugation"}
  review: kernel-checked
  note: "Compared with Krajewski, arXiv:hep-th/9701081, Section 3.1, p. 10 (read): 'Mₙ(ℝ) and Mₙ(ℍ) have only one irreducible representation, the fundamental one ... Hᵢⱼ is isomorphic to ℂⁿⁱ ⊗ ℂᵐⁱʲ ⊗ ℂⁿʲ, where nᵢ is the dimension of the irreducible representation i', which for Mₙ(ℍ) is 2n. Here A = ⊕ Mₙᵢ(ℍ): with ρ_αβ(q) = π(E_αβ(q)) and the identification ℍ ⊗_ℝ ℂ ≅ M₂(ℂ), q ↦ [[a + b i, c + d i], [-c + d i, a - b i]], the operators (ρ_αβ)_ℂ(E_st) are matrix units of ⊕ M₂ₙᵢ(ℂ) on H, and φ(a)_{(αs)(βt)} = ι(a_αβ)_st gives π = σ ∘ φ. Mixed algebras and the sign conditions of Table 1, p. 14 are not covered."
  since: unreleased

- id: LL-XXXX-j
  title: A real finite spectral triple over a sum of complex matrix algebras Mₙᵢ(ℂ) acting real-linearly is unitarily equivalent to the model of the multiplicity matrix over the fundamental and conjugate representations that occur
  area: NCG
  file: Lightlike/NCG/ComplexSummands.lean
  decls: [Lightlike.NCG.exists_unitary_complexSummands, Lightlike.NCG.complexComplexification, Lightlike.NCG.unitsC, Lightlike.NCG.unitsC_hom_phiC, Lightlike.NCG.phiC, Lightlike.NCG.Blocks, Lightlike.NCG.UC]
  status: proven
  tier: established
  source:
    refs:
      - {ref: krajewski-1998, location: "Section 3.1", check: "irreducible representation"}
      - {ref: krajewski-1998, location: "Section 3.2", check: "charge conjugation"}
  review: kernel-checked
  note: "Compared with Krajewski, arXiv:hep-th/9701081, Section 3.1, p. 10 (read): 'Mₙ(ℂ) has two inequivalent irreducible representations, the fundamental one and its complex conjugate. However, all our formulae remain valid, provided the indices i and j label irreducible representations of A'. Here A = ⊕ Mₙᵢ(ℂ) with a real-linear π: Q± = (1 ∓ i π(i·1))/2 split H into the parts where π is complex-linear (fundamental) and antilinear (conjugate); the units Q± π(E^i_αβ) of the blocks (i, ±) that occur (Q± π(1ᵢ) ≠ 0) and φ(a) = (aᵢ, āᵢ) give the complexification. The index set of the model is the set of representations (i, ±) that occur. Mixed algebras and the sign conditions of Table 1, p. 14 are not covered."
  since: unreleased

- id: LL-XXXX-k
  title: A real finite spectral triple over a mixed algebra ⊕ Mₙ(ℝ) × ⊕ Mₙ(ℂ) × ⊕ Mₙ(ℍ) is unitarily equivalent to the model of the multiplicity matrix over the irreducible representations that occur
  area: NCG
  file: Lightlike/NCG/MixedSummands.lean
  decls: [Lightlike.NCG.exists_unitary_mixed, Lightlike.NCG.mixedComplexification, Lightlike.NCG.unitsMixed, Lightlike.NCG.unitsMixed_hom_phiMixed, Lightlike.NCG.phiMixed, Lightlike.NCG.psiPart, Lightlike.NCG.psiPart_mul, Lightlike.NCG.partialR, Lightlike.NCG.partialC]
  status: proven
  tier: established
  source:
    refs:
      - {ref: krajewski-1998, location: "Section 3.1", check: "irreducible representation"}
      - {ref: krajewski-1998, location: "Section 3.2", check: "charge conjugation"}
  review: kernel-checked
  note: "Compared with Krajewski, arXiv:hep-th/9701081, Section 2, p. 2 (A = ⊕ Mₙᵢ(K), K = ℝ, ℂ, ℍ) and Section 3.1, p. 10 (read): 'Mₙ(ℝ) and Mₙ(ℍ) have only one irreducible representation, the fundamental one, whereas Mₙ(ℂ) has two inequivalent irreducible representations, the fundamental one and its complex conjugate. However, all our formulae remain valid, provided the indices i and j label irreducible representations of A'. Here A = ⊕ Mₙ(ℝ) × ⊕ Mₙ(ℂ) × ⊕ Mₙ(ℍ) with a real-linear π: the restrictions of π to the three factors give units ψ₁(E^i_αβ), ψ±(E^i_αβ) (ψ±(Y) = ½(ψ₂(Y) ∓ i ψ₂(iY)), over the representations (i, ±) that occur) and the quaternionic units of M₂ₙ(ℂ); together they are one system of matrix units, and the uniqueness theorem for complex summands gives the unitary onto the model indexed by the irreducible representations that occur. The sign conditions of Table 1, p. 14 (the S⁰-real structure and the intersection form) are not covered."
  since: unreleased
