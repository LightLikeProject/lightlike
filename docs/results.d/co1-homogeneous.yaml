- id: LL-XXXX-a
  title: A metric on R^4 with the spatial translations and rotations as Killing fields has the flat FLRW form
  area: Spacetime
  file: Lightlike/Spacetime/HomogeneousIsotropic.lean
  decls: [Lightlike.lieDerivMetric_affField_basis, Lightlike.flat_flrw_of_killing]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.1)", check: "maximally symmetric"}
  review: kernel-checked
  note: "For a smooth metric g of any signature on R^4 whose Lie derivative vanishes along the three spatial translations and the three spatial rotations (checked on the coordinate basis fields), g_{0k} = 0, g_{ij} = a(t) delta_{ij} and g_{00} = b(t), with a and b functions of the time alone: the flat FLRW form with lapse b and scale factor a. Limits: only the flat case (k = 0); the curved cases (Killing fields of S^3 and H^3, classification of three-dimensional maximally symmetric spaces), the converse (the FLRW metric has these Killing fields) and the statement for isometry groups acting (not only infinitesimally) are follow-up tasks; the comparison with the source is pending and the location is the chapter."
  since: unreleased

- id: LL-XXXX-b
  title: The age of an expanding universe with the strong energy condition is at most the Hubble time, and the density diverges as the scale factor tends to zero
  area: Cosmology
  file: Lightlike/Cosmology/BigBang.lean
  decls: [Lightlike.Cosmology.bigBang_age_le, Lightlike.Cosmology.bigBang_density_tendsto_atTop, Lightlike.Cosmology.bigBang_age_lt_of_pos_density, Lightlike.Cosmology.bigBang_density_tendsto_atTop_of_pos]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "eq. (8.35)", check: "Big Bang"}
  review: kernel-checked
  note: "For a positive scale factor a on an open interval (t1, t2) with Friedmann's second equation with zero cosmological constant, the strong energy condition (rho + 3p at least zero) and a'(t0) > 0 at a time t0 in the interval: t0 - t1 is at most a(t0)/a'(t0); and for Friedmann's first equation with k at least zero and zero cosmological constant, if a tends to zero as t decreases to t1 then rho tends to infinity. With Carroll's hypotheses rho > 0 and p >= 0 the age is strictly less than a(t0)/a'(t0) (bigBang_age_lt_of_pos_density), and for every k, if rho(t0) > 0 and a tends to zero then rho tends to infinity, since rho(t) a(t)^2 >= rho(t0) a(t0)^2 for t <= t0 (bigBang_density_tendsto_atTop_of_pos); the Milne universe a = t, k = -1, rho = 0 shows that the positivity of the density is needed (milne_friedmann). Limits: real-variable statements; that the interval is maximal (so that a tends to zero at its left end) is not proved. Compared with Carroll's lecture notes, p. 224 (after eq. (8.41); 'by (8.35) we must have a'' < 0') and p. 225; see docs/notes/co1-carroll-comparison.md."
  since: unreleased
