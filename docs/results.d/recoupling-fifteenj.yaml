  note: "Comparison pending: no source was read at a cited location for this statement (the library cites Martin-Dussaud 2019, section 5.6, and Dona-Sarno 2018, Section 2, for the 15j symbol in the same area). The spins are doubled natural numbers. The identity is the reduction of the 15j symbol to the 3nj symbol of the first kind (n = 5) of Yutsis-Levinson-Vanagas type, up to sign; proved for all arguments, with no hypotheses."
