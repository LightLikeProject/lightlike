- id: LL-XXXX-d
  title: "The source of the Einstein equations is conserved: if G + Λ g = κ T for the Levi-Civita connection and κ ≠ 0, then ∇^μ T_{μν} = 0"
  area: Spacetime
  file: Lightlike/Spacetime/StressEnergyConservation.lean
  decls: [Lightlike.divBilinAt_eq_zero_of_einsteinEq]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "Chapter 4"}
  review: kernel-checked
  note: "GE14 (G1-010), after Carroll (4.38), (4.42), (4.43): conservation of the stress-energy tensor from the Bianchi identity of the Einstein tensor and the parallel metric, with a cosmological constant (the source has Λ = 0). The divergence is divBilinAt, g^{ij}(∇_i T)(e_j, w), on a manifold modelled on ℝⁿ. The comparison with the source is pending in the registry."
