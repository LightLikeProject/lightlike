  status: proven
  tier: established
  source:
    refs:
      - {ref: curiel-2014, location: "§2.1"}
      - {ref: hawking-ellis-1973, location: "Chapter: The physical significance of curvature|10.1017/CBO9780511524646.005"}
  review: kernel-checked
  note: "GE14 (G1-010). The pointwise equivalences at a point are LL entries on Lightlike/Spacetime/EnergyConditions.lean; these are their statements for a field on a manifold (4 dimensions). Dust is the trust check of the milestone. The comparison with the source is pending in the registry."
  since: unreleased
