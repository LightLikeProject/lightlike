  note: "Comparison pending: the location is the one of LL-0289 and LL-0031 (Turaev, chapter VII on simplicial state sums), and the comparison of these three statements with the source was not made for this entry. Proof: the 3-2 and 4-1 moves are the inverses of the 2-3 and 1-4 moves (move23_move32, move14_move41), for which the state sum is invariant at r = 3 (turaevViro3_move23 and turaevViro3_move14, unconditionally at r = 3); the chain statement is induction on the equivalence relation generated by the four moves (MoveEquiv3). They are the steps of the proof of LL-0289. No unproved hypothesis."
