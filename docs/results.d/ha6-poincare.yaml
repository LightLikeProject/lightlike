- id: LL-XXXX-a
  title: "The massive one-particle representation of the Poincaré group, induced from SU(2): it preserves the L² norm, is covariant under translations, has P² = m², W² = −m² s(s+1) and n+1 states per momentum"
  area: Lorentz
  file: Lightlike/Lorentz/PoincareIrreps/Classification.lean
  decls: [Lightlike.Lorentz.Poincare.wigner_massive]
  status: proven
  tier: established
  source:
    refs:
      - {ref: weinberg-1995, location: "Chapter: RELATIVISTIC QUANTUM MECHANICS|10.1017/CBO9781139644167.004"}
  review: kernel-checked
  note: "The representation is built by induction from the little group SU(2) on the mass shell of SL(2,C) = double cover of the Lorentz group, spin s = n/2 (n = 1: two states per momentum). Not claimed: irreducibility, and Wigner's classification theorem (ClassificationStatement.lean states it as a Prop, it is not proven: its proof needs Mackey's imprimitivity theorem). The comparison with Weinberg (1995), Chapter 2, is pending: the book was not read at the cited location, and Wigner (1939) was not read. Weinberg works in signature (-,+,+,+) with W^2 = m^2 j(j+1); here (+,-,-,-), so W^2 = -m^2 s(s+1) (the sign convention is stated in the task, milestones.md HA6)."
  since: unreleased
