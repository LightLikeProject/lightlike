- id: LL-XXXX-a
  title: "The massive one-particle representations of the Poincaré group on L²(d³p / 2ω_p) are irreducible: a closed subspace invariant under all translations and all U(A) is 0 or everything"
  area: Lorentz
  file: Lightlike/Poincare/ShellSourceMeasure.lean
  decls: [Lightlike.Poincare.irreducible_massive_sourceMeasure]
  status: proven
  tier: established
  source:
    refs:
      - {ref: weinberg-1995, location: "Chapter: RELATIVISTIC QUANTUM MECHANICS|10.1017/CBO9781139644167.004"}
  review: kernel-checked
  note: "HA6 (G1-055). No hypothesis beyond the closed invariant subspace: the invariant measure is the explicit sourceMeasure (d³p / 2ω_p), with measurePreserving_shellAct_sourceMeasure. The general form irreducible_massive (IrreducibleMassive.lean) takes any σ-finite SL(2,C)-invariant measure on the shell and rests on commutant_eq_scalar (the commutant of the translations and U(A) is the scalars). Not claimed: that every irreducible positive-energy representation is of this form (WignerClassification, stated only). The comparison with Weinberg (1995), Chapter 2, is pending: the book was not read at the cited location, and Wigner (1939) was not read."
  since: unreleased
- id: LL-XXXX-b
