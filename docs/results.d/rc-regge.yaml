      - {ref: christiansen-2011, location: "Section 1", check: "converges in the sense of measures"}
  review: kernel-checked
  note: "Trust checks of RC6 (flat triangulations give zero; a curvature density without the volume weights fails to converge). The comparison with Christiansen (2011), Section 1 (the statement of the Cheeger-Müller-Schrader theorem), is pending: not read at the cited location. RC6 is proven in dimension 2 and partial in dimension 4: the convergence theorem for general metrics in dimension 4 (the angle_sum, first_order and curvature fields of JetStarCore4 for a general jet) is NOT proved."
  since: unreleased
