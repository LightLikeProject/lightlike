- id: LL-XXXX-d
  title: "In dimension 4 the area-weighted sum over the 240 hinge incidences of Kuhn's orthoscheme triangulation of the first variation of the dihedral angle for a curvature operator K is -scal(K)/2"
  area: Regge
  file: Lightlike/Regge/CMS4/Kuhn4Core.lean
  decls: [Lightlike.Regge4.kuhn4_sum]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Section 1", check: "converges in the sense of measures"}
  review: kernel-checked
  note: "Dimension 4 analogue of the Cheeger-Müller-Schrader hinge sum; no symmetry or Bianchi identity of K is used. The comparison with Christiansen (2011), Section 1 (the statement of the Cheeger-Müller-Schrader theorem), is pending: not read at the cited location. RC6 is proven in dimension 2 and partial in dimension 4: the convergence theorem for general metrics in dimension 4 (the angle_sum, first_order and curvature fields of JetStarCore4 for a general jet) is NOT proved."
  since: unreleased
- id: LL-XXXX-e
