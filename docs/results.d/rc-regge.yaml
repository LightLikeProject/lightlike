- id: LL-XXXX-a
  title: "The linearized deficit angle at a vertex of a flat positively oriented star under a displacement field with a metric perturbation t is -t times the area of the star, independent of the gauge, covariant under scaling, and zero if and only if t = 0"
  area: Regge
  file: Lightlike/Regge/Linearized/DeficitLaw.lean
  decls: [Lightlike.Regge.Linearized.combStarDeficit_hasDerivAt_area, Lightlike.Regge.Linearized.combStarDeficit_gauge_independent, Lightlike.Regge.Linearized.combStarDeficit_scale_covariant, Lightlike.Regge.Linearized.combStarDeficit_zero_iff]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: christiansen-2011, location: "Abstract", check: "converge to their continuous counterparts"}
  review: kernel-checked
  note: "Vertex-level content of linearized Regge calculus in two dimensions (the flat background has zero deficit: flat_background_zero in Tests.lean). The comparison with Christiansen (2011) is pending: the paper was not read at the cited location. RC3 stays OPEN: Christiansen's convergence of solutions and eigenpairs on tori (Thm 4.7) needs Sobolev spaces, Regge finite-element spaces and Courant-Fischer, which are absent from Mathlib; Roček-Williams (1981) has no source key."
  since: unreleased
