- id: LL-XXXX-z
  title: Raychaudhuri's equation for a geodesic field in coordinates, with the split into expansion, shear and rotation
  area: Spacetime
  file: Lightlike/Spacetime/RaychaudhuriCoord.lean
  decls: [Lightlike.covD, Lightlike.expansion, Lightlike.raychaudhuri_coord, Lightlike.raychaudhuri_equation]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kar-sengupta-2007, location: "eq. (12)", check: "Raychaudhuri"}
  review: kernel-checked
  note: "For a coordinate metric g on an open U of R^n and a smooth field v with v^c nabla_c v^d = 0 on U (nabla_b v^a = d_b v^a + Gamma^a_bc v^c): v^c d_c Theta = -(nabla_b v^a)(nabla_a v^b) - R_{sigma nu} v^sigma v^nu, Theta = nabla_a v^a, in the library's ricci convention, with no normalisation of v (raychaudhuri_coord; the index computation raychaudhuri_algebra is fable1's). At a point where g(v, v) = -1, with L = g (nabla v), the shear sigma = (L + L^T)/2 - (Theta/(n-1)) (g + v_flat v_flat) and the rotation omega = (L - L^T)/2, norms taken with g^{-1}: v(Theta) = -Theta^2/(n-1) - |sigma|^2 + |omega|^2 - R(v, v) (raychaudhuri_equation, trace_sq_split), Kar and SenGupta's (12) for n = 4 (their (1) for the split). Limits: coordinates; the congruence on a manifold, the null version, and focusing under the energy condition (|sigma|^2 >= 0 needs the Lorentzian signature) are not here."
  since: unreleased
