  note: "Comparison pending (no source for the SU(2)_k S matrix was read). The proof telescopes 2 sin(phi/2) sum cos(x phi) (two_sin_mul_sum_cos), evaluates the full-period cosine sum (1 - (-1)^k)/2 for 0 < k < 2r, and uses that a - b and a + b have the same parity. S is real and symmetric (sMat_comm), so S^2 = 1 says it is an orthogonal involution; charge conjugation is trivial for SU(2). WEAKER than the full modular data: the Verlinde formula for the rows other than the unit row, the T matrix and the relation (ST)^3 = S^2 are not proved."
