- id: LL-XXXX
  title: "A non-null gradient gives a unit normal: if φ is smooth near x₀ and its gradient at x₀ is not null, the level sets of φ near x₀ have a smooth unit normal field n = |g(∇φ, ∇φ)|^{-1/2} ∇φ with g(n, n) = ε = ±1, the sign of g(∇φ, ∇φ)"
  area: Spacetime
  file: Lightlike/Spacetime/HypersurfaceNormal.lean
  decls: [Lightlike.Hypersurface.exists_isUnitNormal]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending for this statement: the Gauss and Codazzi relations of LL-0174, which take the unit normal as a hypothesis (IsUnitNormal), were compared with Gourgoulhon, 3+1 Formalism (gr-qc/0703035); the existence of the unit normal of a level set was not compared with a source for this entry. Hypotheses stated in the Lean theorem: g is a nondegenerate metric on a manifold M modelled on a normed space E (as in Hypersurface.lean), phi is smooth near x0, and every vector xi at x0 with g(xi, .) = d phi has g(xi, xi) not zero, so the hypersurface is non-null at x0. The conclusion IsUnitNormal g phi n eps x0 includes smoothness of n near x0, g(n, n) = eps with eps = 1 or -1, and the kernel of d phi being the g-orthogonal of n. No unproved hypothesis; this removes the assumption on the unit normal in LL-0174. The induced metric on a leaf is not an object of this development (leaves have no manifold structure); see the limits of LL-0174."
  since: unreleased
