- id: LL-XXXX-s
  title: "Fermionic Shale theorem, sufficiency in infinitely many modes: a surjective real-linear map R of a complex Hilbert space preserving the real part of the inner product, whose antilinear part is Hilbert-Schmidt in a Hilbert basis, is implemented by a unitary of the fermionic Fock space, U phi(w) = phi(R w) U"
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/CARShaleMain.lean
  decls: [Lightlike.OperatorAlgebras.CARShale.fermionic_shale_of_HS, Lightlike.OperatorAlgebras.CARShale.exists_vacuum_of_HS, Lightlike.OperatorAlgebras.CARShale.decoupling]
  status: proven
  tier: established
  source:
    refs:
      - {ref: derezinski-2006, location: "Theorem 31, p. 32", check: "Theorem 31"}
  review: kernel-checked
  note: "The sufficiency half of the equivalence LL-XXXX-i (the comparison with the source is recorded there). Proof: the transformed annihilators of any vector are a CAR system; a unit vector killed by them gives a unitary on the words of transformed creation operators (dense by irreducibility); the vacuum is the limit of the decreasing commuting projections prod (1 - c_k a_k) over the modes of an eigenbasis of K = beta* beta, with the relative decoupling bound (decoupling), class by class, and the finitely many heavy classes handled by mode flips."
  since: unreleased
- id: LL-XXXX-t
  title: "Uniqueness of the implementer of a fermionic Bogoliubov transformation up to a phase: two unitaries U, U' of the fermionic Fock space with U phi(w) = phi(R w) U and U' phi(w) = phi(R w) U' satisfy U' = c U with |c| = 1"
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/CARShaleUnique.lean
  decls: [Lightlike.OperatorAlgebras.CARShale.implementer_unique]
  status: proven
  tier: established
  source:
    refs:
      - {ref: derezinski-2006, location: "Theorem 31, p. 32", check: "Theorem 31"}
  review: kernel-checked
  note: "Compared with Dereziński, arXiv:math-ph/0511030, Theorem 31 (2), p. 32 (read): the unitary U with U φ(y) U* = φ(ry) is defined uniquely up to a phase factor. Here the quotient V = U⁻¹U' commutes with every field φ(w); it maps the vacuum to a vector killed by every annihilator, i.e. to a multiple c Ω₀ of the vacuum, and the closed subspace {x | V x = c x} is invariant under all fields, hence everything by the irreducibility of the Fock representation; |c| = 1 because V is isometric. The explicit formula (57) of Theorem 31 (3) is not formalised."
  since: unreleased
