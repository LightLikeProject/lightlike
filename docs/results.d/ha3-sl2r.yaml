- id: LL-XXXX-e
  title: The Casimir operator of SL(2,R) acts by -(1+ν²)/4 on the principal series and by (n/2)(n/2-1) on the discrete series D_n^+
  area: Lorentz
  file: Lightlike/Lorentz/SL2RCasimir.lean
  decls: [Lightlike.Lorentz.SL2R.casimir_principal, Lightlike.Lorentz.SL2R.casimir_discrete, Lightlike.Lorentz.SL2R.casimir_lowestVec]
  status: proven
  tier: established
  source:
    refs:
      - {ref: knapp-1986, location: "Chapter: Chapter II. Representations of SU(2), SL(2, ℝ) and SL(2, ℂ)|10.1515/9781400883974-005"}
  review: kernel-checked
  note: "Compared with Kitaev, arXiv:1711.08169, Section 2, eq. (10) (read 24 November 2026; page not checked): the Casimir eigenvalue is q = λ(1-λ), with q = 1/4 + s² on the principal series (λ = 1/2 + is) and λ = n/2 on D_n^±. Convention difference: our Casimir has the opposite sign, so it acts by -q = -(1/4 + s²) = -(1+ν²)/4 with ν = 2s, and by (n/2)(n/2 - 1) = -q for λ = n/2. Non-vacuity: casimir_lowestVec on the nonzero lowest-weight vector. The comparison with Knapp (1986) is pending: the book was not read at the cited location."
  since: unreleased
