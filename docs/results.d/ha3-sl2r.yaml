- id: LL-XXXX-a
  title: The spherical Plancherel theorem for SL(2,R): the spherical transform is a unitary equivalence from L²(1,∞) onto L²(0,∞), with the density ρ tanh(πρ)
  area: Lorentz
  file: Lightlike/Lorentz/SL2RPlancherel/SphericalSurjective.lean
  decls: [Lightlike.Lorentz.SL2RPlancherel.sphericalL2Equiv, Lightlike.Lorentz.SL2RPlancherel.surjective_sphericalL2]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kitaev-2017, location: "Section 4", check: "Plancherel"}
  review: kernel-checked
  note: "Compared with Kitaev, arXiv:1711.08169, Section 4, eq. (79)-(80), p. 14 (read 24 November 2026): the Plancherel measure of PSL(2,R) on the principal series C_{1/4+s^2} is (2π)^{-2} tanh(πs) s ds, the same density ρ tanh(πρ) with ρ = s. Difference (representation): only the spherical, K-biinvariant part is proven, as the transform of a function of v = cosh r > 1 in a square-root normalisation; the discrete series D_n (weight (2π)^{-2}(n - 1/2)) and the non-spherical K-types are NOT proven, so this does not close HA3. The comparison with Knapp (1986) and Gelfand-Graev-Vilenkin (1966) is pending: the books were not read at the cited locations."
  since: unreleased
