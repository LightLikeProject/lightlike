- id: LL-XXXX
  title: The Morse index is the number of negative eigenvalues of the Hessian - on a finite-dimensional real inner product space, the number of negative signs in the diagonal normal form of the Morse lemma, equivalently the largest dimension of a subspace on which the Hessian is negative definite, is the number of negative eigenvalues, with multiplicity, of the symmetric operator of the Hessian
  area: Asymptotics
  file: Lightlike/Asymptotics/MorseIndex.lean
  decls: [Lightlike.Morse.sigNeg_hessQuad_eq_card_neg_eigenvalues, Lightlike.Morse.exists_symmetric_operator, Lightlike.Morse.morse_diagonal_eigenvalues]
  status: proven
  tier: established
  source:
    refs:
      - {ref: milnor-1963, location: "Chapter: PART I. NON-DEGENERATE SMOOTH FUNCTIONS ON A MANIFOLD|10.1515/9781400881802-002"}
  review: kernel-checked
  note: "Comparison pending (Milnor's index is defined as the maximal dimension of a subspace on which the Hessian is negative definite; the chapter is verified in the registry, the statement that this is the number of negative eigenvalues is standard linear algebra and was not read at a location). Setting: E a finite-dimensional real inner product space, B a continuous bilinear form (the Hessian) represented by a symmetric operator A (B x y = <x, A y>, which exists for every symmetric B, exists_symmetric_operator). sigNeg of the quadratic form v -> (1/2) B v v (Mathlib's signature, the largest dimension of a negative-definite subspace) equals the number of negative eigenvalues of A (Mathlib's eigenvalues of a symmetric operator, listed with multiplicity), proved by diagonalising A in an orthonormal eigenbasis and using Sylvester's law of inertia (sigNeg of a weighted sum of squares). The corollary morse_diagonal_eigenvalues restates the Morse lemma's number of negative signs w_i < 0 as this number of negative eigenvalues. A positive scalar factor (the 1/2 of the quadratic form) does not change the signs."
  since: unreleased
