- id: LL-XXXX-a
  title: The spin representations of SU(2) are unitary and continuous
  area: SU2
  file: Lightlike/SU2/SpinRep.lean
  decls: [Lightlike.SU2.spinMat_mem_unitaryGroup, Lightlike.SU2.continuous_spinRep]
  status: proven
  tier: established
  source:
    refs:
      - {ref: hall-2015, location: "Chapter: Basic Representation Theory|10.1007/978-3-319-13467-3_4"}
      - {ref: martin-dussaud-2019, location: "§4.1", check: "representations"}
  review: kernel-checked
  note: "Comparison pending (the cited locations were not re-read for this entry). spinMat n g is unitary for g in SU(2) (the matrix of g is unitary, so is its n-th symmetric power in the monomial basis normalised as in SpinRep.lean) and g ↦ spinMat n g is continuous; the irreducibility is LL-0007."
