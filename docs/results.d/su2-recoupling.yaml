- id: LL-XXXX-d
  title: The two couplings of three SU(2) spins to a total spin are equivariant for the spin representations, and their overlap is Racah's 6j symbol (Hilbert–Schmidt form)
  area: SU2
  file: Lightlike/SU2/Recoupling6j.lean
  decls: [Lightlike.SU2.coupleLeft_equivariant, Lightlike.SU2.coupleRight_equivariant, Lightlike.SU2.coupleLeft_apply, Lightlike.SU2.coupleRight_apply, Lightlike.SU2.sum_cg_overlap]
  status: proven
  tier: established
  source:
    refs:
      - {ref: edmonds-1957, location: "Chapter: Chapter 6. The Construction of Invariants from the Vector-Coupling Coefficients|10.1515/9781400884186-007"}
      - {ref: varshalovich-1988, location: "Chapter: 6j Symbols and the Racah Coefficients|10.1142/9789814415491_0010"}
  review: kernel-checked
  note: "Comparison pending (the cited chapters were not read for this entry). Doubled spins a, b, c; couplings via Physlib's Clebsch–Gordan coefficients (Condon–Shortley phase) and the group-equivariant matrices cgMatrix of Spin4/CGBridge.lean. WEAKER (difference from the source, reported to the integrator; the item stays open until the owner decides whether it meets the done-when): the overlap is the sum over all entries (Hilbert–Schmidt inner product), not the matrix identity coupleLeft^H coupleRight = λ·1 (which follows from Schur's lemma for the spin representations, not formalised here), and the sign is not simplified to the textbook (-1)^(a+b+c+J). The 6j symbol is Physlib's sixJSym, not redefined; the recoupling at the level of invariant tensors is Recoupling.fourJ_eq_sum_fourRecoupling."
  since: unreleased
