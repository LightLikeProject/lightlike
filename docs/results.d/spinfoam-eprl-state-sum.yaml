- id: LL-XXXX-a
  title: "The intrinsic EPRL vertex is the vertex of the 4-simplex with the virtual spins rewritten by the transition matrices between the positional and the sorted channel, and at γ = 1 the EPRL state sum on a closed 4-complex is the sum over the triangle colourings and the virtual spins of the triangle constraints times the explicit sign twist times the Ooguri weight, i.e. the Ooguri amplitude up to the sign twist"
  area: SpinFoam
  file: Lightlike/SpinFoam/EPRLStateSum/IntrinsicVertex.lean
  decls: [Lightlike.SpinFoam.EPRLStateSum.simpEI_eq_sum_simpE, Lightlike.SpinFoam.EPRLStateSum.simpEIAux_eq_sum_nodeT, Lightlike.SpinFoam.EPRLStateSum.amplitudeI_one_eq_signed_ooguri, Lightlike.SpinFoam.EPRLStateSum.amplitudeI_one_closed]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Comparison pending: the equality of the state sum with the Ooguri amplitude up to an explicit sign twist is the library's own statement, not a theorem of Engle, Pereira, Rovelli and Livine (2008). Difference from the Ooguri amplitude: the explicit sign eprlGlobalSign, which depends on the order of the vertices (see the entry on the swap phase)."
  since: unreleased
- id: LL-XXXX-b
  title: "The EPRL vertex is unchanged by the exchange of the two factors of Spin(4), (n, m) to (m, n), and the EPRL state sum is unchanged by gamma to -gamma, the opposite orientation of R^4"
  area: SpinFoam
  file: Lightlike/SpinFoam/EPRLStateSum/Orientation.lean
  decls: [Lightlike.SpinFoam.EPRLStateSum.eprlVertex_swap, Lightlike.SpinFoam.EPRLStateSum.amplitudeI_neg]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Comparison pending. The proof is the sign (-1)^S of two exchanged rows of a 9j symbol, which cancels over the ten edges of K5. The orientation of K5 inside the 15j symbol (edges from the smaller to the larger position) is a convention of the vertex order, not the orientation of R^4: its dependence is part of the dependence on the vertex order, which is not claimed to vanish."
  since: unreleased
- id: LL-XXXX-c
  title: "Trust check on the boundary of the 5-simplex: with the bone cutoff the EPRL state sum at γ = 1 is 1 + 4 = 5, and with the face amplitude (J + 1)^2 instead of J + 1 the same sum is 65"
  area: SpinFoam
  file: Lightlike/SpinFoam/EPRLStateSum/BoneAmplitude.lean
  decls: [Lightlike.SpinFoam.EPRLStateSum.Trust.amplitudeI_sphere6_low_spin, Lightlike.SpinFoam.EPRLStateSum.Trust.amplitudeI_wrong_face]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Comparison pending: a trust check of the library's own statement. The cutoff gives doubled spin at most 1 to the four triangles through the edge {0, 1}; only the zero colouring (weight 1) and the bone colouring (weight 4, weight_col0) survive the triangle constraints, both with the sign +1, so the check does not test the sign twist."
  since: unreleased
- id: LL-XXXX-d
  title: "On the boundary of the 5-simplex the bone colouring of the edge {u, w} is admitted by the triangle constraints and carries the sign (-1)^(w - u - 1) in the signed Ooguri sum of the EPRL state sum at γ = 1: the state sum depends on the order of the vertices through the sign twist"
  area: SpinFoam
  file: Lightlike/SpinFoam/EPRLStateSum/OrderDependence.lean
  decls: [Lightlike.SpinFoam.EPRLStateSum.Trust.eprlGlobalSign_bone, Lightlike.SpinFoam.EPRLStateSum.Trust.bone_admitted]
  status: proven
  tier: frontier
  source:
    refs:
      - {ref: eprl-2008, location: "Section III", check: "EUCLIDEAN"}
  review: kernel-checked
  note: "Comparison pending: the library's own statement of the stated dependence on the vertex order (milestone row SF6b: its stated dependence on the vertex order). The checklist item p2 words independence of the vertex order, which this entry does not claim: the dependence is stated. Numerical evidence only (scripts/spinfoam/eprl_order_check.py, docs/notes/sf6b-order-dependence.md): the pure Ooguri amplitude is 5 for the bone cutoff of every edge, the EPRL amplitude is 5 for w - u odd and -3 for w - u even; the Ooguri weights of the bone colourings other than {0, 1} are not proved in Lean."
  since: unreleased
