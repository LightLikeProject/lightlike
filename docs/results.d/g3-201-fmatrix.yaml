  note: "QU3 (G3-201), conditional in the style of LL-0031: fMat_pentagon takes qBiedenharnElliott hr, the q-Biedenharn–Elliott identity (proved at r = 3 only, qBiedenharnElliott_three, which gives fMat_pentagon_three unconditionally; numerical evidence for other r, docs/notes/qbe-all-levels.md). The pentagon is the Biedenharn–Elliott sum over h with the signs and the square roots of the dimensions moved into the F-matrices; the signs agree termwise under the parity of the admissible triads. The convention (the sign (−1)^((a+b+c+d)/2) and the symmetric normalisation √(dim e dim f)) was checked numerically at r = 5 for all labels before the Lean statement, and the same pentagon without the sign fails (difference 2.0). Not proved: the hexagon, the existence of the full modular tensor category, the F-matrices as the associator of a representation category of U_q(sl₂) (they are defined from the 6j symbols, not from UqSl2). The comparison with Turaev, Chapter VI, is pending."
  since: unreleased
