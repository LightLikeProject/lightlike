- id: LL-XXXX-a
  title: "The pentagon equation of the F-matrices of U_q(sl₂) at q = e^{iπ/r}, with F^{abc}_d[e, f] = (−1)^((a+b+c+d)/2) √([e+1][f+1]) {a b e; c d f}_q, follows from the quantum Biedenharn–Elliott identity, and holds unconditionally at r = 3"
