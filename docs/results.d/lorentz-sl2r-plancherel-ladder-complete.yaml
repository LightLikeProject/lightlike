  note: "Layer 2c-iv of the Plancherel formula on SL(2,R). The integrating factor sinh(xi)^l tanh(xi/2)^r turns the raising operator into a derivative, and the lemma of du Bois-Reymond on an open interval (exists_ae_eq_const_of_weak_deriv_zero, a generalisation of the library's weak_const on (0, 1) to unbounded intervals and locally integrable functions) makes the weighted conjugate constant. With ladUp_orth_ker this identifies the orthocomplement of the ladder images with the multiples of the kernel function, nonzero only when the kernel is square integrable in sinh xi d xi. The test functions vanish near xi = 0: for chains of ladders this class is too small (-1/(1 + cosh xi) is square integrable and orthogonal to all ladUp 1 0 (ladUp 0 0 F) with F supported in (0, infinity)), so the completeness of the chains needs the radial functions that do not vanish at the identity. Standard; no source consulted."
  since: unreleased
