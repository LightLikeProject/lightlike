- id: LL-XXXX-f
  title: "Completeness of the ladder images on (0, infinity): for real l, r, a function psi locally integrable on (0, infinity) whose integral against (F' - (l coth xi + r / sinh xi) F) sinh xi vanishes for every smooth F with compact support in (0, infinity) is almost everywhere a constant multiple of sinh(xi)^(-(l+1)) tanh(xi/2)^(-r), the kernel of the adjoint ladder"
