- id: LL-XXXX-v
  title: The Raychaudhuri identity and geodesic focusing for a vector field on a manifold
  area: Spacetime
  file: Lightlike/Spacetime/RaychaudhuriManifold.lean
  decls: [Lightlike.raychaudhuri_manifold, Lightlike.raychaudhuri_leviCivita, Lightlike.raychaudhuri_focusing_manifold_at, Lightlike.raychaudhuri_focusing_manifold]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kar-sengupta-2007, location: "eq. (12)", check: "Raychaudhuri"}
      - {ref: kar-sengupta-2007, location: "eq. (16)", check: "convergence"}
  review: kernel-checked
  note: "On a manifold modelled on R^n with a metric of any signature and its Levi-Civita connection (main's leviCivita g, or any torsion-free metric connection that is locally smooth), for a smooth vector field V with nabla_V V = 0 near x and the expansion Theta = tr(u -> nabla_u V): V(Theta) = -tr((nabla V)^2) - Ric(V, V) at x (raychaudhuri_manifold, raychaudhuri_leviCivita), Kar and SenGupta's identity behind (12), with no normalisation of V; the proof reads the identity in the chart at x (the components of nabla_u V are covD, the trace and Ric are the coordinate ones) and applies raychaudhuri_coord. For a Lorentzian metric and V unit (g(V, V) = -1) and geodesic near x, rotation-free at x (g(nabla_u V, w) = g(nabla_w V, u), Kar and SenGupta's omega = 0) with Ric(V, V) >= 0: V(Theta) <= -Theta^2/(n-1) (raychaudhuri_focusing_manifold_at), and along an integral curve gamma of V on [0, L) with these hypotheses along gamma and Theta(gamma(0)) < 0, L <= (n-1)/|Theta(gamma(0))| (raychaudhuri_focusing_manifold): the paragraph after their (16), convergence as the bound on the parameter interval on which Theta stays finite. Limits: the null version is the next entry."
  since: unreleased
- id: LL-XXXX-w
  title: Raychaudhuri's equation and focusing for a null geodesic congruence, in coordinates and on a manifold
  area: Spacetime
  file: Lightlike/Spacetime/RaychaudhuriNull.lean
  decls: [Lightlike.raychaudhuri_null_equation, Lightlike.nullShear_normSq_nonneg, Lightlike.raychaudhuri_null_focusing_at, Lightlike.raychaudhuri_null_focusing]
  status: proven
  tier: established
  source:
    refs:
      - {ref: kar-sengupta-2007, location: "eq. (17)", check: "null"}
  review: kernel-checked
  note: "Kar and SenGupta, Section D, (17): for a null geodesic congruence k with an auxiliary null N, k.N = -1, the transverse metric h = g + k N + N k and the projected derivative, d(Theta^)/d lambda + Theta^2/2 + sigma^2 - omega^2 = -R_ab k^a k^b in dimension four, and focusing under the null convergence condition. Here, for a coordinate metric on an open U of R^n (n >= 3) and a smooth field k with g(k, k) = 0 and nabla_k k = 0 on U, at a point with g(N, N) = 0 and g(k, N) = -1: k(Theta) = -Theta^2/(n-2) - sigma^2 + omega^2 - R(k, k) (raychaudhuri_null_equation), with B^ = P (nabla k) P, P = g^{-1} h, Theta = tr B^ the expansion, sigma^ = sym(g B^) - (Theta/(n-2)) h, omega^ = antisym(g B^) (the split over the idempotent screen projector of trace n - 2, trace_sq_split_proj; tr B^ = tr(nabla k) and tr(B^2) = tr((nabla k)^2) since (nabla k) k = 0 and k_a nabla_b k^a = 0). For a Lorentzian coordinate metric sigma^2 >= 0 (sigma^ kills the unit timelike (k + N)/sqrt 2), a rotation-free field has omega^ = 0, and with R(k, k) >= 0: k(Theta) <= -Theta^2/(n-2) and, along an integral curve on [0, L) with an auxiliary null vector at each point and Theta(gamma(0)) < 0, L <= (n-2)/|Theta(gamma(0))| (raychaudhuri_null_focusing). The same on a manifold for a Lorentzian metric with its Levi-Civita connection, read in the chart (raychaudhuri_null_focusing_manifold_at, raychaudhuri_null_focusing_manifold in RaychaudhuriNullManifold.lean). Limits: the auxiliary null vector is a hypothesis (as in the source), the full rotation condition g(nabla_u k, w) = g(nabla_w k, u) is assumed (it gives omega^ = 0)."
  since: unreleased
