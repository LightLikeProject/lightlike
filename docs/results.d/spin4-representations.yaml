  area: Spin4
  file: Lightlike/Spin4/Rep.lean
  decls: [Lightlike.Spin4.finrank_tensorSpace, Lightlike.Spin4.finrank_idx]
  status: proven
  tier: established
  source: exploratory
  review: kernel-checked
  note: "Comparison pending (no source was read at a cited location); the dimension of a tensor product is the product of the dimensions. Proved as the complex finrank of TensorSpace n m and of the index space Idx n m -> C. No hypotheses."
