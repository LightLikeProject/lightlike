- id: LL-XXXX-a
  title: "Constraint counting and the circle check: the number of degrees of freedom of the reduced phase space is 2n − 2m + r (r second-class constraints), a second-class set has an even number of constraints, and for the particle on a circle the constraints |q|² − 1 and ⟨p,q⟩ are second class (reduced dimension 2) while treating them as first class gives the wrong count 0"
  area: Gauge
  file: Lightlike/Gauge/ConstraintsAPI.lean
  decls: [Lightlike.Gauge.even_of_isSecondClass, Lightlike.Gauge.diracBracket_constraint, Lightlike.Gauge.finrank_reducedTangent]
  status: proven
  tier: established
  source:
    refs:
      - {ref: henneaux-teitelboim-1992, location: "Chapter: CHAPTER ONE. CONSTRAINED HAMILTONIAN SYSTEMS|10.1515/9780691213866-004"}
  review: kernel-checked
  note: "GC4 (G3-132). Flat phase space X × X with Physlib's Poisson bracket; the Dirac bracket {f,g} − Σ {f,φ_a} (C⁻¹)_ab {φ_b,g} is antisymmetric and vanishes against a constraint when C is invertible. The circle particle and the wrong-count check are circle_isSecondClass and circle_wrong_count (Lightlike/Tests/Constraints.lean). finrank_reducedTangent: dim of the reduced tangent space is dim E − 2 dim(orbit), for a linear action at a zero of the moment map. The comparison with the cited sources is pending in the registry (Wipf hep-th/9312078 is not a registered source; the comparison note docs/notes/gc4-source-dirac.md is the record)."
  since: unreleased
- id: LL-XXXX-b
  title: "The Dirac consistency algorithm terminates: for nested regular stages with nonempty zero sets the zero sets are constant from some stage on, and a regular stage has at most dim E constraint functions"
  area: Gauge
  file: Lightlike/Gauge/DiracRegular.lean
  decls: [Lightlike.Gauge.card_le_finrank_of_regular, Lightlike.Gauge.exists_stable_of_regular]
  status: proven
