  note: "GC4 (G3-132). Removes the hypothesis of one globally admissible selection of DiracAlgo.final_consistent_of_cover: constant rank gives local admissibility only, and the charts are glued with overlap compatibility (zeroSet_stages_inter_eq). Hypotheses: first-order bracket and ConstantRankAt (constant rank near each point, independent stage derivatives, strict differentiability). The comparison with the cited sources is pending in the registry (Wipf hep-th/9312078 is not a registered source; the comparison note docs/notes/gc4-source-dirac.md is the record)."
