      - {ref: henneaux-teitelboim-1992, location: "Chapter: CHAPTER ONE. CONSTRAINED HAMILTONIAN SYSTEMS|10.1515/9780691213866-004"}
  review: kernel-checked
  note: "GC4 (G3-132). Termination by counting under linear independence of the gradients (regularity is a hypothesis; the smooth existence of the secondary constraints is not proved here). Without regularity there is no termination: the chain {x ≤ 1/(k+1)} in ℝ (DiracNonlinear.lean). The comparison with the cited sources is pending in the registry (Wipf hep-th/9312078 is not a registered source; the comparison note docs/notes/gc4-source-dirac.md is the record)."
  since: unreleased
