  note: "Layer 2c-ii of the Plancherel formula on SL(2,R). The Plancherel identity in the K x K components (lintegral_norm_sq_eq_kk) applied to E f, which is continuous, with the action of E on the components (kk_ladder_up of layer 2c-i). Standard in form; no source consulted. The odd components (m or n odd) correspond to half-integer K-types; the existing K-type Plancherel formulas cover only integer K-types."
