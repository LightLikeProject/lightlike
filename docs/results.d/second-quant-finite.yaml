  note: "Compared with Dereziński, arXiv:math-ph/0511030, Theorem 18 (2), (4), p. 22 ([dΓ(h), a(w)] = -a(h* w), [dΓ(h), a*(w)] = a*(hw), in the bosonic and the fermionic case) and Theorem 13 (1), p. 19 ([dΓ(h₁), dΓ(h₂)] = dΓ([h₁, h₂])), with Γⁿ_{s/a}(Z) = Θⁿ_{s/a} ⊗ⁿZ (Section 5.3, p. 20), dΓₙ(h) = ∑ⱼ 1 ⊗ ⋯ ⊗ h ⊗ ⋯ ⊗ 1 (Section 5.2, p. 19), a*(w)Ψ = √(n+1) Θ_{s/a}(w ⊗ Ψ) and a(w) = a*(w)* (Section 5.7, p. 22) (read). Here ⊗ⁿZ is the coordinate tensor power ℓ²(Fin n → ι) of a Hilbert basis of Z, and the identities hold between consecutive tensor powers, sector by sector."
