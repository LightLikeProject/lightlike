- id: LL-XXXX-d
  title: "Minkowski space is conformal to a region of the Einstein static universe: in the coordinates η = arctan u + arctan v, χ = arctan u − arctan v the Minkowski metric is ω⁻²(−dη² + dχ² + sin²χ dΩ²) with ω = (cos η + cos χ)/2, the map (η, χ) ↦ (t, r) is a bijection of {0 < χ, |η| + χ < π} onto {r > 0}, and the conformal factor vanishes exactly on |η| + χ = π"
  area: Spacetime
  file: Lightlike/Spacetime/MinkowskiCompactification.lean
  decls: [Lightlike.minkowski_eq_conformal_esu, Lightlike.bijOn_comp, Lightlike.compOmega_eq_zero_iff]
  status: proven
  tier: established
  source:
    refs:
      - {ref: carroll-1997, location: "Chapter 3"}
  review: kernel-checked
  note: "GE7 (G1-016). The conformal infinity (null infinity η ± χ = ±π with i⁰ and i^±) is the vanishing locus of ω (compOmega_eq_zero_iff); the null character of the boundary and the action of the Poincaré group on it are NOT proved. The identification is a metric identity on tangent vectors, not a manifold embedding. The comparison with the source is pending in the registry: the location cited is the only recorded verified one (Carroll's Chapter 3), while the compactification itself is in Carroll's Chapter 7 (pp. 192-196), Gourgoulhon gr-qc/0703035 Section 6.3.1 and Campos-Verdaguer gr-qc/9307027 Appendix C, none recorded as verified."
  since: unreleased
