  note: "Compared with Derezinski, Section 7.1, p. 29 and Section 5.3, p. 20 (read). The antisymmetric Fock space of Z is represented as a Hilbert space with a Hilbert basis indexed by the finite subsets of ι, for a Hilbert basis (e_i) of Z indexed by a linearly ordered ι (the basis vector of a finite set S stands for the normalized wedge product of the e_i, i in S, in increasing order; l^2(Finset ι) is one such space); the identification with the antisymmetric tensors is not built. Y = Re(Z + conj Z) with (z, conj z) α (w, conj w) = Re<z, w> is written as Z with the real scalar product Re<.,.>."
