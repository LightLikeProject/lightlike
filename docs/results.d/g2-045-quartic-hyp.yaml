  note: "GF7 piece (C) of G2-045: the analytic hypotheses of Nevanlinna's theorem for Z(λ) = ∫ e^{-λφ⁴ - φ²/2} dφ with complex coupling (Rivasseau–Wang, Theorem IV.1 with k = 2, via the hypotheses of Theorem III.2 with k = 1). The constants A = 16√(2π), B = 32 are this library's, from the Taylor bound |e^{-z} - Σ_{m<M} (-z)^m/m!| ≤ |z|^M/M! for Re z ≥ 0; the source gives its own constants. The comparison with the source is pending: the paper was not read at the cited theorem here. Borel summability itself (the consequence) is a separate entry."
