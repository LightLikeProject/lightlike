  title: "The partition function of the zero-dimensional quartic model is analytic for Re λ > 0 and its Taylor remainders obey |R_N Z(λ)| ≤ 16 √(2π) 32^N N! |λ|^{N+1} uniformly in every disk Re λ⁻¹ > 1/R"
