- id: LL-XXXX-k
  title: The second quantization of a contraction p of the one-particle space is a contraction of the Fock space with Gamma(p) e(f) = e(p f) on the exponential vectors, functorial (Gamma(q) Gamma(p) = Gamma(q p)), with Gamma(p)* = Gamma(p*), unitary iff p is, and bounded only if |p| <= 1
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/SecondQuantization.lean
  decls: [Lightlike.OperatorAlgebras.FockRep.gamma, Lightlike.OperatorAlgebras.FockRep.gamma_W_Ω, Lightlike.OperatorAlgebras.FockRep.norm_gamma_le, Lightlike.OperatorAlgebras.FockRep.gamma_comp, Lightlike.OperatorAlgebras.FockRep.adjoint_gamma, Lightlike.OperatorAlgebras.FockRep.gamma_mem_unitary_iff, Lightlike.OperatorAlgebras.FockRep.norm_le_one_of_gamma]
  status: proven
  tier: established
  source:
    refs:
      - {ref: derezinski-2006, location: "Theorem 13, p. 19", check: "Theorem 13"}
  review: kernel-checked
  note: "Compared with Derezinski, Section 5.2, Theorem 13, p. 19 and Section 5.5, p. 21 (read). The Fock space is the repository's Fock representation (a cyclic vacuum with <Omega, W f Omega> = exp(-|f|^2/4)), the symmetric Fock space of Section 5.5; Gamma(p) is characterized by Gamma(p) W(f) Omega = exp((|p f|^2 - |f|^2)/4) W(p f) Omega, i.e. Gamma(p) e(f) = e(p f) on the exponential vectors e(f) = exp(|f|^2/4) W(f) Omega, not by p tensor n on the n-particle spaces (not built). Boundedness: a bounded operator with this action exists iff |p| <= 1."
  since: unreleased
- id: LL-XXXX-l
  title: A unitary U of the one-particle space is implemented in the Fock representation by Gamma(U), Gamma(U) W(f) Gamma(U)* = W(U f), unique up to a phase, and Gamma(U) is the implementer with (Omega | V Omega) > 0
  area: OperatorAlgebras
  file: Lightlike/OperatorAlgebras/SecondQuantization.lean
  decls: [Lightlike.OperatorAlgebras.FockRep.secondQuant_conj, Lightlike.OperatorAlgebras.FockRep.eq_smul_secondQuant, Lightlike.OperatorAlgebras.FockRep.eq_secondQuant_of_pos]
  status: proven
  tier: established
  source:
    refs:
      - {ref: derezinski-2006, location: "Theorem 24, p. 27", check: "Shale"}
  review: kernel-checked
  note: "Compared with Derezinski, Section 6.4, Theorem 24, p. 27 (read), for a unitary r of Z (p = r, c = d = 0 in (46), so U_r^j = Gamma(r)); the general r in Sp_2(Y) is Shale's theorem, in the repository's Shale files. Uniqueness up to a phase from the triviality of the commutant of the Fock representation (commutant_scalar)."
  since: unreleased
