# Builds the API documentation with doc-gen4, without making doc-gen4 a dependency of the library.
#   cd docbuild && lake update doc-gen4 && lake build Lightlike:docs
# Output: docbuild/.lake/build/doc/index.html (all imported modules, ~1.3 GB; for publishing,
# scripts/prune_docs.py removes the dependency pages, see .github/workflows/docs.yml).
name = "docbuild"
reservoir = false
version = "0.1.0"
packagesDir = "../.lake/packages"

[[require]]
name = "Lightlike"
path = "../"

[[require]]
scope = "leanprover"
name = "doc-gen4"
rev = "v4.35.0"
